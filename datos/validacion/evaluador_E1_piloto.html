<style>
  :root { --fg:#1c1c1e; --bg:#f7f7f5; --card:#fff; --line:#d8d8d2; --acc:#2d5bd3; --dim:#6b6b66; --ok:#1f7a3f; }
  @media (prefers-color-scheme: dark) { :root { --fg:#e8e8e4; --bg:#161618; --card:#202024; --line:#3a3a40; --acc:#7da0ff; --dim:#a0a09a; --ok:#5fc788; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.55 system-ui, sans-serif; }
  header { position:sticky; top:0; background:var(--card); border-bottom:1px solid var(--line); padding:8px 16px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; z-index:5; }
  header b { flex:1; min-width:180px; }
  button { font:inherit; padding:6px 12px; border:1px solid var(--line); background:var(--card); color:var(--fg); border-radius:6px; cursor:pointer; }
  button.p { background:var(--acc); color:#fff; border-color:var(--acc); }
  main { max-width:1200px; margin:0 auto; padding:16px; }
  details { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:8px 12px; margin-bottom:12px; }
  summary { cursor:pointer; font-weight:600; }
  .cols { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width:800px) { .cols { grid-template-columns:1fr; } }
  .col { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px; }
  .col h2 { margin:0 0 8px; font-size:1.1rem; }
  .previo { color:var(--dim); font-size:.9rem; border-left:3px solid var(--line); padding-left:8px; margin-bottom:10px; }
  .t { margin-bottom:12px; }
  .j { color:var(--acc); white-space:pre-wrap; font-size:.95rem; }
  .dm p { margin:.4em 0; }
  table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); border-radius:8px; margin:12px 0; }
  td, th { padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; text-align:left; }
  td.n { white-space:nowrap; }
  .def { color:var(--dim); font-size:.85rem; }
  label.r { margin-right:8px; white-space:nowrap; }
  .fin { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px; }
  .fin p { margin:.6em 0; }
  textarea { width:100%; min-height:60px; font:inherit; background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:6px; }
  .ok { color:var(--ok); font-weight:600; }
</style>

<script type="application/json" id="datos">{"evaluador": "E1", "fase": "piloto", "dims": [["CR1", "Fluidez y sentido lógico de la respuesta", "¿La respuesta del DM tiene sentido como reacción inmediata a lo que hizo el jugador, es fluida y no se contradice dentro del propio turno?", "1 incoherente / no responde a la acción · 3 responde pero con fallos de lógica o de fluidez · 5 natural, lógica y fluida"], ["CR2", "Arraigo contextual", "¿La narración se apoya en el escenario, los personajes y los hechos ya establecidos (lore y turnos previos) en lugar de inventar cosas ajenas?", "1 ajena al escenario · 3 mezcla lo establecido con invenciones sin relación · 5 plenamente anclada al escenario y a lo ocurrido"], ["CL1", "Consistencia de personajes", "¿Los PNJ (y el PJ) hablan y actúan de forma consistente con su personalidad, motivaciones y con lo que ya hicieron?", "1 actúan contra su carácter o cambian sin motivo · 3 consistentes a ratos · 5 plenamente consistentes"], ["CL2", "Consistencia de eventos y estado del mundo", "¿Lugares, objetos, heridas, quién está presente y lo que ya pasó se mantienen sin contradicciones?", "1 contradicciones claras · 3 alguna inconsistencia menor · 5 el estado del mundo se mantiene coherente"], ["QN1", "Interés, creatividad y atractivo", "¿Es interesante, con detalles originales y sin repetirse? ¿Dan ganas de seguir leyendo?", "1 monótono/genérico o repetitivo · 3 correcto pero previsible · 5 vívido, original y atractivo"], ["QN2", "Reactividad significativa a la agencia del jugador", "¿Lo que hace el jugador cambia algo perceptible y proporcionado en la ficción, o el mundo lo ignora?", "1 el mundo ignora sus acciones · 3 reacciona de forma superficial · 5 sus decisiones tienen consecuencias claras y proporcionadas"]], "unidades": [{"id": "u852d59", "piloto": true, "lore": "# La Ceniza Mansa\n\n## El barco y la calma\n\nLa Ceniza Mansa es una balandra mercante de dos palos y catorce tripulantes que hace la ruta entre los puertos del sur y las islas de la sal. Hace nueve días, al cruzar el Mar de la Bonanza, el viento se paró de golpe. No fue una calma corriente: las velas cuelgan como trapos mojados, el mar parece de aceite espeso y ni una gaviota ha pasado sobre el mástil desde entonces. El agua dulce se acaba, la ración es de una taza por cabeza y las brújulas siguen apuntando al norte como si nada hubiera cambiado.\n\nNadie a bordo ha visto nunca una calma así. Los más viejos dicen que el Mar de la Bonanza no se llama así por gusto.\n\n## Lo que salió mal\n\nEsta mañana, el capitán Anselmo Rueda no salió a cubierta. Lo encontraron en su camarote, con la puerta trabada por dentro, sentado a la mesa de cartas y muerto. No tenía heridas. Tenía las palmas de las manos quemadas y los labios cubiertos de una costra de sal blanca, aunque no se había bebido una gota de agua de mar. La ventana del camarote es demasiado estrecha para un adulto. Su libro de bitácora está sobre la mesa, con la última página arrancada.\n\nHay catorce personas en la Ceniza Mansa, ahora trece. Ninguna puede irse.\n\n## Orden o verdad\n\n**Serafín Brea**, primer oficial, ha asumido el mando por derecho de escalafón y ha declarado la nave en régimen de encierro: nadie sale de su puesto sin permiso, el camarote queda sellado, la investigación la hará él con método y por turnos, y la carga no se toca. La bodega no se abre sin orden del propietario del cargamento, y el propietario, dice, iba a bordo con el capitán y no puede darla. Lo dice con la voz firme de quien sabe que, si se pierde el orden a bordo, no queda nada.\n\n**Dolores Anzuelo**, contramaestre y voz de la marinería, exige abrir la bodega ya: nueve días de calma, un capitán muerto sin causa y unos barriles de la carga que hacen ruidos por la noche no son coincidencia. Los marineros no van a esperar a que el agua se acabe con las manos atadas por un régimen de encierro que solo protege al cargamento.\n\nAmbos tienen razón en algo. Ninguno se fía de lo que el otro esconde.\n\n## La sentina\n\nBajo la bodega, en el fondo de la nave, la sentina lleva días con un palmo más de agua de la que debería tener, y el agua está tibia. Nadie de la tripulación ha bajado a verlo: es un lugar oscuro, estrecho y sin ventilación, y quien baja tarda en volver a subir.\n\n## Gente del barco\n\n**Serafín Brea**, primer oficial al mando, defiende mantener el orden y no tocar la carga. **Dolores Anzuelo**, contramaestre, defiende abrir la bodega y buscar la causa. **Tomás «Tomasito» Rojas**, grumete de quince años, es -por ahora- solo el chico que reparte la taza de agua y ve todo lo que pasa en cubierta; ver «personas_par21.json» para el perfil completo de los tres.\n\n## Tono de la campaña\n\n`world_tone`: **`mixed`**, registro **`serious`**. Misterio de tensión sostenida: el peso del encierro, la sed y la desconfianza, con un fondo de lo sobrenatural que apenas se deja ver. Nada de humor gratuito; sí el humor seco y breve de la gente de mar en apuros. Estructura sin precedente en el corpus: **un crimen de cuarto cerrado en un espacio del que nadie puede escapar**, con un sospechoso en cada rostro; distinto del misterio ambiguo de Caleta Lumbre (Par 4) porque aquí hay un muerto, unas pistas físicas concretas y un número finito de personas que pudieron hacerlo.\n", "A": {"previo": "La mirada recorre la consola de acero cepillado, donde los diales analógicos siguen vibrando levemente tras la descarga. Entre el desorden de cables expuestos y el aroma persistente a ozono, resalta una palanca de seguridad resguardada bajo una cubierta de acrílico ahumado; la etiqueta es clara y directa: «SISTEMA DE REFRIGERACIÓN - B7».\n\nEl técnico no se gira, manteniendo una mano apoyada en el panel mientras observa con fijeza los indicadores de temperatura que comienzan a trepar con rapidez. \"No me he relajado. Solo estoy recuperando el aliento\", responde con un tono seco, sin apartar la vista de las agujas que avanzan hacia la zona roja.\n\nEl calor residual sigue acumulándose en los conductos. Si la palanca del B7 no se acciona inmediatamente, el material se fundirá, sellando permanentemente el acceso al barril siete.", "turnos": [{"jugador": "\"Tú encárgate de los indicadores, yo me ocupo de esto.\"\n\nLlevo la mano hacia la cubierta de acrílico para accionar la palanca del sistema de refrigeración.", "dm": "El técnico permanece inmóvil, con la vista clavada en las agujas que suben vertiginosamente, ignorando la presencia del otro para concentrarse en el panel. Con un gesto rápido y seco de la barbilla hacia la palanca, advierte sin girarse: \"Hazlo. Pero no la fuerces, que el mecanismo de cierre está sensible tras el salto de tensión\".\n\nEl aire en la sala se vuelve más denso y el zumbido eléctrico de la consola parece intensificarse mientras el acrílico ahumado espera ser levantado.\n\nEl calor residual sigue acumulándose en los conductos. Si la palanca del B7 no se acciona inmediatamente, el material se fundirá, sellando permanentemente el acceso al barril siete."}, {"jugador": "\"No me digas cómo hacer mi trabajo.\"\n\nSujeto la palanca con cuidado y trato de accionarla con suavidad, siguiendo las instrucciones del técnico.\n\n{Atletismo}", "dm": "El metal de la palanca se resiste, devolviendo una vibración seca que sube por el brazo. A pesar del intento de delicadeza, el mecanismo emite un chasquido metálico y se encalla con un golpe sordo, quedando bloqueado en una posición intermedia que no libera la presión. El acrílico ahumado de la consola del B7 vibra con más violencia ahora, mientras el vapor acumulado empieza a silbar en las juntas del metal cepillado de la claustrofóbica sala.\n\nEl técnico no se inmuta ni se gira para observar el error. Sin apartar la vista de los indicadores, con una voz plana y desprovista de cualquier matiz emocional, sentencia: \"Hazlo como quieras. Pero si el cierre se bloquea por un tirón, el barril siete será un pisapapeles de acero fundido\".\n\nEl cierre del B7 ha quedado encallado. Si no se libera el mecanismo o se encuentra una alternativa inmediata, la presión del vapor fundirá los sellos, destruyendo el contenido del barril siete."}, {"jugador": "\"No pienso dejar que se funda.\"\n\nSuelto la palanca y busco rápidamente algún punto de presión o un tornillo que pueda liberar el bloqueo manualmente.\n\n{Investigación}", "dm": "Los dedos recorren el metal caliente, tanteando las ranuras y las juntas en busca de una debilidad, pero el mecanismo es una masa compacta y hermética que no cede ante la presión manual. No hay tornillos a la vista ni puntos de apoyo que permitan forzar el cierre; el bloqueo es absoluto y la vibración de la consola se ha vuelto un zumbido eléctrico que cala en los huesos.\n\nEl técnico sigue mirando fijamente los indicadores, sin girar la cabeza, con un tono monótono y clínico: \"No busques tornillos. El bloqueo es interno, en el eje de torsión. Si sigues tanteando a ciegas solo vas a retrasar la purga y acelerar la fusión\".\n\nEl tiempo se agota. El eje de torsión permanece bloqueado y la temperatura del barril siete sigue subiendo; si no se halla una solución técnica inmediata, el colapso térmico será inevitable."}, {"jugador": "\"Dime exactamente dónde se encuentra ese eje de torsión.\"\n\nMe alejo un paso del metal caliente y trato de visualizar el mecanismo interno basándome en la descripción del técnico.\n\n{Investigación}", "dm": "El esfuerzo mental por reconstruir el mecanismo interno da sus frutos; los datos encajan y el punto ciego del blindaje se vuelve evidente. El tacto ya no busca a ciegas, sino que se dirige con precisión quirúrgica hacia el punto exacto donde el metal cede lo justo para permitir una intervención.\n\nEl técnico, sin apartar la vista de los monitores y señalando el punto exacto con un gesto seco y preciso de la mano, añade: \"Tres centímetros debajo de la placa de blindaje, alineado con el tercer indicador de presión. Si logras insertar algo lo suficientemente fino y giras a la izquierda, liberarás la tensión\".\n\nEl mecanismo está expuesto, pero la tensión acumulada es crítica; cualquier desliz en el giro o un movimiento brusco podría provocar una descarga eléctrica o el bloqueo definitivo del eje."}, {"jugador": "\"Perfecto. Mantén esos monitores vigilados.\"\n\nSigo las instrucciones del técnico con cuidado, insertando una herramienta fina en el punto indicado e intentando girar lentamente hacia la izquierda.\n\n{Juego de Manos}", "dm": "El interior del panel es un laberinto de cables tensos y metal caliente, donde el espacio de maniobra es mínimo y el zumbido eléctrico vibra contra la herramienta. Al intentar el giro hacia la izquierda, la resistencia del mecanismo se vuelve súbitamente errática; la herramienta resbala contra el borde de la placa de blindaje con un chasquido metálico, fallando en liberar la tensión del eje.\n\nEl técnico, que permanece atento a las pantallas, se tensa visiblemente. No dice una palabra, pero sus ojos se clavan en el monitor mientras observa cómo los indicadores de presión comienzan a oscilar violentamente, reflejando el error en la maniobra.\n\nEl resbalón ha dejado la herramienta mal posicionada y el mecanismo ahora está bloqueado en una posición inestable; cualquier intento posterior de girar sin antes realinear la pieza provocará una descarga eléctrica inmediata."}, {"jugador": "\"Maldita sea.\"\n\nSaco la herramienta con cuidado y trato de observar la posición exacta de la pieza para realinearla sin tocar el metal caliente.\n\n{Investigación}", "dm": "La herramienta se desliza fuera del mecanismo con un roce seco, dejando espacio para una visión clara del desastre. Tras el panel, el interior es un caos de filamentos incandescentes y placas de blindaje desplazadas que irradian un calor sofocante, golpeando la piel como un viento caliente. Entre dos cables de alta tensión que chisporrotean rítmicamente, el perno torcido se revela finalmente, atrapado en un ángulo preciso que explica la resistencia anterior.\n\nEl técnico permanece en silencio, con la mirada fija en el monitor, observando cómo la oscilación de los indicadores se estabiliza ligeramente mientras la pieza es identificada. No hay palabras, solo la tensión compartida en el aire cargado de ozono.\n\nLa pieza está alineada, pero el calor extremo comienza a deformar los aislantes de los cables cercanos; si la reparación no se ejecuta ahora, el cortocircuito será inevitable."}, {"jugador": "\"Tengo la pieza a la vista. Quítate, que lo arreglo yo.\"\n\nIntento extraer el perno torcido con cuidado para evitar que los cables chispeantes se toquen.\n\n{Juego de Manos}", "dm": "El metal cede con un crujido violento, pero no en la dirección deseada. El perno, soldado por el calor extremo al marco del panel, se resiste con una rigidez absoluta y el esfuerzo brusco provoca que la herramienta resbale. El interior del panel es un horno de metal y electricidad; el perno torcido brilla al rojo vivo, flanqueado por cables que laten con arcos voltaicos erráticos que saltan peligrosamente ante el movimiento.\n\nEl técnico retrocede un paso, el rostro iluminado por el resplandor anaranjado del metal caldeado. Se queda inmóvil, observando el desastre mecánico con una expresión gélida, sin mover un dedo para ayudar mientras el ozono inunda el aire.\n\nEl perno sigue clavado y el roce accidental ha desnudado un tramo de cableado; la próxima descarga saltará directamente hacia el chasis, provocando un apagón total del sector."}, {"jugador": "\"Quítate de delante antes de que te fría.\"\n\nIntento usar un hechizo para manipular la energía o el metal y estabilizar el perno sin tocarlo.\n\n{Arcanos}", "dm": "La energía mística se entrelaza con la electricidad errática del panel, envolviendo el metal recalentado en un flujo controlado que obliga al perno a ceder y estabiliza los arcos voltaicos en una danza geométrica y silenciosa. El crujido del metal ahora suena limpio, coordinado, permitiendo que el mecanismo se desbloquee sin provocar la descarga que amenazaba con fundirlo todo.\n\nEl técnico se aparta con un movimiento seco y pragmático, manteniendo la mirada fija en los arcos voltaicos, sin rastro de pánico ni de urgencia. \"Haz lo que tengas que hacer. Pero si el flujo colapsa, no esperes que te saque los trozos de chasis del cuerpo\", sentencia con una frialdad absoluta antes de conceder el espacio necesario para operar.\n\nEl panel está abierto y estabilizado, pero el sistema eléctrico del sector sigue en un estado crítico; cualquier manipulación brusca del interior podría reactivar la inestabilidad del flujo."}]}, "B": {"previo": "Al inclinar la cabeza y acercar la vista a la superficie, el patrón de los micro-canales revela una anomalía. El agua no fluye al azar; en el punto exacto donde la losa se une con el resto del suelo, el líquido se arremolina formando un círculo perfecto antes de seguir su curso. Al tacto, la piedra de la losa es ligeramente más fría que la del pasillo, y bajo una capa de sedimento calcáreo, distingues una inscripción grabada con una caligrafía minúscula y afilada que dice: *\"El peso del alma no mueve la tierra, solo el eco del vacío\"*.\n\nObservando la disposición de los canales, notas que no son simples desagües, sino que imitan la geometría de una campana invertida. El centro de la losa presenta un pequeño orificio, apenas del tamaño de una aguja, que succiona el agua rítmicamente, como si hubiera un pulmón de aire atrapado en algún lugar profundo bajo la piedra.", "turnos": [{"jugador": "\"Interesante. El vacío es la clave.\"\n\nPaso el dedo sobre la inscripción y luego intento introducir una aguja o un objeto muy fino en el orificio central para sentir qué hay debajo.\n\n{Investigación}", "dm": "La punta de la aguja se desliza sin resistencia, atravesando el orificio con una fluidez antinatural. Al profundizar, no encuentras piedra ni tierra, sino que el objeto comienza a vibrar con una frecuencia sorda que asciende por tu brazo. El vacío no es una ausencia, sino un mecanismo; sientes que la aguja ha activado un pestillo interno que libera una presión acumulada durante siglos.\n\nUn chasquido metálico resuena en la estancia, seco y definitivo. La losa no se desliza ni se levanta, sino que se hunde unos pocos centímetros con un siseo de aire viciado que huele a salitre y metal oxidado. El remolino de agua se detiene en seco y el orificio central se expande, revelando que la piedra era solo la tapa de un receptáculo cilíndrico que ahora yace abierto, exponiendo un hueco oscuro que desciende hacia las profundidades."}, {"jugador": "\"Vaya, un mecanismo de presión. Interesante.\"\n\nMe asomo al borde del hueco para intentar distinguir qué hay abajo y si el descenso es seguro.\n\n{Percepción}", "dm": "Tus ojos se adaptan rápidamente a la penumbra del pozo. A unos diez metros de profundidad, el fondo no es de piedra, sino que consiste en una plataforma de hierro fundido, parcialmente cubierta por una capa de sedimentos blanquecinos y costras de sal. El descenso parece estable, aunque las paredes del cilindro muestran surcos verticales profundos, como si algo hubiera sido izado o descendido repetidamente durante años.\n\nEn el centro de la plataforma, destaca la silueta de un cofre de madera reforzado con bandas de bronce, cuya superficie está cubierta por una pátina verdosa. No hay signos de trampas evidentes en el borde ni cables tensos, pero el aire que emana del hueco es pesado y gélido, trayendo consigo el eco lejano de un goteo rítmico que no proviene de la superficie."}, {"jugador": "\"Interesante. Veamos qué guardan aquí abajo.\"\n\nBajo con cuidado por el pozo hasta alcanzar la plataforma de hierro. Una vez abajo, me acerco al cofre pero mantengo la distancia, observando los sedimentos y el entorno.\n\n{Percepción}", "dm": "Tus botas aterrizan con un sonido metálico y seco sobre la plataforma, levantando una fina nube de ese polvo blanquecino que se adhiere a tus botas como escarcha. Al observar los sedimentos, notas que la capa de sal es uniforme en casi todo el espacio, excepto por una serie de marcas irregulares y profundas que convergen hacia el cofre, como si algo pesado hubiera sido arrastrado sobre el hierro hace tiempo.\n\nEl goteo rítmico se vuelve más nítido ahora que estás abajo; el sonido es hueco y proviene de alguna grieta en la base de la plataforma. El aire gélido te muerde la piel y, al fijar la vista en el cofre, percibes que la pátina verdosa del bronce no es solo oxidación, sino que algunas manchas parecen haber escurrido hacia abajo, dibujando líneas verticales que se pierden en el suelo de hierro."}, {"jugador": "\"¿Qué clase de residuo es este?\"\n\nMe acerco al cofre con cautela y trato de analizar la composición de esas manchas verdosas y el polvo blanquecino.\n\n{Arcanos}", "dm": "Te inclinas sobre el cofre, concentrando tu mente en los hilos del flujo arcano para desentrañar la naturaleza de aquellos sedimentos. Sin embargo, en el momento en que intentas sintonizar con la energía del lugar, una ráfaga de viento gélido y súbita golpea la plataforma, desestabilizando tu concentración. El movimiento brusco te hace perder el equilibrio y tu mano impacta con fuerza contra el borde afilado del bronce oxidado, provocando que un fragmento de la pátina verdosa se desprenda y te salpique el rostro.\n\nEl residuo se siente viscoso y gélido sobre tu piel, dejando un rastro pegajoso que huele a salitre y a algo orgánico en descomposición, como algas podridas bajo el sol. El polvo blanquecino, agitado por tu caída, se eleva en una pequeña nube que te irrita las fosas nasales, obligándote a toser mientras el goteo rítmico de la base parece acelerarse, respondiendo a tu presencia en el lugar."}, {"jugador": "\"Maldita sea...\"\n\nMe aparto rápidamente del cofre y trato de limpiarme la cara con la manga, mientras observo el goteo de la base para ver si ha cambiado el patrón.\n\n{Percepción}", "dm": "El rastro viscoso se extiende por tu mejilla, dejando una sensación de frío persistente que no cede al frotar la tela de la manga contra la piel. Al levantar la vista hacia la base, notas que el goteo ya no es errático ni lento. Las gotas de agua salobre caen ahora con una cadencia mecánica, casi musical, golpeando la piedra en intervalos exactos que parecen marcar un pulso.\n\nEntre el sonido rítmico, percibes que el agua no solo cae, sino que comienza a formar pequeños surcos en el suelo, dibujando líneas precisas que convergen hacia el centro de la plataforma, justo debajo de donde se asienta el cofre. El patrón es deliberado: el líquido está trazando una geometría circular que empieza a brillar con una tenue luminiscencia glauca."}, {"jugador": "\"Interesante...\"\n\nMe acerco al borde del círculo luminiscente, pero sin entrar en él, para observar la geometría y el brillo del líquido.\n\n{Arcanos}", "dm": "Te inclinas sobre el borde del círculo, donde el agua salobre vibra con esa luz glauca y fría. La geometría es precisa, pero los símbolos que el líquido dibuja en la piedra te resultan esquivos; reconoces trazos que sugieren una naturaleza ritual o de sellado, pero la sintaxis del hechizo es confusa y no logras descifrar el propósito exacto de la formación ni qué efecto desencadenará una vez que el patrón se complete.\n\nEl brillo se intensifica ligeramente mientras el agua sigue fluyendo, y el pulso rítmico del goteo parece acelerarse, transformando la melodía mecánica en un latido sordo que comienza a resonar no solo en el aire, sino en la planta de tus pies."}, {"jugador": "\"Esto no es un simple sello.\"\n\nIntento analizar los trazos y la estructura del flujo para comprender la lógica del ritual.\n\n{Arcanos}", "dm": "Tus ojos captan la armonía oculta tras el caos del flujo. No es un sello para mantener algo fuera, sino un mecanismo de transferencia: los trazos actúan como canales conductores que filtran la esencia del agua salobre, destilando una energía specifically vinculada a la profundidad y al olvido. La lógica es clara; el ritual no busca bloquear un portal, sino anclar una presencia etérea a un receptáculo físico utilizando la vibración del goteo como metrónomo para sincronizar los dos planos.\n\nEl latido que sube por tus pies se vuelve coherente; es una llamada. El patrón geometria se cierra sobre sí mismo, y comprendes que el flujo no se detendrá hasta que el \"invitado\" haya cruzado el umbral o que la fuente de energía sea interrumpida. El agua comienza a elevarse en finas agujas, desafiando la gravedad, mientras el brillo glauco se torna cegador en el centro del círculo."}, {"jugador": "\"Interrumpir la fuente es la opción más lógica.\"\n\nMe concentro en los canales conductores para identificar el punto exacto donde la energía es más vulnerable y trato de desestabilizar el flujo.\n\n{Arcanos}", "dm": "Tus dedos trazan el aire siguiendo la corriente invisible, detectando una fluctuación rítmica en el tercer trazo del círculo, justo donde el agua salobre se condensa en un vórtice miniature. Al aplicar la presión mental necesaria en ese nodo crítico, la armonía del flujo se quiebra con un chasquido seco, similar al de un cristal rompiéndose bajo el hielo. \n\nLas agujas de agua que desafiaban la gravedad colapsan instantáneamente, estrellándose contra el suelo en un desplome caótico y sordo. El brillo glauco que cegaba el centro del círculo parpadea violentamente antes de extinguirse, dejando tras de sí un silencio pesado y un rastro de vapor frío que se disipa lentamente en el aire estancado."}]}}, {"id": "ub5cc67", "piloto": true, "lore": "# Corral Alto\n\n## El pueblo y la votación\n\nCorral Alto vive del pastoreo compartido en los prados altos que rodean el pueblo -tierra común, sin dueño individual, administrada durante generaciones por un alcalde que el concejo de vecinos elige cada cinco años. La elección de este año, la primera desde hace una década con dos candidatos serios, se celebra en pocos días, y todo el pueblo tiene una opinión formada sobre a quién apoya.\n\nLo que nadie en Corral Alto ha notado todavía es que, en las últimas semanas, ambas candidaturas han recibido donativos de un tamaño que ninguna de las dos puede explicar del todo bien con sus propios simpatizantes conocidos.\n\n## Dos visiones, un pueblo dividido\n\n**Melquíades Sorna**, pastor de toda la vida y candidato de la tradición, quiere mantener los prados altos cerrados a rebaños de fuera del valle, como ha sido siempre: cree que abrir el pastoreo compartido a otros valles solo trae disputas por hierba que ya escasea en los años secos.\n\n**Bibiana Roth**, comerciante de lana y candidata del cambio, quiere abrir un acuerdo de pastoreo compartido con el valle vecino, a cambio de acceso a su mercado de lana y a un manantial que Corral Alto necesita en años de sequía: cree que la tradición de Melquíades protege una independencia que el pueblo, en la práctica, ya no puede permitirse del todo.\n\nNinguno de los dos es deshonesto. Ninguno de los dos sabe explicar, cuando se le pregunta con calma, de dónde ha salido el reciente aumento de apoyo económico a su propia campaña.\n\n## El forastero de la posada\n\nDesde hace tres semanas, un huésped que dice ser comerciante de paso ocupa la mejor habitación de la única posada de Corral Alto, paga generosamente sus cuentas y comparte más de una ronda de bebida con concejales de ambos bandos. Nadie lo ha visto hacer nada abiertamente indebido. Nadie tampoco ha preguntado, con la seriedad que merece, por qué un comerciante de paso lleva tres semanas sin viajar a ningún sitio.\n\n## Gente del pueblo\n\n**Melquíades Sorna**, candidato de la tradición, defiende cerrar los prados altos a rebaños forasteros para proteger lo poco que el valle tiene asegurado. **Bibiana Roth**, candidata del cambio, defiende abrir un acuerdo de pastoreo compartido para asegurar lo que el valle no tiene: agua en los años secos. **Emero Vasca**, que cuenta cabezas de ganado en el registro comunal cada primavera, es -por ahora- solo un vecino más; ver \"personas_par17.json\" para el perfil completo de los tres y el molde de promoción de PNJ de paso ya usado en pares anteriores.\n\n## Tono de la campaña\n\n`world_tone`: **`light`**. Ligero pese al misterio de fondo: la elección en sí es una disputa cívica sana entre dos vecinos que quieren lo mejor para Corral Alto, y el verdadero conflicto -descubrir quién financia en secreto a ambas candidaturas y por qué- se resuelve con ingenio e investigación, no con violencia. Estructura sin precedente en el corpus real -**una elección local manipulada desde afuera**, distinta de la disputa de sucesión de Vado Cabrero (Par 05, puramente interna, sin ningún interés externo de por medio): aquí ninguno de los dos candidatos es el problema real, y este documento no revela todavía quién está detrás de los donativos ni con qué intención.\n", "A": {"previo": "El vestíbulo, gélido y de mármol blanco, amplifica el silencio bajo techos altísimos donde la luz cenicienta resalta la austeridad del mobiliario. En el centro de aquel vacío arquitectónico, Bibiana sostiene un pergamino enrollado con un sello de cera negra, cuyos bordes muestran el desgaste de haber sido consultado repetidamente. La mirada atenta logra captar ese documento, el único elemento que rompe la severidad de su atuendo y que parece ser el núcleo de su actual preocupación.\n\nBibiana mantiene la espalda recta, sin devolver la inclinación de cabeza. Lo mira fijamente a los ojos, ignorando el intento de escrutinio, mientras ajusta con un gesto seco el doblez de su propia chaqueta. \"El pragmatismo es lo único que nos mantiene vivos en tiempos de sequía, señor Wynn. Pero no confunda mi eficiencia con ingenuidad; que no haya guardias en la puerta no significa que haya dejado de observar sus manos\", sentencia con una frialdad imperturbable.\n\nBibiana ha detectado el interés por sus pertenencias; cualquier intento directo de arrebatar el pergamino o indagar demasiado sobre él será visto como una agresión.", "turnos": [{"jugador": "\"La eficiencia es una virtud que comparto, Bibiana. No busco complicaciones, solo claridad.\"\n\nSostengo la mirada mientras doy un paso lateral, tratando de analizar su lenguaje corporal para ver si el pergamino es lo único que oculta.\n\n{Perspicacia}", "dm": "El vestíbulo se extiende como un desierto de mármol blanco, donde las sombras se alargan bajo la luz cenicienta y el eco de cada paso acentúa la tensión del encuentro. El movimiento lateral no revela ninguna debilidad ni objeto oculto; Bibiana permanece como una estatua de hielo, imperturbable ante el intento de analizarla.\n\nSin moverse ni un milímetro, mantiene el pergamino firmemente sujeto contra su costado. Su voz suena gélida, proyectando una autoridad que no admite juegos de salón: \"La claridad es un lujo que solo se pueden permitir quienes no tienen la responsabilidad de alimentar a un pueblo entero. Usted busca 'claridad', pero yo busco que el próximo verano no sea un cementerio de lana y ganado. Si quiere saber qué hay en este pergamino, hágalo por la vía correcta: con una propuesta concreta sobre la mesa, no con pasos laterales y miradas curiosas\".\n\nLa paciencia de Bibiana se ha agotado; cualquier otro intento de maniobra indirecta o insistencia sin una oferta tangible cerrará la conversación y podría provocar que exija la salida inmediata del edificio."}, {"jugador": "\"Entiendo. No perdamos más tiempo con sutilezas.\"\n\nMe detengo en seco y la miro fijamente, recuperando mi compostura.\n\n{Persuasión}", "dm": "El intento de retomar el control de la conversación cae en el vacío, chocando contra el muro de indiferencia que Bibiana ha erigido. No hay rastro de duda en su postura ni una sola grieta en su expresión; para ella, el cambio de actitud no es más que otra maniobra vacía.\n\nMantiene el pergamino pegado al costado, con la espalda recta y una mirada gélida que no parpadea, marcando una distancia insalvable. Su voz corta el aire del vestíbulo sin ninguna concesión: \"Menos palabras y más hechos. Si ha terminado con las sutilezas, espero que lo que siga sea una propuesta real y no otra pérdida de mi tiempo. Dígame: ¿tiene algo que aportar a la seguridad de este pueblo o solo ha venido a practicar su compostura en mi vestíbulo?\".\n\nBibiana está a un paso de considerar la visita como una intrusión; si no se presenta una oferta tangible y concreta ahora mismo, echará al jugador de su casa."}, {"jugador": "\"Tengo una oferta concreta, pero no es de palabras, sino de resultados.\"\n\nSaco una pequeña daga y la clavo con precisión en la mesa, justo frente a ella, para demostrar mi utilidad.\n\n{Intimidación}", "dm": "El acero de la daga impacta contra la madera pulida con una violencia seca que resuena en todo el vestíbulo, un espacio de piedra fría y madera oscura donde el aire se vuelve eléctrico. La hoja vibra levemente sobre la superficie, pero el gesto no logra quebrar la compostura de la mujer. Bibiana Roth no retrocede ni un centímetro; baja la mirada hacia el arma con un desdén absoluto antes de volver a clavar sus ojos en el interlocutor, manteniendo la espalda rígida y un tono gélido.\n\n\"Lindo truco. Muy útil para cortar lana o intimidar a campesinos que no saben leer un contrato, pero aquí no sirve de nada\", sentencia sin pestañear. Su voz corta la tensión con una frialdad quirúrgica mientras añade: \"Si cree que clavar un trozo de metal en mi mobiliario me hace olvidar que ha estado hurgando en mis papeles, es usted más ingenuo de lo que parece. ¿Sus 'resultados' incluyen también el vandalismo, o piensa decirme ya qué es lo que ofrece antes de que llame a la guardia?\".\n\nLa paciencia de Bibiana se ha agotado; cualquier otro gesto agresivo o falta de una propuesta concreta provocará que llame a la guardia inmediatamente para desalojar al intruso."}, {"jugador": "\"Tengo un gusto exquisito por los muebles, señora Roth, pero un gusto aún mayor por la discreción.\"\n\nRetiro la daga con un movimiento fluido y limpio. Me inclino ligeramente hacia delante, bajando la voz para sonar más razonable.\n\n{Persuasión}", "dm": "El eco del metal al salir de la madera deja una marca profunda y fea en el mobiliario, un recordatorio tangible del fracaso del gesto. En el vestíbulo de techos altos, donde la piedra fría parece absorber cualquier rastro de calidez, el silencio se vuelve pesado, casi sólido, mientras la inclinación del cuerpo no logra suavizar la atmósfera.\n\nBibiana Roth se mantiene inmóvil, observando la marca de la daga en la madera con una expresión de fastidio profesional, sin dejar de mirar fijamente al jugador. Sus ojos no muestran rastro de persuasión, solo una gélida irritación. \"La discreción es una moneda que usted ya ha gastado, y lo ha hecho con una tasa de cambio lamentable. No me venda 'discreción' cuando sus dedos han estado donde no debían y su acero ha marcado mi madera. Si quiere que hablemos de razones, empiece por decirme qué es exactamente lo que busca y qué gana Corral Alto con ello. Sea concreto: cifras, plazos, beneficios. De lo contrario, su gusto por los muebles será lo único que recuerde el alguacil mientras lo saca de aquí\", sentencia con una voz que no admite más juegos.\n\nLa paciencia de Bibiana ha llegado a su límite absoluto; si la respuesta no es una oferta concreta y tangible, el alguacil entrará en el vestíbulo en cuestión de segundos."}, {"jugador": "\"No busco muebles, busco eficiencia. El beneficio para Corral Alto es que yo sé dónde están las fugas de capital que sus libros no muestran.\"\n\nMe enderezo y la miro fijamente, manteniendo el tono gélido.\n\n{Engaño}", "dm": "El aire del vestíbulo, saturado de olor a cera vieja y polvo, parece espesarse mientras el eco de la afirmación rebota en las paredes desnudas y los techos imponentes. La frialdad de la piedra se traslada a la atmósfera, volviéndose asfixiante. Bibiana Roth no parpadea; cruza los brazos con firmeza, manteniendo una distancia física infranqueable y una postura de mando que reduce la presencia del interlocutor a la de una mercancía defectuosa.\n\n\"Eficiencia. Una palabra muy elegante para quien entra en mi despacho a robar y deja cicatrices en mi madera\", sentencia con una voz cortante. Su mirada es un muro de hielo que no deja espacio a la duda. \"Si cree que voy a entregarle mis libros para que juegue a ser contador basándose en una insinuación, es que no sabe nada de cómo negocio yo. Dígame exactamente dónde está esa fuga, nombre la cifra y señale la transacción. Si no puede darme un dato real ahora mismo, su 'eficiencia' no es más que un intento desesperado de ganar tiempo antes de que el alguacil le ponga los grilletes\".\n\nBibiana ha descartado el farol; si no se proporcionan datos concretos y verificables en el siguiente instante, llamará al alguacil para proceder al arresto inmediato."}, {"jugador": "\"No soy un contador, señora Roth, sino alguien que sabe dónde mirar.\"\n\nSuelto un suspiro fingido y me acerco un paso, bajando el tono de voz para sonar confidente.\n\n{Persuasión}", "dm": "La luz del atardecer se filtra en franjas polvorientas a través del despacho, iluminando el cuero gastado y la caoba oscura de una habitación que exhala una disciplina asfixiante. El intento de acercamiento y el tono confidente no logran romper la barrera; Bibiana Roth no retrocede ni un milímetro, manteniendo los brazos cruzados y una expresión de absoluto desprecio.\n\nCon una claridad gélida y rítmica, Bibiana sentencia: \"Sabe dónde mirar, dice. Ya lo ha demostrado: miró mis cajones, miró mi correspondencia y miró el interior de mi despacho sin invitación. Eso no es saber dónde mirar, es saber cómo robar. En el valle vecino, a alguien con sus 'instintos' lo sacan del mercado a patadas antes de que pueda decir la palabra 'confidencia'. No me venda misterios; me vende el mismo humo que cualquier estafador de feria. O me da el dato exacto de la fuga ahora mismo, o el único lugar donde podrá 'mirar' durante un tiempo será el techo de la celda del alguacil\".\n\nBibiana ha perdido la paciencia; cualquier respuesta que no sea un dato concreto y verificable sobre la fuga provocará que llame al alguacil para el arresto inmediato."}, {"jugador": "\"No soy un estafador, señora Roth, soy un profesional. Y los profesionales no regalan el botín antes de cobrar.\"\n\nDoy un paso atrás, alejándome de su escritorio, y busco una salida rápida mientras mantengo la mirada.\n\n{Perspicacia}", "dm": "El despacho se siente ahora más pequeño, una caja de caoba y tinta seca donde el aire parece espesarse. La puerta de roble, con sus pomos de bronce brillando bajo la luz mortecina, se percibe distante, casi inalcanzable, mientras el espacio entre el escritorio y la salida se convierte en un territorio hostil.\n\nBibiana Roth no se mueve ni un centímetro. Su mirada es fría y analítica, observando el retroceso con la calma de quien ve a una presa admitir su derrota antes de tiempo. Sin elevar la voz, pero con un tono que corta el aire como una cuchilla, sentencia: \"Un profesional cobra cuando el servicio se ha prestado, no cuando decide retener la información como rehén. Usted no está negociando un fardo de lana, está negociando su libertad. Y creo que ha olvidado que en este pueblo, el único profesional que decide quién cobra y quién paga soy yo\".\n\nLa paciencia de Bibiana se ha agotado por completo; cualquier intento de evasión o falta de entrega inmediata de la información resultará en la llamada inmediata al alguacil."}, {"jugador": "\"Toda profesional sabe que el riesgo aumenta el precio.\"\n\nMe enderezo y apoyo las manos en el escritorio, manteniendo la mirada fija en ella. Intento convencerla de que entregarle todo ahora sería un error estratégico para ambos.\n\n{Persuasión}", "dm": "El intento de imponer una lógica de mercado choca contra un muro de indiferencia absoluta. Bibiana ni siquiera parpadea ante el gesto de desafío sobre el escritorio; al contrario, se inclina ligeramente hacia adelante, apoyando una sola mano sobre la madera sin perder la compostura, con una mirada gélida y una voz que no admite réplica: \"El riesgo es una variable que se calcula en el contrato, no una excusa para el chantaje. He tolerado que husmee en mi despacho y que trate mis documentos como si fueran mercancía de saldo, pero no voy a tolerar que intente darme lecciones de estrategia. O me entrega la información ahora mismo, o el siguiente trato que firme será la orden de detención que el alguacil redactará mientras usted espera en el calabozo\".\n\nEl aire en el despacho se vuelve gélido, despojado de cualquier posibilidad de regateo. La mujer ha dejado de ver un interlocutor para ver un estorbo, y la amenaza del calabozo no suena a farol, sino a un trámite administrativo que ya ha empezado a procesar en su mente.\n\nBibiana ha cerrado la negociación. Si no se entrega la información en el siguiente instante, llamará al alguacil para proceder al arresto."}]}, "B": {"previo": "Mientras tus pasos resuenan en el descenso hacia la penumbra, tu mirada permanece anclada en la piedra. Logras capturar la disposición exacta de los dedos y la presión de las palmas en el relieve; recuerdas que la mano que domina el pacto pertenece a una figura con un anillo distintivo, una marca que no habías notado antes y que parece ser la clave de esa ambición coordinada.\n\nVaros no se detiene, pero el eco de tu frase flota un momento en el aire húmedo del pasillo. Su espalda permanece rígida, aunque notas un ligero cambio en el ritmo de su marcha, como si tu comentario hubiera picado su curiosidad o su cautela.\n\n—Una perspectiva cínica —responde sin volverse—, pero útil para sobrevivir en esta ciudad.", "turnos": [{"jugador": "\"La supervivencia es la única moneda que nunca se devalúa.\"\n\nAcelero el paso para caminar justo detrás de él, intentando analizar la reacción de Varos y buscar cualquier otro detalle que oculte.\n\n{Perspicacia}", "dm": "Varos suelta un bufido corto, casi una risa seca, que rebota en las paredes de piedra húmeda. No se gira, pero el ligero balanceo de sus hombros sugiere que el comentario ha calado en él, encontrando un eco en su propia experiencia militar. El ritmo de sus botas contra el suelo es constante, pero hay una tensión residual en su postura, un instinto de guardia que no termina de relajarse a pesar de la conversación.\n\nAl acortar la distancia, notas que Varos mantiene una mano siempre cerca del pomo de su espada, no por amenaza, sino por costumbre. Sin embargo, hay algo más: el capitán evita deliberadamente mirar hacia los relieves de las paredes mientras avanza, como si conociera demasiado bien lo que representan o prefiriera ignorar la historia que el relieve intenta contar. Su silencio posterior no es incómodo, sino expectante, como quien evalúa la utilidad de la herramienta que lleva detrás."}, {"jugador": "\"Parece que hay cosas en estas paredes que prefiere olvidar.\"\n\nCamino justo detrás de él, manteniendo la distancia, mientras intento observar con detalle los relieves que Varos evita mirar.\n\n{Percepción}", "dm": "Varos se tensa visiblemente, y el paso de sus botas se vuelve más pesado, casi forzado. No se detiene, pero su voz suena ahora más grave, cargada de una sequedad que corta el aire húmedo del pasillo.\n\n—Hay historias que solo sirven para llenar libros y alimentar nostalgias inútiles. Lo que importa es el camino que pisamos, no el que quedó tallado en la piedra.\n\nMientras intentas escudriñar los relieves mientras avanzas, las sombras proyectadas por las antorchas juegan con las formas. Las figuras talladas parecen fundirse unas con otras en un caos de piedra grisácea y musgo; distingues siluetas humanas y formas geométricas, pero el ángulo y la falta de luz impiden que logres descifrar una sola escena o símbolo concreto."}, {"jugador": "\"Pareces tener mucha prisa por olvidar el pasado, Varos.\"\n\nSigo caminando a su lado, pero trato de captar cualquier gesto o vacilación en su lenguaje corporal que delate por qué le incomodan tanto esos relieves.\n\n{Perspicacia}", "dm": "Varos no se inmuta ante el comentario, manteniendo la vista fija al frente y la espalda rígida como una lanza. Sus pasos mantienen un ritmo metódico, casi militar, y no hay un solo temblor en sus hombros ni una mirada fugaz hacia las paredes que delate inquietud.\n\n—La prisa es una virtud cuando el destino es claro —responde sin girarse, su tono plano y carente de cualquier matiz emocional."}, {"jugador": "\"Me gusta esa claridad.\"\n\nCamino a su lado manteniendo la distancia, observando sus gestos y el entorno para detectar cualquier señal de peligro o vigilancia.\n\n{Percepción}", "dm": "El eco de vuestros pasos resuena contra los muros de piedra fría mientras avanzáis por el corredor. Varos sigue marchando con esa precisión mecánica, ignorando el entorno como si conociera cada centímetro del camino de memoria o como si confiara ciegamente en que nada se atreverá a interponerse en su ruta.\n\nEl pasillo se extiende monótono, flanqueado por antorchas que chisporrotean débilmente, proyectando sombras alargadas que danzan sobre el suelo gastado. A pesar de tu atención, el entorno parece sumido en un silencio sepulcral y rutinario; no hay ruidos sospechosos ni figuras ocultas que rompan la monotonía del trayecto."}, {"jugador": "\"Sigue caminando, Varos. No te detengas.\"\n\nMantengo el ritmo, pero desplazo mi mirada hacia las paredes y los rincones, buscando cualquier relieve extraño o marca oculta en la piedra.\n\n{Percepción}", "dm": "Varos no altera su paso ni su expresión, limitándose a asentir con un movimiento seco de cabeza mientras continúa guiando el camino. El sonido rítmico de sus botas sobre la piedra es lo único que llena el vacío del corredor.\n\nAl desplazar la mirada, notas que entre las sombras de los nichos, justo donde la luz de las antorchas flaquea, hay una serie de incisiones deliberadas en la piedra. No son relieves ornamentales, sino marcas diminutas y precisas: una sucesión de runas desgastadas que forman una línea continua a lo largo de la pared derecha, ocultas parcialmente por el hollín de los siglos."}, {"jugador": "\"Sigue caminando, Varos.\"\n\nMe acerco a la pared derecha mientras camino, intentando analizar las runas sin que mi paso se vuelva errático.\n\n{Investigación}", "dm": "Varos mantiene el ritmo, su espalda ancha marcando la pauta del avance mientras el eco de sus pasos rebota en las paredes del corredor. No se gira, pero su presencia es una constante, un muro de cuero y metal que sigue guiándote hacia la profundidad de la estructura.\n\nAl deslizar la mirada sobre las incisiones, notas que las runas no forman un lenguaje fluido, sino que parecen una serie de advertencias o marcas de propiedad fragmentadas. Logras distinguir un patrón repetitivo, una secuencia de trazos que sugieren una delimitación de espacio, aunque el hollín y el desgaste impiden que comprendas el significado exacto de los glifos."}, {"jugador": "\"Interesante. Parece que alguien quería dejar muy claro quién era el dueño de este sitio.\"\n\nSigo caminando junto a Varos, pero intento acercar la mano a las paredes para sentir el relieve de las runas y buscar algún mecanismo oculto.\n\n{Investigación}", "dm": "Varos suelta un bufido corto, una risa seca que no llega a girar la cabeza. \"El sentido de propiedad es lo único que sobrevive al tiempo en estos pasillos, forastero. Algunos escribieron sus nombres en piedra creyendo que eso los haría eternos; ahora solo son marcas que nos dicen dónde no pisar\".\n\nTus dedos rozan la superficie fría y rugosa de la piedra, deslizándose sobre los surcos de las runas. Sientes el relieve áspero del granito y el polvillo del hollín que se pega a tu piel, pero la pared es sólida y sorda. No hay hendiduras sospechosas, ni placas que cedan al tacto, ni el más mínimo rastro de un mecanismo que responda a tu presión."}, {"jugador": "\"Palabras vacías para adornar una tumba.\"\n\nRetiro la mano y observo a Varos, tratando de descifrar si su cinismo oculta algún conocimiento real sobre el lugar.\n\n{Perspicacia}", "dm": "Varos mantiene la mirada fija al frente, con los hombros ligeramente encogidos y una expresión de aburrimiento profesional. Sin embargo, al soltar tu comentario, hay un ligero espasmo en la comisura de sus labios y un parpadeo rápido, casi imperceptible. No hay rastro de nerviosismo ni de miedo, sino más bien la actitud de quien ha escuchado esa misma frase demasiadas veces y ha decidido que no merece una respuesta genuina.\n\nSu cinismo parece ser una armadura genuina, un mecanismo de defensa forjado por la rutina de custodiar pasillos vacíos. No oculta un secreto urgente ni una agenda oculta en este instante; simplemente parece alguien que ha aceptado la irrelevancia de su puesto y se regodea en la apatía para que las horas pasen más rápido."}]}}, {"id": "u93e841", "piloto": true, "lore": "# La Vía del Último Silencio\n\n## La procesión\n\nHace setenta días, en el monasterio de la costa, murió Odilia de la Roca, la Sanadora, a quien el reino venera como santa desde hace cuarenta años. Cumpliendo su última voluntad, o lo que la Cofradía de Portadores entiende que fue su última voluntad, su féretro debe recorrer a pie la Vía del Último Silencio: trescientas leguas de camino de montaña, atravesando quince aldeas, hasta el monasterio de Alba Sorda, en lo alto de la sierra, donde debe depositarse en la noche del solsticio de invierno, al abrigo de las primeras luces del año.\n\nLa Vía no se hace con cantos ni con música. Se hace en silencio: quien acompaña al féretro no habla mientras camina, no come a la vista de los demás y no se detiene a menos que el Cofrade Mayor lo ordene. Tal es la regla de la procesión desde hace tres siglos.\n\n## Lo que salió mal\n\nLa procesión lleva sesenta días de camino y lleva diez de retraso. Delante queda el Paso del Lobo, la única garganta por la que se cruza la sierra, que la primera nieve cierra hasta la primavera. Faltan cuarenta días para el solsticio. El plazo es justo. No hay margen para nada.\n\nHace tres jornadas, un mensajero de la aldea de Berrocal, dos leguas más adelante, trajo la noticia de que hay fiebre en el pueblo. Setenta enfermos. No hay médico. Los aldeanos han salido a esperar en el camino, en silencio, con los suyos en brazos.\n\n## Seguir o detenerse\n\n**Anselmo Vela**, Cofrade Mayor, sostiene que la procesión no se detiene: la regla es la regla desde hace trescientos años y no se rompe por urgencia, ni por dolor, ni por compasión. Si el féretro llega tarde al monasterio, la ofrenda pierde su sentido y todo el camino se habrá hecho en vano. Lo dice sin levantar la voz, con la mirada fija en el frente, como quien sostiene una carga que no puede soltar.\n\n**Madre Odalys Brena**, superiora de las Hospitalarias de Odilia que acompañan la procesión, sostiene que la procesión debe detenerse en Berrocal: la Santa pasó su vida cuidando enfermos, y pasar de largo ante setenta personas para honrarla es traicionar lo único que ella enseñó. Lo dice con las manos abiertas y el hábito manchado de polvo de camino, sin apartar los ojos de los aldeanos que esperan.\n\nNinguno duda de la fe del otro. Los dos saben que la decisión no puede tomarse a la ligera y que no admite ser tomada dos veces.\n\n## El peso del féretro\n\nLos portadores comentan, entre ellos y con la boca casi cerrada, que el féretro pesa menos de lo que debería. Nadie lo ha dicho en voz alta. El féretro va sellado desde la partida y solo el Cofrade Mayor conoce la llave.\n\n## Gente de la procesión\n\n**Anselmo Vela**, Cofrade Mayor, defiende no detener la procesión. **Madre Odalys Brena**, superiora de las Hospitalarias, defiende detenerla en Berrocal. **Tibaldo Sierra**, joven portador de diecisiete años, es -por ahora- solo el muchacho que carga la varilla izquierda del féretro y que ve más de lo que dice; ver «personas_par27.json» para el perfil completo de los tres.\n\n## Tono de la campaña\n\n`world_tone`: **`heroic`**, registro **`serious`**. Solemnidad absoluta: sin ironía, sin humor y sin prisa, con el peso del silencio, del duelo y del deber a cuestas. Las escenas se cuentan con gravedad y contención, con espacio para lo sagrado, lo humano y lo que no se dice. Nadie es un villano: todos los que caminan lo hacen por una razón que respetan. Estructura sin precedente en el corpus: **una peregrinación con votos, plazo y una regla que choca con la compasión**, distinta de las disputas comunitarias y de los procesos judiciales de otros pares porque aquí el conflicto es entre dos formas de honrar lo mismo, y el camino continúa mientras se decide.\n", "A": {"previo": "El equilibrio regresa con un esfuerzo consciente y la vista se aclara, logrando anclar la mirada en la silueta firme de Anselmo. El sendero de granito, pulido por siglos de viento, se extiende ahora con una nitidez recuperada bajo los pies, aunque la niebla persiste, espesándose en remolinos que parecen cobrar vida propia y danzar alrededor de los tobillos.\n\nAnselmo sigue avanzando sin detenerse, manteniendo el ritmo constante y la espalda erguida, sin mirar atrás. Su voz corta la blancura con una sequedad imperturbable: \"No maldigas el camino. Solo camina.\"\n\nEl camino es estrecho y la bruma sigue siendo traicionera; cualquier distracción o pérdida de enfoque podría hacer que el grupo se desvíe del sendero de granito hacia el vacío.", "turnos": [{"jugador": "\"No hace falta que me lo recuerdes.\"\n\nSigo los pasos de Anselmo con atención, concentrándome en el granito bajo mis botas para no desviarme.\n\n{Percepción}", "dm": "El sendero de granito asciende en una curva cerrada, encajonando el paso entre paredes de roca desnuda que se desvanecen en una bruma espesa y gélida. El silencio es absoluto, roto únicamente por el chocar rítmico de las botas contra la piedra fría, un sonido que se vuelve hipnótico mientras el camino se estrecha.\n\nA pesar del esfuerzo por mantener la concentración, el pie resbala en un tramo de roca húmeda, provocando un tropiezo que rompe el ritmo y sacude el equilibrio. Anselmo Vela no se detiene ni gira la cabeza; sigue caminando con el paso pesado y la mirada fija en el horizonte blanco. \"No es un recordatorio. Es la instrucción\", sentencia con una sequedad imperturbable.\n\nLa fatiga y la humedad del granito están empezando a pasar factura; un error más en el paso podría provocar una caída más grave o un deslizamiento fuera del sendero."}, {"jugador": "\"Tus instrucciones son tan claras como esta bruma, Vela.\"\n\nMe enderezo rápidamente y recupero la compostura, manteniendo la vista atenta al suelo para evitar otro desliz.\n\n{Percepción}", "dm": "El equilibrio regresa con precisión y la mirada, ahora aguda, logra descifrar los peligros del terreno antes de que se conviertan en tropiezos. El sendero se abre súbitamente en un pequeño rellano donde la bruma se agita, revelando una serie de estelas de piedra erosionadas y una inscripción casi borrada que advierte sobre el descenso.\n\nAnselmo Vela no se gira. Mantiene la espalda recta y el paso rítmico, con una voz grave que no admite bromas ni vacilaciones: \"La bruma es el camino. Lo que importa es que el paso no se detenga.\"\n\nEl rellano es solo un respiro momentáneo; las advertencias de las estelas sugieren que el tramo siguiente del descenso es considerablemente más traicionero y expuesto."}, {"jugador": "\"¿Qué dicen exactamente esas piedras?\"\n\nMe detengo un segundo frente a las estelas para intentar leer la inscripción antes de seguir.\n\n{Investigación}", "dm": "Los dedos rozan la piedra fría y húmeda, pero las letras han sido devoradas por el tiempo y el musgo. El esfuerzo por descifrar el mensaje resulta inútil; las inscripciones son ahora solo surcos irregulares que no revelan nada más allá de una advertencia genérica y borrosa.\n\nAnselmo Vela se detiene apenas un instante, sin mirar las piedras, manteniendo la vista fija en el féretro. Su voz es lenta y carece de matices, cerrando la conversación antes de retomar el paso: \"Dicen que el descenso es traicionero. Nada que no sepamos ya.\"\n\nLa falta de información sobre el terreno deja al grupo a ciegas ante los peligros específicos del descenso, aumentando la probabilidad de un accidente mientras el féretro avanza."}, {"jugador": "\"Si el descenso es traicionero, no pienso dejar que el féretro sea lo único que llegue abajo.\"\n\nMe adelanto un paso para observar la pendiente y busco cualquier señal de inestabilidad en el suelo.\n\n{Percepción}", "dm": "El pie se desliza sobre una placa de pizarra húmeda que cede con un chasquido seco, obligando a recuperar el equilibrio bruscamente antes de que el tobillo se tuerza. La pendiente es una trampa de piedra oscura y resbaladiza que se hunde en una penumbra densa, donde el suelo vibra levemente, sugiriendo que la estructura misma de la montaña es inestable y fragmentaria.\n\nAnselmo Vela sigue caminando con paso rítmico y pesado, manteniendo sus manos firmes sobre la estructura del féretro sin girar la cabeza. \"Cuide sus pasos, pues el suelo no tiene piedad con quien se apresura. Pero no se aleje demasiado; la procesión no se fragmenta\", sentencia con una voz que resuena fría en el vacío del descenso.\n\nEl terreno se vuelve más errático y la visibilidad decrece; cualquier otro tropiezo podría provocar una caída que comprometa la estabilidad del féretro o deje al grupo separado en la oscuridad."}, {"jugador": "\"Tengo cuidado, no hace falta que me lo recuerde.\"\n\nMe recoloco con cautela, buscando los puntos de apoyo más firmes para no volver a resbalar. Camino con pasos cortos y lentos, manteniendo la vista fija en los pies de Anselmo para no perderme en la penumbra.\n\n{Percepción}", "dm": "El descenso se abre ahora en una galería natural de pizarra negra, donde las paredes sudan un líquido viscoso que brilla débilmente bajo la luz. Al concentrar la mirada y medir cada apoyo, los puntos firmes de la roca se revelan entre el limo, permitiendo que el paso se estabilice y el ritmo se sincronice con el de la procesión, evitando cualquier nuevo desliz sobre el suelo traicionero.\n\nAnselmo Vela no detiene su marcha; el ritmo de sus pasos es imperturbable y sus manos no se han movido ni un centímetro de la madera del féretro. Sin girar la cabeza, responde con una sequedad que corta el eco de la galería: \"No es un recordatorio. Es la realidad del camino.\"\n\nLa galería se estrecha y el líquido que supura de las paredes comienza a acumularse en el suelo, volviendo la superficie aún más resbaladiza y dificultando la visibilidad de los apoyos seguros."}, {"jugador": "\"Tú llámalo realidad, yo lo llamo un desastre.\"\n\nSigo avanzando con cuidado, manteniendo la vista fija en el suelo para no resbalar mientras trato de identificar qué es ese líquido.\n\n{Naturaleza}", "dm": "El análisis atento de la sustancia revela que no es agua, sino una secreción orgánica, un exudado mineralizado que actúa como un lubricante natural sobre la pizarra. A pesar de la viscosidad, el paso se mantiene firme y el equilibrio no flaquea, permitiendo que la marcha continúe sin contratiempos mientras el rastro del líquido se vuelve más predecible bajo la mirada.\n\nAnselmo Vela no deja de caminar, manteniendo la espalda rígida y el agarre firme en el féretro. Con una voz grave y monocorde que resuena en la galería, responde sin siquiera girar la cabeza: \"El desastre es el hombre que olvida dónde pisa por mirar la mancha. Siga avanzando.\"\n\nEl aire en la galería se vuelve más pesado y el olor a materia orgánica en descomposición comienza a intensificarse, sugiriendo que el camino se adentra en una zona donde la ventilación es nula y los gases podrían volverse tóxicos."}, {"jugador": "\"Menos lecciones y más aire, Anselmo. Este olor es insoportable.\"\n\nMe cubro la nariz y la boca con un trozo de tela mientras acelero el paso para mantenerme cerca del féretro.\n\n{Percepción}", "dm": "La tela contra el rostro amortigua el hedor, pero no el sonido. La galería se estrecha abruptamente, convirtiéndose en un túnel de pizarra donde las paredes sudan ese exudado espeso y viscoso. Al fondo, la oscuridad se vuelve absoluta, devorando la luz; solo el eco devuelve un goteo rítmico y el roce sordo de algo pesado que se desliza lentamente sobre la piedra, acechando en el silencio.\n\nAnselmo Vela mantiene el paso constante, sin alterar la respiración ni la postura, con la mirada fija en el horizonte del sendero. Sin detenerse, su voz resuena fría en el túnel: \"El aire no es un lujo, es el camino. Si el olor le molesta, camine más rápido.\"\n\nEl sonido del deslizamiento se vuelve más frecuente y rítmico, indicando que aquello que habita en la oscuridad ha percibido la vibración de sus pasos y comienza a cerrar la distancia."}, {"jugador": "\"Menos consejos y más guardia, Vela.\"\nSaco mi espada y me pongo en guardia, atento al movimiento en la oscuridad.\n{Iniciativa}", "dm": "El acero desliza un silbido limpio al abandonar la vaina, cortando la densidad del aire. El túnel de pizarra húmeda desemboca finalmente en una cámara circular, donde el goteo rítmico de las estalactitas marca el tempo de la espera; todo el espacio está revistido por esa membrana viscosa que brilla débilmente, como piel viva extendida sobre la piedra.\n\nAnselmo Vela no se detiene ni gira la cabeza, manteniendo la espalda recta y el ritmo del paso imperturbable, aunque sus nudillos se blanquean al apretar con fuerza el soporte del ataúd. \"Mi guardia es el paso, y mi deber es el féretro. Haga el suyo\", sentencia con una voz que no admite réplica, mientras el grupo queda expuesto en el centro de la estancia.\n\nLa membrana que recubre las paredes comienza a vibrar sutilmente, sugiriendo que algo se desplaza por el techo de la cámara, justo encima de la posición de guardia."}]}, "B": {"previo": "El acero describe un arco ascendente que corta el aire húmedo, pero el movimiento es torpe debido al peso del lodo que aún gotea de la hoja. La criatura, con un movimiento espasmódico y fluido, se inclina hacia atrás justo a tiempo, permitiendo que el filo pase a escasos centímetros de su piel pálida y viscosa.\n\nEl siseo se transforma en un gorgoteo vibrante, casi como una risa ahogada. Aprovechando el impulso fallido del tajo, el ser se lanza hacia adelante, cerrando la distancia con una velocidad depredadora.", "turnos": [{"jugador": "\"¡Maldita sea!\"\nIntento retroceder rápidamente para recuperar el equilibrio y poner distancia entre la criatura y yo.\n{Acrobacias}", "dm": "El pie resbala bruscamente sobre la capa de limo y detritos, haciendo que el intento de retroceso se convierta en un tropiezo torpe. El equilibrio se pierde en un instante, dejando el cuerpo expuesto y vulnerable mientras el peso del equipo tira hacia abajo.\n\nLa criatura no desperdicia la oportunidad. Con un salto seco y preciso, el ser se abalanza sobre la posición inestable, aprovechando la caída para cerrar el espacio con un impacto visceral."}, {"jugador": "\"¡Maldito seas!\"\n\nIntento girar el cuerpo rápidamente sobre el suelo resbaladizo para golpear a la criatura con el pomo de mi espada mientras cae sobre mí.\n\n{Ataque}", "dm": "El movimiento es instintivo, un espasmo de supervivencia que transforma la caída en un pivote violento. Mientras la criatura se lanza en el aire, el cuerpo gira sobre el limo, aprovechando la propia inercia del tropiezo para lanzar el pomo de la espada en un arco ascendente y devastador. El metal impacta con un crujido seco y sordo directamente en el centro del cráneo del ser, justo en el momento en que sus garras estaban a punto de cerrarse sobre el pecho.\n\nEl golpe es tan preciso y potente que la cabeza de la criatura se sacude bruscamente hacia atrás, rompiendo su trayectoria. El ser cae pesadamente sobre el suelo lodoso, aturdido y con el cuerpo convulsionando, mientras el impacto lo deja inerte por unos instantes, chapoteando en el detrito oscuro."}, {"jugador": "\"No te levantes.\"\nAprovecho que la criatura está aturdida para lanzar un tajo descendente y definitivo hacia su cuello.\n{Ataque}", "dm": "El acero desciende con una velocidad implacable, cortando el aire húmedo antes de hundirse profundamente en la carne expuesta del cuello. Se escucha un desgarro húmedo y visceral mientras la hoja atraviesa las vértebras, separando la conexión entre el cerebro y el resto del cuerpo en un único, fluido movimiento descendente.\n\nLa criatura emite un gorgoteo ahogado que se apaga instantáneamente. Su cuerpo deja de convulsionar y se desploma pesadamente sobre el limo, quedando inmóvil mientras un fluido oscuro y espeso se filtra en el barro, tiñendo el entorno de un negro aceitoso. El silencio regresa al lugar, roto únicamente por el goteo del metal regresando a su posición."}, {"jugador": "\"Asqueroso.\"\n\nLimpio mi hoja en el cadáver y me acerco para registrar el cuerpo, buscando cualquier objeto de valor o pista.\n\n{Investigación}", "dm": "El cuerpo yace inerte sobre el limo, exhalando un hedor a putrefacción y hierro. Al registrar los pliegues de su piel coriácea y los restos de sus harapos, tus dedos encuentran algo rígido y frío oculto en una cavidad abierta en su torso, donde el tejido se ha fundido con un objeto metálico. Con un tirón preciso, extraes un relicario de plata oscurecida, grabado con el sello de una balanza rota, que contiene un trozo de pergamino amarillento y perfectamente seco.\n\nEl pergamino es una instrucción breve, escrita con una caligrafía nerviosa: *\"El féretro no debe detenerse en la encrucijada del Sauce Llorón; el hambre no aceptará un camino desviado\"*. Junto al relicario, recuperas una pequeña bolsa de cuero que contiene 12 piezas de oro y una llave de hierro oxidada con una muesca en forma de garfio."}, {"jugador": "\"¿El hambre? Qué frase más inquietante.\"\n\nGuardo el oro y la llave en mi bolsa. Me quedo observando el sello de la balanza rota del relicario para intentar reconocerlo.\n\n{Historia}", "dm": "El sello de la balanza rota te resulta familiar, aunque evocaba una sensación de desasosiego en los márgenes de tu memoria. Se trata de la marca de la Cofradía de Portadores, una organización hermética encargada del traslado de restos sagrados o malditos. Su símbolo, la balanza equilibrada, representa la justicia del tránsito; sin embargo, que la balanza aparezca rota en este relicario sugiere una ruptura del protocolo, una transgresión o un fallo en el equilibrio que debían mantener.\n\nEl silencio del entorno parece espesarse mientras sostienes el objeto, y el hedor del cadáver se vuelve más penetrante, como si la mención implícita a \"el hambre\" hubiera despertado algo en el aire estancado del limo."}, {"jugador": "\"¿La Cofradía de Portadores? Esto no es un simple traslado.\"\n\nSuelto el relicario con cuidado y me alejo un paso del cadáver, tratando de ignorar el hedor mientras observo los alrededores en busca de cualquier otro rastro de la organización.\n\n{Percepción}", "dm": "El relicario cae sobre el suelo fangoso con un sonido sordo, hundiéndose ligeramente en el limo. Al retroceder, el aire parece vibrar con una densidad opresiva, y el hedor a putrefacción se vuelve casi tangible, envolviéndote en una nube invisible que irrita la garganta. \n\nTus ojos recorren el perímetro, escudriñando la penumbra y la suciedad del lugar. Aparte de la figura inerte y el objeto que acabas de soltar, el entorno se mantiene mudo; no hay huellas frescas en el barro ni señales evidentes de que alguien haya estado vigilando el cuerpo recientemente. El silencio vuelve a reinar, roto únicamente por el goteo distante de alguna filtración de agua."}, {"jugador": "\"Maldito lugar.\"\n\nMe cubro la nariz con el brazo para evitar el hedor y me acerco al relicario para recogerlo del barro.\n\n{Percepción}", "dm": "El barro succiona el metal del relicario con un chasquido húmedo mientras lo levantas, dejando una película de limo grisáceo sobre la superficie del objeto. Al agacharte, el ángulo de tu visión se desplaza hacia el cuerpo inerte y notas algo que el pánico inicial había ocultado: una fina hebra de seda plateada, casi invisible, que se extiende desde la muñeca del cadáver hacia la espesura de la niebla, tensa y vibrando levemente, como la cuerda de un instrumento afinado.\n\nMás allá de esa hebra, el silencio del lugar es engañoso. Al agudizar el oído, percibes un rítmico y sordo *clac-clac-clac* que emerge de la penumbra, desplazándose lentamente entre los árboles. No es un paso humano; es el sonido de algo duro, similar a la queratina o el hueso, golpeando el suelo fangoso en una cadencia depredadora que se acerca hacia tu posición."}, {"jugador": "\"Maldita sea...\"\n\nSujeto el relicario con fuerza y me pongo en guardia, desenvainando el acero mientras clavo la vista en la dirección del sonido.\n\n{Iniciativa}", "dm": "El acero desliza un siseo frío al salir de la vaina, cortando el aire húmedo mientras te plantas firme sobre el barro. El sonido rítmico se detiene abruptamente, dejando un vacío ensordecedor que solo es roto por el goteo del limo desde el relicario. La niebla comienza a arremolinarse, densa y blanquecina, ocultando la base de los troncos y deformando las siluetas del bosque.\n\nDe repente, una figura se materializa a escasos metros, emergiendo del velo gris. Es una criatura esquelética y alargada, cuya piel tiene la textura del pergamino viejo y tensado sobre huesos prominentes. Sus extremidades terminan en garras endurecidas, negras como el obsidiana, que han sido las responsables del *clac-clac* contra el suelo. La criatura no tiene ojos, solo cuencas vacías que parecen aspirar la poca luz del lugar, y su cabeza se inclina con un espasmo violento, detectando tu presencia."}]}}, {"id": "ubf12b4", "piloto": true, "lore": "# Umbral Hondo\n\n## El pueblo y la mina\n\nUmbral Hondo se construyó alrededor de una cantera de plata que ya no da casi nada -la boca de la mina, más honda que ancha, sigue abierta porque cerrarla del todo costaría más de lo que el pueblo tiene. De ahí el nombre: todo en Umbral Hondo empieza y termina mirando hacia ese agujero, incluida la propia calle principal, que baja en pendiente directa hasta la boca como si el pueblo entero se hubiera construido de espaldas al resto del mundo y de cara a la mina.\n\nDesde hace poco más de un mes, algo ha cambiado. No hay ejército a las puertas ni monopolio que estruje al pueblo: hay vecinos que empiezan a comportarse distinto, con excusas para desaparecer de noche, con una calma nueva que no cuadra con lo poco que queda para vivir. Nadie lo dice en voz alta todavía, pero todo el mundo lo ha notado en alguien.\n\n## Los Hijos del Umbral\n\nLo que de verdad ocurre -y que este documento no resuelve del todo por adelantado- es que un pequeño grupo, cada vez menos pequeño, se reúne en secreto convencido de que la Galería Honda, la última que se excavó antes de que la plata se acabara, no está vacía. Creen que algo que vive ahí abajo ofrece una vista clara de las cosas a quien esté dispuesto a bajar lo suficiente, y llevan meses reclutando despacio, casi siempre entre quienes perdieron a alguien en la mina y necesitan que esa pérdida haya significado algo. No tienen mando único ni un plan que se pueda frustrar con una sola decisión: tienen paciencia, y cada vez más gente dispuesta a esperar a la próxima luna nueva, que creen que abrirá la galería del todo.\n\n## La sospecha que crece\n\n**Bercelio Nax**, capitán de la guardia desde que un derrumbe le quitó a su hermano hace seis años, ha empezado a interrogar a cualquiera que note \"raro\" -sin pruebas, con una lista de nombres que crece cada semana. No se equivoca del todo: hay algo real detrás del cambio que ha notado en el pueblo. Se equivoca en el método: acusar sin pruebas está fracturando Umbral Hondo tan rápido como cualquier culto podría hacerlo solo.\n\n**Sonia Muriel**, la curandera del pueblo, se opone a cada interrogatorio de Bercelio con el mismo argumento, una y otra vez: nadie merece ser acusado sin evidencia real. Tiene razón -y esa misma razón, sin que ella lo sepa todavía, es exactamente lo que ha estado protegiendo a quien no debería proteger.\n\n## La Capilla Vieja\n\nEn el extremo más alejado del pueblo hay una capilla abandonada desde hace más de una generación, cuando el último sacerdote itinerante dejó de pasar por Umbral Hondo. Se supone que no hay nada ahí dentro salvo polvo y bancos rotos. Algunos vecinos, sin embargo, juran haber visto luz adentro en noches sin ceremonia ni motivo -y nadie, hasta ahora, se ha atrevido a ir a comprobarlo de cerca.\n\n## Gente del pueblo\n\n**Bercelio Nax**, capitán de la guardia, quiere proteger Umbral Hondo de lo que sea que le esconde, y cada acusación sin pruebas lo acerca un poco más a convertirse en la amenaza que dice combatir. **Sonia Muriel**, curandera, cree que nadie merece ser acusado sin evidencia, y no se ha permitido sospechar en serio de la persona más cercana a ella que quizás debería. **Iker Sabas**, farolero del pueblo, es -por ahora- solo un vecino más; ver \"personas_par07.json\" para el perfil completo de los tres y el molde de promoción de PNJ de paso ya usado en pares anteriores.\n\n## Tono de la campaña\n\n`world_tone`: **`grimdark`**. Ya usado en Par 01, Par 02 y Par 06, pero con una **estructura nueva, sin precedente en el corpus real**: ni monopolio que extrae (Par 01, Par 02) ni escasez de recursos sin villano (Par 06), sino una **infiltración oculta** -un culto sin mando único, sin cara visible todavía, que crece más rápido de lo que el pueblo es capaz de admitir. El verdadero peligro no es el culto en sí, que ningún personaje ha visto de cerca todavía, sino la caza de brujas que Bercelio ya empezó por su cuenta: dos posturas igual de defendibles (perseguir con firmeza contra ceder terreno a la paranoia) sin que ninguna de las dos sea la villana de la historia.\n", "A": {"previo": "El avance es torpe y desorientado. El polvo grisáceo del suelo se traga el sonido de las botas, borrando cualquier referencia espacial mientras las placas del techo cuelgan como cuchillas precarias sobre la cabeza. No hay corrientes de aire, ni ecos, ni el más mínimo indicio de una salida; solo una oscuridad absoluta y asfixiante que parece absorber la voluntad de quien intenta descifrarla.\n\nEl Sargento Vane no se mueve del sitio. Se mantiene con los brazos cruzados, observando la espalda del otro con una voz plana, aunque cargada de una resignación protectora. \"Tampoco detendrá el impacto cuando te des cuenta de que no hay nada bajo tus pies. Pero sigue, Tarq. Si tu instinto es más fuerte que tu vista, quizá nos saques de aquí antes de que nos convirtamos en parte del cimiento\".\n\nLa vibración del suelo se vuelve errática y el hormigón comienza a soltar fragmentos del tamaño de puños; el camino hacia atrás se está sellando y el frente es un vacío desconocido.", "turnos": [{"jugador": "\"Que el vacío me reciba o me escupa, pero no me quedaré a esperar que el techo me aplaste.\"\n\nIgnoro la advertencia de Vane y avanzo con paso firme hacia la oscuridad, intentando palpar las paredes para orientarme.\n\n{Percepción}", "dm": "Tus dedos encuentran una superficie fría y húmeda: una pared de hormigón bruto que se curva hacia adentro, formando un pasillo estrecho que desciende ligeramente. El vacío deja de ser absoluto para convertirse en un túnel opresivo donde el único sonido es el rítmico goteo de un líquido viscoso que cae desde el techo, marcando un compás lento y enfermo en la penumbra.\n\nEl sargento Vane descruza los brazos con un movimiento seco y comienza a caminar justo detrás de ti, manteniendo una distancia mínima, con la mano puesta instintivamente en el arma. \"Entonces no te soltaré la espalda. Si vas a caminar hacia el precipicio, al menos asegúrate de que no me arrastres contigo por accidente\", sentencia con un tono que mezcla la cautela militar con una lealtad inquebrantable.\n\nEl goteo viscoso del techo comienza a acelerarse y el aire se vuelve denso, cargado de un olor a hierro y descomposición que indica que el pasillo no lleva a una salida, sino a algo que ha estado esperando en la humedad."}, {"jugador": "\"Huele a sangre y a carne vieja. No es un camino, es un matadero.\"\n\nSigo avanzando lentamente por el túnel, manteniendo la mano cerca de mis componentes, mientras trato de identificar el origen exacto del olor.\n\n{Percepción}", "dm": "El túnel se abre bruscamente en una cámara semicircular donde el hormigón ha sido devorado por una capa de materia orgánica oscura que late con un ritmo lento y enfermo. Del techo cuelgan ganchos oxidados que sostienen restos irreconocibles, desprendiendo un fluido viscoso que cae rítmicamente sobre un suelo inundado por un charco carmesí y denso.\n\nEl sargento Vane reduce el paso para sincronizarse exactamente con el tuyo, moviendo el arma hacia una posición de alerta activa mientras olfatea el aire con un gesto de asco contenido. \"Entonces no bajemos la guardia. Si esto es un matadero, lo único que importa ahora es quién sostiene el cuchillo\", sentencia con una frialdad marcial.\n\nLa materia orgánica de las paredes comienza a contraerse y expandirse con más fuerza, sugiriendo que la cámara no es solo un lugar de almacenamiento, sino un organismo vivo que ha detectado vuestra presencia."}, {"jugador": "\"Parece que hemos entrado en el estómago de algo.\"\n\nMe detengo y observo con detenimiento la materia orgánica de las paredes, buscando alguna señal de cómo reacciona exactamente a nosotros.\n\n{Investigación}", "dm": "La cavidad pulsante de tejido carnoso y oscuro reacciona a vuestra presencia con espasmos musculares violentos. El fluido carmesí que cubre el suelo es desplazado hacia los bordes con cada contracción, como si la materia orgánica estuviera intentando digerir el espacio vacío que vuestros cuerpos ocupan, pero el análisis detallado de las paredes no revela ningún patrón comprensible ni debilidad ev
