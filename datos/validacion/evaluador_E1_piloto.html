idente; solo una masa ciega y hambrienta.\n\nEl sargento Vane te da un empujón seco en el hombro para obligarte a seguir avanzando, sin dejar de barrer la zona con el arma. \"No te quedes ahí pasmado analizando la pared. Si es un estómago, ya estamos digeridos; muévete\", sentencia con brusquedad.\n\nEl ritmo de las contracciones se acelera y el fluido carmesí empieza a subir por vuestras botas, volviéndose más viscoso y adherente."}, {"jugador": "\"Tu optimismo es conmovedor, sargento.\"\n\nMe separo de la pared y avanzo rápidamente, intentando no hundirme en el fluido.\n{Percepción}", "dm": "El paso es rápido y seguro, logrando esquivar los remolinos más densos del fluido carmesí mientras el cuerpo se adapta al terreno viscoso. El pasillo de tejido se estrecha bruscamente, obligando a avanzar en fila india entre paredes que palpitan con un ritmo febril, casi agónico. Al fondo, una membrana translúcida y tensa actúa como válvula, vibrando violentamente ante el acercamiento del grupo, como un diafragma que lucha por mantenerse cerrado.\n\nEl sargento Vane no se molesta en girar la cabeza; mantiene el arma en guardia y el paso firme, aunque la densidad del suelo dificulte cada zancada. \"Guárdate la ironía para cuando tengamos suelo firme bajo los pies. Ahora camina\", sentencia con un tono gélido que no admite réplica.\n\nLa membrana del fondo empieza a dilatarse irregularmente, sugiriendo que algo del otro lado está empujando para entrar en el pasillo."}, {"jugador": "\"Algo quiere entrar.\"\n\nMe detengo un instante para observar el ritmo de las paredes y la vibración de la membrana, buscando algún patrón en el movimiento.\n\n{Investigación}", "dm": "El intento de descifrar el patrón resulta inútil; las vibraciones son erráticas, un caos de espasmos orgánicos que no revelan nada más que una urgencia ciega. Mientras la atención se pierde en el ritmo de las paredes, el pasillo se cierra aún más, convirtiéndose en un cuello de botella asfixiante donde la membrana translúcida late con una violencia creciente, empujada por una fuerza invisible que amenaza con desgarrar el tejido.\n\nVane no se detiene, pero tensa el brazo del arma y echa una mirada rápida y severa hacia atrás, instando al grupo a seguir moviéndose. \"Menos análisis y más distancia. Si esa cosa logra abrirse paso, no quiero que nos pille mirando la pared\", sentencia con brusquedad.\n\nLa membrana está a punto de ceder; si el grupo no avanza o se prepara, el impacto de lo que hay al otro lado los encontrará estáticos en el punto más estrecho del pasillo."}, {"jugador": "\"No hace falta que me lo digas dos veces.\"\n\nMe aparto de la pared y apresuro el paso para salir de ese cuello de botella.\n\n{Percepción}", "dm": "El paso se acelera y el cuello de botella queda atrás justo a tiempo. El pasillo se ensancha bruscamente en una cámara ovalada, donde el tejido orgánico se vuelve más pálido y fibroso, alzándose en pilares que parecen costillas colosales sosteniendo un techo abovedado y húmedo que gotea un fluido viscoso sobre el suelo.\n\nEl Sargento Vane mantiene la mirada al frente, avanzando con paso firme y el arma en guardia, sin mirar atrás para comprobar si el grupo lo sigue. \"Bien. No te detengas hasta que el aire deje de oler a sangre\", sentencia con una frialdad mecánica mientras se adentra en la blancura pálida de la cámara.\n\nLa cámara es vasta y el eco de los pasos atrae la atención de algo que se arrastra entre las costillas del techo; el silencio es una ilusión que se rompe lentamente."}, {"jugador": "\"Que el aire huela a sangre es lo más honesto de este lugar.\"\n\nSigo avanzando, pero mantengo la vista fija en las costillas del techo para localizar aquello que se arrastra.\n\n{Percepción}", "dm": "La mirada se pierde en la blancura pálida del techo, rastreando el movimiento entre las costillas colosales, pero el fluido viscoso que gotea y el juego de sombras confunden la vista. No hay rastro claro de lo que se arrastra; solo queda la sensación opresiva de ser observado desde lo alto mientras el eco de los pasos sigue resonando en la cámara ovalada.\n\nEl Sargento Vane no gira la cabeza, manteniendo el arma elevada y el dedo en el gatillo con una rigidez profesional. Su voz suena seca y pragmática, cortando el aire húmedo: \"No busques honestidad en un matadero, Tarq. Busca el camino de salida.\"\n\nEl movimiento en el techo se vuelve más errático y cercano; la criatura ha localizado la fuente del ruido y comienza a descender lentamente por los pilares fibrosos."}, {"jugador": "\"Tú sigue mirando al frente, Sargento.\"\n\nDoy un paso atrás para ganar distancia y trato de localizar el punto exacto donde la criatura desciende entre las sombras.\n\n{Percepción}", "dm": "El movimiento errático en las alturas se vuelve nítido. Entre el goteo viscoso y las sombras que se retuercen en las costillas del techo, un punto de contraste emerge: la criatura se desliza con una lentitud depredadora, revelando su silueta contra la blancura pálida justo antes de intentar fundirse de nuevo con la oscuridad.\n\nEl Sargento Vane no baja el arma ni mueve un solo músculo del cuello, manteniendo la mirada clavada en el vacío del pasillo. Con una voz gélida y enfocada, sentencia: \"Tengo el frente cubierto. Tú encárgate de que nada nos caiga en la nuca.\"\n\nLa criatura ha detectado tu mirada; el descenso se acelera y el silencio del techo es sustituido por un siseo húmedo que desciende rápidamente hacia vuestras espaldas."}]}, "B": {"previo": "El desconocido no se mueve, pero el aire a tu alrededor parece espesarse, volviéndose grumoso y cargado de un olor a ozono y tierra húmeda. Al intentar concentrarte en la esencia arcana de aquel rastro, tu mente se nubla violentamente; la energía que intentas desentrañar reacciona a tu intrusión como un nervio expuesto, provocando un chispazo psíquico que te devuelve un eco distorsionado y caótico. Te quedas un instante desorientado, con un zumbido agudo perforando tus oídos y la sensación de que, por un segundo, algo desde el otro lado ha mirado hacia ti.\n\n—La curiosidad es la grieta por donde se cuela el vacío —sentencia la figura, cuya voz ahora suena ligeramente más resonante, casi como si hablara desde el fondo de un pozo—. Preguntas por el \"quién\", cuando deberías temer el \"qué\".\n\n[La pifia en Arcanos no solo falla en darte información, sino que provoca una reacción adversa del eco. Has sufrido una breve desorientación sensorial y el PNJ ha percibido tu intento fallido de analizarlo mágicamente.]", "turnos": [{"jugador": "\"No me intimida el vacío, ni quien pretenda hablar en su nombre.\"\n\nSacudo la cabeza para despejar el zumbido y doy un paso hacia adelante, manteniendo la mirada fija en el desconocido. {Intimidación}", "dm": "El desconocido no retrocede. Al contrario, se inclina levemente hacia adelante, y aunque su rostro permanece oculto, puedes sentir cómo el aire se vuelve gélido, congelando la humedad de la tierra bajo tus botas. La presión en el ambiente no cede, pero el ritmo de su respiración —si es que respira— se vuelve lento, casi imperceptible, mientras procesa tu desafío.\n\n—La arrogancia es el prefacio de la caída —responde con una calma glacial, aunque hay una nota de reconocimiento en su tono, como quien observa a un animal que muerde el anzuelo—. No busco intimidarte, viajero. Busco advertirte de que hay puertas que, una vez abiertas, no admiten el regreso.\n\nEl Vigilante permanece inmóvil, pero el aura de hostilidad se transforma en una desconfianza gélida; te observa ahora no como a un intruso irrelevante, sino como a una variable peligrosa y errática."}, {"jugador": "\"Me gustan las puertas que no permiten el regreso. Suelen guardar los secretos que el resto teme.\"\n\nSostengo la mirada, sin retroceder ante el frío, mientras intento analizar sus palabras para descubrir qué es exactamente lo que protege.\n\n{Perspicacia}", "dm": "El desconocido no se inmuta ante tu declaración, pero el aire a su alrededor vibra con una tensión contenida. Te observa en silencio, y aunque intentas desgranar el significado de su advertencia, sus palabras permanecen como un muro de hielo: no hay una grieta, una duda o un desliz en su tono que te revele la naturaleza de lo que custodia ni la razón exacta de su vigilancia.\n\n—La curiosidad es un hambre que rara vez se sacia sin consumir al que la siente —sentencia el Vigilante, manteniendo esa distancia gélida—. Si tanto ansías el camino sin retorno, camina. Pero no esperes que el Umbral sea benevolente con quien ignora las señales."}, {"jugador": "\"Tus advertencias no son más que ruido para quien ya ha aceptado su destino.\"\n\nCamino con paso firme hacia el Umbral, ignorando la tensión del aire.\n\n{Perspicacia}", "dm": "El Vigilante del Umbral no se mueve ni un centímetro mientras lo adelantas. Solo se escucha el eco de tus pasos sobre la piedra fría y el siseo del viento que comienza a arreciar, cargado de un olor a salitre y ceniza. Sus ojos, fijos en tu espalda, no transmiten ni ira ni preocupación, sino una indiferencia gélida, como la de quien observa a un insecto caminar hacia una red.\n\nAl avanzar, el aire se vuelve denso, casi tangible, y la luz del día se filtra débilmente, adquiriendo un tinte grisáceo y enfermo. No percibes ninguna señal oculta en el comportamiento del guardia ni ningún indicio visual que revele qué hay más allá del límite; solo sientes la presión opresiva de un lugar que parece rechazar tu presencia antes siquiera de haber entrado."}, {"jugador": "\"Este lugar tiene un hambre antigua.\"\n\nSigo caminando hacia adelante, ignorando la sensación de rechazo y manteniendo la vista fija en el horizonte grisáceo.\n\n{Percepción}", "dm": "El horizonte permanece como una mancha difusa de ceniza y plomo, negándose a revelar cualquier detalle concreto. A medida que avanzas, el silencio se vuelve absoluto, ahogando incluso el sonido de tu propia respiración, y el paisaje se funde en una monotonía gris que no ofrece ni una grieta, ni una huella, ni un solo indicio de lo que aguarda más adelante.\n\nA tus espaldas, el Vigilante del Umbral sigue inmóvil, una silueta oscura recortada contra la luz débil, observando cómo te sumerges en la bruma sin pronunciar palabra."}, {"jugador": "\"No espero que me guíes, pero tampoco que me detengas.\"\n\nMe detengo un momento y miro hacia atrás, analizando la postura del Vigilante del Umbral mientras sigo avanzando lentamente hacia la bruma.\n\n{Perspicacia}", "dm": "El Vigilante del Umbral no se ha movido ni un centímetro desde que pronunciaste tus palabras. Permanece como una estatua de piedra y sombras, con los brazos caídos y la mirada fija en tu espalda, aunque su rostro permanece oculto bajo la penumbra de su capucha. Su silencio es pesado, una presencia que no busca ayudar ni obstaculizar, sino simplemente atestiguar tu avance hacia lo desconocido.\n\nAl analizar su postura, no percibes ninguna señal clara de intención ni un gesto que revele sus pensamientos. La figura es un vacío absoluto de emociones y lenguaje corporal, fundiéndose con la monotonía gris del entorno mientras te alejas."}, {"jugador": "\"No me gusta que alguien me mire la espalda sin decir una palabra.\"\n\nMe detengo en seco y giro sobre mis talones para quedar frente a frente con la figura. Intento descifrar si hay algo más allá de la capucha.\n\n{Perspicacia}", "dm": "El Vigilante permanece inmóvil, una silueta recortada contra la bruma cenicienta. Al quedar frente a él, el vacío de su capucha no revela rasgos, ojos ni piel; solo una oscuridad densa que parece absorber la escasa luz del lugar. No hay rastro de respiración, ni el leve balanceo de un cuerpo vivo, solo una quietud mineral que resulta antinatural.\n\nCuando hablas, la figura no reacciona al tono ni a la confrontación. El silencio persiste, denso como el plomo, y la sensación de ser observado no disminuye, aunque no logras distinguir ninguna intención, emoción o secreto oculto tras esa máscara de sombras. Sigue siendo un testigo mudo, una extensión más del paisaje gris."}, {"jugador": "\"Tus silencios no me intimidan, pero tu naturaleza sí me intriga.\"\n\nMe acerco un paso más, tratando de analizar si hay algún rastro de magia o energía emanando de esa oscuridad.\n{Arcanos}", "dm": "Al intentar desentrañar la esencia del Vigilante, tu mente se nubla con una certeza errónea. Sientes un repentino y violento flujo de energía que interpretas como una señal clara de magia nigromántica activa, una pulsación de muerte que parece emanar del centro de su pecho. Estás convencido de que la criatura es un conducto de energía oscura, aunque esa sensación te deja una punzada de desorientación que te hace tambalear ligeramente el paso.\n\nLa figura no se mueve, pero el vacío bajo la capucha parece expandirse un instante, como si tu intento de análisis hubiera sido detectado y descartado. El frío de la bruma cenicienta se intensifica, envolviéndote en un silencio que ahora se siente deliberadamente opresivo."}, {"jugador": "\"Así que eres un conducto de muerte...\"\n\nMe recupero del tambaleo y doy un paso hacia adelante, tratando de mantener la compostura mientras analizo la naturaleza de esa energía.\n\n{Arcanos}", "dm": "El esfuerzo por diseccionar la energía que emana del Vigilante se estrella contra un muro de estática mental. A medida que intentas rastrear el flujo de esa supuesta nigromancia, los hilos del conocimiento se deshacen entre tus dedos; la sensación de muerte que percibiste se vuelve difusa, transformándose en un ruido blanco que no te permite extraer ninguna conclusión útil ni técnica sobre su origen.\n\nLa figura permanece imperturbable, aunque el silencio opresivo se vuelve más denso, casi sólido. La bruma cenicienta comienza a arremolinarse con más fuerza alrededor de tus botas, como si el entorno mismo reaccionara a tu insistencia, manteniendo al Vigilante envuelto en un misterio que se niega a ser descifrado."}]}}]}</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("datos").textContent);
const CLAVE = "val_" + D.evaluador + "_" + D.fase;
let S = { i: 0, r: {} };
try { S = JSON.parse(localStorage.getItem(CLAVE)) || S; } catch (e) { /* sin almacenamiento: exportar seguido */ }
const guardar = () => { try { localStorage.setItem(CLAVE, JSON.stringify(S)); } catch (e) {} };
let t0 = Date.now();

function el(tag, attrs, ...hijos) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") e.className = v; else e.setAttribute(k, v);
  }
  for (const h of hijos.flat()) e.append(h);
  return e;
}
function parrafos(txt) { return (txt || "").split(/\n{2,}/).filter(x => x.trim()).map(x => el("p", {}, x)); }
function reg(u) { return (S.r[u.id] = S.r[u.id] || { seg: 0, p: {}, adivina: "", graves: [], nota: "" }); }
function completa(u) { const r = S.r[u.id]; return !!r && D.dims.every(d => r.p[d[0] + "_A"] && r.p[d[0] + "_B"]) && !!r.adivina; }
function tiempo(u) { const r = reg(u); r.seg += Math.round((Date.now() - t0) / 1000); t0 = Date.now(); }

function columna(nombre, w) {
  return el("div", { class: "col" },
    el("h2", {}, "Texto " + nombre),
    el("div", { class: "previo" }, el("b", {}, "Contexto previo (no se califica): "), ...parrafos(w.previo)),
    w.turnos.map((t, i) => el("div", { class: "t" },
      el("div", { class: "j" }, "Turno " + (i + 1) + " · Jugador: " + t.jugador),
      el("div", { class: "dm" }, ...parrafos(t.dm)))));
}

function render() {
  const u = D.unidades[S.i], r = reg(u);
  t0 = Date.now();
  document.getElementById("titulo").textContent = "Evaluación ciega · " + D.evaluador + " · " + D.fase.toUpperCase() + " · unidad " + (S.i + 1) + " de " + D.unidades.length;
  document.getElementById("avance").textContent = D.unidades.filter(completa).length + " completas";
  document.getElementById("lorec").replaceChildren(...parrafos(u.lore));
  const rub = document.getElementById("rub");
  rub.replaceChildren(...D.dims.map(d => el("p", {}, el("b", {}, d[0] + " · " + d[1] + ". "), d[2], el("br"), el("span", { class: "def" }, d[3]))));

  const filas = D.dims.map(d => el("tr", {},
    el("td", {}, el("b", {}, d[1]), el("div", { class: "def" }, d[2])),
    ["A", "B"].map(lado => el("td", { class: "n" }, el("div", {}, "Texto " + lado),
      [1, 2, 3, 4, 5].map(n => {
        const inp = el("input", { type: "radio", name: d[0] + lado, value: n });
        inp.checked = r.p[d[0] + "_" + lado] === n;
        inp.onchange = () => { r.p[d[0] + "_" + lado] = n; guardar(); document.getElementById("avance").textContent = D.unidades.filter(completa).length + " completas"; };
        return el("label", { class: "r" }, inp, " " + n);
      })))));

  const sel = el("select", {}, ...[["", "— elige —"], ["A", "El Texto A"], ["B", "El Texto B"], ["?", "No sé"]].map(([v, t]) => { const o = el("option", { value: v }, t); o.selected = r.adivina === v; return o; }));
  sel.onchange = () => { r.adivina = sel.value; guardar(); document.getElementById("avance").textContent = D.unidades.filter(completa).length + " completas"; };
  const graves = ["Otro idioma / palabras raras", "Repetición evidente", "Habla fuera de la ficción (meta-comentario)"].map(g => {
    const c = el("input", { type: "checkbox" }); c.checked = r.graves.includes(g);
    c.onchange = () => { r.graves = c.checked ? [...r.graves, g] : r.graves.filter(x => x !== g); guardar(); };
    return el("label", { class: "r" }, c, " " + g);
  });
  const nota = el("textarea", { placeholder: "Comentarios (opcional): qué te llamó la atención, dudas con la rúbrica…" }); nota.value = r.nota;
  nota.oninput = () => { r.nota = nota.value; guardar(); };

  document.getElementById("unidad").replaceChildren(
    el("div", { class: "cols" }, columna("A", u.A), columna("B", u.B)),
    el("table", {}, el("tr", {}, el("th", {}, "Dimensión"), el("th", {}, "Texto A"), el("th", {}, "Texto B")), filas),
    el("div", { class: "fin" },
      el("p", {}, el("b", {}, "¿Cuál cree que es el sistema multiagente? "), sel),
      el("p", {}, el("b", {}, "Problemas graves que notaste: "), ...graves),
      nota));
  window.scrollTo(0, 0);
}

function ir(d) {
  tiempo(D.unidades[S.i]);
  S.i = Math.max(0, Math.min(D.unidades.length - 1, S.i + d));
  guardar(); render();
}
document.getElementById("ant").onclick = () => ir(-1);
document.getElementById("sig").onclick = () => ir(1);
document.getElementById("exp").onclick = () => {
  tiempo(D.unidades[S.i]); guardar();
  const cab = ["evaluador", "fase", "unidad", "segundos"].concat(D.dims.map(d => d[0] + "_A"), D.dims.map(d => d[0] + "_B"), ["adivina_multiagente", "graves", "nota"]);
  const esc = v => '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
  const filas = D.unidades.filter(u => S.r[u.id]).map(u => {
    const r = S.r[u.id];
    return [D.evaluador, D.fase, u.id, r.seg].concat(D.dims.map(d => r.p[d[0] + "_A"]), D.dims.map(d => r.p[d[0] + "_B"]), [r.adivina, r.graves.join("; "), r.nota]).map(esc).join(",");
  });
  const blob = new Blob(["﻿" + [cab.join(",")].concat(filas).join("\n")], { type: "text/csv;charset=utf-8" });
  const a = el("a", { href: URL.createObjectURL(blob), download: "ratings_" + D.evaluador + "_" + D.fase + ".csv" });
  document.body.append(a); a.click(); a.remove();
};
render();
</script>
</body>
</html>
