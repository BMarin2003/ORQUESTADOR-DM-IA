services:
  # Imagen con pgvector ya compilado. Postgres pelado falla en CREATE EXTENSION.
  db:
    image: pgvector/pgvector:pg16
    container_name: dmia_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_only_change_me}
      POSTGRES_DB: dmia_dev
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
      # Todo .sql aquí se ejecuta al crear el volumen por primera vez.
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dmia_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
    # HNSW necesita memoria de mantenimiento al construir el índice.
    # Ajusta según lo que el VPS pueda ceder sin ahogar al resto.
    command: >
      postgres
      -c maintenance_work_mem=512MB
      -c shared_buffers=1GB
      -c work_mem=16MB

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: dmia_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@local.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmindata:/var/lib/pgadmin
      - ./pgadmin-servers.json:/pgadmin4/servers.json:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
  pgadmindata:
