no en un laberinto ciego."}, {"jugador": "\"¡Rápido, movamos esto antes de que no veamos ni nuestras propias manos!\"\n\nSujeto el féretro con fuerza y empujo siguiendo la ruta analizada para sacarlo del fango.\n\n{Atletismo}", "dm": "El esfuerzo resulta insuficiente frente a la densidad del terreno. A pesar de seguir la ruta analizada, el féretro no cede; el lodo negro y aceitoso actúa como un imán viscoso que ancla la madera al suelo, devolviendo el empuje con una resistencia sorda y pesada. El peso se vuelve inmanejable, hundiéndose un poco más en el fango mientras el esfuerzo físico se pierde en la inercia del pantano.\n\nAlrededor, el horizonte desaparece por completo bajo jirones de gas grisáceo que se cierran sobre la escena. La vegetación putrefacta flota en los charcos cercanos, meciéndose lentamente en un aire que se vuelve irrespirable, mientras Anselmo Vela permanece inmóvil, observando el fracaso del intento en el silencio opaco de la bruma.\n\nEl féretro se ha asentado más profundamente en el lodo y el gas viciado ahora borra la visibilidad, haciendo que cualquier nuevo intento de movimiento sea a ciegas y mucho más costoso."}, {"jugador": "\"Maldita sea este lugar.\"\n\nSuelto el féretro y retrocedo un paso para no hundirme yo también. Miro a Anselmo Vela buscando alguna explicación o alternativa.\n\n{Perspicacia}", "dm": "El lodazal asfixiante parece absorber cualquier rastro de esperanza; la bruma gris borra los límites del mundo, dejando el féretro anclado en un fango negro y aceitoso que parece respirar con un ritmo lento y maligno. Al buscar una respuesta en la mirada de Anselmo Vela, no se encuentra ninguna señal de urgencia ni una solución inmediata. El hombre permanece como una columna rígida, observando la madera sumergida en el lodo sin hacer el menor gesto por ayudar.\n\nCon una lentitud ceremonial y sin apartar la vista del féretro, Anselmo pronuncia sus palabras: \"El lugar no es el problema. El problema es que hemos dejado que el camino nos dicte el ritmo, y no nosotros al camino\".\n\nLa inmovilidad de Anselmo y la profundidad del hundimiento sugieren que el féretro no volverá a moverse mediante la fuerza bruta; el fango sigue reclamando la carga y el tiempo empieza a jugar en contra de la expedición."}]}, "B": {"previo": "Tus ojos se entrecierran mientras analizas el patrón de la hojarasca, ignorando la frustración y centrándote en las irregularidades del terreno. Tras unos minutos de búsqueda meticulosa, detectas una anomalía: una ligera depresión en el manto de hojas secas que rompe la uniformidad del suelo, donde la tierra húmeda ha quedado expuesta.\n\nSiguiendo el rastro, encuentras una rama de acebo quebrada, cuya madera blanca aún muestra el corte fresco del impacto. Las huellas son tenues, pero discernibles; el peso de quien pasó por aquí era considerable, hundiendo el talón con una fuerza que sugiere que cargaba algo pesado sobre los hombros. El rastro se aleja del roble, dirigiéndose hacia el corazón del bosque, donde la espesura se vuelve más densa y la luz comienza a escasear.", "turnos": [{"jugador": "\"Alguien cargaba con algo pesado... y no tenía prisa por ocultarlo.\"\n\nSigo el rastro de las huellas adentrándome en la espesura, manteniendo la mano en el pomo de mi espada.\n\n{Supervivencia}", "dm": "El rastro se vuelve errático y confuso a medida que la vegetación se cierra sobre ti. Las huellas, antes claras, se desvanecen rápidamente entre raíces retorcidas y acumulaciones de musgo que ocultan cualquier señal de paso. La humedad del bosque absorbe el rastro, dejándote solo con el silencio opresivo de los árboles y la incertidumbre de hacia dónde se ha desviado la carga.\n\nTe encuentras detenido en un claro pequeño donde el suelo es una alfombra indistinguible de materia orgánica y sombras. No hay señales frescas que indiquen la dirección exacta; el rastro se ha perdido por completo entre la espesura."}, {"jugador": "\"No voy a dejar que un poco de musgo me detenga.\"\n\nMe agacho para examinar el suelo con detenimiento, buscando cualquier rama rota o rastro de pisada que haya pasado desapercibido.\n\n{Supervivencia}", "dm": "Te inclinas sobre el suelo, apartando con cuidado las capas de musgo húmedo y hojas en descomposición. Tus dedos hunden la tierra fría, buscando cualquier irregularidad que delate el paso del féretro, pero el terreno es traicionero; la materia orgánica se ha compactado de tal forma que cualquier marca ha sido absorbida por la humedad del bosque.\n\nEl silencio del claro se vuelve más denso mientras recorres el perímetro. Solo encuentras el rastro natural de la fauna local y el caos de las raíces retorcidas, que parecen haberse cerrado deliberadamente tras el paso de la carga. El rastro sigue siendo un enigma, y el bosque no ha revelado ninguna pista nueva."}, {"jugador": "\"Maldita sea, parece que el bosque mismo quiere ocultarlo.\"\n\nMe pongo en pie y limpio la tierra de mis manos. Inicio una búsqueda más exhaustiva en los alrededores, buscando ramas rotas o hierba aplastada que no haya sido absorbida por el musgo.\n\n{Supervivencia}", "dm": "Te alejas del centro del claro, moviéndote en círculos concéntricos y obligando a tu vista a ignorar el verde dominante para centrarse en las fracturas del entorno. Tras unos minutos de observación meticulosa, detectas una anomalía: una serie de arbustos de bayas negras han sido aplastados lateralmente, no por el paso de un animal, sino por algo pesado y ancho que ha forzado su camino.\n\nSiguiendo esa línea, encuentras una rama de fresno, gruesa como un brazo, que ha sido partida limpiamente hacia abajo, dejando una herida blanca y fresca en la madera que aún gotea savia. El rastro no es evidente para un ojo inexperto, pero allí está: una senda de vegetación lacerada que se interna hacia el noreste, hundiéndose en la espesura donde la luz del sol apenas logra filtrarse."}, {"jugador": "\"Algo pesado pasó por aquí.\"\n\nMe pongo en guardia y comienzo a seguir el rastro de la vegetación lacerada hacia el noreste, moviéndome con cautela.\n\n{Sigilo}", "dm": "Te deslizas entre la maleza, tratando de mimetizarte con las sombras que se alargan a medida que el bosque se cierra sobre ti. El aire se vuelve más denso y húmedo, cargado con un olor a tierra mojada y descomposición vegetal. Tus pasos son cuidadosos, pero el suelo del bosque es traicionero; una rama seca cruje bajo tu bota con un chasquido seco que resuena en el silencio sepulcral de la espesura.\n\nA unos diez metros por delante, el rastro de vegetación aplastada se vuelve más pronunciado, abriendo un surco en el barro. De repente, el viento cambia de dirección y trae consigo un hedor metálico y dulzón, similar al de la carne olvidada al sol, que emana exactamente de la dirección hacia la que te diriges."}, {"jugador": "Me detengo en seco y sujeto con fuerza el pomo de mi espada. Olfateo el aire, tratando de identificar el origen exacto de ese hedor.\n\n{Percepción}", "dm": "El aire gélido transporta el hedor con una precisión quirúrgica. Al cerrar los ojos y concentrarte, el olor dulzón se separa del aroma a humus; no es una masa informe de putrefacción, sino el rastro concentrado de sangre vieja y vísceras expuestas. El origen es exacto: el surco en el barro terminó abruptamente hace unos pasos, y justo detrás de un denso muro de helechos marchitos, algo pesado y orgánico descansa sobre el suelo.\n\nDesde tu posición, percibes un sonido casi imperceptible, un roce rítmico de cuero contra el barro y una respiración pesada, húmeda, que no pertenece a ningún animal del bosque. Algo se mueve lentamente allí delante, oculto por la vegetación, moviéndose con una parsimonia depredadora mientras el hedor se intensifica."}, {"jugador": "\"Sea lo que sea, no me pillará desprevenido.\"\n\nSaco mi espada y me deslizo con cautela hacia el muro de helechos, intentando no hacer ruido.\n{Sigilo}", "dm": "El acero de tu espada resbala al salir de la vaina con un chirrido metálico que corta el silencio del bosque como un grito. Al intentar deslizarte, tu bota se hunde bruscamente en un pozo de barro traicionero, provocando un chapoteo ruidoso y un desequilibrio que te hace tropezar, rompiendo una rama seca con un chasquido seco justo frente a los helechos.\n\nLa respiración húmeda se detiene en seco. De repente, la vegetación estalla hacia los lados y una masa de carne pálida y fibrosa, coronada por mandíbulas desencajadas, se lanza sobre ti con una velocidad violenta, aprovechando tu pérdida de equilibrio para cerrar la distancia en un instante."}, {"jugador": "\"¡Maldito barro!\"\n\nIntento recuperar el equilibrio rápidamente mientras golpeo hacia arriba con la espada para interceptar a la criatura.\n\n{Ataque}", "dm": "El acero de tu espada corta el aire en un arco ascendente, pero el movimiento es torpe y lento debido al hundimiento de tu bota. La hoja pasa rozando la carne pálida de la bestia, sin lograr encontrar un punto débil ni frenar su impulso. El impacto del metal contra el aire vacío solo acentúa tu vulnerabilidad mientras luchas contra la succión del barro.\n\nLa criatura, aprovechando el fallo y tu postura inestable, no se detiene. Sus mandíbulas desencajadas se abren aún más, emitiendo un siseo húmedo, y se lanza con todo su peso sobre tu pecho para derribarte definitivamente contra el suelo lodoso."}, {"jugador": "\"¡Atrás, asquerosa cosa!\"\n\nIntento apoyar el peso en mi pierna libre y empujar la criatura con el hombro para evitar que me aplaste.\n\n{Atletismo}", "dm": "Tus músculos se tensan con un esfuerzo brusco y coordinado. Al clavar el peso en la pierna firme, logras anclarte lo suficiente para convertir el impulso de la criatura en su propia desventaja; el choque de tu hombro contra el costado pálido y viscoso de la bestia suena como un golpe seco sobre carne húmeda.\n\nEl impacto desvía la trayectoria del monstruo, que sale proyectado hacia un lado con un chillido estridente. La criatura rueda por el barro, patinando en el fango espeso antes de lograr estabilizarse a un par de metros de ti, mientras tú recuperas el equilibrio, aunque el aroma a putrefacción y el lodo frío siguen envolviéndote."}]}}, {"id": "u5e80bf", "piloto": false, "lore": "# Villa Pilfera\n\n## La ciudad y el museo\n\nVilla Pilfera es famosa por dos cosas: la mejor escuela de cerrajería del reino y el Museo de Cosas Robadas, una institución única donde se exhiben, con cartelito y todo, los objetos recuperados por la Vigilancia a lo largo de doscientos años, a la espera de que alguien los reclame. Nadie ha reclamado casi nada. En las vitrinas hay una espada sin filo, tres coronas de cartón, la dentadura postiza de un rey y, en la sala principal, bajo una campana de cristal y con dos guardias de turno, la pieza estrella: la Diadema de la Reina Perdida.\n\nSe dice que vale lo que cuesta una ciudad. Se dice también que todo el que ha intentado robarla ha terminado en la sala de al lado, exhibido como «Ladrón de Diademas, hacia 1140».\n\n## Lo que salió mal\n\nDentro de nueve días arranca la Feria de las Cerraduras, la semana en que Villa Pilfera se llena de cerrajeros, curiosos y, según la Vigilancia, de todo el hampa del reino disfrazada de cerrajero. El museo abre sus puertas al público las veinticuatro horas. Y la Cuadrilla del Gato Cojo, la última banda de ladrones profesionales de la villa, ha anunciado, por vía oficial y con anticipación de cortesía, que esa semana se llevará la Diadema.\n\nLa Vigilancia, por su parte, ha anunciado que la estará esperando.\n\n## Robarla o atraparla\n\n**Marga Zancada**, cabecilla de la Cuadrilla del Gato Cojo, sostiene que la Diadema no es del museo: la sacaron de un pueblo que la lleva doscientos años reclamando, y un museo que exhibe lo robado sin devolverlo es un ladrón con permiso municipal. Se la va a llevar, con elegancia, y la va a devolver. Lo dice con una sonrisa que sugiere que ya tiene el plan y que el plan tiene detalles bonitos.\n\n**Ubaldo Cerrojo**, capitán de la Vigilancia, sostiene que el museo es la memoria de la ciudad: si cada uno se lleva lo que cree suyo, el edificio es un almacén, y los ladrones bien intencionados son los más peligrosos porque no se detienen. Lo dice con el pecho hacia delante, con veinte años de servicio sin un solo robo con éxito y ganas de que sean veintiuno.\n\nNinguno de los dos quiere hacer daño a nadie. Los dos quieren, por encima de todo, ganar.\n\n## La sala de las réplicas\n\nBajo el museo, tras una puerta que solo se abre con una llave que nadie ha visto usar, hay un taller de réplicas donde se hacen las copias para las vitrinas «de peligro». En la Feria de las Cerraduras el taller estará cerrado, como siempre. Casi nadie se pregunta por qué un museo tan seguro necesita un taller tan grande.\n\n## Gente de la villa\n\n**Marga Zancada**, cabecilla de la Cuadrilla del Gato Cojo, defiende robar la Diadema para devolverla. **Ubaldo Cerrojo**, capitán de la Vigilancia, defiende atrapar a los ladrones y proteger el museo. **Fermín Llavín**, que vende llaves en un puesto ambulante de la plaza, es -por ahora- solo el hombre que sabe quién compra qué cerradura; ver «personas_par24.json» para el perfil completo de los tres.\n\n## Tono de la campaña\n\n`world_tone`: **`light`**, registro **`comedic`**. Comedia de atraco: planes con demasiados pasos, ladrones con oficio y vergüenza profesional, vigilantes demasiado listos para su propio bien y una ciudad que se toma el robo como deporte nacional. El humor sale de los planes que salen mal de formas creativas y de personajes muy competentes en cosas absurdas; nadie sale herido de verdad. Estructura sin precedente en el corpus: **un golpe anunciado con dos equipos que planean a la vez** y una pieza cuyo valor real nadie ha comprobado; distinto de la sátira institucional (Par 18) y de la negociación (Par 20) porque aquí manda la acción, la improvisación y el plan.\n", "A": {"previo": "El aire se vuelve más denso en el pasillo estrecho, donde la humedad de las paredes de piedra parece filtrarse en la ropa y el humo graso de las antorchas asfixia la vista, reduciendo el mundo a un túnel claustrofóbico. No hay rastro de complicidad ni una pizca de amusemento en la respuesta del guía; el comentario queda suspendido en el aire, cayendo al suelo como un peso muerto.\n\nLa figura encapuchada ni siquiera se molesta en devolver la mirada, girando el cuerpo hacia la salida con un movimiento mecánico y brusco. Con un gesto seco de la mano que indica el camino, sentencia con una voz monótona y desprovista de cualquier emoción: \"El humor es un lujo que no puedo permitirme, y tú un riesgo que ya me cuesta tolerar. Camina\".\n\nLa figura encapuchada ha llegado al límite de su tolerancia; cualquier otro intento de broma o distracción podría provocar que decida abandonar la escolta y dejar al jugador a merced de los pasillos.", "turnos": [{"jugador": "\"Tienes razón, el silencio es más seguro. Perdona.\"\n\nBajo la cabeza con una sonrisa apacible y comienzo a caminar detrás de él, manteniendo una distancia prudencial. {Sigilo}", "dm": "El movimiento es impecable, casi etéreo; los pasos se funden con el eco del lugar, transformando la presencia del jugador en una sombra líquida que fluye sin hacer ruido. El pasillo desemboca finalmente en una cámara circular de techos bajos, donde el goteo rítmico del agua sobre el suelo de piedra resuena como un metrónomo. Unas pocas antorchas agonizantes proyectan sombras alargadas que bailan sobre paredes cubiertas de un moho blanquecino y pegajoso.\n\nLa figura encapuchada sigue caminando sin detenerse ni mirar atrás, aunque sus hombros se tensan imperceptiblemente al notar que el silencio a sus espaldas se ha vuelto peligrosamente fluido. Sin romper la marcha, suelta con sequedad: \"Menos palabras, más pasos\".\n\nEl guía se siente acechado por la eficiencia del silencio; cualquier movimiento brusco o intento de adelantarse podría interpretarse como una agresión en este entorno claustrofóbico."}, {"jugador": "\"No te preocupes, solo me aseguro de que no nos sorprenda nadie.\"\n\nAcelero el paso para ponerme a su lado, manteniendo una distancia prudente pero cercana, mientras observo las paredes y el techo en busca de cualquier cosa inusual.\n\n{Percepción}", "dm": "El intento de alcanzar la figura encapuchada con elegancia termina en un tropiezo torpe; el pie resbala en una zona especialmente viscosa del suelo, rompiendo el ritmo y el silencio con un ruido húmedo y aparatoso. La figura no se detiene, pero sus hombros se contraen en un gesto de evidente irritación ante la pérdida de compostura.\n\nFrente a ambos, la cámara circular se abre a un corredor estrecho que desciende en espiral. Allí, el moho blanquecino se vuelve más denso, trepando por las paredes en costras espesas que parecen pulsar débilmente al compás del goteo constante del agua.\n\nLa torpeza ha alertado al guía y ha roto la tensión del sigilo; cualquier otro ruido innecesario podría hacer que la figura encapuchada decida que el acompañante es más un lastre que un aliado."}, {"jugador": "\"Lo siento, el suelo es un jabón\"\n\nMe levanto rápidamente y trato de recuperar el equilibrio sin hacer más ruido, siguiendo a la figura hacia el corredor en espiral.\n\n{Sigilo}", "dm": "El esfuerzo por recuperar la compostura resulta tan ruidoso como la caída; el movimiento brusco provoca un nuevo resbalón contra la pared viscosa, dejando un rastro de moho blanquecino en la ropa y un sonido húmedo que resuena en todo el pasillo. El aire pesado y saturado de humedad parece espesarse mientras el corredor desciende en espiral, con las costras de hongo pulsando levemente contra la piedra fría.\n\nLa figura encapuchada no se gira para mirar, pero detiene su paso un instante en la entrada del corredor, con la espalda tensa. \"Menos disculpas y más cuidado. El suelo no es el problema; lo es tu falta de atención\", sentencia con un tono cortante antes de reanudar la marcha con un paso más acelerado y tajante, alejándose rápidamente por la pendiente.\n\nLa paciencia del guía se ha agotado; un nuevo incidente de torpeza podría provocar que la figura encapuchada se detenga en seco y deje atrás a quien no sea capaz de caminar en silencio."}, {"jugador": "\"Tienes razón, me he distraído. No volverá a pasar.\"\n\nMe sacudo el moho de la ropa con rapidez y apresuro el paso para alcanzar al guía, tratando de imitar su ritmo.\n\n{Sigilo}", "dm": "El intento de recuperar el ritmo resulta torpe; el roce apresurado de las botas contra la piedra resbaladiza produce un chirrido agudo que rebota en las paredes del pasillo. El corredor en espiral se estrecha progresivamente, obligando a avanzar en fila india mientras la pátina orgánica y viscosa de los muros parece cerrarse sobre el grupo. El descenso culmina en una pequeña plataforma circular donde el aire se vuelve súbitamente gélido y el único sonido es el goteo rítmico y constante de un techo invisible.\n\nLa figura encapuchada no se detiene ni mira atrás; su voz suena seca, proyectándose desde debajo de la tela mientras acelera el paso para marcar una distancia incómoda. \"Menos palabras y más pasos. El silencio es la única moneda que acepto en este lugar\".\n\nLa figura encapuchada comienza a distanciarse deliberadamente; si el ruido persiste, el guía podría simplemente desaparecer en la penumbra del siguiente pasillo, dejando al grupo a su suerte en el frío."}, {"jugador": "\"Perdone la torpeza, señor guía. El suelo está traicionero.\" \n\nAcelero el paso para cerrar la distancia con él, tratando de no hacer ruido mientras camino.\n\n{Sigilo}", "dm": "El intento de acercarse termina en un tropiezo clumsy; el pie resbala en la humedad del suelo y el cuerpo se balancea violentamente antes de recuperar el equilibrio, rompiendo cualquier esperanza de sigilo. La plataforma circular desemboca en un vestíbulo octogonal de piedra negra, donde el goteo se transforma en un flujo constante que alimenta una serie de canales tallados en el suelo. En el centro, una pesada puerta de hierro oxidado permanece entreabierta, revelando una oscuridad absoluta que exhala un vaho gélido.\n\nLa figura encapuchada no se detiene ni mira atrás. Su voz suena gélida y distante, casi fundiéndose con el goteo del techo mientras mantiene el paso acelerado: \"El suelo no es el traicionero, sino quien no sabe dónde pisa. Mantengan la distancia o se convertirán en parte del eco de este pasillo\".\n\nLa figura encapuchada se adentra ya en la oscuridad de la puerta de hierro; si el grupo no se apresura o vuelve a causar un alboroto, el guía podría decidir que el riesgo de ser detectado es demasiado alto y abandonarlos en el vestíbulo."}, {"jugador": "\"Vaya, parece que el suelo y yo no nos llevamos bien hoy.\"\n\nMe sacudo la ropa rápidamente y me apresuro a seguir a la figura encapuchada antes de que se pierda en la oscuridad.\n\n{Acrobacias}", "dm": "El intento de recuperar la compostura y alcanzar al guía termina en un nuevo traspié; el cuerpo se inclina torpemente y el movimiento resulta más un baile errático que una carrera eficiente, dejando al grupo un paso más lejos de lo deseado. El corredor de piedra húmeda que se extiende desde la puerta de hierro parece estrecharse con cada segundo, asfixiando el espacio mientras el aire se vuelve tan denso y gélido que el aliento se condensa en nubes blancas frente al rostro.\n\nLa figura encapuchada no se detiene ni se gira, su silueta fundiéndose parcialmente con la oscuridad de la puerta de hierro. Su voz llega como un hilo seco, carente de cualquier rastro de humor: \"Ahorre sus bromas para alguien a quien le importe su supervivencia\".\n\nLa figura encapuchada se desliza ya hacia las profundidades del corredor; cualquier otra demora o torpeza podría hacer que el guía decida que el grupo es una carga demasiado ruidosa y los deje atrás en el frío."}, {"jugador": "\"Tienes razón, no es momento para bromas.\"\n\nMe apresuro a ponerme en pie y camino rápidamente tras el encapuchado, tratando de no hacer ruido.\n\n{Sigilo}", "dm": "El intento de avanzar con cautela resulta torpe; el pie resbala en el limo de la piedra húmeda y el sonido del tropiezo resuena con una claridad molesta en el corredor gélido, rompiendo la penumbra asfixiante con un eco metálico y brusco.\n\nLa figura encapuchada no detiene la marcha, y su silueta se desvanece más profundamente en el corredor mientras el sonido de su ropa rozando la piedra es casi imperceptible comparado con el ruido del grupo. Sin mirar atrás, su voz corta el aire: \"Menos palabras y más pasos. El silencio es lo único que nos mantendrá vivos aquí abajo\".\n\nEl ruido del tropiezo ha alertado a cualquier cosa que aceche en las sombras del corredor, y la paciencia del guía se ha agotado; un error más podría provocar que el encapuchado desaparezca definitivamente en la oscuridad."}, {"jugador": "\"Mil disculpas, mi pie ha tenido voluntad propia.\"\n\nMe apresuro a recuperar el equilibrio y trato de seguir el rastro del encapuchado sin hacer más ruido.\n\n{Sigilo}", "dm": "El equilibrio regresa justo a tiempo, permitiendo que los pasos se sincronicen con el ritmo del guía sin provocar nuevos estruendos. El corredor de piedra negra se estrecha, envolviéndolo todo en una humedad pegajosa; el techo se pierde en un vacío absoluto mientras el limo del suelo, aunque resbaladizo, ahora parece colaborar para amortiguar el avance.\n\nLa figura encapuchada no reduce la velocidad ni se gira para comprobar el progreso. Con una voz gélida y desprovista de emoción, lanza un susurro cortante que vibra en el aire: \"Tus disculpas no ensordecen a lo que nos acecha. Camina.\".\n\nAunque el silencio ha sido recuperado, el tiempo apremia; el guía se aleja cada vez más y cualquier nueva distracción podría romper el hilo invisible que los mantiene unidos en la oscuridad."}]}, "B": {"previo": "La risa de la pastelera es la cortina perfecta; el sonido llena el espacio y su atención sigue anclada en el guiño y la chispa de la conversación. Sus dedos aún juguetean con el aire donde antes estaba tu mano, dejándola totalmente vulnerable mientras se inclina ligeramente hacia adelante, absorta en el juego de seducción.\n\nTus dedos se deslizan con la precisión de un cirujano por la tela rugosa del delantal, hundiéndose en la profundidad del bolsillo sin que ella note el más mínimo roce. En un movimiento fluido, rescatas el objeto oculto y lo retiras antes de que el eco de su carcajada se apague.", "turnos": [{"jugador": "\"Eres una distracción deliciosa, querida.\"\n\nLe doy un beso rápido en la mejilla y me retiro con paso ligero hacia la salida, guardando el objeto en mi propia ropa.\n\n{Sigilo}", "dm": "La pastelera parpadea, aún sonriente y con el rostro ligeramente encendido por el beso, mientras te ve alejarte. Su risa se transforma en un suspiro distraído, absorta en el rastro de tu fragancia y el eco de tus palabras, totalmente ajena al vacío que ahora habita en su bolsillo.\n\nCruzas el umbral de la tienda con una naturalidad pasmosa. El aire fresco de la calle te golpea el rostro mientras te mezclas con el bullicio de los transeúntes, dejando atrás el aroma a azúcar y canela sin que nadie, ni siquiera la Vigilancia que patrulla a lo lejos, haya notado tu maniobra."}, {"jugador": "\"Un placer, querida.\"\n\nGuardo la bolsa en mi ropa y camino tranquilamente, observando a mi alrededor para ver si alguien me ha seguido.\n\n{Percepción}", "dm": "Te alejas con paso ligero, sintiendo el peso reconfortante de la bolsa oculta contra tu cuerpo. El mercado de Pilfera es un hervidero de colores y gritos; mercaderes que pregonan telas brillantes y carretas que chirrían sobre el empedrado, creando un ruido blanco perfecto para alguien que desea pasar inadvertido.\n\nLanzas algunas miradas rápidas sobre el hombro y escudriñas los rostros de quienes caminan a tu lado, pero no detectas ninguna mirada fija ni pasos que sincronicen su ritmo con el tuyo. La multitud fluye a tu alrededor como un río, y por el momento, eres simplemente un rostro más entre la masa de ciudadanos y turistas."}, {"jugador": "\"Qué día tan espléndido para hacer negocios\"\n\nSigo caminando con aire despreocupado, pero busco entre los puestos algún lugar que parezca discreto o un contacto que pueda lavar el botín.\n\n{Percepción}", "dm": "El bullicio del mercado se vuelve un mapa de oportunidades mientras avanzas. Entre el aroma a especias fuertes y el olor a pescado fresco, distingues un callejón estrecho que se desvía de la avenida principal, donde la luz del sol apenas llega a tocar el suelo. Al fondo, un puesto de reparación de calzado, cuya fachada está tan descascarillada que parece sostenerse por pura fuerza de voluntad, muestra un pequeño cartel con un dibujo de un gato cojeando.\n\nCerca de la entrada del callejón, un hombre gordo con un chaleco demasiado apretado observa el flujo de gente con ojos inquisidores, pero su mirada se desvía distraídamente hacia una vendedora de manzanas que le sonríe. El puesto del gato parece el refugio ideal: discreto, apartado y con un aire de \"no preguntes qué hay en la bolsa\" que resulta casi tangible."}, {"jugador": "\"Buenos días, buen hombre. Una manzana para el camino, ¿verdad?\"\n\nMe acerco al hombre del chaleco con una sonrisa, intentando distraerlo mientras me deslizo hacia el callejón.\n\n{Sigilo}", "dm": "El hombre del chaleco, completamente hipnotizado por la sonrisa de la vendedora y la promesa de una manzana jugosa, ni siquiera parpadea cuando te acercas. Sin embargo, al intentar deslizarte hacia la penumbra del callejón, tu pie tropieza con una cesta de mimbre mal colocada. El sonido del mimbre chocando contra el suelo de piedra resuena en el estrecho pasillo como un disparo.\n\nEl hombre gordo reacciona al ruido con un sobresalto, girando la cabeza bruscamente hacia ti con los ojos muy abiertos. Se endereza, haciendo que un botón de su chaleco esté a punto de salir disparado por la tensión, y te clava una mirada suspicaz mientras frunce el ceño."}, {"jugador": "\"¡Oh, perdone! No quería molestar, solo buscaba un atajo.\"\n\nLe dedico mi sonrisa más encantadora mientras trato de recuperar la compostura rápidamente.\n\n{Engaño}", "dm": "El hombre del chaleco mantiene el ceño fruncido durante un segundo eterno, con la mejilla temblando mientras procesa la disculpa. Sin embargo, ante la sonrisa y el tono conciliador, su expresión se desploma en una mezcla de alivio y condescendencia. Suspira profundamente, provocando que el botón de su chaleco finalmente ceda y salga disparado hacia el callejón con un chasquido metálico.\n\n—¡Por los dioses! Me ha dado un susto de muerte, joven —balbucea, llevándose una mano al pecho mientras recupera el aliento—. Tenga más cuidado, que este callejón es traicionero. Siga su camino rápido, que no es lugar para paseos nonchalants."}, {"jugador": "\"Tiene usted toda la razón, caballero. Mil disculpas de nuevo por el susto.\"\n\nLe dedico una última sonrisa cálida mientras retrocedo un paso, pero aprovecho el descuido del botón saltando para intentar levantarle la cartera.\n\n{Juego de Manos}", "dm": "El hombre del chaleco sigue balbuceando sobre la seguridad de los callejones, gesticulando con una mano mientras la otra descansa relajada sobre su pecho, justo donde el botón ha dejado un hueco. En el instante en que su atención se centra en el vacío de su prenda, tus dedos se deslizan con una precisión quirúrgica, deslizándolo todo sin que la tela llegue siquiera a rozar su piel.\n\nLa cartera desaparece de su bolsillo y se funde con tu palma en un movimiento fluido y casi invisible. El caballero, ajeno al robo, termina de recuperar la compostura y asiente con aire paternal, convencido de que su reprimenda ha calado hondo en el joven descuidado."}, {"jugador": "\"Tiene usted toda la razón, caballero. Me esforzaré por ser más atento.\"\n\nLe dedico una sonrisa cálida y una reverencia ligera mientras guardo la cartera en mi propia ropa.\n{Sigilo}", "dm": "El hombre del chaleco se infla de orgullo ante la sumisión, soltando una risita nasal mientras se ajusta el cuello de la camisa. \"Así me gusta, muchacho. La disciplina es el único camino hacia la prosperidad en Pilfera\", exclama con una condescendencia casi enternecedora, dándote una palmadita en el hombro antes de darse la vuelta.\n\nSe aleja con paso pomposo, tarareando una melodía monótona y balanceando los brazos, totalmente ignaro de que su fortuna ahora viaja oculta entre tus ropajes. El bullicio del mercado envuelve su figura hasta que desaparece tras un puesto de especias, dejándote el camino libre y el bolsillo lleno."}, {"jugador": "\"Que tenga un día espléndido, caballero.\"\n\nLe dedico una sonrisa sincera mientras me alejo en dirección opuesta, buscando un callejón tranquilo para revisar el botín.\n\n{Sigilo}", "dm": "Tus pasos, aunque decididos, resultan torpes sobre el empedrado irregular del mercado. Al intentar deslizarte hacia la sombra de un callejón, tropiezas ligeramente con una cesta de coles, provocando que el montón de verduras ruede por el suelo con un estrépito húmedo y llamativo.\n\nUn par de mercaderes cercanos dejan de gritar sus precios para mirarte con extrañeza, mientras un perro callejero aprovecha la distracción para lamer una de las coles esparcidas. El camino hacia el callejón sigue abierto, pero ya no pasas desapercibido para quienes pueblan la calle."}]}}, {"id": "uce4075", "piloto": false, "lore": "# Torre Alondra\n\n## La cresta y el asentamiento\n\nTorre Alondra se levanta sobre una cresta estrecha desde la que se ve, en día claro, hasta las dos comarcas vecinas -por eso el torreón que le da nombre se construyó ahí hace más de cien años, y por eso dos familias, no una, lo fundaron juntas: los Roquende, que llegaron primero desde el sur con rebaños, y los Sávez, que llegaron un año después desde el norte con canteros. Ambas cosas hacían falta para levantar la torre, y ambas familias se repartieron desde el principio el gobierno del asentamiento a partes iguales, turnándose la guardia del torreón generación tras generación.\n\nEse reparto ha funcionado, con tropiezos, durante un siglo. Hace ocho días dejó de funcionar.\n\n## La muerte de Ossian\n\nOssian Roquende, el mayor de los primos jóvenes de la casa, apareció muerto al pie de un risco en tierra que ambas familias llevan generaciones disputándose sin llegar nunca a repartir del todo. Todo apunta a una caída durante una cacería solitaria -piedra suelta, mal paso, nada que un ojo entrenado no pueda explicar sin necesidad de villano alguno. Pero la tierra donde cayó es tierra Sávez, y hace más de un siglo, en los primeros años del asentamiento, un Roquende murió en esas mismas laderas en circunstancias que nadie del pueblo cuenta ya completas ni de la misma manera dos veces.\n\nNadie ha dicho la palabra \"asesinato\" en voz alta todavía. Todos la están pensando.\n\n## Dos maneras de no dejar que esto vuelva a pasar\n\n**Ginebra Roquende**, matriarca de su casa, quiere que el consejo del asentamiento -Roquende y Sávez a partes iguales, como siempre- investigue la muerte de Ossian con calma y la resuelva con pruebas, no con presunciones. Lo que no dice en las reuniones del consejo es que ya ha tenido que contener dos veces a sus propios primos más jóvenes, que quieren bajar armados a la casa Sávez esta misma semana.\n\n**Baltasar Sávez**, patriarca de la suya, no confía en que \"calma\" e \"investigación\" basten para que los más jóvenes de ambas casas no terminen a cuchillo de todas formas. Prefiere invocar el Desafío Franco, una costumbre del asentamiento tan vieja como la propia torre: un solo duelo, público, aceptado por ambas familias de antemano como cierre definitivo, sin más muertes después pase lo que pase en él. Lo ha invocado una sola vez en su vida, hace treinta años, y funcionó -pero exige que alguien esté dispuesto a apostarlo todo en un único golpe.\n\nNinguno de los dos quiere la guerra entre casas. Ninguno de los dos está seguro de que el otro no la esté empujando sin querer.\n\n## El Archivo Fundacional\n\nEn el propio torreón, bajo llave que solo abren la matriarca Roquende y el patriarca Sávez juntos, se guardan los registros del año en que se fundó Torre Alondra -incluida, en algún lugar de esas páginas amarillentas, la versión más antigua de lo que de verdad pasó con el Roquende que murió en esas laderas hace un siglo. Ni Ginebra ni Baltasar lo han vuelto a abrir en años. Lo que de verdad dice ese archivo, y si cambia algo sobre la muerte de Ossian, es algo que este documento no decide de antemano.\n\n## Gente del asentamiento\n\n**Ginebra Roquende**, matriarca, defiende la investigación con calma y contiene como puede a sus propios primos armados. **Baltasar Sávez**, patriarca, defiende un duelo único y definitivo antes de que la sangre joven decida por su cuenta. **Renata Sarco**, campanera del torreón desde niña, es -por ahora- solo una vecina más entre las dos casas; ver \"personas_par08.json\" para el perfil completo de los tres y el molde de promoción de PNJ de paso ya usado en pares anteriores.\n\n## Tono de la campaña\n\n`world_tone`: **`heroic`**. Heroico pero con peso real: la amenaza de una guerra entre casas es genuina y una muerte ya ocurrió, pero ni Ginebra ni Baltasar son villanos -son dos personas que quieren lo mismo (que Torre Alondra no se destruya a sí misma) y no confían en el método del otro para lograrlo. Estructura sin precedente en el corpus real: una **venganza de sangre entre dos familias fundadoras**, distinta de la amenaza externa de Vega del Yelmo (Par 03) y de la disputa de sucesión política de Vado Cabrero (Par 05) -aquí el conflicto es interno, familiar, y la propia causa de la muerte de Ossian queda deliberadamente sin resolver de antemano.\n", "A": {"previo": "La meseta de caliza gris y fracturada se extiende como un desierto mineral bajo el azote de vientos violentos. El ruido es ensordecedor, un rugido constante del aire chocando contra salientes afilados que reduce la visibilidad a unos pocos metros, mientras el vacío se abre amenazante a las espaldas. A pesar de la urgencia, la mirada recorre frenéticamente la piedra desnuda, pero las grietas resultan insuficientes y los salientes demasiado expuestos; no hay ningún refugio inmediato que proteja del frío cortante.\n\nGinebra Roquende sube los últimos metros con una elegancia metódica, sin jadear. Al llegar a la cima, se mantiene erguida, ignorando el azote del frío mientras observa la búsqueda de refugio con una calma imperturbable. \"Aprecio su solicitud, pero no se equivoque: sé exactamente dónde estoy y qué es lo que me sigue los pasos. El viento es solo ruido; la piedra, en cambio, tiene memoria\", sentencia con una voz que corta el viento sin esfuerzo.\n\nLa exposición prolongada al viento y al frío comienza a mermar las fuerzas; si no encuentran un resguardo real pronto, el agotamiento físico empezará a penalizar las próximas acciones.", "turnos": [{"jugador": "\"¿Memoria? Habla claro, Ginebra. No tenemos tiempo para acertijos mientras el frío nos cala los huesos.\"\n\nMe acerco a ella, plantando los pies con firmeza para que el viento no me desplace, y la miro a los ojos.\n\n{Perspicacia}", "dm": "La cercanía no logra quebrantar el muro de compostura de la mujer. Ginebra Roquende sostiene la mirada, fija y serena, sin pestañear ni un instante mientras el viento sigue azotando la meseta de caliza. No se inmuta ante la brusquedad ni el frío que cala los huesos; permanece allí, erguida y gélida, como si fuera una extensión más de la piedra gris que los rodea.\n\n\"Hablo con claridad, solo que no con la prisa que usted prefiere\", responde con una voz que no tiembla. Su postura impecable refuerza la distancia que marca entre su linaje y la urgencia del momento. \"Hace más de un siglo, un Roquende dejó de respirar en estas mismas laderas; la historia se borró de los libros, pero la tierra no olvida dónde se derramó la sangre\".\n\nEl viento se vuelve más agresivo y la temperatura desciende; el tiempo se agota antes de que el frío convierta el agotamiento en una debilidad irreversible."}, {"jugador": "\"No me interesan los linajes ni los libros, sino la verdad de lo que ocurrió aquí.\"\n\nMe cruzo de brazos para combatir el frío y la miro fijamente, intentando que no note mi cansancio.\n\n{Historia}", "dm": "El viento aúlla sobre la meseta de caliza gris, levantando nubes de polvo blanco que se filtran entre los matorrales secos y las grietas de la roca. Bajo ese cielo plomizo, la insistencia por la verdad encuentra una respuesta que no busca el consuelo de la lógica, sino la aceptación de un patrón oscuro.\n\nGinebra Roquende mantiene la espalda recta, imperturbable ante el frío. Sus ojos no se desvían ni un milímetro; su voz es un hilo de seda, pausada y gélida: \"La verdad es un tejido complejo, y arrancarlo con brusquedad suele dejar solo jirones. Ossian murió aquí, es un hecho; que haya una piedra suelta que justifique el accidente es la versión que los ojos ven, pero la historia de hace un siglo sugiere que este lugar tiene una costumbre muy específica de cobrar vidas de mi sangre\".\n\nLa revelación de Ginebra abre una veta de misterio, pero el viento se vuelve más cortante; si no se decide el siguiente paso pronto, la hipotermia empezará a nublar el juicio de quien intente resolver este enigma."}, {"jugador": "\"Una maldición familiar no es una justificación, es un problema que debe resolverse.\"\n\nMe acerco a Ginebra y la miro fijamente, tratando de descifrar si oculta algo más sobre esa costumbre de cobrar vidas.\n\n{Perspicacia}", "dm": "El viento gélido azota la meseta de caliza, arrastrando nubes de polvo blanco que desdibujan el horizonte y agitan los matorrales secos y retorcidos. Al acortar la distancia, la proximidad no parece inquietarla; Ginebra Roquende no retrocede ni un centímetro, manteniendo una expresión serena, casi marmórea, mientras sostiene la mirada con una calma imperturbable.\n\nA través de ese escrutinio, se percibe que su compostura no es una máscara de engaño, sino el blindaje de alguien que ha aceptado la tragedia como una variable más de su linaje. Con una voz que no tiembla ante la confrontación, sentencia: \"No busco justificaciones, pues no hay excusa para la pérdida. Busco la certeza necesaria para que la respuesta de mi Casa sea la correcta, y no una impulsada por el dolor\".\n\nLa resolución de Ginebra es firme, pero el clima en la meseta se vuelve hostil; el frío cala los huesos y el polvo blanco comienza a cegar, reduciendo el tiempo disponible para obtener respuestas antes de que el entorno obligue a buscar refugio."}, {"jugador": "\"La estabilidad de vuestra Casa no puede construirse sobre el silencio de los muertos.\"\n\nSostengo la mirada, sin ceder terreno, mientras el frío me cala.\n{Persuasión}", "dm": "El viento gélido ruge sobre la meseta de caliza, envolviendo la escena en nubes de polvo blanco que borran el horizonte y sacuden los matorrales retorcidos, cuyas ramas parecen garras surgiendo del suelo mineral. A pesar de la intensidad del clima, Ginebra Roquende permanece inmóvil, como una estatua tallada en la misma piedra que pisan. No cede ni un ápice ante la presión, y su rostro no muestra la más mínima grieta de irritación ni duda.\n\nMantiene la mirada fija, sin pestañear, mientras su voz fluye constante y pausada, casi rítmica, ignorando el azote del viento en sus vestiduras: \"El silencio de los muertos es el único que no miente, pero es también el que no ofrece pruebas. Mi Casa no busca el olvido, sino la verdad que sea lo suficientemente sólida como para sostener el peso de una sentencia\".\n\nLa frialdad de Ginebra es ahora tan impenetrable como el clima. El polvo blanco comienza a cegar y el frío se vuelve insoportable; si no logras cambiar el rumbo de la conversación o encontrar un nuevo ángulo, el entorno os obligará a interrumpir el encuentro para sobrevivir a la ventisca."}, {"jugador": "\"No busco concesiones, sino justicia. Si vuestra Casa es tan sólida, no temeréis que la verdad salga a la luz.\"\n\nMe planto firmemente contra el viento, sosteniendo la mirada de Ginebra sin retroceder.\n{Intimidación}", "dm": "La determinación se impone sobre el rugido de la tormenta. En la blancura cegadora de la meseta de caliza, donde los matorrales secos se agitan como dedos esqueléticos, la postura firme logra romper la inercia del encuentro. El aire gélido corta la piel, pero la tensión entre ambos es más afilada que el viento.\n\nGinebra Roquende no retrocede ni un centímetro. Mantiene la mirada fija y la voz en un volumen bajo y constante, obligando a quien la escucha a esforzarse por captar sus palabras sobre el estrépito del clima: \"La justicia es un concepto demasiado elástico para ser usado como arma en una tormenta, joven. Mi Casa no teme a la verdad; teme a la precipitación de quienes confunden la furia con la rectitud\".\n\nGinebra ha aceptado el desafío, pero la ventisca sigue arreciando. Si no concretas una demanda o llegas a un acuerdo ahora, la visibilidad caerá a cero y el frío extremo os obligará a abandonar la meseta, perdiendo la oportunidad de presionar a la matriarca mientras está vulnerable al entorno."}, {"jugador": "\"La rectitud no es furia, es claridad. Y ahora mismo, la única claridad es que vuestra Casa oculta algo que no soporta la luz del día.\"\n\nMe acerco un paso más, ignorando el frío, para obligarla a mantener el contacto visual.\n\n{Persuasión}", "dm": "El intento de acorralar la verdad choca contra un muro de hielo. A pesar de la proximidad y la insistencia del gesto, la matriarca no parpadea ni retrocede; sus manos permanecen entrelazadas al frente, inmóviles, como si fuera una extensión de la caliza blanca que los rodea. Ginebra mantiene ese volumen bajo y gélido que obliga a inclinarse para escucharla, transformando la cercanía en una barrera insalvable.\n\n\"La claridad es un don peligroso cuando se usa para inventar sombras donde solo hay silencio\", sentencia con una calma imperturbable. \"Si cree que el silencio de mi Casa es un refugio para secretos, es que aún no comprende la diferencia entre ocultar una verdad y esperar a que las pruebas hablen por sí mismas\".\n\nLa ventisca se intensifica, borrando los límites del horizonte. Si no cambias la estrategia o planteas una alternativa inmediata, el frío extremo hará imposible mantener la conversación, y Ginebra se retirará al abrigo de su Casa llevándose consigo el silencio."}, {"jugador": "\"No me interesan los juegos de palabras, sino la seguridad de este lugar.\"\n\nDoy un paso atrás para darle espacio, pero mantengo la mirada fija en ella mientras observo sus gestos en busca de cualquier señal de nerviosismo.\n\n{Perspicacia}", "dm": "El viento aúlla entre las columnas descarnadas del patio, arrastrando una ventisca que comienza a sepultar los relieves de la caliza blanca bajo un manto gélido. En medio de ese caos blanco, la figura de Ginebra emerge como un ancla de serenidad; al cederle el espacio, se hace evidente que no hay ni un solo músculo tenso en su cuerpo, ni un rastro de duda en su postura. Su control es absoluto, una armadura de calma que no deja fisura alguna donde buscar el nerviosismo.\n\nMantiene la espalda recta y las manos entrelazadas, clavando sus ojos en los del interlocutor con una mirada serena, casi maternal, aunque cargada de una distancia jerárquica inamovible. \"La seguridad de mi hogar es un hecho, no una moneda de cambio\", sentencia con una voz que corta el aire frío. \"Si busca garantías, se las doy: mientras permanezca bajo mi techo y respete mis leyes, nada le sucederá. Pero no confunda mi hospitalidad con una debilidad que le permita saltarse las formas\".\n\nLa tormenta sigue ganando terreno. Si la conversación se prolonga demasiado sin un acuerdo concreto, la visibilidad desaparecerá por completo y la matriarca dará por terminada la audiencia para refugiarse en el interior."}, {"jugador": "\"No confundo la cortesía con la debilidad, ni la seguridad con la servidumbre. Acepto vuestras condiciones.\"\n\nHago una breve inclinación de cabeza, reconociendo su autoridad, y me mantengo firme frente a ella.\n\n{Persuasión}", "dm": "El intento de imponer una postura de igualdad en la negociación cae en el vacío; la firmeza del gesto no logra alterar la dinámica de poder ni extraer ninguna concesión adicional de la matriarca. El patio de caliza blanca comienza a desdibujarse bajo la ventisca, convirtiendo las columnas en fantasmas pálidos y el suelo en un espejo blanco y resbaladizo que amenaza con borrar cualquier rastro de humanidad en el entorno.\n\nGinebra Roquende mantiene la mirada fija, sin pestañear, mientras esboza una sonrisa mínima y profesional. No rompe su postura rígida, pero el tono de su voz se suaviza ligeramente, recuperando esa calidez maternal pero distante al responder: \"Me complace que hayamos llegado a un entendimiento. La claridad es la base de cualquier acuerdo que pretenda sobrevivir al tiempo\".\n\nLa ventisca ha alcanzado un punto crítico. Si no se desplazan al interior ahora, la visibilidad será nula y quedarán atrapados en el patio, exponiéndose al frío extremo y perdiendo la oportunidad de asegurar el refugio."}]}, "B": {"previo": "Baltasar no parpadea. Mantiene la mirada fija, y aunque el resultado de tu escrutinio no revela ninguna grieta evidente ni una emoción traicionera, notas que su calma no es producto de la indiferencia, sino de un control deliberado. Hay una disciplina férrea en su postura, la de alguien que está acostumbrado a gestionar la información como si fuera una moneda de cambio, midiendo el peso de cada palabra antes de soltarla.\n\n—La paciencia es una virtud que pocos cultivan en tiempos de urgencia —responde con una voz suave y modulada, sin que un solo músculo de su rostro se altere—. Pero tienes razón. El silencio es un muro, y yo no he venido aquí para construir muros, sino para proponer caminos.", "turnos": [{"jugador": "\"Hablemos entonces de esos caminos. ¿Cuál de ellos me llevará a la verdad de lo que ocurre aquí?\"\n\nCruzo los brazos y sostengo su mirada, sin ceder un ápice de terreno.\n\n{Persuasión}", "dm": "Baltasar esboza una sonrisa tenue, casi imperceptible, que no llega a sus ojos pero suaviza la rigidez de su mandíbula. Se inclina ligeramente hacia adelante, reconociendo el peso de tu determinación y la firmeza de tu postura; la tensión en el aire se transforma en una especie de respeto mutuo, un entendimiento entre dos personas que saben jugar sus cartas.\n\n—Me gusta esa determinación. La verdad en este lugar no es un destino, sino un laberinto, y caminarlo solo es una invitación al extravío —dice, bajando el tono de voz—. Hay un camino formal, el del Consejo, donde las palabras se pesan en balanzas de oro y protocolo. Pero hay otro, más directo, que comienza con un acuerdo privado entre nosotros. Si estás dispuesto a demostrar que tu lealtad es tan sólida como tu mirada, puedo abrirte puertas que el Consejo mantendría cerradas durante décadas."}, {"jugador": "\"No me interesa el oro ni el protocolo, Baltasar. Solo me interesa la verdad y que este lugar sea justo.\"\n\nCruzo los brazos y lo miro fijamente, evaluando sus intenciones.\n\n{Perspicacia}", "dm": "Baltasar mantiene la mirada, imperturbable, mientras el silencio se extiende entre ambos. No hay rastro de irritación en su rostro ante el desdén por el oro; al contrario, su expresión permanece neutral, como una máscara de porcelana que no deja filtrar ninguna emoción genuina.\n\nAl evaluarlo, notas que su postura es demasiado perfecta, casi estudiada. Aunque sus palabras hablan de lealtad y puertas abiertas, hay una calculating frialdad en la forma en que inclina la cabeza. No detectas una mentira flagrante, pero percibes que su generosidad no es altruista: Baltasar no busca un aliado por justicia, sino una pieza útil que encaje en un tablero que solo él puede ver."}, {"jugador": "\"Tus palabras suenan a cortesía, pero tu mirada a estrategia. Dime entonces, ¿cuál es el precio real de esa pieza que buscas?\"\n\nMe mantengo firme, sosteniéndole la mirada sin ceder un ápice.\n{Perspicacia}", "dm": "Baltasar esboza una sonrisa mínima, un movimiento casi imperceptible de los labios que no llega a alcanzar sus ojos gélidos. No se inmuta ante la confrontación; al contrario, parece valorar la franqueza del cuestionamiento, aunque su postura sigue siendo la de alguien que posee todas las cartas de la partida.\n\n—La honestidad es una moneda rara en esta ciudad, y el hecho de que prefieras el precio real a la cortesía me resulta... refrescante —responde con una voz suave, casi melódica—. Mi precio es simple: eficacia. No busco un servidor, sino alguien capaz de moverse donde mis manos están atadas por el protocolo y la etiqueta. El precio real, pues, es que cuando llegue el momento de actuar, tu espada y tu voluntad se alineen con las mías."}, {"jugador": "\"No vendo mi voluntad, Baltasar. Vendo mi espada y mi acero, pero mi lealtad se gana, no se pacta.\"\n\nCruzo los brazos y lo observo fijamente, buscando cualquier señal de engaño en su mirada.\n{Perspicacia}", "dm": "Baltasar mantiene la mirada, imperturbable. Sus ojos, como dos fragmentos de hielo pulido, no parpadean mientras procesa la respuesta. La sonrisa mínima desaparece, sustituida por una expresión de neutralidad absoluta que vuelve a convertir su rostro en una máscara de porcelana.\n\n—Una distinción necesaria —concede, inclinando levemente la cabeza—. Me basta con saber que conoces la diferencia. No busco comprar tu alma, solo asegurar que, en el instante en que el acero sea la única respuesta, no haya dudas sobre hacia dónde apunta el filo."}, {"jugador": "\"No habrá dudas. Mi acero sirve a la justicia, no a quien pague más.\"\n\nSostengo la mirada con firmeza, sin retroceder ni un centímetro.\n\n{Perspicacia}", "dm": "Baltasar permanece inmóvil, su rostro una superficie lisa y gélida que no revela ninguna emoción. El silencio se prolonga un instante más de lo habitual, mientras el aire entre ambos parece volverse más denso. No hay un gesto de molestia ni de admiración; simplemente observa, como quien estudia una pieza de artesanía para evaluar su resistencia antes de ponerla a prueba.\n\n—La justicia es un concepto elástico, según quién sostenga la balanza —responde con una voz plana, despojada de cualquier matiz—. Pero prefiero un arma que crea en su propio propósito que una que solo se mueva por monedas. Al menos la primera es predecible."}, {"jugador": "\"La predictibilidad es una virtud en el campo de batalla, pero la ceguera ante la verdad es un defecto.\"\n\nSostengo la mirada, buscando cualquier grieta en su expresión gélida.\n{Perspicacia}", "dm": "Baltasar no parpadea. Sus ojos, fijos y analíticos, mantienen la misma intensidad mientras procesa la réplica, pero no hay ninguna contracción en los músculos de su mandíbula ni un leve movimiento de sus cejas. Su postura sigue siendo la de un muro de piedra, imperturbable y perfectamente controlada.\n\nA pesar de la tensión, no detectas ninguna señal de irritación, duda o engaño en su lenguaje corporal. Se mantiene estrictamente dentro de su máscara de cordialidad gélida, sin dejar que ninguna emoción se filtre a través de su expresión."}, {"jugador": "\"No me sirve una máscara, Baltasar. Necesito respuestas claras.\"\n\nMe mantengo firme frente a él, sosteniéndole la mirada sin retroceder ni un centímetro.\n\n{Intimidación}", "dm": "Baltasar Sávez no se inmuta. El silencio se prolonga unos segundos, llenando el espacio entre ambos con una densidad casi tangible, mientras él sostiene la mirada con una calma imperturbada. No hay rastro de miedo en sus pupilas ni un solo músculo de su rostro que traicione una debilidad ante la presión.\n\n—La claridad es un privilegio que se gana con la confianza, no con la fuerza —responde con una voz plana, desprovista de cualquier matiz de irritación—. Mi máscara, como usted la llama, es la cortesía. No confunda mi compostura con falta de voluntad."}, {"jugador": "\"Tus palabras son elegantes, pero la cortesía no oculta la verdad.\"\n\nMe inclino hacia él, reduciendo la distancia para mantener la presión psicológica. {Perspicacia}", "dm": "Baltasar Sávez ni siquiera parpadea mientras reduces la distancia. Se mantiene erguido, como una estatua de mármol, permitiendo que tu presencia invada su espacio personal sin retroceder un milímetro. El aroma a incienso y cuero viejo que emana de sus ropajes es lo único que se vuelve más intenso al acercarte.\n\nSus ojos, fríos y analíticos, te observan con una paciencia exasperante. No hay sudor en su frente, ni un ligero temblor en sus manos, ni ninguna señal física que indique que tu presión psicológica esté surtiendo efecto. Para él, tu despliegue de fuerza no es más que un gesto ruidoso y vacío."}]}}, {"id": "u95c3a4", "piloto": false, "lore": "# Piedra Yerma\n\n## El pueblo y el monolito\n\nPiedra Yerma toma su nombre del monolito de piedra oscura que se alza en el centro de un círculo de tierra donde nada crece desde antes de que el pueblo tuviera nombre propio. Durante generaciones esa tierra muerta se mantuvo del mismo tamaño exacto -un círculo perfecto, ni un palmo más- y el pueblo aprendió a vivir alrededor de él sin necesidad de entenderlo del todo: se le llama simplemente \"la Piedra\", se le deja en paz, y una vez al año se renuevan alrededor unas marcas de guarda que nadie recuerda ya quién trazó primero.\n\nHace seis semanas, el círculo empezó a crecer.\n\n## Lo que se perturbó\n\nPoco antes de que empezara a crecer, un buscador de reliquias que pasaba por la región cavó cerca de la base del monolito, de noche y sin permiso de nadie, y se marchó del pueblo al amanecer siguiente sin que nadie llegara a verle la cara con claridad. Nadie sabe qué encontró, si encontró algo, ni qué se llevó -pero el círculo muerto, quieto durante generaciones, no ha dejado de expandirse desde esa noche.\n\n## Dos formas de responder\n\n**Ondina Oscanda**, guardiana de las marcas desde que heredó el puesto de su maestra hace quince años, sostiene que la única respuesta segura es reforzar la guarda y no tocar la Piedra ni la tierra que la rodea bajo ningún concepto: cree, como le enseñaron, que cada vez que alguien perturba el círculo -como hizo el buscador de reliquias- lo que sea que duerme ahí se remueve un poco más, y que cavar de nuevo para \"arreglarlo\" solo lo empeoraría.\n\n**Baldemar Cruz**, cuyas tierras de cultivo lindan directamente con el círculo yermo, ha perdido ya dos surcos enteros desde que empezó a crecer y no está dispuesto a esperar a que la guarda de Ondina baste, si es que alguna vez bastó. Quiere organizar una expedición para investigar la base del monolito de una vez, encontrar lo que el buscador de reliquias dejó removido, y devolverlo o destruirlo antes de perder el resto de su cosecha.\n\nNinguno de los dos ha visto jamás qué hay de verdad bajo la Piedra. Ninguno puede probar del todo que el otro se equivoca.\n\n## La Fosa del Hallazgo\n\nCerca de la base del monolito, medio oculta ahora por la propia expansión del círculo yermo, queda una fosa reciente y poco profunda -lo que dejó el buscador de reliquias al cavar. Nadie del pueblo se ha atrevido todavía a examinarla de cerca.\n\n## Gente del pueblo\n\n**Ondina Oscanda**, guardiana de las marcas, defiende no tocar nada porque cree que cualquier intervención empeora lo que sea que se perturbó. **Baldemar Cruz**, labrador con tierras al borde del círculo, defiende actuar directamente porque no puede permitirse esperar a que la guarda pasiva vuelva a bastar. **Iván Restrepo**, que ordeña las pocas cabras que todavía pastan lejos del círculo, es -por ahora- solo un vecino más; ver \"personas_par13.json\" para el perfil completo de los tres y el molde de promoción de PNJ de paso ya usado en pares anteriores.\n\n## Tono de la campaña\n\n`world_tone`: **`mixed`**. Ni heroico ni desesperanzado de forma limpia: hay temor real y también la posibilidad genuina de resolverlo bien o mal según lo que decida la partida. Estructura sin precedente en el corpus real -**una maldición ligada a un lugar concreto**, distinta del misterio ambiguo de portal de Caleta Lumbre (Par 04, un fenómeno que no responde a ninguna intervención humana conocida) porque aquí sí hay una causa concreta y reciente -la perturbación del buscador de reliquias- que la partida puede rastrear, aunque su verdadera naturaleza quede sin resolver en este documento.\n", "A": {"previo": "El entorno no ofrece consuelo ni secretos; la mirada recorre la extensión de la costra mineral blanca y compacta, pero la cicatriz caliza es monótona y estéril, ocultando cualquier objeto de valor bajo su superficie impenetrable. El paisaje seco permanece indiferente, devolviendo solo el reflejo pálido de un sol implacable.\n\nBaldemar Cruz cierra el puño con fuerza y da un paso agresivo hacia adelante, recuperando el espacio cedido e invadiendo la zona personal con una presencia asfixiante. Su voz, ronca y cargada de un desprecio visceral, estalla en el aire: \"¡Insignificantes! Llama insignificante a la tierra que alimenta a tu familia mientras tú te alimentas de aire y tinta. Me importa un bledo el valor de tu 'hallazgo' cuando el blanco ya me ha robado dos hileras de trigo y viene a por mi puerta. No eres más que un buitre buscando joyas entre los muertos mientras mi vida se vuelve cal\".\n\nLa ira de Baldemar ha pasado de la frustración al odio puro. Sigue invadiendo tu espacio personal y cualquier palabra más que desprecie su tierra podría provocar que el puño cerrado se convierta en un golpe.", "turnos": [{"jugador": "\"Tu trigo es ceniza y tu tierra es un cadáver, Baldemar. No me hables de hambre mientras te ahogas en tu propia ignorancia.\"\n\nMe mantengo firme, sin retroceder ni un centímetro a pesar de su proximidad.\n{Intimidación}", "dm": "La costra mineral blanca se extiende hasta el horizonte, una superficie monótona y estéril que devuelve el resplandor cegador de un sol que aplasta cualquier relieve. El aire vibra por el calor, espesando el silencio que sigue a las palabras, mientras el paisaje calizo permanece indiferente a la confrontación.\n\nBaldemar no retrocede; al contrario, la provocación parece cristalizar su desprecio. Sus ojos se entrecierran y el músculo de su mandíbula se tensa con una rigidez pétrea. No hay rastro de duda ni de miedo en su postura, solo una furia gélida que se asienta en su rostro mientras sostiene la mirada, imperturbable ante el intento de intimidación.\n\nEl desprecio de Baldemar ha mutado en una violencia contenida. La tensión en sus hombros indica que ha dejado de escuchar razones; cualquier movimiento brusco o palabra adicional será el detonante para que descargue su rabia físicamente."}, {"jugador": "\"Parece que el miedo no es una moneda que aceptes.\"\n\nDoy un paso atrás, alejándome de su alcance físico, y busco con la mirada algún objeto de valor o algún detalle inusual en el entorno que pueda aprovechar.\n\n{Percepción}", "dm": "El retroceso deja espacio entre los dos, pero no alivia la tensión. Alrededor, la llanura de sal se despliega blanca y cegadora, un desierto mineral roto únicamente por grietas profundas y fragmentos de roca caliza que emergen del suelo como dientes rotos, devolviendo un brillo hostil bajo el sol. A pesar del esfuerzo por encontrar algún elemento útil o algún descuido en el entorno, la esterilidad del paisaje es absoluta; no hay nada que aprovechar, ningún objeto ni detalle que rompa la monotonía del blanco.\n\nBaldemar no aprovecha la distancia para relajarse. Sus manos se cierran en puños y escupe las palabras con asco, sin moverse un milímetro y manteniendo la mirada fija: \"El miedo es para los que tienen algo que perder mañana. Yo ya estoy viendo cómo el blanco se come mi puerta hoy mismo. No me hables de monedas, que el hambre no se paga con palabras bonitas.\"\n\nLa negativa rotunda de Baldemar ha cerrado la vía de la negociación económica. Su hostilidad ha alcanzado un punto de saturación donde cualquier intento fallido de persuasión será interpretado como una burla, acelerando su voluntad de echarte de su vista por la fuerza."}, {"jugador": "\"Tu hambre es un problema biológico, Baldemar, no un argumento lógico.\"\n\nMe mantengo firme, observando su lenguaje corporal para detectar cualquier señal de duda o debilidad.\n\n{Perspicacia}", "dm": "La tentativa de diseccionar la situación con frialdad no surte efecto; al contrario, parece actuar como un detonante. No hay rastro de duda en la postura de Baldemar, ni un solo temblor en sus manos que sugiera debilidad. Solo hay una determinación ciega y amarga que se cierra sobre el interlocutor como una trampa.\n\nBaldemar se inclina ligeramente hacia adelante, invadiendo el espacio personal del jugador, con la mandíbula tensa y los ojos entornados por el desprecio. \"Lógica... Me vienes a hablar de lógica mientras el frío me lame los talones. La lógica es que dos surcos de trigo ya no existen, y que si sigo escuchando tuitiones de alguien que no tiene ni un puñado de tierra que defender, el próximo invierno mi familia comerá sal.\"\n\nEl desprecio de Baldemar ha escalado. Cualquier intento posterior de imponer una superioridad intelectual o lógica será visto como una provocación directa, empujándolo a resolver el conflicto mediante la violencia física inmediata."}, {"jugador": "\"Tus problemas de cosecha me resultan irrelevantes, pero tu desesperación es una herramienta útil.\"\n\nDoy un paso atrás para recuperar mi espacio y lo miro con indiferencia, buscando cualquier objeto de valor que lleve encima.\n\n{Percepción}", "dm": "La mirada indiferente no encuentra nada; los bolsillos de Baldemar están vacíos de cualquier lujo y su ropa, gastada y raída, no esconde ningún objeto de valor. El paso atrás, lejos de crear una distancia segura, solo parece alimentar la indignación del hombre.\n\nBaldemar no retrocede. Al contrario, avanza para mantener la presión, cerrando los puños lentamente mientras su voz desciende a un tono bajo, cargado de una rabia contenida que vibra en el aire: \"Llamas 'herramienta' a que mi casa se convierta en ceniza blanca... Tienes el corazón más frío que la tierra que me queda, forastero.\"\n\nLa paciencia de Baldemar se ha agotado por completo. Cualquier gesto más de desdén o un intento de manipulación hará que el conflicto pase de las palabras a una confrontación física inmediata."}, {"jugador": "\"Tu rabia es tan predecible como tu pobreza.\"\n\nMe cruzo de brazos, observándolo con desdén mientras mantengo mi posición.\n\n{Intimidación}", "dm": "El desdén no surte efecto; la postura imperturbable no intimida a quien ya lo ha perdido todo. El camino de tierra batida, flanqueado por los restos de muros calcinados y la ceniza gris que aún se desprende de las vigas carbonizadas de un antiguo hogar, parece absorber cualquier rastro de autoridad.\n\nBaldemar se planta frente al jugador, invadiendo su espacio personal. No grita, pero su voz suena como piedra rozando piedra, mientras sus nudillos blanquean por la fuerza del puño cerrado: \"Ríete ahora, forastero. Ríete mientras tengas zapatos que pisar. Porque cuando el círculo llegue a tu puerta y te quite hasta el aire, verás que la pobreza no es no tener oro, sino no tener nada que defender.\"\n\nLa rabia de Baldemar ha dejado de ser contenida para volverse fría y decidida. Cualquier palabra más será el detonante para que el hombre descargue su frustración violentamente."}, {"jugador": "\"Tus palabras son tan vacías como tus bolsillos, Baldemar.\"\n\nDoy un paso atrás para recuperar mi espacio y observo los restos de las casas calcinadas, buscando cualquier objeto de valor que haya sobrevivido al fuego entre las cenizas.\n\n{Investigación}", "dm": "El paso hacia atrás crea una distancia gélida entre ambos. Baldemar permanece inmóvil, convertido en una estatua de rencor y hollín, observando con los ojos entornados mientras el silencio se espesa. Alrededor, el asentamiento no es más que un cementerio de esqueletos de madera carbonizada; el aire, cargado de un olor a humedad y ceniza antigua, parece pesar sobre los hombros.\n\nAl desplazar la mirada hacia los escombros, la capa de gris espesa que amortigua los pasos revela un destello. Entre las vigas calcinadas y el polvo, el rastro de un objeto metálico que el fuego no logró consumir emerge de la ceniza, resistiendo el paso del tiempo y el olvido.\n\nBaldemar no ha apartado la vista; su silencio no es señal de rendición, sino de una furia que se alimenta de la indiferencia. Cada segundo que pasas ignorándolo para hurgar entre las cenizas aumenta la probabilidad de que el hombre rompa su inmovilidad de forma violenta."}, {"jugador": "\"Tú no eres más que un residuo del pasado, Baldemar.\"\n\nIgnoro su mirada y me agacho para recoger el objeto metálico de entre los escombros.\n\n{Investigación}", "dm": "Los dedos se cierran sobre el metal frío, extrayéndolo con facilidad de la capa de cenizas compactas. Alrededor, los restos de las casas carbonizadas emergen del suelo gris como costillas negras de un animal muerto, mientras el viento arrastra un polvo metálico que silba entre los escombros, envolviéndolo todo en un zumbido eléctrico y desolador.\n\nBaldemar no se mueve, pero su mandíbula se tensa visiblemente. Cuando habla, su voz es seca y cortante, sin llegar al grito, pero cargada de una urgencia que vibra en el pecho: \"Llamarme residuo es fácil cuando no tienes raíces que se estén pudriendo bajo tus pies. Pero mientras tú juegas a buscar chatarra en las cenizas, mi tierra se vuelve blanca y fría. Cada minuto que pierdes hurgando ahí es un surco más que el Círculo se traga\".\n\nLa urgencia de Baldemar no es solo rabia; el tiempo corre contra la tierra y su paciencia se agota. Si continúas priorizando el saqueo sobre el diálogo, el hombre podría pasar de la amargura a la acción desesperada para apartarte de su camino."}, {"jugador": "\"Tus raíces me importan tan poco como el polvo que respiramos.\"\n\nLimpio el objeto metálico con un trozo de tela y lo guardo rápidamente en mi bolsa, ignorando la urgencia del hombre.\n\n{Investigación}", "dm": "El intento de ocultar el objeto con rapidez falla; el movimiento es torpe y el metal tintinea contra el fondo de la bolsa, delatando la acción bajo el silencio eléctrico del cementerio de vigas retorcidas. La ceniza espesa que amortigua los pasos parece absorber cualquier resto de discreción, mientras la estática del aire eriza el vello de la nuca, cargando la atmósfera de una tensión insoportable.\n\nBaldemar reacciona al instante. Da un paso agresivo hacia adelante, invadiendo el espacio personal con los puños cerrados y la mirada clavada en la bolsa, como si quisiera arrancarla de un tirón. \"Sigue guardándolo, sigue escondiendo cosas en tus bolsillos. No te detendrás hasta que el Círculo llegue a tu cuello, ¿verdad? Pero yo no voy a quedarme mirando cómo se borra mi herencia mientras tú juegas al coleccionista entre muertos\", escupe con una furia que ya no intenta contener.\n\nBaldemar ha pasado de la amargura a la hostilidad abierta. Si no cambias tu actitud o el objeto no sale de esa bolsa, el enfrentamiento físico es inevitable y el hombre no dudará en usar la fuerza para recuperar lo que considera suyo."}]}, "B": {"previo": "Al acercar la vista, el zumbido asciende de tono, convirtiéndose en una nota pura que resuena en los dientes. Los patrones fractales no son adornos, sino un lenguaje de vectores y nodos; la red geométrica describe una topografía exacta de las corrientes energéticas que fluyen bajo la superficie del lugar donde te encuentras. La sustancia no está simplemente reaccionando, está dibujando un mapa en tiempo real de las líneas de ley locales, marcando con puntos de luz intensa los nodos de poder más cercanos.\n\nLa precisión es quirúrgica. Al seguir la trayectoria de las líneas grabadas en el vidrio, notas que todas convergen en un único punto exterior al recipiente, señalando una dirección específica hacia las profundidades de la estructura. El dibujo vibra con una insistencia rítmica, como si la muestra estuviera intentando indicarte el camino hacia su origen o hacia algo que reconoce como similar.", "turnos": [{"jugador": "\"Fascinante. Una brújula de flujos energéticos.\"\n\nObservo con detenimiento la convergencia de las líneas para memorizar la dirección exacta antes de moverme.\n\n{Arcanos}", "dm": "El resplandor de la sustancia pulsa con una cadencia hipnótica, pero la complejidad de los vectores comienza a desdibujarse mientras intentas fijar el punto exacto en tu memoria. Logras captar la orientación general hacia las profundidades, pero la precisión quirúrgica del mapa se escapa; los nodos de luz parecen bailar y desplazarse ligeramente, dejando una sensación de incertidumbre sobre si la dirección es una línea recta o una trayectoria quebrada.\n\nEl zumbido en tus dientes persiste, transformándose ahora en una vibración sorda que parece advertirte que el tiempo de observación es limitado. La red geométrica sigue allí, vibrando con insistencia, señalando el camino hacia el corazón de la estructura, aunque el destino exacto permanece envuelto en la bruma de una comprensión incompleta."}, {"jugador": "\"Interesante... se resiste a ser catalogado.\"\n\nMe acerco más a la sustancia, ignorando el zumbido, para intentar descifrar el patrón de esos desplazamientos.\n\n{Arcanos}", "dm": "Al inclinarte sobre la sustancia, el zumbido se intensifica hasta convertirse en un eco metálico que resuena en tu cráneo, pero tu concentración logra imponerse. Los desplazamientos que parecían erráticos revelan una lógica fractal: la luz no baila al azar, sino que se pliega sobre sí misma siguiendo una geometría no euclidiana. El patrón describe un descenso en espiral, un camino que no busca la profundidad vertical, sino que se retuerce hacia un centro gravitatorio invisible situado en los niveles inferiores.\n\nLa red geométrica se estabiliza un instante bajo tu mirada, confirmando que el destino no es un punto fijo, sino un núcleo pulsante que atrae la energía de la estructura. La vibración en tus dientes alcanza un pico agudo, casi doloroso, y la sustancia emite un destello súbito y frío que te obliga a parpadear, dejando una imagen residual de la trayectoria grabada en tu retina."}, {"jugador": "\"Interesante. Un núcleo que devora energía.\"\n\nMe alejo de la sustancia para evitar más destellos y trato de memorizar la trayectoria exacta del descenso fractal.\n\n{Arcanos}", "dm": "La imagen residual se asienta en tu mente con una claridad matemática. Al distanciarte, el zumbido retrocede a un murmullo sordo, pero la trayectoria fractal permanece grabada como un mapa invisible detrás de tus párpados. Logras desglosar la secuencia de plegamientos: el descenso no es lineal, sino que requiere giros precisos en ángulos que desafían la arquitectura visible del lugar para evitar quedar atrapado en los bucles de energía que alimentan el núcleo.\n\nLa sustancia, ahora en calma, sigue pulsando con una luz gélida y rítmica, como el corazón de una máquina orgánica que aguarda en las profundidades. El aire alrededor del recipiente se siente cargado de electricidad estática, erizando el vello de tus brazos mientras el silencio de la estancia vuelve a cerrarse sobre ti."}, {"jugador": "\"Interesante... una geometría no euclídea aplicada a la energía.\"\n\nMe acerco al recipiente para examinar la sustancia gélida y trato de analizar su composición.\n\n{Arcanos}", "dm": "La sustancia gélida reacciona a tu proximidad, ondulando en patrones concéntricos que parecen anticipar tu mirada. Al analizarla, percibes que no es un líquido ni un gas, sino un estado de materia suspendido entre dimensiones; los hilos de energía que la componen no fluyen, sino que se anclan a puntos invisibles del espacio, actuando como un condensador de maná puro y estabilizado.\n\nIdentificas que la composición es una mezcla de sales alquímicas raras y un residuo etéreo que solo se encuentra en los planos más profundos de la Energía Astral. La luz rítmica que emite no es un simple destello, sino una frecuencia de resonancia diseñada para mantener la integridad de la geometría fractal que ya has descifrado: si la sustancia se evaporara o se contaminara, los senderos hacia el núcleo colapsarían instantáneamente."}, {"jugador": "\"Fascinante. Un condensador de maná astral estabilizado.\"\n\nIntento extraer una pequeña muestra de la sustancia sin alterar su resonancia ni contaminarla.\n\n{Juego de Manos}", "dm": "Tus dedos se mueven con precisión, deslizándose sobre la superficie vibrante mientras intentas aislar una gota de la materia astral. Sin embargo, al aplicar la presión necesaria para el extracto, la sustancia reacciona con una brusquedad imprevista. La tensión superficial se rompe violentamente, provocando que la muestra se disperse en una nube de chispas plateadas que se evaporan antes de tocar el vial, dejando tras de sí un rastro de ozono y un frío cortante que entumece tus yemas.\n\nLa geometría fractal de la sala vibra en respuesta al incidente, emitiendo un zumbido grave que resuena en tus huesos. Aunque la estructura general se mantiene estable, la ondulación concéntrica de la sustancia se vuelve errática y caótica durante unos segundos, como si el condensador hubiera registrado una intrusión molesta antes de recuperar su ritmo hipnótico original."}, {"jugador": "\"Impreciso. Absolutamente impreciso.\"\n\nSiseo con fastidio mientras me froto los dedos entumecidos. Me quedo inmóvil, observando con atención el patrón de las ondulaciones para comprender qué ha provocado la reacción violenta.\n\n{Arcanos}", "dm": "Observas las ondulaciones con rigor, buscando el hilo lógico detrás del caos. El patrón se estabiliza, pero el análisis te devuelve una respuesta incompleta; notas que la sustancia no reaccionó a la presión física, sino a una fluctuación en la frecuencia de la sala que coincidió exactamente con tu movimiento. Hay una variable externa, un pulso invisible que altera la estabilidad de la materia astral, pero el origen exacto de esa interferencia permanece oculto tras la complejidad de la geometría fractal.\n\nEl zumbido grave se desvanece, dejando un silencio sepulcral en la estancia. Las chispas plateadas han desaparecido por completo, y el vial permanece vacío, reflejando únicamente la luz fría y geométrica del condensador que vuelve a latir con su ritmo hipnótico y distante."}, {"jugador": "\"Interesante. Una frecuencia externa, no una reacción material.\"\n\nMe acerco al condensador para examinar la fuente del pulso y buscar el origen de esa interferencia.\n\n{Investigación}", "dm": "Te inclinas sobre la maquinaria del condensador, donde el metal cepillado vibra con una intensidad casi imperceptible. Al analizar los conductos de flujo y las placas de resonancia, detectas una anomalía: una pequeña fisura en el cristal del núcleo que no es un daño físico, sino una distorsión óptica. A través de ella, percibes que el pulso no emana del dispositivo, sino que el condensador está actuando como una antena, captando una señal rítmica que proviene de algún punto profundo, justo debajo de los cimientos de la estancia.\n\nLa frecuencia es constante, un latido artificial que se sincroniza con la geometría de la sala. Al seguir el rastro de la vibración con los dedos, notas que la interferencia se intensifica en un punto específico del suelo, donde las juntas de las losas de piedra parecen haber sido selladas con un material que anula cualquier eco acústico, ocultando deliberadamente el origen de la señal."}, {"jugador": "\"Interesante. Alguien se ha esforzado mucho en ocultar el origen.\"\n\nMe arrodillo y paso las manos sobre las juntas de las losas para examinar el material sellador.\n{Investigación}", "dm": "Tus dedos recorren las juntas y el material, frío y gomoso, cede ligeramente bajo la presión, revelando una textura orgánica que imita la piedra pero carece de su porosidad. Al aplicar la presión exacta en los puntos de tensión, descubres que el sellador no es solo un aislante, sino un mecanismo de cierre sofisticado: una serie de micro-ranuras que, al ser accionadas en una secuencia específica de deslizamiento, liberan un clic sordo y metálico.\n\nLa losa central se desplaza un centímetro hacia un lado, rompiendo el vacío. Por la rendija, emerge un aire rancio, cargado de ozono y un olor a metal oxidado que no ha visto la luz en décadas. Desde el hueco, el latido artificial que sentías en el condensador ahora es un zumbido físico que hace vibrar tus falanges, revelando que justo debajo de tus rodillas comienza una estructura de hierro y cristal que desciende en vertical hacia las profundidades."}]}}, {"id": "u913505", "piloto": false, "lore": "# Cruce Salado\n\n## El pueblo en el cruce\n\nCruce Salado se levanta exactamente donde se cruzan dos caminos comerciales: la Ruta de la Sal, que lleva dos siglos moviendo sal y grano hacia el sur, y la Ruta del Ámbar, abierta hace apenas cinco años hacia el norte, con resina, ámbar y tintes que se pagan mucho mejor cuando llegan a destino. El pueblo no pertenece a ninguna de las dos rutas: vive de servir a ambas, con posadas, herrerías y un mercado donde caravanas de un lado y del otro paran a descansar, comerciar y seguir camino.\n\nHasta hace dos meses eso bastaba. Ya no.\n\n## La guerra de precios\n\nLos mercaderes de la Ruta del Ámbar empezaron a ofrecer, hace ocho semanas, precios de transporte muy por debajo de lo que cuesta moverlos -tanto que ningún comerciante independiente de Cruce Salado entiende cómo salen las cuentas. La Ruta de la Sal no puede igualar esos precios sin perder dinero en cada carga, y los comerciantes del pueblo, que durante años trabajaron con las dos rutas indistintamente, empiezan a sentirse empujados a elegir un solo bando antes de quedarse sin ninguno.\n\n**Fernanda Robles**, cabeza del gremio q
