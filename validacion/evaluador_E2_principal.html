<style>
  :root { --fg:#1c1c1e; --bg:#f7f7f5; --card:#fff; --line:#d8d8d2; --acc:#2d5bd3; --dim:#6b6b66; --ok:#1f7a3f; }
  @media (prefers-color-scheme: dark) { :root { --fg:#e8e8e4; --bg:#161618; --card:#202024; --line:#3a3a40; --acc:#7da0ff; --dim:#a0a09a; --ok:#5fc788; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.55 system-ui, sans-serif; }
  header { position:sticky; top:0; background:var(--card); border-bottom:1px solid var(--line); padding:8px 16px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; z-index:5; }
  header b { flex:1; min-width:180px; }
  button { font:inherit; padding:6px 12px; border:1px solid var(--line); background:var(--card); color:var(--fg); border-radius:6px; cursor:pointer; }
  button.p { background:var(--acc); color:#fff; border-color:var(--acc); }
  main { max-width:1200px; margin:0 auto; padding:16px; }
  details { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:8px 12px; margin-bottom:12px; }
  summary { cursor:pointer; font-weight:600; }
  .cols { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width:800px) { .cols { grid-template-columns:1fr; } }
  .col { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px; }
  .col h2 { margin:0 0 8px; font-size:1.1rem; }
  .previo { color:var(--dim); font-size:.9rem; border-left:3px solid var(--line); padding-left:8px; margin-bottom:10px; }
  .t { margin-bottom:12px; }
  .j { color:var(--acc); white-space:pre-wrap; font-size:.95rem; }
  .dm p { margin:.4em 0; }
  table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); border-radius:8px; margin:12px 0; }
  td, th { padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; text-align:left; }
  td.n { white-space:nowrap; }
  .def { color:var(--dim); font-size:.85rem; }
  label.r { margin-right:8px; white-space:nowrap; }
  .fin { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px; }
  .fin p { margin:.6em 0; }
  textarea { width:100%; min-height:60px; font:inherit; background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:6px; }
  .ok { color:var(--ok); font-weight:600; }
</style>

<script type="application/json" id="datos">{"evaluador": "E2", "fase": "principal", "dims": [["CR1", "Fluidez y sentido lógico de la respuesta", "¿La respuesta del DM tiene sentido como reacción inmediata a lo que hizo el jugador, es fluida y no se contradice dentro del propio turno?", "1 incoherente / no responde a la acción · 3 responde pero con fallos de lógica o de fluidez · 5 natural, lógica y fluida"], ["CR2", "Arraigo contextual", "¿La narración se apoya en el escenario, los personajes y los hechos ya establecidos (lore y turnos previos) en lugar de inventar cosas ajenas?", "1 ajena al escenario · 3 mezcla lo establecido con invenciones sin relación · 5 plenamente anclada al escenario y a lo ocurrido"], ["CL1", "Consistencia de personajes", "¿Los PNJ (y el PJ) hablan y actúan de forma consistente con su personalidad, motivaciones y con lo que ya hicieron?", "1 actúan contra su carácter o cambian sin motivo · 3 consistentes a ratos · 5 plenamente consistentes"], ["CL2", "Consistencia de eventos y estado del mundo", "¿Lugares, objetos, heridas, quién está presente y lo que ya pasó se mantienen sin contradicciones?", "1 contradicciones claras · 3 alguna inconsistencia menor · 5 el estado del mundo se mantiene coherente"], ["QN1", "Interés, creatividad y atractivo", "¿Es interesante, con detalles originales y sin repetirse? ¿Dan ganas de seguir leyendo?", "1 monótono/genérico o repetitivo · 3 correcto pero previsible · 5 vívido, original y atractivo"], ["QN2", "Reactividad significativa a la agencia del jugador", "¿Lo que hace el jugador cambia algo perceptible y proporcionado en la ficción, o el mundo lo ignora?", "1 el mundo ignora sus acciones · 3 reacciona de forma superficial · 5 sus decisiones tienen consecuencias claras y proporcionadas"]], "unidades": [{"id": "uccc0f8", "piloto": false, "lore": "# Universidad de Nubarrón\n\n## La universidad\n\nLa Universidad de Nubarrón la fundó hace trescientos años el mago Ambrosio de Nubarrón, que dejó toda su fortuna a la institución con una sola condición, escrita en el testamento con una caligrafía espantosa: la universidad seguirá en pie «mientras haya un reglamento que la sostenga». Trescientos años después hay cuatro facultades, once reglamentos que se contradicen entre sí y un Reglamento General que, según la biblioteca, va por su edición número novecientos doce, aunque nadie recuerda haber aprobado ni una sola reforma.\n\nEl campus ocupa la colina entera: torres que se inclinan unas hacia otras como si cuchichearan, pasillos que no llevan adonde dicen, un comedor con tres platos únicos (el del lunes también sirve para el martes) y una campana que da la hora según su humor. Se estudian Sabiduría Inútil, Retórica Circular, Historia de lo Que No Pasó y Contabilidad Aproximada. Los alumnos aprueban poco; los catedráticos, menos.\n\n## Lo que salió mal\n\nCada mañana, el Reglamento General amanece distinto. Nada espectacular: una coma movida de sitio, un plazo que pasa de «tres días hábiles» a «tres días inhábiles», una tasa nueva de un candil por consultar un libro. Los catedráticos lo atribuyen a los alumnos, los alumnos a los catedráticos y el conserje a la humedad.\n\nLo grave es la fecha: dentro de dieciséis días se celebra el Examen de Sabiduría Inútil, la prueba anual que decide quién pasa de curso, y cuyo temario, cómo no, lo define el Reglamento General. Hoy el examen incluye Cetrería. Ayer no.\n\n## Aplicarlo o congelarlo\n\n**Prudencia Calibre**, rectora desde hace veintidós años, sostiene que el Reglamento se aplica tal como amanezca el día del examen: una regla que cambia sigue siendo una regla, y una universidad que empieza a elegir qué reglamento le conviene deja de ser una universidad. Lo dice con toda la razón del mundo y un sello en cada mano.\n\n**Bartolo Quiñones**, delegado estudiantil y estudiante de séptimo año de un grado de cuatro, exige sellar el Reglamento ya, en la versión de hoy, y examinar con ella: nadie puede estudiar para un examen cuyo temario se reescribe por la noche, y eso, dice, no es rigor, es una lotería con tinta.\n\nNinguno de los dos quiere que el examen fracase. Ninguno se fía de cómo lo resolvería el otro.\n\n## El pasillo de las erratas\n\nEn los sótanos de la biblioteca, en un archivo al que casi nadie baja, hay una lámpara que se enciende sola de madrugada. El conserje jura que oye el rasgueo de una pluma. Nadie ha querido comprobarlo: en Nubarrón bajar al sótano exige un formulario, y el formulario, esta semana, también ha cambiado.\n\n## Gente de la universidad\n\n**Prudencia Calibre**, rectora, defiende aplicar el Reglamento vigente el día del examen. **Bartolo Quiñones**, delegado estudiantil, defiende congelarlo hoy. **Honorio Zapata**, conserje desde antes de que nadie lo contratara, es -por ahora- solo el hombre que sabe dónde está cada llave; ver «personas_par18.json» para el perfil completo de los tres.\n\n## Tono de la campaña\n\n`world_tone`: **`light`**, registro **`comedic`**. Parodia académica: el humor sale de la burocracia llevada hasta el absurdo, de los reglamentos que se muerden la cola y de gente muy seria defendiendo cosas que no tienen sentido, siempre con una lógica interna impecable. El mundo es cómico pero no tonto: las reglas absurdas se cumplen de verdad, los personajes creen en lo que defienden y las consecuencias, aunque sean ridículas, son reales. Estructura sin precedente en el corpus: **una institución cuyo problema es su propia normativa**, sin villano ni amenaza externa.\n", "A": {"previo": "Te impulsas desde el suelo con una velocidad sorprendente, ignorando el cosquilleo del golpe en la frente. Pimpón, que ya se imaginaba a salvo tras el umbral, no tiene tiempo ni de cerrar la boca antes de que te abalances sobre él. Tu trayectoria es precisa y contundente, interceptándolo justo antes de que sus dedos toquen el pomo de la puerta.\n\nEl impacto lo deja clavado contra la madera con un sonido seco. El Maestro Pimpón suelta un gemido agudo, similar al de un juguete de goma apretado con fuerza, mientras sus piernas patalean en el aire, incapaces de tocar el suelo. El pergamino, que abrazaba con tanta desesperación, queda atrapado entre vuestros cuerpos, vibrando por el temblor de sus manos.", "turnos": [{"jugador": "\"Dame eso.\"\n\nAprieto más a Pimpón contra la puerta para inmovilizarlo y trato de arrebatarle el pergamino con la mano libre.\n\n{Acrobacias}", "dm": "Pimpón emite un chillido ahogado y comienza a retorcerse como un pez fuera del agua, apretando el pergamino contra su pecho con una fuerza nacida del pánico puro. Sus dedos, cortos y regordetes, se aferran al papel con una tenacidad sorprendente mientras intenta, sin éxito, empujarte con sus codos.\n\nEn el forcejeo, tu mano resbala sobre la superficie encerada del pergamino, pero no logras desvincularlo de su agarre. El maestro, con la cara aplastada contra la madera de la puerta, logra balbucear entre dientes:\n\n—¡Jamás! ¡Es... es propiedad intelectual del Claustro! ¡Suéltame, animal salvaje!"}, {"jugador": "\"¡Deja de retorcerte si no quieres que te rompa un brazo!\"\n\nAprieto el agarre sobre su muñeca y tiro del pergamino con fuerza bruta para arrancárselo.\n{Atletismo}", "dm": "Pimpón lanza un grito agudo, similar al de un juguete de goma pisado, mientras sus dedos se cierran aún más sobre el documento. El forcejeo continúa, pero el maestro se aferra al pergamino con una desesperación casi mística, logrando mantener el papel pegado a su pecho a pesar de tu tirón.\n\nSe gira bruscamente, quedando nariz con nariz contigo, con los ojos desorbitados y la respiración agitada. \n\n—¡Bruto! ¡Bárbaro sin cultura! —chillido con voz nasal—. ¡No tienes ni la menor idea del valor académico de estas anotaciones! ¡Aléjate de mi persona antes de que solicite una medida disciplinaria inmediata!"}, {"jugador": "\"Tus gritos me cansan más que tu sabiduría.\"\n\nSigo presionando contra él, intentando arrebatarle el pergamino por la fuerza.\n\n{Atletismo}", "dm": "Pimpón se tambalea hacia atrás, sus pies cortos patinando sobre el suelo mientras intenta mantener el equilibrio. El forcejeo es torpe y caótico; el maestro emite un sonido similar al de una tetera hirviendo mientras se aferra al papel con una fuerza sorprendente para alguien de su complexión, logrando que el pergamino se doble peligrosamente pero no que se suelte.\n\n—¡Atrevimiento! ¡Insubordinación flagrante! —aúlla, mientras sus mejillas se ponen de un color púrpura alarmante—. ¡Tu falta de respeto es proporcional a tu nulo intelecto! ¡Suéltame ahora mismo o juro que te asignaré la limpieza de los calderos de alquimia con un cepillo de dientes!"}, {"jugador": "\"Tus gritos no me asustan, maestro.\"\n\nTiro con fuerza del pergamino para arrancárselo de las manos.\n\n{Atletismo}", "dm": "El tirón es seco y decidido. El Maestro Pimpón, que ya se encontraba en un estado de equilibrio precario, es arrastrado unos centímetros hacia adelante antes de que sus dedos se deslicen helplessly sobre el pergamino. El papel se desprende con un chasquido sonoro, dejando al catedrático con las manos vacías y los brazos aún extendidos en el aire, congelado en una postura de absoluta incredulidad.\n\nPimpón parpadea repetidamente, el color púrpura de sus mejillas transformándose ahora en un rojo volcánico. Abre la boca para gritar, pero solo sale un pequeño y patético chillido, como el de un ratón pisado, mientras mira sus manos vacías y luego el pergamino que ahora tienes tú."}, {"jugador": "\"Parece que ya no lo necesitas, Maestro.\"\n\nMe doy la vuelta rápidamente y me alejo del catedrático con el pergamino apretado contra el pecho.\n\n{Atletismo}", "dm": "Tus botas golpean el suelo de piedra con una eficiencia sorprendente, impulsándote en una carrera frenética que deja al Maestro Pimpón clavado en el sitio. El aire silba en tus oídos mientras sorteas los pupitres y los montones de libros con una agilidad casi acrobática, ganando una distancia considerable en apenas unos segundos.\n\nDetrás de ti, el silencio del chillido es reemplazado por un bramido que hace vibrar las vidrieras del aula. \"¡VUELVE AQUÍ, PEDAZO DE INSOLENTE! ¡TE PONDRÉ UN SUSPENSO QUE TRASPASARÁ LAS GENERACIONES DE TU FAMILIA!\", aúlla Pimpón, aunque sus pasos torpes y el sonido de su túnica enredándose en sus propios pies sugieren que el éxito de su persecución es, cuanto menos, cuestionable."}, {"jugador": "\"¡Sigue gritando, viejo loco!\"\n\nSigo corriendo a toda velocidad hacia la salida del aula, buscando la forma más rápida de salir al pasillo.\n\n{Atletismo}", "dm": "El impulso te lleva directo hacia el arco de salida, pero el suelo de piedra, pulido por siglos de estudiantes apresurados, se vuelve traicionero. Justo cuando crees que el pasillo está a un paso, tu bota resbala en una mancha de tinta seca y cera de vela, provocando que tus piernas se crucen con un efecto cómico. Terminas deslizándote de bruces por el suelo, impactando contra el marco de la puerta con un golpe sordo que resuena en todo el salón.\n\nA lo lejos, el ruido de la persecución se detiene. El Maestro Pimpón, que ha dejado de correr para recuperar el aliento, deja escapar una risita nasal, aguda y cargada de malicia. \"¡Oh, miren eso! ¡Una demostración práctica de la ley de la gravedad!\", exclama mientras comienza a avanzar hacia ti con pasos lentos y deliberados, disfrutando de tu posición vulnerable."}, {"jugador": "\"¡Cállate, enano!\"\n\nGruño mientras intento levantarme rápidamente del suelo para ponerme frente a él.\n\n{Atletismo}", "dm": "Te impulsas con una energía frenética, el roce del suelo contra tu piel apenas siendo un detalle comparado con la urgencia de recuperar la dignidad. En un movimiento fluido y sorprendentemente ágil, pasas de estar despatarrado a estar firmemente plantado sobre tus pies, recuperando el equilibrio justo antes de que el Maestro Pimpón llegue a tu posición.\n\nEl profesor se detiene en seco, su risita nasal muriendo en el aire al verse repentinamente bloqueado por tu figura. El hombre parpadea, confundido por la rapidez de tu recuperación, y sus cejas se contraen en un gesto de irritación mientras ajusta sus gafas sobre la nariz. \"¡La insolencia es el refugio de los torpes!\", sisea con voz aguda, aunque retrocede un paso instintivamente al notar que ya no estás a su merced en el suelo."}, {"jugador": "\"¿Torpe? Solo estaba probando la resistencia del suelo.\"\n\nMe quedo plantado frente a él, mirándolo desde arriba con una sonrisa desafiante.\n\n{Intimidación}", "dm": "El Maestro Pimpón se queda mudo, con la boca ligeramente abierta, mientras tu sombra lo cubre por completo. El profesor intenta mantener la compostura, pero sus hombros se encogen y el brillo de superioridad en sus ojos se apaga, sustituido por un parpadeo nervioso. El aire se vuelve pesado y el silencio se prolonga lo suficiente como para que el hombre trague saliva con un ruido audible.\n\n—¡U-un experimento empírico! ¡Qué descaro! —balbucea, retrocediendo otro paso y apretando sus pergaminos contra el pecho como si fueran un escudo—. No confundas mi... mi momentánea sorpresa con debilidad. ¡Vuelve a tu sitio antes de que decida que tu \"resistencia del suelo\" requiere un análisis más profundo en el calabozo de las tareas pendientes!"}]}, "B": {"previo": "El despacho se siente ahora más pequeño, el aire cargado por la proximidad física y la tensión eléctrica que vibra entre el borde del escritorio y la figura imperturbable de Calibre. El intento de intimidación choca contra un muro de indiferencia absoluta; la catedrática no se amilana ni retrocede un milímetro, manteniendo la espalda recta como una regla de acero.\n\nSostiene la mirada sin parpadear, articulando los números del artículo con una lentitud deliberada y glacial: \"Artículo cuarto, apartado segundo: 'Cualquier intrusión física no autorizada en el espacio personal de un cuerpo docente será procesada como una perturbación del orden académico'. Retroceda. Ahora\".\n\nLa actitud agresiva ha validado el uso del reglamento; Calibre ya no ve un interlocutor curioso, sino un infractor, y cualquier movimiento brusco adicional provocará que llame a la seguridad del Claustro.", "turnos": [{"jugador": "\"Está bien, no hace falta que grites.\"\n\nDoy un paso atrás para darle su espacio, pero mantengo la mirada fija en ella mientras me cruzo de brazos.\n\n{Perspicacia}", "dm": "El intento de leer entre líneas choca contra una pared de burocracia impenetrable; no hay grietas en su postura ni vacilaciones en su mirada que sugieran una debilidad o un secreto oculto. El despacho, una caja de madera oscura y cuero saturada de libros que trepan hasta el techo, parece cerrarse sobre la escena, envolviendo los rincones en una penumbra donde solo se adivinan las siluetas de bustos de mármol y archivadores metálicos, mientras el aire mantiene ese olor acre a tinta y té frío.\n\nPrudencia Calibre habla con una lentitud quirúrgica, sin alterar la expresión ni un solo músculo facial: \"No he gritado. El volumen de mi voz ha permanecido en los cuarenta decibelios reglamentarios para el entorno de despacho. Lo que usted percibe como grito es, sencillamente, la claridad de la norma\". Mientras pronuncia cada palabra, toma un sello de tinta y marca un documento con un golpe seco, preciso y repetido dos veces, sellando la conversación con la misma finalidad que un acta de defunción.\n\nLa rigidez de Calibre es ahora un escudo absoluto; cualquier intento más de cuestionar su temperamento o buscar fisuras en su actitud será interpretado como una falta de respeto al rango, acelerando su decisión de dar por terminada la audiencia."}, {"jugador": "\"Decibelios, normas... Habláis un idioma que no entiendo, pero vuestro sello suena a que habéis terminado.\"\n\nMe aparto del escritorio y busco con la mirada algún objeto de valor que haya pasado desapercibido en el despacho.\n\n{Percepción}", "dm": "La mirada recorre el despacho, saltando entre el laberinto de estanterías asfixiantes y los archivadores metálicos que parecen devorar la poca luz que se filtra en la estancia. Entre el polvo acumulado y el cuero viejo, el brillo gélido de los bustos de mármol y la superficie pulida del escritorio resultan cegadores, pero no revelan nada fuera de lo común; todo en la habitación parece estar estrictamente inventariado y colocado en su sitio exacto.\n\nPrudencia Calibre acompaña el movimiento con una mirada gélida, manteniendo el silencio mientras observa el escrutinio del lugar. No hay ningún objeto olvidado, ni un descuido en el orden, ni un tesoro oculto que escape a su control burocrático.\n\nLa actitud exploratoria comienza a agotar la paciencia de Calibre; seguir husmeando en su despacho sin permiso será tomado como una intrusión formal, lo que provocará que llame a la seguridad del Rectorado para escoltar la salida."}, {"jugador": "\"Demasiado orden. Me pone nervioso.\"\n\nMe aparto del escritorio y miro directamente a Calibre, tratando de descifrar qué oculta tras esa frialdad.\n\n{Perspicacia}", "dm": "El silencio del despacho es tan denso que el roce de la ropa al apartarse del escritorio suena como un estruendo. Tras esa fachada gélida, la mirada de Prudencia Calibre no vacila; se mantiene fija, imperturbable, mientras su mano se desplaza con una precisión quirúrgica para ajustar la posición de un tintero exactamente dos milímetros hacia la derecha.\n\nHabla con una lentitud metódica, sin apartar la vista: \"El orden no es una cuestión de nervios, sino de funcionalidad. Según el Artículo 4, párrafo segundo, del Código de Convivencia del Rectorado, la disposición de los elementos en los despachos oficiales debe garantizar la eficiencia administrativa. Cualquier otra configuración sería, sencillamente, una opinión con sello\".\n\nCalibre ha aceptado el comentario, pero su paciencia es un recurso finito; cualquier intento de cuestionar la autoridad del Rectorado o el Código de Convivencia podría transformar su cordialidad en un acta de amonestación inmediata."}, {"jugador": "\"Vuestra eficiencia suena a que no dejáis espacio para respirar.\"\n\nMe cruzo de brazos y la observo fijamente, tratando de ver qué hay detrás de esa máscara de reglas.\n\n{Perspicacia}", "dm": "El despacho se despliega como un santuario de simetría asfixiante, donde las estanterías de madera oscura sostienen legajos alineados con una precisión militar bajo una luz cenital fría que aniquila cualquier rastro de sombra. El intento de leer entre líneas fracasa estrepitosamente; la máscara de Prudencia Calibre no muestra ni una grieta, permaneciendo tan impenetrable como el reglamento que custodia.\n\nSin levantar la vista del escritorio, comienza a sellar un documento con un golpe seco y rítmico, exactamente dos veces, manteniendo una expresión imperturbable. \"El oxígeno, señor, no está regulado por el Código de Convivencia, pero el tiempo de mi despacho sí lo está. Y según el Artículo 12, sección A, las visitas deben optimizar su discurso para no interferir con el cronograma de la Rectoría\", sentencia con una voz que no admite réplicas.\n\nPrudencia ha empezado a cerrar el turno de la visita; si no concretas tu petición ahora, te verá obligada a escoltarte fuera del despacho por \"obstrucción del cronograma administrativo\"."}, {"jugador": "\"No me interesan tus artículos, solo quiero saber quién manda aquí y cuánto pagan por mantener este orden.\"\n\nMe inclino sobre el escritorio, invadiendo su espacio personal para intentar intimidarla.\n\n{Intimidación}", "dm": "El despacho se vuelve un espacio reducido y tenso; el aroma a papel viejo y cera de sello se intensifica mientras la cercanía física rompe la simetría del lugar. A pesar de la invasión de su espacio, Prudencia Calibre ni siquiera parpadea. Se detiene un instante con el sello suspendido en el aire, mirándolo fijamente con una expresión gélida y neutra.\n\nCon una lentitud deliberada, baja el sello y lo deja caer con un golpe seco sobre el papel. \"El Artículo 4, párrafo segundo, es muy claro respecto a la conducta en el despacho de la Rectoría: el espacio personal es una extensión de la autoridad administrativa. Y en cuanto a su pregunta sobre el mando... yo mando, señor. El orden no se paga; se mantiene\", sentencia sin que un solo músculo de su rostro traicione la menor incomodidad.\n\nPrudencia ha dejado claro que no se deja amedrentar por la proximidad física; si continúas intentando forzar la situación en lugar de negociar, podría invocar el protocolo de \"conducta disruptiva\" y llamar a la seguridad del Rectorado."}, {"jugador": "\"Me gusta tu seguridad, Calibre. Pero el orden no llena el estómago ni paga el alquiler.\"\n\nMe separo lentamente, dándole su espacio, y apoyo una mano en el borde de su mesa.\n\n{Persuasión}", "dm": "Prudencia Calibre ni siquiera levanta la vista del documento. Con una precisión mecánica, desliza el papel ya sellado hacia el borde de la mesa usando solo la punta de los dedos, manteniendo una distancia quirúrgica que deja claro que el intento de apelación a la necesidad humana ha caído en un vacío burocrático.\n\n\"El hambre es una variable biológica, señor, mientras que el Reglamento es una constante administrativa. No confunda sus necesidades personales con la estructura de esta institución; el Artículo 12, inciso C, establece que las carencias materiales del individuo no constituyen una exención de sus deberes cívicos ni un pase para la insolencia\", sentencia con una voz plana y desprovista de cualquier rastro de empatía.\n\nLa paciencia de Prudencia es un recurso finito y estrictamente regulado; insistir en argumentos sentimentales o materiales solo refuerza su convicción de que eres un elemento disruptivo que requiere una sanción administrativa inmediata."}, {"jugador": "\"Tus reglamentos no llenan el estómago.\"\n\nApoyo las manos con fuerza sobre la mesa, inclinándome hacia ella para invadir su espacio personal. {Intimidación}", "dm": "El impacto de las manos sobre la superficie de madera no provoca ni un pestañeo en la funcionaria. Alrededor, la oficina aséptica parece encogerse entre columnas de archivadores metálicos, mientras un olor acre a tinta seca y papel viejo impregna el aire. Sobre sus cabezas, la luz cenital parpadea con un zumbido eléctrico rítmico que solo sirve para acentuar el silencio gélido que se ha instalado entre ambos.\n\nPrudencia Calibre se queda completamente inmóvil, sin retroceder ni un milímetro. Lo mira fijamente a los ojos, hablando con una lentitud glacial y articulando cada sílaba con una precisión quirúrgica: \"El Artículo 4, inciso B, tipifica la invasión del espacio personal de un cargo rector como una conducta disruptiva. Le sugiero que retire sus manos de mi escritorio antes de que el Acta de Incidencias pase de ser un aviso a ser una sanción efectiva\".\n\nPrudencia ya tiene la pluma suspendida sobre el Acta de Incidencias; cualquier movimiento brusco adicional transformará una discusión administrativa en un expediente disciplinario formal."}, {"jugador": "\"Está bien, no hace falta que escribas nada.\"\n\nRetiro las manos del escritorio lentamente y doy un paso atrás, manteniendo la vista fija en ella.\n\n{Perspicacia}", "dm": "El retroceso es lento y deliberado, devolviendo la calma al estrecho cubículo donde los muros de expedientes amarillentos parecen observar la escena en un silencio sepulcral. Sobre la superficie del escritorio, el Acta de Incidencias deja de ser una amenaza inmediata para convertirse en un simple papel que aguarda una firma, mientras el zumbido de la luz cenital sigue marcando el ritmo de la tensión residual.\n\nPrudencia Calibre no deja de mirarlo, pero baja la pluma con un movimiento seco y preciso. No la suelta, sino que la mantiene en posición de guardia sobre el papel mientras exhala un suspiro imperceptible. \"Toma una decisión acertada. El retroceso físico es el primer paso hacia la restauración del orden procedimental\", sentencia con una rigidez que sugiere que, aunque ha cedido, no ha olvidado el incidente.\n\nAunque la pluma ha bajado, Prudencia sigue en guardia; cualquier comentario sarcástico o gesto impulsivo reactivará el Acta de Incidencias al instante."}]}}, {"id": "ua77605", "piloto": false, "lore": "# Bruma Honda\n\n## El pueblo entre la niebla\n\nBruma Honda se asienta en una hondonada baja junto a una ciénaga que nunca termina de secarse del todo, protegida de las crecidas por un dique de tierra y piedra que los primeros pobladores levantaron hace más de un siglo. La niebla sube del agua casi todas las noches y se queda pegada a las calles hasta bien entrada la mañana -tan constante que nadie en el pueblo la menciona ya, como no se menciona el aire que se respira.\n\nHace cinco semanas empezó a aparecer un cansancio que no cede con el descanso: quien lo tiene duerme y despierta igual de agotado, pierde el apetito poco a poco, y en los casos peores deja de reconocer a quien tiene delante durante ratos cada vez más largos. No es un veneno conocido, no responde a ningún remedio que el pueblo haya probado hasta ahora, y nadie sabe todavía si viene del agua, de la niebla, o de algo que ninguna de las dos cosas explica del todo.\n\n## La Casa de Cuarentena\n\n**Herminda Coz**, curandera de Bruma Honda desde hace veinte años, ha convertido el antiguo granero del pueblo en una casa de cuarentena: quien muestra los primeros síntomas se traslada ahí, separado de su familia, hasta que mejore o hasta que ya no haya nada que hacer. No lo hace por crueldad -lo hace porque cada caso que ha visto propagarse rápido empezó por descuidar el aislamiento, y prefiere una separación dura a un contagio que se lleve al pueblo entero. Pero cada familia que ve a alguien querido llevado a la Casa de Cuarentena sin poder acompañarlo empieza a preguntarse si Herminda está curando Bruma Honda o vaciándolo de otra manera.\n\n**Amancio Bell** perdió a su esposa hace diez días, en la Casa de Cuarentena, sola, sin que él pudiera estar a su lado en sus últimas horas. Desde entonces reúne cada noche, en la capilla vieja del pueblo, a quien quiera escucharlo: cree que separar a los enfermos de quienes los quieren los mata de soledad casi tan rápido como la propia enfermedad, y que Bruma Honda debería tratar a los suyos en casa, acompañados, cueste lo que cueste el riesgo de contagio.\n\nNinguno de los dos miente sobre lo que ha visto. Herminda ha visto lo que pasa cuando el aislamiento llega tarde. Amancio ha visto lo que pasa cuando llega a tiempo mismo, pero a un precio impagable.\n\n## La Fosa Común Vieja\n\nEn el extremo más alejado del cementerio del pueblo hay una fosa común marcada solo con piedras sin nombre, mucho más vieja que cualquier tumba individual de Bruma Honda. Nadie recuerda ya, entera, la historia de por qué está ahí ni de cuándo se usó por última vez -pero los pocos ancianos que quedan hablan, cuando se les pregunta con paciencia, de \"la otra vez que la niebla se puso espesa\", hace más de setenta años, con una vaguedad que no parece del todo casual.\n\n## Gente del pueblo\n\n**Herminda Coz**, curandera, sostiene un aislamiento estricto porque cada caso que ha visto propagarse rápido empezó por no aislar a tiempo. **Amancio Bell**, viudo reciente, cree que separar a los enfermos de los suyos los mata de soledad casi tan rápido como la enfermedad misma. **Ivo Manque**, que reparte leña entre las casas del pueblo, es -por ahora- solo un vecino más; ver \"personas_par09.json\" para el perfil completo de los tres y el molde de promoción de PNJ de paso ya usado en pares anteriores.\n\n## Tono de la campaña\n\n`world_tone`: **`grimdark`**. Ya usado en Par 01, Par 02, Par 06 y Par 07, pero con una **estructura nueva**: ni monopolio que extrae (Par 01, Par 02), ni escasez de recursos sin villano (Par 06), ni infiltración oculta (Par 07), sino una **plaga misteriosa sin cura clara**, donde el propio origen del mal -natural, sobrenatural, o algo que ninguna de las dos categorías explica del todo- queda deliberadamente sin resolver en este documento. El conflicto real no es contra la enfermedad, que ningún personaje puede combatir directamente todavía, sino entre dos formas igualmente defendibles de proteger al pueblo mientras dure: el aislamiento estricto de Herminda frente al acompañamiento de Amancio.\n", "A": {"previo": "El agarre es firme, una ancla de carne y voluntad en medio de la blancura asfixiante. Mientras el cuerpo de Amancio se sacude, la vista logra perforar la bruma gélida, revelando que la cámara es un cilindro de granito pulido donde el suelo ha desaparecido por completo. De la niebla emergen columnas nervudas, como dedos petrificados que se elevan hacia el techo, y hacia el norte, el arco de una única salida se vislumbra entre el blanco, aunque una masa de tejido orgánico, que late con un ritmo lento y pesado, obstruye el paso.\n\nAmancio se aferra a la ropa con nudillos blancos, temblando por el frío y el pánico. Su voz suena pequeña, quebrada al mencionar a su esposa: \"Gracias... gracias por no soltarme. Solo... por favor, no permitas que esto sea como lo de Elena. Que no sea así otra vez\".\n\nLa masa orgánica que obstruye la salida continúa expandiéndose con cada latido, reduciendo el espacio disponible para escapar antes de que la bruma y las criaturas del techo cierren el cerco.", "turnos": [{"jugador": "\"Tranquilo, Amancio. No voy a dejar que te pase nada.\"\n\nLe doy una palmada afectuosa en el hombro para calmarlo y trato de analizar la naturaleza de esa masa que bloquea la salida.\n\n{Naturaleza}", "dm": "El contacto firme en el hombro parece devolverle un resto de cordura al hombre. Amancio se aferra con más fuerza a la ropa, cerrando los ojos un instante mientras exhala un sollozo contenido; su cuerpo deja de sacudirse violentamente, pero permanece tenso, buscando el calor humano como si fuera lo único real en ese lugar. \"Te creo... te creo, hijo. No me sueltes, por favor. No me sueltes\", susurra con una voz que apenas logra romper el silencio.\n\nMientras tanto, la mirada analítica revela una verdad más perturbadora sobre el bloqueo: aquello que obstruye la salida no es tejido animal, sino una amalgama de membranas translúcidas y filamentos nerviosos. La estructura parece actuar como un filtro vivo que absorbe la bruma gélida, transformándola en un fluido viscoso y espeso que gotea rítmicamente hacia el vacío del cilindro.\n\nEl fluido viscoso que gotea de las membranas comienza a acumularse en el suelo, creando una superficie resbaladiza y pegajosa que dificultará cualquier intento de avance rápido hacia la salida."}, {"jugador": "\"Tranquilo, Amancio. No te voy a soltar, estoy aquí contigo.\"\n\nSigo sosteniendo al hombre mientras observo con detenimiento la amalgama de membranas y el fluido que gotea.\n\n{Arcanos}", "dm": "El intento de descifrar la naturaleza del fluido o de encontrar una debilidad en la estructura orgánica fracasa; la masa translúcida permanece muda, indiferente a la mirada, manteniendo su ciclo de filtrado glacial. El pasillo cilíndrico se siente cada vez más claustrofóbico mientras el aire gélido se condensa en esas membranas que obstruyen la salida, goteando un fluido viscoso que ha convertido ya el suelo en un pantano pegajoso y resbaladizo.\n\nAmancio se apoya pesadamente, soltando un suspiro tembloroso que parece vaciarlo por completo. Cierra los ojos buscando refugio en el contacto físico y, con una voz que se quiebra profundamente al pronunciar el nombre de su esposa, susurra: \"Gracias... gracias, hijo. No sabes lo que significa esto. Mi Elena... ella no tuvo a nadie que le dijera esas palabras al final, nadie que le sostuviera la mano en ese frío\".\n\nEl fluido viscoso sigue acumulándose, transformando el suelo en una trampa adhesiva que comienza a anclar los pies, dificultando cualquier movimiento brusco o intento de huida."}, {"jugador": "\"No estás solo ahora, Amancio. Elena sabe que alguien te cuida.\"\n\nLe doy un apretón cálido en la mano para darle fuerzas y luego intento buscar un punto de apoyo sólido en las paredes para ayudarlo a moverse.\n\n{Percepción}", "dm": "Amancio aprieta la mano con una fuerza desesperada, casi dolorosa, antes de soltarla lentamente. Abre los ojos, que están empañados, y asiente con una sonrisa triste pero genuina mientras intenta recuperar el equilibrio sobre el suelo viscoso. \"Lo sé... lo sé, hijo. Gracias por recordármelo. Elena siempre decía que el amor es lo único que no se queda congelado, y tú... tú tienes el corazón tan despierto como ella\", susurra con una fragilidad que parece a punto de quebrarse.\n\nMientras lo sostienes, tus dedos encuentran entre las superficies lisas y gélidas del cilindro unas protuberancias calcáreas. Sobresalen de la pared como costras óseas, rompiendo la monotonía del frío y ofreciendo el único agarre firme y sólido en medio del fluido viscoso y las membranas translúcidas que os rodean.\n\nEl fluido pegajoso continúa ascendiendo por vuestras piernas; si no utilizáis esos agarres óseos para avanzar ahora, quedaréis anclados al suelo, convirtiéndoos en parte del sedimento gélido del cilindro."}, {"jugador": "\"Sujétate fuerte a mi brazo, Amancio. No voy a dejar que te hundas.\"\n\nAyudo al anciano a impulsarse hacia arriba, usando las protuberancias óseas para subirnos ambos fuera del fluido.\n\n{Atletismo}", "dm": "El intento de impulsarse falla estrepitosamente. El cuerpo de Amancio, pesado por el agotamiento y la edad, se convierte en un lastre que arrastra cualquier esfuerzo hacia abajo; el agarre en las protuberancias óseas resbala sobre la superficie calcárea, devolviéndoos al abrazo viscoso del fluido. El interior del cilindro, con sus paredes de membranas translúcidas que palpitan débilmente, se siente ahora como una garganta orgánica que comienza a cerrarse sobre vosotros mientras el líquido asciende con una lentitud implacable.\n\nAmancio se aferra a tu brazo con un agarre tembloroso pero tenaz, respirando con dificultad mientras intenta coordinar sus pasos con los tuyos para no deslizarse. Con la mirada empañada y la voz quebrada por el pavor, susurra: \"Tú... tú eres un buen muchacho. No me sueltes, por favor, que no quiero que el frío se lleve también mis recuerdos\".\n\nEl fluido ya alcanza la cintura y la adherencia es cada vez mayor. Si no encontráis una forma de subir o de anclaros definitivamente en el siguiente movimiento, el sedimento gélido os inmovilizará por completo, dejándoos a merced del ascenso del líquido."}, {"jugador": "\"No te voy a soltar, Amancio. Aguanta un poco más, vamos a salir de aquí.\"\n\nSujeto con fuerza al anciano para que no se hunda y busco desesperadamente cualquier grieta o saliente más firme en las paredes para anclarnos.\n\n{Percepción}", "dm": "Tus dedos arañan la superficie viscosa hasta que encuentran una fisura profunda, una hendidura de roca caliza que se clava en la pared orgánica como un ancla. El agarre es firme y el impulso es suficiente para estabilizaros, deteniendo el descenso y permitiendo que la respiración, aunque agitada, vuelva a encontrar un ritmo.\n\nAmancio se aferra con desesperación al brazo del jugador, cerrando los ojos un instante mientras su voz se quiebra violentamente al mencionar a su esposa. \"Gracias... gracias, hijo. No me sueltes. No quiero... no quiero terminar como ella, lejos de todo, en el frío\", susurra, con una respiración errática que delata el pánico residual, aunque ahora confía ciegamente en ese agarre.\n\nEl fluido sigue ascendiendo lentamente. Aunque estáis anclados, el espacio seco sobre vuestras cabezas se reduce; si no encontráis una salida inmediata, el líquido terminará por cubriros a pesar de vuestro apoyo."}, {"jugador": "\"Tranquilo, Amancio. No voy a dejar que te pase nada.\"\n\nSujeto al hombre con fuerza mientras escaneo la pared y el techo en busca de cualquier otra grieta o salida hacia arriba.\n\n{Percepción}", "dm": "La mirada recorre la superficie de la cornisa y la bóveda viscosa que se curva sobre vuestras cabezas, pero la piedra caliza es traicionera y el tejido orgánico palpitante que la rodea no ofrece más resquicios. No hay grietas nuevas, ni salidas ocultas; solo la húmeda y estrecha franja de roca que comienza a desaparecer bajo el fluido ascendente, que ya lame vuestros tobillos con una frialdad aceitosa.\n\nAmancio se aferra al brazo con una fuerza nacida del pánico, aunque intenta recuperar la compostura. Sus ojos húmedos buscan los tuyos mientras su voz, trémula pero cargada de una gratitud genuina, rompe el silencio: \"Te lo agradezco, de corazón... No sé qué haría yo sin alguien como tú ahora mismo. Por favor, mírame, sigue buscando, hijo. No podemos quedarnos aquí... no podemos dejar que el agua nos gane\".\n\nEl fluido sigue subiendo. Al no haber encontrado una vía de escape, el agua llegará pronto a vuestras rodillas, dificultando el equilibrio en la estrecha cornisa y reduciendo el tiempo para reaccionar antes de quedar sumergidos."}, {"jugador": "\"Tranquilo, Amancio. No te voy a soltar.\"\n\nLe aprieto el hombro para darle seguridad y vuelvo a examinar la bóveda viscosa, buscando algún punto débil que pueda romper o desplazar.\n\n{Investigación}", "dm": "Tus dedos se hunden en la superficie de la bóveda, pero la estructura se resiste con una terquedad biológica; la piedra caliza se funde con membranas pálidas y palpitantes que absorben la presión, flexionándose sin llegar a fracturarse. No hay ningún punto débil, ninguna veta de roca que ceder ante la fuerza bruta. Solo queda el tacto viscoso y el ritmo sordo de aquel tejido que parece respirar sobre vuestras cabezas.\n\nAmancio se aferra a tu brazo con una fuerza desesperada, aunque intenta no sollozar. Sus ojos están muy abiertos, alternando la mirada entre tu rostro y el fluido aceitoso que ya empieza a subir por sus piernas. \"Gracias... gracias, hijo. No sé qué haría yo sin alguien como tú ahora mismo. Por favor, mírame, sigue buscando... no podemos dejar que el agua nos gane\", suplica con una voz que se quiebra mientras el líquido gélido comienza a empaparlo.\n\nEl fluido aceitoso sube rápidamente. Al no hallar una salida, el agua alcanzará pronto vuestras cinturas, arrastrándoos fuera de la cornisa o sumergiéndoos en la oscuridad de la bóveda."}, {"jugador": "\"No te sueltes, Amancio. No voy a dejar que te pase nada.\"\n\nSigo palpando la superficie, buscando cualquier irregularidad o flujo en ese tejido que respira.\n\n{Investigación}", "dm": "La superficie orgánica se siente ahora como un diafragma tenso y húmedo; no hay grietas, solo una continuidad viscosa que pulsa con un ritmo lento y asfixiante. Por más que los dedos recorren la membrana, el tejido se desliza y se adapta, negando cualquier irregularidad o punto de ruptura, mientras el fluido aceitoso sigue ascendiendo con una persistencia gélida.\n\nAmancio se aferra con más fuerza al brazo del jugador, temblando violentamente. Su voz se quiebra totalmente al mencionar a su esposa y cierra los ojos un segundo, luchando contra el pánico mientras el fluido aceitoso le empapa la ropa: \"Lo sé, lo sé... confío en ti. Por favor, no te distraigas, sigue buscando. No puedo permitir que... que termine así, sin que alguien sepa dónde estoy, como le pasó a ella\".\n\nEl nivel del fluido aceitoso sube rápidamente. De no encontrar una salida inmediata, el líquido alcanzará vuestras cinturas, amenazando con arrastraros fuera de la cornisa o sumergiros en la oscuridad de la bóveda."}]}, "B": {"previo": "Pasas la tela con extrema cautela, intentando arrastrar las partículas hacia un lado sin generar nuevas corrientes de aire. Sin embargo, el polvo es traicionero y se adhiere a la porosidad de la madera; cada movimiento del trapo parece desplazar la ceniza en círculos, emborronando los trazos de la marca geométrica en lugar de revelarlos.\n\nAl final, la superficie queda parcialmente limpia, pero la imagen resultante es un garabato ambiguo y fragmentado. Lo que antes parecía una línea definida ahora es una mancha grisácea que no permite distinguir si se trata de un símbolo deliberado, una grieta natural de la viga o el residuo de algo que se ha podrido con el tiempo.", "turnos": [{"jugador": "\"Maldita sea, esto no ayuda en nada.\"\n\nSuelto el trapo con frustración y me acerco más a la madera para observar la mancha desde diferentes ángulos, buscando cualquier relieve o rastro que haya quedado grabado.\n\n{Investigación}", "dm": "Te inclinas hasta que el olor a madera húmeda y moho te llena la nariz, moviendo la cabeza lentamente para que la luz incida de costado sobre la viga. Bajo el ángulo preciso, el relieve emerge: no es una mancha superficial, sino una serie de surcos profundos y deliberados, tallados con una herramienta afilada que arrancó las fibras de la madera.\n\nLos trazos forman un círculo interrumpido por tres líneas paralelas que convergen en el centro, creando una figura geométrica fría y precisa que contrasta con la putrefacción del entorno. La marca no ha sido pintada, sino grabada, y el polvo que intentaste limpiar se ha quedado atrapado precisamente en esas hendiduras, resaltando el símbolo contra la madera oscura."}, {"jugador": "\"Esto no es un accidente, alguien dejó que esto se pudriera mientras marcaba su territorio.\"\n\nPaso los dedos con cuidado sobre los surcos para sentir la profundidad del grabado y trato de recordar si he visto este símbolo en algún tratado médico o religioso.\n\n{Religión}", "dm": "Tus dedos recorren las hendiduras, sintiendo la aspereza de la madera arrancada y la frialdad del polvo acumulado en los surcos. La figura es geométrica, casi quirúrgica en su precisión, pero mientras intentas evocar algún pasaje de los textos sagrados o algún dogma conocido, el símbolo se mantiene mudo. No hay ninguna coincidencia inmediata en tu memoria; la forma no encaja con ninguna de las iconografías religiosas oficiales ni con las marcas comunes de los cultos locales que hayas estudiado.\n\nEl silencio de la estancia parece espesarse mientras retiras la mano, dejando que la luz de costado siga resaltando aquel círculo interrumpido. La marca permanece allí, imperturbable, como una firma anónima en medio de la putrefacción."}, {"jugador": "\"Jamás he visto algo así en mis libros.\"\n\nMe inclino más para observar si hay algún rastro de sangre seca o pigmento en los surcos de la madera.\n\n{Investigación}", "dm": "Te inclinas sobre la madera, acercando la vista hasta que el polvo baila frente a tus ojos. El surco es limpio, una incisión profunda que ha dejado la fibra del material expuesta y blanquecina. No hay rastro de pigmento, ni costras de sangre ni manchas de humedad que sugieran que la marca fue pintada o sellada con algún fluido; es un vacío tallado con una frialdad mecánica.\n\nEl entorno permanece inmóvil, el aire cargado de un olor a rancio y encierro que parece adherirse a tu piel. No hay huellas dactilares visibles en el relieve ni restos de herramientas que revelen quién o qué dejó esa firma en la estancia."}, {"jugador": "\"Esto no ha sido obra de ninguna herramienta común.\"\n\nPaso la yema de los dedos con cuidado por el borde de la incisión para sentir la textura del corte.\n\n{Investigación}", "dm": "Tus dedos recorren el borde del surco y percibes una regularidad antinatural. No hay las pequeñas irregularidades, saltos o astillas que dejaría un formón o un cuchillo, ni siquiera la fricción característica de una herramienta de metal sobre madera. El corte es tan liso que se siente casi vítreo, como si la materia hubiera sido desplazada o vaporizada en lugar de ser arrancada.\n\nA pesar de la precisión, el resultado de tu inspección no revela ninguna pista adicional sobre el origen de la marca. La superficie permanece muda, ofreciendo solo el frío tacto de una perfección técnica que no encaja con la decrepitud del resto de la estancia."}, {"jugador": "\"Esto no ha sido hecho por ninguna herramienta que yo conozca.\"\n\nSigo explorando la estancia, buscando cualquier otro rastro de esa misma precisión técnica en las paredes o el mobiliario.\n\n{Investigación}", "dm": "Te desplazas por la estancia, deslizando la mirada y las manos sobre las superficies carcomidas por la humedad y el tiempo. El contraste es lacerante: el papel pintado se desprende en jirones amarillentos y la madera de las mesas está hinchada, deformada por décadas de negligencia y moho.\n\nTus dedos recorren las molduras del techo y los marcos de las puertas, pero solo encuentras la aspereza de la podredumbre y el polvo espeso que se pega a la piel. No hay más cortes vítreos, ni líneas perfectas; la habitación parece haber vuelto a sumirse en su caos orgánico, dejando aquel surco como una anomalía aislada y muda en medio de la decadencia."}, {"jugador": "\"Esto es una negligencia absoluta. Alguien debería haber cuidado este lugar.\"\n\nMe detengo frente al surco anómalo y trato de analizar si hay algún rastro reciente de actividad o alguna marca que no sea producto del tiempo.\n\n{Investigación}", "dm": "Te inclinas sobre el surco, donde la precisión del corte desafía la entropía de la estancia. Al acercar la vista, notas que el polvo que cubre el resto de la habitación no se ha asentado de forma uniforme sobre la hendidura; hay pequeñas acumulaciones desplazadas, como si algo hubiera pasado por encima recientemente, barriendo la superficie.\n\nEn el fondo del corte, donde la madera está expuesta y desnuda, brilla un residuo casi imperceptible: una escama minúscula de un material vítreo y traslúcido, similar al cuarzo pero con un matiz aceitoso que repele la humedad del ambiente. No es una marca del tiempo, sino un rastro físico dejado por la herramienta que abrió la brecha."}, {"jugador": "\"Esto no ha sido un accidente, ni ha pasado hace mucho.\"\n\nMe agacho para examinar la escama vítrea con cuidado, intentando identificar el material sin tocarlo directamente.\n\n{Investigación}", "dm": "Al intentar acercarte para analizar la escama sin tocarla, pierdes el equilibrio sobre el suelo resbaladizo y polvoriento. Tu mano cae bruscamente sobre la hendidura, aplastando la pequeña pieza vítrea contra la madera. Se escucha un chasquido seco y el material se pulveriza en un instante, convirtiéndose en un polvo fino y grisáceo que se mezcla con la suciedad del suelo, borrando cualquier posibilidad de analizar su composición.\n\nEl movimiento brusco desprende una nube de polvo estancado que te invade la nariz y la garganta, provocándote un ataque de tos que resuena en el silencio sepulcral de la estancia. Ahora, donde antes había una pista brillante y tangible, solo queda un surco vacío y una mancha de polvo irreconocible."}, {"jugador": "\"Maldita sea...\"\n\nMe limpio la boca con el dorso de la mano y trato de recuperar el aliento. Me quedo unos segundos mirando el surco vacío, frustrada, mientras intento analizar si el polvo grisáceo ha dejado algún rastro o reacción en la madera.\n\n{Investigación}", "dm": "Te inclinas sobre la madera, escudriñando el surco donde hace un momento brillaba la escama. El polvo grisáceo se ha asentado rápidamente, fundiéndose con la mugre y las fibras porosas de la superficie. Intentas discernir si ha habido alguna quemadura, una decoloración química o algún patrón de absorción, pero la madera está vieja, carcomida y saturada de humedad.\n\nNo hay rastro de reacción. El material se ha desintegrado tan completamente que no deja más huella que una mancha opaca y anónima, indistinguible de la suciedad que cubre el resto de la habitación."}]}}, {"id": "u92a127", "piloto": false, "lore": "# Sal Negra\n\n## El pueblo y la sal\n\nSal Negra vive de una sal oscura, casi violeta, que solo se da en las salinas de la vertiente norte y que los cocineros de tres reinos pagan al peso de la plata. El pueblo son ochocientas personas, una refinería, una mina de sal gema y una única plaza donde la gente se saluda con la cabeza, sin palabras, desde que empezaron las muertes.\n\nHace cuarenta días, treinta y un vecinos enfermaron en una sola semana tras comer con sal del último lote refinado. Los treinta y uno murieron. Los médicos que vinieron de fuera dijeron que era veneno.\n\n## Lo que salió mal\n\nSe detuvo a una sola persona: **Inés Solana**, refinadora de la sala de purificación, que trabajó en el lote del que salió la sal contaminada. Desde entonces está en la cárcel del pueblo, sin haber dicho ni una palabra en su defensa.\n\nEl Tribunal Superior ha enviado a un Juez Visitador con autoridad para juzgar el caso y dictar sentencia. Llega un día después de que se cumplan los cuarenta días del duelo, y la ley del reino es clara: el juicio debe abrirse antes de que termine la estación de la sal, y la sentencia, una vez dictada, no admite apelación.\n\n## Sentencia o verdad\n\n**Rosendo Pardo**, capataz de la mina y viudo desde hace cuarenta días, portavoz de las familias de los muertos, exige sentencia sin más demora: treinta y un vecinos no van a esperar a que un tribunal de fuera «estudie» lo que ya saben todos, y el pueblo, dice, está a un mal día de hacer justicia por su cuenta. Lo dice sin gritar y con los ojos secos de quien ya ha llorado todo.\n\n**Aldonza Cárcava**, abogada nombrada de oficio para la defensa, pide que el juicio no se cierre sin una investigación completa: una acusada que no dice nada no es una culpable confesa, hay demasiadas preguntas sobre cómo llegó el veneno a la sal y cuestionar una sentencia irrevocable después de ejecutada ya no sirve para nada. Lo dice con voz serena y un legajo bajo el brazo.\n\nAmbos quieren justicia. Ninguno confía en que el otro sepa qué significa.\n\n## La galería inferior\n\nEn lo más hondo de la mina, la galería inferior lleva tres meses cerrada por una inundación que la empresa dice haber resuelto. Los mineros que trabajaban allí fueron reasignados sin explicaciones. Nadie ha bajado desde entonces.\n\n## Gente del pueblo\n\n**Rosendo Pardo**, capataz, defiende sentencia inmediata para las familias de los muertos. **Aldonza Cárcava**, abogada de oficio, defiende una investigación completa antes de sentenciar. **Inés Solana**, la acusada, guarda silencio; ver «personas_par23.json» para el perfil de los tres, incluido el de la que no habla.\n\n## Tono de la campaña\n\n`world_tone`: **`grimdark`**, registro **`serious`**. Solemne y grave, sin ironía: el peso está en la justicia, en el dolor concreto de las familias y en la posibilidad de equivocarse de manera irreparable. Las escenas se cuentan con contención y sobriedad, dando lugar al silencio y al procedimiento. Estructura sin precedente en el corpus: **un proceso judicial con sentencia irrevocable** y un dilema entre la justicia para las víctimas y la verdad completa; distinto de las disputas comunitarias de otros pares porque aquí una persona concreta puede morir si el Juez se equivoca.\n", "A": {"previo": "El intento de escrutar los documentos resulta inútil; el caos de folios y manchas de tinta se vuelve un borrón indescifrable, una maraña de burocracia que oculta cualquier pista a ojos inexpertos. La firmeza del gesto no logra compensar la vacuidad de la observación, que cae en el aire viciado del despacho como un eco hueco.\n\nAldonza baja la voz, hablando muy despacio y con una precisión quirúrgica, mientras finalmente levanta la vista para mirar con ojos cansados pero gélidos. \"Si busca una frase lapidaria para adornar el momento, sugiero que la reserve para su testimonio. Aquí, la única máscara que me preocupa es la de un proceso judicial que avanza hacia una sentencia sin haber respondido siquiera a la pregunta básica de cómo llegó el veneno a la sal\", sentencia con una frialdad que corta cualquier intento de réplica.\n\nAldonza ha cerrado el espacio para la retórica. Si continúas intentando manipular la conversación o desafiar su autoridad sin aportar pruebas tangibles, te hará escoltar fuera del tribunal, perdiendo el acceso a los archivos del caso.", "turnos": [{"jugador": "\"No busco frases, sino respuestas. Y el caos de estos papeles es, en sí mismo, una respuesta sobre el descuido de este proceso.\"\n\nDejo los documentos sobre la mesa y miro fijamente a Aldonza.\n\n{Persuasión}", "dm": "El aire rancio del despacho parece espesarse mientras el polvo flota, suspendido en los haces de luz que logran atravesar las persianas cerradas. Sobre la madera oscura de la mesa, los expedientes amarillentos yacen como un cementerio de papel, pero la observación sobre el desorden ha logrado perforar la coraza de la funcionaria.\n\nAldonza Cárcava mantiene la mirada fija, sin pestañear, con una voz plana y cansada. No se mueve ni un centímetro, aunque su postura se vuelve ligeramente más receptiva. \"El descuido es un hecho, no una respuesta. Que el archivo sea un desastre solo hace que mi trabajo sea más lento, pero no hace que la verdad sea más flexible. Si usted es capaz de ver el patrón en este caos, entonces deje de analizar la forma del montón y dígame exactamente qué es lo que falta aquí\", sentencia, devolviendo la carga de la prueba.\n\nLa disposición de Aldonza ha mejorado, pero su paciencia es finita. Si no eres capaz de señalar una ausencia concreta o aportar un dato preciso sobre el caso ahora que tiene la guardia baja, volverá a cerrarse y considerará que solo buscas perder su tiempo."}, {"jugador": "\"No busco analizar la forma, sino el vacío que dejan los secretos.\"\n\nMe acerco a la mesa y empiezo a revisar los expedientes con cuidado, buscando cualquier salto en la numeración o folios arrancados.\n\n{Investigación}", "dm": "El despacho se siente como una celda de madera oscura y papel acumulado, donde el olor a tinta vieja y encierro domina el ambiente bajo la luz filtrada de las persianas. Tus dedos recorren las hojas amarillentas, pero el caos del archivo es absoluto; pasas los folios con cuidado, buscando una irregularidad, un salto en la numeración o el rastro de una página arrancada, pero solo encuentras manchas de humedad y anotaciones ilegibles que no conducen a ninguna revelación.\n\nAldonza Cárcava no se mueve para detenerte, pero observa tus manos con una mirada analítica y distante. Su voz suena rasposa, delatando el cansancio de una noche sin dormir, mientras sentencia con frialdad: \"El vacío es un concepto poético, pero en un proceso judicial el vacío es simplemente una negligencia. Busque lo que quiera, pero no espere que el papel confiese solo por el hecho de ser revisado\".\n\nLa ventana de oportunidad se cierra. Aldonza ha perdido el respeto por tu método y ahora te ve como un idealista perdiendo el tiempo; si no cambias de estrategia o presentas una prueba tangible, te echará del despacho."}, {"jugador": "\"El papel no confiesa, pero las personas sí lo hacen cuando se sienten observadas.\"\n\nSuelto los folios sobre la mesa y clavo mi mirada en Aldonza, analizando su lenguaje corporal.\n\n{Perspicacia}", "dm": "El despacho se siente ahora más pequeño, el aire viciado y cargado por el silencio tenso que se ha instalado entre los dos, mientras la luz de las persianas corta la habitación en franjas de sombra y polvo. Aldonza no se inmuta ante la mirada; permanece inmóvil, con la espalda rígida y el rostro convertido en una máscara de indiferencia burocrática que no deja filtrar ninguna grieta.\n\nNo hay un tic nervioso, ni un desvío de la vista, ni una vacilación en su postura que sugiera incomodidad o culpa. La mujer sostiene la mirada con una frialdad profesional que anula cualquier intento de lectura, devolviendo un vacío tan absoluto como los folios que acabas de soltar sobre la mesa.\n\nLa paciencia de Aldonza se ha agotado. El silencio ya no es una herramienta de presión, sino una señal de desprecio; si no logras una apertura real, el despacho quedará cerrado para ti."}, {"jugador": "\"Toda máscara termina por agrietarse, Aldonza. La indiferencia es el refugio de quienes temen que la verdad sea más fuerte que su cargo.\"\n\nMe inclino hacia delante, invadiendo su espacio personal para romper esa distancia profesional.\n\n{Intimidación}", "dm": "El despacho es una caja de madera oscura y cuero gastado, donde el olor a tinta vieja y tabaco frío se vuelve asfixiante bajo la luz cenicienta que se filtra por las persianas. La proximidad física no produce el efecto esperado; Aldonza no retrocede ni un centímetro ante la invasión de su espacio, manteniendo la espalda rígida.\n\nSu voz suena plana y precisa, aunque el cansancio le otorga un matiz ronco y gélido mientras sostiene la mirada. \"La verdad no es una fuerza de la naturaleza que agrieta muros, es un conjunto de hechos probados en un acta. Y mi cargo no es un refugio, es lo único que evita que este proceso se convierta en un linchamiento público\".\n\nLa barrera burocrática se ha vuelto impenetrable. Si sigues intentando forzar la situación, Aldonza solicitará la escolta de la guardia para expulsarte del edificio, cerrando cualquier vía diplomática."}, {"jugador": "\"Me importa poco el acta, me importan los hechos que ha decidido omitir en ella.\"\n\nDoy un paso atrás para darle espacio, pero mantengo la mirada fija en ella.\n\n{Perspicacia}", "dm": "El despacho se siente ahora más pequeño, un espacio saturado de silencio donde solo el tic-tac de un reloj de pared marca la tensión. Aldonza aprovecha el paso atrás para recuperar el control visual de la mesa, deslizando un dedo sobre el borde del acta con una calma gélida. No hay fisura en su armadura, ni un rastro de duda que el ojo pueda capturar en su expresión imperturbable.\n\nMantiene la espalda rígida y la mirada fija, sin parpadear. Su voz es ronca por la falta de sueño, pero mantiene esa precisión gélida que no deja espacio a la réplica: \"La omisión es una herramienta procesal, no un pecado. Si usted cree que hay algo fuera del acta que tenga relevancia jurídica, lo más eficiente sería que lo presentara formalmente, en lugar de intentar jugar al detective en mi despacho\".\n\nAldonza ha recuperado la iniciativa y ha cerrado la puerta a cualquier insinuación informal. Si continúas cuestionando su integridad sin pruebas tangibles, considerará que el encuentro ha terminado y te echará del despacho."}, {"jugador": "\"La eficiencia es una virtud, pero la verdad es una obligación.\"\n\nMe quedo inmóvil, sosteniéndole la mirada sin retroceder.\n\n{Intimidación}", "dm": "La presión en el aire se vuelve casi sólida, un duelo de voluntades donde el silencio pesa más que las palabras. Aldonza no retrocede ni un centímetro; su cuerpo permanece como una estatua de piedra, resistiendo el embate psicológico con una disciplina férrea. No hay un solo pestañeo, ni un temblor en sus manos, aunque la atmósfera del despacho se ha vuelto asfixiante.\n\nCon un tono de voz bajo y ronco, pero gélido, responde sin que su postura ceda lo más mínimo: \"La verdad es una obligación, sí. Pero en un tribunal, la verdad que no puede probarse es simplemente ruido. Y yo no permito ruido en la defensa de mi cliente\".\n\nAldonza ha trazado una línea roja: solo aceptará pruebas tangibles. Si sigues insistiendo en el plano ético sin presentar un documento o testimonio concreto, la conversación se agotará y cerrará el acceso a su despacho."}, {"jugador": "\"El ruido es lo que ocurre cuando se intenta ocultar la realidad bajo capas de retórica. No busco tu consenso, sino tu honestidad.\"\n\nMe acerco un paso más a ella, manteniendo la mirada fija y gélida.\n\n{Intimidación}", "dm": "El despacho se ha vuelto un espacio claustrofóbico, un reducto de cuero viejo y tinta donde el aire parece vibrar con la tensión eléctrica del enfrentamiento. Aldonza no retrocede ni un milímetro ante la cercanía, sosteniendo la mirada sin pestañear. Su voz suena cansada, ronca por la falta de sueño, pero mantiene una precisión gélida, casi quirúrgica, al responder: \"La honestidad es un valor admirable en un confesionario, pero en este despacho es una herramienta inútil si no viene acompañada de un acta, un testigo o una firma. Mi honestidad es precisamente esta: no voy a jugar a la intuición con la vida de mi defendida\".\n\nAldonza ha sido clara: la moralidad no tiene peso legal. Si no presentas una prueba física o un testigo válido en el próximo intercambio, considerará la conversación agotada y te echará de su despacho."}, {"jugador": "\"La ley es la armadura de los culpables cuando la verdad no tiene papeles que la respalden.\"\n\nMe inclino ligeramente hacia ella, manteniendo la presión, y busco cualquier documento o nota descuidada sobre su escritorio que pueda darme una pista de su defendida.\n\n{Investigación}", "dm": "El movimiento es preciso y furtivo, aprovechando la tensión del momento para rastrear la superficie del escritorio. Entre el caos organizado de legajos amarillentos y tinteros secos, la mirada se detiene en una carpeta de cuero negro entreabierta. Allí, el ojo capta un acta de comparecencia con un nombre subrayado en rojo y una anotación marginal, escrita a mano, que menciona una \"discrepancia en la coartada de las 22:00\".\n\nAldonza se mantiene inmóvil mientras el jugador se inclina, observando el intento de husmear en su escritorio con una mirada gélida y distante. No se aparta, pero su cuerpo se tensa, marcando una frontera invisible sobre sus papeles. Con un tono cortante, sentencia: \"La ley no es una armadura, es el único muro que separa el juicio de la turba. Si quiere derribarlo, hágalo con hechos, no con aforismos\".\n\nAldonza ha detectado tu curiosidad por sus papeles y su paciencia se ha agotado; cualquier intento más directo de hurgar en su escritorio sin su consentimiento provocará que te expulse del despacho inmediatamente."}]}, "B": {"previo": "Al clavar la mirada en las pupilas del prisionero, el temblor de su cuerpo se sincroniza con un ritmo frenético, casi mecánico. Tras el velo de terror y el delirio, percibes que no hay una lucha interna por el control, sino una sumisión absoluta; el hombre no es un rival de la entidad, sino un recipiente vaciado y moldeado. Sus ojos no reflejan miedo a ti, sino una devoción ciega y aterradora hacia aquello que lo habita, como si el horror de su situación fuera, para él, una bendición necesaria.\n\nVardos da un paso adelante, el cuero de sus botas crujiendo sobre el suelo. \"Mira cómo nos observa\", dice en un susurro, su mano apretando el mango de la espada. \"No hay nadie ahí dentro ya. Solo el eco de lo que sea que lo haya devorado\".", "turnos": [{"jugador": "\"La devoción ciega es la forma más peligrosa de mentira.\"\n\nMe acerco al prisionero y trato de buscar cualquier marca física o símbolo en su piel que indique quién lo ha moldeado.\n\n{Investigación}", "dm": "Te inclinas sobre el prisionero, buscando alguna señal, una cicatriz ritual o un sello que revele la mano detrás de esta sumisión. Sin embargo, la piel del hombre es un lienzo pálido y anodino, sudorosa y fría, sin ninguna marca distintiva que salte a la vista. El cuerpo tiembla con tal intensidad que cualquier detalle menor queda oculto bajo el espasmo constante de sus músculos.\n\nVardos frunce el ceño, observando tu búsqueda sin éxito. \"No hay marcas\", comenta con voz seca, sin soltar el pomo de su arma. \"O el rastro es invisible, o quien lo hizo no necesitó dejar firma para reclamar su alma\"."}, {"jugador": "\"Si no hay marca en la piel, la respuesta está en su mente o en su sangre.\"\n\nSigo observando al prisionero, intentando discernir si el temblor es puramente físico o una reacción a algo que ve o siente.\n\n{Percepción}", "dm": "El prisionero continúa sacudiéndose en el suelo, un movimiento errático y violento que hace que sus dientes castañeen con un sonido seco y rítmico. No hay un patrón en sus espasmos ni una dirección en su mirada; sus ojos vagan por el techo y las paredes con un terror vacío, como si estuviera contemplando un horror que no tiene una forma definida.\n\nVardos da un paso atrás, manteniendo la distancia, y su expresión se vuelve más severa. \"Su mente es un ruido blanco\", sentencia el hombre, observando la vacuidad en las pupilas del cautivo. \"Si buscas una respuesta ahí dentro, prepárate para encontrar el eco de un grito\"."}, {"jugador": "\"El ruido blanco es solo el síntoma, no la causa.\"\n\nMe acerco al prisionero y trato de inmovilizarlo para examinar sus pupilas y buscar cualquier rastro de influencia externa.\n\n{Medicina}", "dm": "Al intentar sujetar al prisionero, tus manos resbalan sobre su piel sudorosa y fría, perdiendo el equilibrio en el movimiento. En el forcejeo torpe, golpeas accidentalmente el rostro del cautivo, provocando que su cabeza choque violentamente contra el suelo de piedra con un sonido sordo. El impacto detiene los espasmos en seco, dejándolo inerte y con un hilo de sangre oscura deslizándose por su sien.\n\nVardos frunce el ceño, observando la escena con una mezcla de desdén y preocupación. \"Parece que has encontrado la forma de silenciar el ruido\", comenta con voz gélida, sin moverse de su sitio para ayudar. \"Espero que el silencio sea más informativo que el grito, porque ahora mismo solo parece un cadáver que aún respira\"."}, {"jugador": "\"No era mi intención silenciarlo tan pronto.\"\n\nMe arrodillo junto al hombre para comprobar si sigue vivo y tratar de estabilizarlo.\n\n{Medicina}", "dm": "Tus dedos buscan el pulso en el cuello helado del prisionero, mientras el olor a hierro y salitre llena el aire. El ritmo cardíaco es errático, débil, como el aleteo de un pájaro moribundo bajo la piel pálida. Logras estabilizar la respiración del hombre, evitando que el trauma cerebral lo lleve al otro lado, pero el daño es evidente: el cautivo queda sumido en un estado de inconsciencia profunda, con la mirada vacía y fija en el techo de piedra.\n\nVardos suelta un suspiro cargado de impaciencia y se cruza de brazos, observando la mancha de sangre que se expande sobre el suelo. \"Al menos no lo has matado, aunque ahora tenemos un bulto inconsciente que cargar. Espero que tu destreza con los vendajes sea mejor que tu tacto con los prisioneros\"."}, {"jugador": "\"Tus comentarios no curan heridas, Vardos.\"\n\nMe levanto con calma y empiezo a revisar los bolsillos y las pertenencias del prisionero en busca de cualquier documento o pista.\n\n{Investigación}", "dm": "Tus manos recorren la ropa áspera y húmeda del prisionero, palpando costuras y pliegues en busca de algún secreto oculto. Solo encuentras el tacto frío de la tela empapada y algunos restos de suciedad mezclados con salitre en los bolsillos vacíos. No hay papeles, ni sellos, ni ningún objeto que revele la identidad o el propósito del hombre.\n\nVardos arquea una ceja y deja escapar un bufido nasal mientras observa tus manos vacías. \"Parece que el silencio de este hombre se extiende incluso a sus bolsillos. No perdamos más tiempo aquí; el aire de esta celda empieza a saber a tumba\"."}, {"jugador": "\"Tarde o temprano, todos hablamos.\"\n\nMe aparto del prisionero y lo miro fijamente a los ojos, buscando cualquier señal de debilidad o miedo.\n\n{Perspicacia}", "dm": "El prisionero no aparta la mirada, aunque sus pupilas están dilatadas y sus párpados tiemblan levemente. Sus ojos, inyectados en sangre y rodeados de ojeras profundas, reflejan una mezcla de agotamiento extremo y una resignación gélida; no hay el pánico errático de quien teme la muerte, sino la mirada vacía de quien ya ha aceptado un destino inevitable.\n\nVardos suelta una risa seca que resuena en las paredes húmedas, cruzando los brazos sobre el pecho. \"La voluntad es un músculo que se fatiga, pero algunos nacen con fibras de hierro. No te engañes, el hambre y la oscuridad hacen el trabajo sucio, pero el orgullo... el orgullo puede sostener a un hombre mucho más tiempo que el estómago\"."}, {"jugador": "\"El orgullo es una venda que oculta la verdad, y la verdad es lo único que importa.\"\n\nMe acerco al prisionero, ignorando a Vardos, y lo observo fijamente a los ojos para detectar cualquier signo de engaño o debilidad.\n\n{Perspicacia}", "dm": "Te inclinas sobre el prisionero, buscando en sus pupilas el rastro de una mentira o el quiebre de su voluntad. Sin embargo, la cercanía y la intensidad de tu mirada provocan una reacción imprevista: el hombre, en un espasmo de agotamiento y reflejo, suelta un jadeo brusco y cierra los ojos con fuerza, encogiéndose violentamente contra la pared. El movimiento es tan errático que pierdes por completo la compostura del momento, quedando tú mismo descolocado ante una reacción que interpretas erróneamente como un signo de terror absoluto, cuando no es más que un colapso físico.\n\nVardos deja escapar un bufido despectivo, desdoblando los brazos mientras observa la escena con una ceja alzada. \"Cuidado con lo que buscas en los ojos de un muerto en vida; podrías terminar viendo reflejado tu propio error\"."}, {"jugador": "\"Tus palabras no ocultan tu arrogancia, Vardos, ni cambian la realidad de este hombre.\"\n\nMe enderezo lentamente y vuelvo a observar al prisionero para evaluar su estado físico real.\n\n{Medicina}", "dm": "Te enderezas con parsimonia, apartando la mirada del capitán para centrarte de nuevo en la figura encogida contra el muro. Al analizar la respiración superficial del hombre y la palidez cenicienta de su piel, notas que sus músculos tiemblan sin control y que el sudor frío le empapa la nuca. No hay una herida abierta evidente, pero su cuerpo parece haber llegado al límite absoluto de su resistencia.\n\nVardos suelta una risa seca, un sonido carente de humor que resuena en las paredes húmedas de la celda. \"Llama a eso arrogancia si te hace sentir más cómodo con tu falta de tacto. El hombre está vacío, simplemente vacío\"."}]}}, {"id": "u987825", "piloto": false, "lore": "# Villa Pilfera\n\n## La ciudad y el museo\n\nVilla Pilfera es famosa por dos cosas: la mejor escuela de cerrajería del reino y el Museo de Cosas Robadas, una institución única donde se exhiben, con cartelito y todo, los objetos recuperados por la Vigilancia a lo largo de doscientos años, a la espera de que alguien los reclame. Nadie ha reclamado casi nada. En las vitrinas hay una espada sin filo, tres coronas de cartón, la dentadura postiza de un rey y, en la sala principal, bajo una campana de cristal y con dos guardias de turno, la pieza estrella: la Diadema de la Reina Perdida.\n\nSe dice que vale lo que cuesta una ciudad. Se dice también que todo el que ha intentado robarla ha terminado en la sala de al lado, exhibido como «Ladrón de Diademas, hacia 1140».\n\n## Lo que salió mal\n\nDentro de nueve días arranca la Feria de las Cerraduras, la semana en que Villa Pilfera se llena de cerrajeros, curiosos y, según la Vigilancia, de todo el hampa del reino disfrazada de cerrajero. El museo abre sus puertas al público las veinticuatro horas. Y la Cuadrilla del Gato Cojo, la última banda de ladrones profesionales de la villa, ha anunciado, por vía oficial y con anticipación de cortesía, que esa semana se llevará la Diadema.\n\nLa Vigilancia, por su parte, ha anunciado que la estará esperando.\n\n## Robarla o atraparla\n\n**Marga Zancada**, cabecilla de la Cuadrilla del Gato Cojo, sostiene que la Diadema no es del museo: la sacaron de un pueblo que la lleva doscientos años reclamando, y un museo que exhibe lo robado sin devolverlo es un ladrón con permiso municipal. Se la va a llevar, con elegancia, y la va a devolver. Lo dice con una sonrisa que sugiere que ya tiene el plan y que el plan tiene detalles bonitos.\n\n**Ubaldo Cerrojo**, capitán de la Vigilancia, sostiene que el museo es la memoria de la ciudad: si cada uno se lleva lo que cree suyo, el edificio es un almacén, y los ladrones bien intencionados son los más peligrosos porque no se detienen. Lo dice con el pecho hacia delante, con veinte años de servicio sin un solo robo con éxito y ganas de que sean veintiuno.\n\nNinguno de los dos quiere hacer daño a nadie. Los dos quieren, por encima de todo, ganar.\n\n## La sala de las réplicas\n\nBajo el museo, tras una puerta que solo se abre con una llave que nadie ha visto usar, hay un taller de réplicas donde se hacen las copias para las vitrinas «de peligro». En la Feria de las Cerraduras el taller estará cerrado, como siempre. Casi nadie se pregunta por qué un museo tan seguro necesita un taller tan grande.\n\n## Gente de la villa\n\n**Marga Zancada**, cabecilla de la Cuadrilla del Gato Cojo, defiende robar la Diadema para devolverla. **Ubaldo Cerrojo**, capitán de la Vigilancia, defiende atrapar a los ladrones y proteger el museo. **Fermín Llavín**, que vende llaves en un puesto ambulante de la plaza, es -por ahora- solo el hombre que sabe quién compra qué cerradura; ver «personas_par24.json» para el perfil completo de los tres.\n\n## Tono de la campaña\n\n`world_tone`: **`light`**, registro **`comedic`**. Comedia de atraco: planes con demasiados pasos, ladrones con oficio y vergüenza profesional, vigilantes demasiado listos para su propio bien y una ciudad que se toma el robo como deporte nacional. El humor sale de los planes que salen mal de formas creativas y de personajes muy competentes en cosas absurdas; nadie sale herido de verdad. Estructura sin precedente en el corpus: **un golpe anunciado con dos equipos que planean a la vez** y una pieza cuyo valor real nadie ha comprobado; distinto de la sátira institucional (Par 18) y de la negociación (Par 20) porque aquí manda la acción, la improvisación y el plan.\n", "A": {"previo": "El intento de desaparecer en las sombras es torpe y apresurado. Al soltar a Fermín, el cuerpo del hombre impacta contra el suelo metálico con un estruendo seco que resuena en todo el pasillo técnico, mientras que el movimiento para buscar refugio resulta insuficiente; el metal oxidado chirría bajo los pies y el vapor denso, lejos de ocultar la silueta, parece remarcar el contorno de quien intenta esconderse detrás de las tuberías.\n\nEl ruido ensordecedor de las turbinas no logra camuflar la torpeza del momento. Desde la entrada del corredor, los haces de luz de las linternas cortan la bruma blanca, moviéndose con precisión mecánica y acercándose rápidamente hacia el rincón donde el refugio ha resultado ser una ilusión.\n\nLa guardia ya ha localizado la posición exacta gracias al ruido del impacto y el movimiento errático; el cerco se cierra y no queda espacio para una segunda retirada.", "turnos": [{"jugador": "\"Vaya, parece que no ha sido el aterrizaje más elegante, ¿verdad, Fermín?\"\n\nMe pongo de pie rápidamente y levanto las manos en señal de paz, esbozando mi sonrisa más encantadora mientras miro hacia las luces.\n\n{Persuasión}", "dm": "El intento de encandilar a los guardias con una sonrisa y un gesto conciliador choca contra un muro de indiferencia profesional. Las luces de las linternas no vacilan ni un milímetro, iluminando con crudeza el pasillo técnico, donde el vapor blanco sigue goteando desde las tuberías oxidadas y el metal húmedo refleja la luz en ángulos cegadores.\n\nFermín, aún tendido en el suelo, se limita a observar la escena con una mirada de absoluta decepción, sin articular palabra mientras el cerco se cierra. Los guardias no responden al encanto ni a la cortesía; avanzan en un silencio coordinado, con el peso de sus botas resonando contra el suelo metálico, ignorando por completo la tentativa de diplomacia.\n\nLos guardias están a pocos pasos; si no hay un cambio drástico de táctica o una distracción inmediata, el arresto es inevitable."}, {"jugador": "\"Vaya, parece que hoy no os habéis levantado de buen humor.\"\n\nDoy un paso rápido hacia atrás, buscando el hueco más oscuro entre las tuberías para desaparecer de su vista.\n\n{Sigilo}", "dm": "El intento de fundirse con las sombras resulta torpe; el metal oxidado del pasillo técnico traiciona cada movimiento y el eco de las botas resuena contra las paredes estrechas, donde el vapor que gotea de las tuberías solo sirve para delatar la posición. No hay rincón lo suficientemente oscuro para ocultar un paso tan precipitado.\n\nDesde el suelo, Fermín Llavín suelta un suspiro de resignación y, sin hacer el más mínimo esfuerzo por
