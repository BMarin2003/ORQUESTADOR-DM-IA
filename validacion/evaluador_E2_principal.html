to.", "turnos": [{"jugador": "\"Que el cielo reciba lo que queda de esta aberración y limpie este lugar.\"\n\nLimpio mi arma en un trozo de tela y me acerco al charco de moco para examinar los restos en busca de cualquier objeto o rastro que la criatura pudiera haber absorbido.\n\n{Investigación}", "dm": "Te inclinas sobre la masa viscosa, que comienza a burbujear y a reducirse mientras el aire recupera su frescura. Al apartar con cuidado las capas de moco translúcido, encuentras que la criatura no solo absorbía materia orgánica, sino que retenía objetos que no pudo digerir completamente. En el centro del charco, donde el núcleo estalló, brilla un pequeño objeto metálico.\n\nEs un anillo de plata con una piedra de color ámbar que parece contener una gota de líquido en movimiento. Al rescatarlo de la mucosidad, notas que el metal está ligeramente grabado con unas runas que, aunque desgastadas, sugieren un origen antiguo y noble. No hay más rastros; el resto de la aberración se ha evaporado, dejando solo el anillo y una mancha blanquecina y seca sobre el pavimento."}, {"jugador": "\"Que los dioses guíen al dueño de esta pieza hacia su hogar.\"\n\nLimpio el anillo con cuidado y lo recojo, examinando las runas para intentar reconocer el linaje o la casa a la que pertenecen.\n\n{Historia}", "dm": "Pasas el dedo sobre las incisiones del metal, tratando de encontrar un patrón familiar en las curvas y ángulos de las runas. Sin embargo, el desgaste del tiempo y la corrosión de los fluidos de la criatura han borrado los trazos más definitorios. Las marcas resultan ambiguas, recordándote vagamente a algunos estilos decorativos de regiones lejanas, pero no logras vincularlas con ninguna casa noble conocida ni con un linaje específico de los anales históricos.\n\nEl anillo permanece frío en tu mano, y la gota de líquido ámbar sigue oscilando en el interior de la piedra, ajena a tu incertidumbre. Solo queda el silencio del lugar y la mancha blanquecina en el suelo como testigo de la batalla."}, {"jugador": "\"No me conoces, pero no dejaré que este lugar quede así.\"\n\nMe pongo en pie y comienzo a limpiar la mancha blanquecina del suelo con mi capa y cualquier trozo de tela que encuentre.\n\n{Atletismo}", "dm": "Te inclinas sobre el suelo, frotando la superficie con la tela de tu capa y algunos jirones que encuentras esparcidos. Sin embargo, el residuo blanquecino es viscoso y se adhiere con terquedad a las porosidades de la piedra. A pesar de tus esfuerzos, el material solo se extiende en una mancha más ancha y difuminada, dejando el tejido de tu prenda impregnado de una sustancia pegajosa y de olor acre que se resiste a desaparecer.\n\nEl silencio vuelve a llenar la estancia, interrumpido únicamente por el roce inútil de la tela contra el suelo frío. La mancha persiste, ahora más extendida, marcando el lugar donde la criatura exhaló su último aliento."}, {"jugador": "\"Qué suciedad tan persistente.\"\n\nMe pongo en pie y observo la mancha con detenimiento, tratando de identificar la naturaleza de esa sustancia.\n\n{Naturaleza}", "dm": "Te enderezas, dejando que la mirada recorra la viscosidad que ahora brilla bajo la luz tenue. El olor acre, similar al amoníaco mezclado con materia orgánica en descomposición, te resulta familiar. No es una secreción natural de ningún animal común; la densidad del fluido y la forma en que ha corroído ligeramente la superficie de la piedra sugieren una base ácida, típica de ciertas criaturas abisales o exudados alquímicos inestables.\n\nLa mancha burbujea débilmente, consumiendo los restos de tela que quedaron atrapados en ella. Es una sustancia diseñada para digerir materia orgánica rápidamente, lo que indica que la criatura no solo atacaba físicamente, sino que su propia fisiología estaba orientada a la descomposición acelerada de sus presas."}, {"jugador": "\"Que los cielos nos protejan de semejante aberración.\"\nMe acerco con cautela para examinar los bordes de la mancha y buscar cualquier rastro de la criatura que no haya sido digerido.\n{Investigación}", "dm": "Te inclinas sobre el fluido, manteniendo una distancia prudencial mientras tus ojos buscan cualquier irregularidad en el perímetro de la mancha. Sin embargo, la sustancia ha hecho su trabajo con una eficiencia aterradora; la corrosión ha sido tan uniforme y agresiva que ha borrado cualquier huella, gota errante o rastro de tejido que pudiera dar una pista sobre la morfología del atacante.\n\nSolo queda el vacío circular de la piedra devorada y el siseo persistente de las burbujas. No hay escamas, ni pelos, ni fragmentos de caparazón que hayan resistido el proceso digestivo; la mancha es un borrón limpio y letal que no deja testigoss."}, {"jugador": "\"Que los dioses nos protejan, esto no es un accidente natural.\"\n\nMe alejo de la mancha para evitar que el vapor dañe mi equipo y busco cualquier rastro de lucha o arrastre en el resto de la estancia.\n\n{Percepción}", "dm": "El aire de la estancia es pesado, cargado con el olor acre del ácido que aún burbujea en el suelo. Al retroceder, tus botas resuenan contra la piedra fría mientras desplazas la mirada hacia los rincones y las sombras de la habitación. El silencio es absoluto, roto únicamente por el siseo químico que parece burlarse de tu búsqueda.\n\nTus ojos recorren el perímetro y detectan algo: lejos del círculo de corrosión, donde el polvo se acumula en las juntas de los muros, hay un surco irregular y superficial. No es una huella clara, sino un rastro de arrastre, como si algo pesado hubiera sido desplazado apresuradamente hacia la salida, dejando una línea de piedra rayada y polvo removido que se pierde en la penumbra del pasillo."}, {"jugador": "\"Que los dioses nos guíen en este rastro.\"\n\nMe acerco al surco en la piedra para examinarlo más de cerca, tratando de comprender qué pudo haber causado semejante marca.\n\n{Investigación}", "dm": "Te inclinas sobre la marca, pero al acercar la vista, la irregularidad del surco se vuelve confusa. El polvo acumulado y la erosión natural de la piedra ocultan los detalles; no logras distinguir si la raya fue producida por el metal de un cofre, el cuero de un saco pesado o simplemente el desgaste accidental de algún equipo arrastrado hace tiempo.\n\nEl rastro sigue allí, guiando la mirada hacia el pasillo, pero no consigues extraer ninguna pista concreta sobre la naturaleza del objeto o la fuerza que lo desplazó. Solo queda la certeza de que algo se movió en esa dirección."}, {"jugador": "\"Sea lo que sea que haya pasado por aquí, no dejaré que siga oculto.\"\n\nMe pongo en pie y sigo el rastro hacia el pasillo, manteniendo la guardia alta.\n\n{Percepción}", "dm": "Tus pasos resuenan huecos mientras avanzas por el pasillo, donde la luz se vuelve más escasa y el aire adquiere un aroma a piedra húmeda y moho antiguo. Con los sentidos alerta, notas que el rastro en el suelo se vuelve más nítido al alejarse de la entrada; el surco es ahora una línea continua que corta el polvo grisáceo, flanqueada por pequeñas motas de un material blanquecino, similar a la cal o a restos de yeso desprendido, que se han ido depositando a medida que el objeto avanzaba.\n\nAl final del corredor, donde el pasillo se abre hacia una estancia más amplia, percibes un cambio en la corriente de aire. Un sutil siseo, casi imperceptible, llega desde la oscuridad del frente, acompañado por el rítmico goteo de agua chocando contra una superficie metálica. El rastro termina abruptamente justo antes de que la penumbra total devore el suelo."}]}, "B": {"previo": "Los dedos se deslizan con precisión milimétrica entre el cuero y la masa vibrante, logrando aflojar la tensión del nudo sin provocar el desgarro temido. El tejido cede lentamente, liberando la bota, mientras el vapor continúa ocultando los límites de la sala y el aceite denso y oscuro gotea desde las tuberías del estrecho pasillo industrial, manchando el suelo metálico.\n\nLa entidad orgánica observa el punto de contacto con una fijeza casi quirúrgica, sin mover un solo músculo del rostro. \"El gesto es correcto, pero el tiempo se ha agotado. El tejido ya no reconoce la calma, solo el miedo\", sentencia con una neutralidad gélida.\n\nLa criatura, ahora libre pero sumida en un estado de pánico absoluto, comienza a emitir un chirrido agudo que resuena en las tuberías, alertando a cualquier otra entidad orgánica que se encuentre en los niveles inferiores del pasillo.", "turnos": [{"jugador": "\"Tranquilo, ya estás a salvo. No permitiremos que te hagan daño.\"\n\nMe interpongo entre la entidad y el pasillo, posicionándome para protegerla mientras observo los alrededores en busca de cualquier amenaza que se acerque.\n\n{Percepción}", "dm": "El pasillo industrial se cierra sobre la escena, claustrofóbico y saturado de un vapor espeso que transporta el olor acre del aceite negro. Las gotas densas golpean las rejillas metálicas con un ritmo hipnótico, mientras el suelo vibra bajo los pies, transmitiendo un chirrido lejano que parece reptar por las paredes.\n\nLa entidad orgánica no se mueve, manteniendo la mirada fija en la profundidad del corredor, ignorando la presencia protectora que se ha interpuesto en su camino. Con una postura estática y una voz desprovista de cualquier matiz emocional, sentencia: \"Tus palabras son un bálsamo que el cuerpo no sabe procesar. El ruido ya ha viajado por el metal; la seguridad es ahora una ilusión coordinada\".\n\nEl eco del chirrido ha sido captado por los conductos de ventilación; los pasos rítmicos y pesados de los perseguidores comienzan a resonar desde ambos extremos del pasillo, cerrando el cerco."}, {"jugador": "\"No permitáis que el miedo os ciegue. Mantente detrás de mí.\"\n\nMe coloco en posición defensiva, protegiendo a la entidad y observando ambos extremos del pasillo.\n\n{Percepción}", "dm": "El intento de asegurar el perímetro fracasa; el ruido metálico que rebota en las paredes y el vapor espeso que emana de las tuberías sudorosas crean una desorientación acústica total, dejando los extremos del pasillo sumergidos en una incertidumbre ciega. El acero oxidado parece vibrar con una frecuencia hostil, borrando cualquier rastro sonoro que permita anticipar la amenaza.\n\nLa entidad orgánica permanece inmóvil, casi fundiéndose con la estática del entorno, sin apartar la mirada del pasillo. Con una voz plana, como una grabación sin alma, sentencia: \"El miedo es una frecuencia que ya no reconozco. No me proteges de lo que viene, solo te interpones entre mi vista y la geometría de nuestra caída\".\n\nLa falta de visibilidad y el caos acústico impiden detectar la posición exacta de los perseguidores, que ahora avanzan aprovechando la cobertura del vapor para flanquear la posición defensiva."}, {"jugador": "\"No me mueve el miedo, sino el deber de protegerte y descubrir qué es este lugar.\"\n\nMe planto firmemente frente a la entidad, desenvainando mi arma y alzando el escudo para cubrirla.\n{Percepción}", "dm": "El escudo se alza con firmeza, creando una barrera de metal que corta la corriente de vapor y ofrece un refugio sólido frente a la incertidumbre del pasillo. A través de la bruma, el oído logra filtrar el ruido industrial y detecta un patrón: el eco rítmico de pasos metálicos que se aproximan desde el extremo opuesto, revelando la posición de la amenaza antes de que emerja de la blancura.\n\nLa entidad orgánica no se mueve ni un centímetro para refugiarse tras la protección; permanece erguida, con los ojos fijos en la bruma, ignorando el gesto protector. Con una calma gélida, sentencia: \"Tu deber es un ancla que solo sirve para hundirte más rápido. Pero si insistes en ser el muro, hazlo. Yo seguiré mirando el vacío\".\n\nEl enemigo ha sido localizado, pero el espacio reducido del pasillo industrial impide maniobrar; cualquier movimiento brusco para cambiar la formación dejará un flanco expuesto al ataque inminente."}, {"jugador": "\"No me hundiré mientras haya alguien que proteger. ¡Mantente detrás de mí!\"\n\nMe planto firmemente en el pasillo, manteniendo el escudo en alto para bloquear el avance de lo que sea que se acerque.\n\n{Percepción}", "dm": "El escudo se ancla con fuerza contra el suelo metálico, cerrando el paso en el pasillo industrial. Entre el siseo constante de las tuberías y el vapor blanco que satura el aire, el metal oxidado de las paredes parece cerrarse sobre la posición, limitando cualquier maniobra. A través de la bruma espesa, el eco rítmico de los pasos metálicos se vuelve más nítido y pesado, confirmando que la amenaza está ya a pocos metros, aunque sigue oculta por la blancura.\n\nLa entidad orgánica permanece inmóvil, fuera del perímetro del escudo, sin apartar la vista de la bruma. Con una voz monocorde que no denota ni miedo ni gratitud, sentencia: \"Protege lo que quieras, Ilvard. Pero no confundas tu terquedad con seguridad; el vacío no distingue entre muros y los que se esconden tras ellos\".\n\nEl enemigo está a punto de emerger del vapor; el espacio es tan estrecho que cualquier intento de retroceder o reorganizarse ahora provocará un choque contra las paredes, dejando el flanco desprotegido durante el impacto."}, {"jugador": "\"No me escondo, sino que sostengo la línea.\"\n\nMe planto firmemente detrás del escudo, apretando el agarre y preparando el arma para el impacto.\n\n{Percepción}", "dm": "El esfuerzo por anticipar la llegada del enemigo fracasa; la bruma blanca sigue siendo un muro impenetrable que oculta el momento exacto del ataque, dejando la posición en un estado de tensa e incierta espera. En el pasillo industrial, el vapor sisea con violencia entre las tuberías y el espacio se siente asfixiante, con el escudo bloqueando casi por completo el tránsito sobre el metal oxidado.\n\nLa entidad orgánica no se mueve ni un centímetro, manteniendo la mirada fija en la blancura mientras el ruido metálico se vuelve ensordecedor. Con una voz plana y desprovista de emoción, sentencia: \"Sosténla, entonces. Que el impacto sea el único lenguaje que necesites entender hoy.\"\n\nLa falta de aviso visual significa que el impacto será total y sorpresivo; si el escudo no resiste el primer golpe, la inercia empujará al grupo contra las tuberías hirvientes del pasillo."}, {"jugador": "\"¡No temáis! ¡Yo os sostendré!\"\n\nApreto el agarre de mi escudo, planto los pies con fuerza sobre el metal y me preparo para recibir el choque.\n\n{Atletismo}", "dm": "El metal oxidado del pasillo cede ligeramente bajo la presión de los pies, pero la estabilidad es insuficiente. El cuerpo no logra anclarse con la firmeza necesaria contra la corriente de vapor hirviente que sisea en las paredes, dejando el centro de gravedad vulnerable justo cuando el espacio, reducido a un embudo asfixiante por el ancho del escudo, se llena de una tensión insoportable.\n\nLa entidad orgánica no se inmuta, manteniendo la vista clavada en la blancura impenetrable de la bruma. Sin apartar la mirada, su voz suena plana, desprovista de cualquier rastro de emoción: \"Entonces sosténlo. Que el impacto sea el único lenguaje que necesites entender hoy.\"\n\nLa falta de anclaje sólido significa que el primer impacto no será absorbido; el golpe desplazará al grupo violentamente hacia atrás, arrojándolos contra las tuberías al rojo vivo del corredor."}, {"jugador": "\"¡Sosteneos fuerte!\"\n\nAprieto los dientes y planto los pies con todas mis fuerzas, intentando absorber el impacto con mi propio cuerpo para evitar que retrocedamos más.\n\n{Atletismo}", "dm": "El cuerpo se tensa, los músculos se anclan al suelo de metal oxidado y los pies encuentran el agarre justo en el instante en que el choque sacude la estructura. El impacto es brutal, una onda expansiva que hace vibrar las tuberías anaranjadas y satura el pasillo industrial de un vapor blanco y cegador, pero la resistencia prevalece; el retroceso se detiene en seco, absorbiendo la violencia del golpe sin ceder un centímetro.\n\nEn medio de esa corriente hirviente, la entidad orgánica permanece inmóvil, como una roca imperturbable frente al caos. Sin moverse ni un milímetro, su voz gélida y cortante atraviesa el siseo del vapor: \"No te desmorones ahora. Mantén la línea.\"\n\nEl impacto ha sido contenido, pero la estructura del pasillo ha quedado comprometida; el vapor comienza a filtrarse por grietas nuevas en el techo y la temperatura del corredor sigue subiendo peligrosamente."}, {"jugador": "\"No me desmoronaré. Mi voluntad es más fuerte que este metal.\"\n\nAprieto los dientes y mantengo la posición, resistiendo la presión mientras busco una forma de estabilizar el entorno.\n\n{Atletismo}", "dm": "El vaho blanco se vuelve más denso, envolviendo el pasillo de metal oxidado en una bruma cegadora mientras el calor opresivo comienza a calar en la piel. A pesar de la presión asfixiante y el siseo constante de las tuberías anaranjadas que parecen a punto de estallar, el cuerpo se mantiene firme, anclado al suelo con una tenacidad que vence la inercia del colapso.\n\nLa entidad orgánica no se inmuta ante la declaración, manteniendo sus músculos tensos y una neutralidad quirúrgica que contrasta con el estruendo del entorno. Sin pestañear ante el vapor que los rodea, sentencia con una voz que no sube de volumen: \"Entonces demuéstralo. No con palabras, sino con el peso de tu cuerpo contra este acero.\"\n\nEl calor en el pasillo industrial es ahora insoportable y el vapor reduce la visibilidad a pocos centímetros; si no se estabiliza la zona o se avanza, el agotamiento térmico empezará a mermar la resistencia física."}]}}, {"id": "ub3495d", "piloto": false, "lore": "# La Vía del Último Silencio\n\n## La procesión\n\nHace setenta días, en el monasterio de la costa, murió Odilia de la Roca, la Sanadora, a quien el reino venera como santa desde hace cuarenta años. Cumpliendo su última voluntad, o lo que la Cofradía de Portadores entiende que fue su última voluntad, su féretro debe recorrer a pie la Vía del Último Silencio: trescientas leguas de camino de montaña, atravesando quince aldeas, hasta el monasterio de Alba Sorda, en lo alto de la sierra, donde debe depositarse en la noche del solsticio de invierno, al abrigo de las primeras luces del año.\n\nLa Vía no se hace con cantos ni con música. Se hace en silencio: quien acompaña al féretro no habla mientras camina, no come a la vista de los demás y no se detiene a menos que el Cofrade Mayor lo ordene. Tal es la regla de la procesión desde hace tres siglos.\n\n## Lo que salió mal\n\nLa procesión lleva sesenta días de camino y lleva diez de retraso. Delante queda el Paso del Lobo, la única garganta por la que se cruza la sierra, que la primera nieve cierra hasta la primavera. Faltan cuarenta días para el solsticio. El plazo es justo. No hay margen para nada.\n\nHace tres jornadas, un mensajero de la aldea de Berrocal, dos leguas más adelante, trajo la noticia de que hay fiebre en el pueblo. Setenta enfermos. No hay médico. Los aldeanos han salido a esperar en el camino, en silencio, con los suyos en brazos.\n\n## Seguir o detenerse\n\n**Anselmo Vela**, Cofrade Mayor, sostiene que la procesión no se detiene: la regla es la regla desde hace trescientos años y no se rompe por urgencia, ni por dolor, ni por compasión. Si el féretro llega tarde al monasterio, la ofrenda pierde su sentido y todo el camino se habrá hecho en vano. Lo dice sin levantar la voz, con la mirada fija en el frente, como quien sostiene una carga que no puede soltar.\n\n**Madre Odalys Brena**, superiora de las Hospitalarias de Odilia que acompañan la procesión, sostiene que la procesión debe detenerse en Berrocal: la Santa pasó su vida cuidando enfermos, y pasar de largo ante setenta personas para honrarla es traicionar lo único que ella enseñó. Lo dice con las manos abiertas y el hábito manchado de polvo de camino, sin apartar los ojos de los aldeanos que esperan.\n\nNinguno duda de la fe del otro. Los dos saben que la decisión no puede tomarse a la ligera y que no admite ser tomada dos veces.\n\n## El peso del féretro\n\nLos portadores comentan, entre ellos y con la boca casi cerrada, que el féretro pesa menos de lo que debería. Nadie lo ha dicho en voz alta. El féretro va sellado desde la partida y solo el Cofrade Mayor conoce la llave.\n\n## Gente de la procesión\n\n**Anselmo Vela**, Cofrade Mayor, defiende no detener la procesión. **Madre Odalys Brena**, superiora de las Hospitalarias, defiende detenerla en Berrocal. **Tibaldo Sierra**, joven portador de diecisiete años, es -por ahora- solo el muchacho que carga la varilla izquierda del féretro y que ve más de lo que dice; ver «personas_par27.json» para el perfil completo de los tres.\n\n## Tono de la campaña\n\n`world_tone`: **`heroic`**, registro **`serious`**. Solemnidad absoluta: sin ironía, sin humor y sin prisa, con el peso del silencio, del duelo y del deber a cuestas. Las escenas se cuentan con gravedad y contención, con espacio para lo sagrado, lo humano y lo que no se dice. Nadie es un villano: todos los que caminan lo hacen por una razón que respetan. Estructura sin precedente en el corpus: **una peregrinación con votos, plazo y una regla que choca con la compasión**, distinta de las disputas comunitarias y de los procesos judiciales de otros pares porque aquí el conflicto es entre dos formas de honrar lo mismo, y el camino continúa mientras se decide.\n", "A": {"previo": "Tus botas se hunden en el limo grisáceo, que emite un sonido succionador y viscoso a cada paso. Al intentar sujetar el tablón de roble, el peso de tu cuerpo desplaza la carreta podrida; la madera, debilitada por décadas de humedad, cede con un crujido seco y sordo.\n\nEl tablón se desliza bruscamente hacia el fondo del foso antes de que puedas asegurar el agarre, perdiéndose en la oscuridad del abismo con un golpe distante y ahogado. El eje de la carreta se rompe definitivamente, dejando la estructura aún más hundida en el lodo.", "turnos": [{"jugador": "\"Maldita sea...\"\n\nMe aparto rápidamente de la carreta para evitar que me arrastre abajo y trato de buscar algún otro punto de apoyo sólido en el borde del foso.\n\n{Percepción}", "dm": "El limo se desliza bajo tus pies mientras retrocedes, dejando un rastro de burbujas aceitosas que estallan con un olor a azufre y materia orgánica en descomposición. Al escanear el perímetro del foso, tus ojos captan un contraste entre la grisalla del barro y el brillo opaco de una piedra tallada que asoma a unos tres metros a tu derecha. Se trata de una cornisa de granito, parcialmente cubierta por musgo negro, que parece formar parte de una estructura antigua y sumergida.\n\nMás allá de la cornisa, el terreno se eleva ligeramente, revelando una franja de tierra más compacta y seca donde crecen unos juncos pálidos y rígidos. Es el único punto en el borde inmediato que no parece dispuesto a tragarse cualquier cosa que ose apoyarse en él."}, {"jugador": "\"Maldito lugar...\"\n\nIntento alcanzar la cornisa de granito para salir del foso.\n\n{Atletismo}", "dm": "Tus músculos se tensan y te impulsas con fuerza, venciendo la resistencia viscosa del limo que intenta anclarte al fondo. En un movimiento fluido y potente, atraviesas la distancia, tus dedos se clavan en las grietas del granito y el impulso te saca del foso con una eficacia rotunda.\n\nEl musgo negro se desprende en jirones bajo tu peso mientras te izas hacia la franja de tierra seca. Los juncos pálidos se doblan y crujen a tu alrededor, pero el suelo aquí es firme, dejándote finalmente fuera del alcance del barro aceitoso."}, {"jugador": "\"Maldito lugar...\"\n\nMe pongo en pie y me sacudo el limo de la ropa y la armadura con gestos bruscos. Miro a mi alrededor para orientarme y buscar cualquier rastro de quien me haya tendido esta trampa.\n\n{Percepción}", "dm": "El aire es pesado, cargado de un olor a descomposición y salitre que se pega a la garganta. Al levantar la vista, el paisaje se despliega en una llanura de ceniza y juncos marchitos, bajo un cielo plomizo que no deja filtrar la luz del sol. A unos veinte pasos de donde has emergido, el rastro es evidente: una huella profunda en el barro, donde el peso de alguien presionó el suelo justo antes de que cayeras, y una pequeña mancha de cera roja, aún fresca, que brilla contra la grisura del terreno.\n\nMás allá, el terreno comienza a elevarse en una serie de crestas rocosas que parecen costillas surgiendo de la tierra. Entre las grietas de la piedra, a unos cincuenta metros hacia el norte, se distingue una figura solitaria y rígida que observa el horizonte, dándote la espalda. Lleva una túnica pesada y sostiene un báculo de hierro que golpea rítmicamente el suelo, creando un sonido sordo que resuena en el silencio absoluto del páramo."}, {"jugador": "\"¿Quién eres y qué haces en este agujero?\"\n\nMe acerco a la figura con la mano en el pomo de mi espada, pero sin desenvainar, mientras observo la mancha de cera roja en el suelo.\n\n{Percepción}", "dm": "Tus pasos hunden el calzado en la ceniza mientras te acercas. Al fijar la vista en la mancha de cera roja, notas que no es un simple goteo accidental; la cera ha sido vertida deliberadamente para sellar un pequeño pergamino que ha quedado parcialmente enterrado en el barro, oculto bajo una capa de juncos secos. El rastro de presión en el suelo sugiere que quien lo dejó no caminaba, sino que cargaba un peso considerable sobre sus hombros, hundiéndose profundamente en la tierra antes de seguir hacia el norte.\n\nLa figura solitaria no se inmuta ante tu voz, aunque el rítmico golpeo del báculo de hierro cesa abruptamente. El hombre gira la cabeza lentamente, revelando un rostro curtido por el viento y unos ojos que parecen haber olvidado el color del sol. Te observa con una calma gélida, sin mostrar miedo ni curiosidad, mientras su mano se aprieta con firmeza alrededor del metal del báculo.\n\n—Soy quien vigila que lo que ha bajado no intente subir —responde con una voz rasposa, como piedra rozando piedra—. Y tú eres una interrupción inesperada en el silencio del Umbral."}, {"jugador": "\"No busco interrumpir, sino respuestas.\"\n\nMe agacho para recoger el pergamino sellado con cera roja antes de volver a mirar al hombre.\n\n{Percepción}", "dm": "Tus dedos rozan la cera fría y el pergamino húmedo mientras te incorporas. Al levantar la vista, el Guardián del Umbral permanece inmóvil, como una estatua de carne y cuero tallada por el frío. El viento silba entre los juncos, arrastrando un olor a salitre y descomposición antigua que parece emanar del suelo mismo.\n\nEl hombre no se mueve ni un centímetro, pero sus ojos recorren el pergamino que ahora sostienes con una intensidad gélida. Sus nudillos, blancos por la presión sobre el báculo, delatan que, aunque sus palabras sean calmadas, su cuerpo está listo para reaccionar ante cualquier gesto brusco.\n\n—Las respuestas en este lugar suelen tener un precio que pocos están dispuestos a pagar —sentencia, y el sonido de su voz parece hacer vibrar el aire pesado del camino."}, {"jugador": "\"No estoy acostumbrado a pagar por lo que ya es mío.\"\n\nSostengo el pergamino con firmeza y observo al Guardián, manteniendo mi posición.\n\n{Perspicacia}", "dm": "El Guardián no parpadea, pero una pequeña comisura de sus labios se contrae, casi imperceptiblemente. Sus ojos se clavan en los tuyos, evaluando la firmeza de tu agarre y la seguridad de tu tono. El silencio se prolonga, interrumpido solo por el chasquido rítmico del viento contra su báculo, mientras el aire parece espesarse alrededor de ambos.\n\nNotas que, a pesar de su postura imperturbable, el Guardián no busca el conflicto; su rigidez no es la de un agresor, sino la de alguien que cumple una función sagrada y burocrática. Sus ojos no miran el pergamino con codicia, sino con una cautela profesional, como quien vigila que un sello no se rompa antes de tiempo. Hay una resignación cansada en su mirada, la de quien ha visto a muchos otros intentar reclamar lo que creen suyo sin comprender la naturaleza de la deuda."}, {"jugador": "\"No me interesa vuestra burocracia ni vuestras resignaciones. Solo quiero lo que es mío por derecho.\"\n\nSostengo la mirada del Guardián sin relajar la tensión de mis hombros.\n\n{Intimidación}", "dm": "El Guardián no retrocede ni se inmuta; al contrario, el leve tic de su labio desaparece para dar paso a una expresión de gélida indiferencia. Tu intento de imponer autoridad cae en el vacío, resultando no solo ineficaz, sino patético ante la magnitud de su estoicismo. El silencio que sigue es pesado, cargado de un juicio mudo que hace que tu postura, antes firme, se sienta ahora forzada y fuera de lugar.\n\nLentamente, el Guardián aparta la mirada de tus ojos y vuelve a fijarla en el pergamino, ignorando tu presencia como si hubieras dejado de existir. Con un movimiento seco y mecánico, levanta su báculo y golpea el suelo una sola vez, produciendo un sonido sordo que resuena en el aire espesado, marcando el fin de la audiencia."}, {"jugador": "\"No he terminado de hablar.\"\n\nMe mantengo en mi sitio, bloqueando el camino hacia la salida mientras observo el báculo y el pergamino.\n\n{Intimidación}", "dm": "El Guardián ni siquiera levanta la vista del pergamino, pero el báculo que sostiene se desplaza unos centímetros, creando una barrera física y simbólica entre ambos. Sus dedos, pálidos y rígidos como la piedra, aprietan la madera con una fuerza imperturbable. El aire a su alrededor parece enfriarse, volviéndose denso y opresivo, mientras su silencio se transforma en un muro infranqueable que anula cualquier rastro de amenaza.\n\n—La audiencia ha concluido —sentencia con una voz que carece de inflexión, fría como el mármol de una cripta—. Retírate, o el silencio que ahora guardo se convertirá en el único sonido que escuches en este lugar."}]}, "B": {"previo": "El giro es torpe y desesperado. El pie resbala en la superficie viscosa del páramo, donde el lodo ceniciento y la bruma espesa convierten el suelo en una trampa traicionera que huele a metal y humedad fría. El cuerpo cede ante la gravedad y el impacto, aterrizando con un golpe sordo y húmedo que expulsa el aire de los pulmones mientras el barro gris se filtra por cada costura de la ropa.\n\nAnselmo Vela no se mueve para ayudar; permanece allí, firme como un ancla en medio de la niebla, observando la caída con una calma gélida. Con una voz seca y pesada, sentencia: \"El lodo no perdona la torpeza. Levántate.\".\n\nQuedar tendido en este terreno es una sentencia. Mientras intentas recuperar el aliento y luchar contra la succión del lodo, el enemigo que te derribó tiene la ventaja posicional para asestar un segundo golpe antes de que puedas ponerte en pie.", "turnos": [{"jugador": "\"Maldito lodo...\"\n\nGruño mientras intento apoyar las manos en el suelo viscoso para impulsarme y ponerme de pie rápidamente.\n\n{Atletismo}", "dm": "Las manos se hunden profundamente en la masa viscosa del páramo, que succiona la piel con una fuerza fría y metálica. El esfuerzo por impulsarse resulta inútil; el lodo ceniciento no ofrece resistencia, sino que se desliza bajo los dedos, transformando cada intento de levantarse en un forcejeo torpe contra la gravedad y el barro que ya empapa la ropa.\n\nAnselmo Vela permanece inmóvil, manteniendo la distancia reglamentaria con el féretro mientras vigila el horizonte con la mirada fija. Sin dedicar un solo gesto a ayudar, su voz grave y monocorde corta la bruma: \"Menos quejas y más fuerza. No permitas que el barro sea quien decida dónde te quedas.\".\n\nLa inmovilidad en este suelo es peligrosa. Cada segundo que pasas luchando contra el lodo es una oportunidad para que cualquier amenaza oculta en la bruma se acerque sin ser detectada."}, {"jugador": "\"¡Tú no me digas dónde me quedo, Vela!\"\n\nGruño y trato de clavar los dedos en cualquier resto de roca o raíz que haya bajo la capa de lodo para impulsarme hacia fuera.\n\n{Atletismo}", "dm": "Tus dedos arañan la viscosidad del suelo, buscando desesperadamente un punto de apoyo, pero solo encuentran más lodo y fragmentos de roca pulida que se deshacen al tacto. El esfuerzo es estéril; el páramo parece succionar tu voluntad mientras te hundes un poco más, atrapado en una masa fría que se niega a ceder ante tu rabia.\n\nAnselmo Vela no se mueve ni un centímetro para ayudar; mantiene la espalda recta y la mirada perdida en el horizonte, con una calma gélida y severa. Sin siquiera girar la cabeza hacia ti, sentencia con voz cortante: \"El barro no escucha jerarquías, solo acepta el peso de quien no lucha. Levántate.\".\n\nEl hundimiento es progresivo. Si no logras encontrar un anclaje sólido o cambiar de estrategia, el lodo te inmovilizará por completo, dejándote expuesto y vulnerable ante cualquier cosa que aceche en la bruma."}, {"jugador": "\"¡Cierra la boca y dame la mano, maldito arrogante!\"\n\nDejo de luchar contra el lodo para no hundirme más y trato de alcanzar la bota o la capa de Anselmo con un movimiento rápido.\n\n{Atletismo}", "dm": "El movimiento rápido es un error; el lodo grisáceo y viscoso reacciona al impulso succionando tu brazo con una fuerza bruta, anclándote más profundamente en el páramo. Tus dedos rozan la tela de la capa de Anselmo, pero el agarre es insuficiente y la prenda se desliza entre tus manos, dejándote solo con la sensación del tejido húmedo y la frustración del fallo.\n\nAnselmo Vela permanece imperturbable, como una estatua de sal en medio de la bruma densa que borra el horizonte. No extiende la mano ni altera su postura; se limita a observar el espacio vacío frente a él, ignorando el ruego y el insulto mientras el terreno continúa reclamando tu peso bajo los fragmentos de roca pulida.\n\nEl lodo ha ganado terreno. Estás más hundido que hace un momento y cualquier intento fallido adicional te dejará completamente inmovilizado, convirtiéndote en una presa estática para lo que sea que se oculte en la niebla."}, {"jugador": "\"¡Maldita sea, ayúdame!\"\n\nDejo de luchar contra el lodo para no hundirme más y busco desesperadamente cualquier saliente de roca o resto sólido a mi alrededor donde apoyar el peso.\n\n{Percepción}", "dm": "El pánico cede ante una calma forzada y, al dejar de luchar, la succión del fango se estabiliza. Los dedos tantean el vacío viscoso hasta que chocan con la aspereza de una placa de esquisto, un fragmento de roca sólida que emerge del lodo como un ancla. El apoyo es firme y permite redistribuir el peso, rompiendo la presión del páramo y otorgando la estabilidad necesaria para no ser engullido por el gris.\n\nAnselmo Vela no se mueve ni un centímetro de su posición, manteniendo la vista fija en el horizonte donde debería estar el camino. Con una voz grave y pausada, sentencia: \"No luches contra la tierra. Escucha el silencio y busca donde el suelo sea firme.\"\n\nLa estabilidad es temporal; el terreno sigue siendo traicionero y cualquier paso en falso hacia adelante podría devolverte al abrazo del lodo."}, {"jugador": "\"Tengo el apoyo, pero no pienso confiar en este suelo.\"\n\nSujeto con fuerza la placa de roca y busco con cuidado otro punto de apoyo sólido antes de intentar avanzar.\n\n{Percepción}", "dm": "La búsqueda meticulosa rinde frutos entre la viscosidad del páramo. Bajo la capa de lodo grisáceo, el terreno de esquisto fracturado emerge como costillas de piedra, revelando una serie de placas sólidas que forman un camino errático y resbaladizo. Al tacto, la roca es fría y afilada, ofreciendo los puntos de apoyo necesarios para avanzar sin quedar atrapado en los charcos que rodean la ruta.\n\nAnselmo Vela permanece inmóvil, con la espalda recta y la mirada perdida en la línea del horizonte, sin girar la cabeza. Su voz corta el silencio con una solemnidad imperturbable: \"Haga lo que juzgue prudente. Pero no olvide que el tiempo no se detiene a esperar que el suelo sea seguro.\"\n\nLa ruta de piedra es estrecha y fragmentada; cualquier desviación del camino marcado para ganar velocidad podría resultar en una caída inmediata al fango profundo."}, {"jugador": "\"No me apresure, Vela. Prefiero llegar entero que rápido.\"\n\nSigo la ruta de las placas de piedra con cuidado para no resbalar hacia el lodo.\n\n{Acrobacias}", "dm": "El avance es preciso; cada paso encuentra el centro de las placas de esquisto, evitando que el fango gris y viscoso reclame el calzado. El camino serpentea entre los charcos, donde las crestas afiladas de piedra se elevan como costillas sobre un mar de lodo, permitiendo un progreso seguro a pesar de la inestabilidad del terreno.\n\nAnselmo Vela no se mueve ni un centímetro. Mantiene la vista fija en el horizonte, con las manos entrelazadas detrás de la espalda y el tono de voz grave, sin rastro de irritación, pero con una sequedad absoluta: \"La prudencia es una virtud, siempre que no se convierta en ancla.\"\n\nEl sendero de esquisto se vuelve más errático y las placas se separan, obligando a realizar saltos más arriesgados que podrían exponer el equilibrio del grupo ante el viento del páramo."}, {"jugador": "\"Tengo la virtud de saber dónde piso, Anselmo.\"\n\nSigo avanzando con cautela, saltando entre las placas de piedra para no hundirme en el fango.\n\n{Acrobacias}", "dm": "El equilibrio se mantiene impecable mientras el sendero se estrecha, transformándose en un puente natural de esquisto fracturado. Bajo los pies, la hondonada de fango hirviente burbujea con un calor viscoso, mientras las ráfagas del páramo azotan con fuerza lateral, intentando desestabilizar cada salto. El avance es limpio, superando la fragilidad de la piedra sin que el lodo reclame el calzado.\n\nAnselmo Vela no aparta la vista del horizonte; su espalda permanece rígida mientras el viento sacude con violencia su hábito. Su voz surge lenta, pesada como el plomo, cargada de una severidad pedagógica: \"Pisar firme es habilidad. Saber hacia dónde caminar es voluntad. No confunda la una con la otra.\"\n\nEl viento del páramo comienza a soplar en ráfagas más erráticas y violentas, amenazando con empujar a cualquiera que se detenga demasiado tiempo sobre las placas expuestas del puente natural."}, {"jugador": "\"Vaya lección, Anselmo. Espero que su voluntad sea tan fuerte como el viento que nos intenta tirar.\"\n\nSigo avanzando con paso firme sobre el esquisto, manteniendo la vista en el camino para no detenerme.\n\n{Acrobacias}", "dm": "El puente de esquisto termina abruptamente en una meseta de roca calcinada, donde el viento ruge entre pilares de piedra negra que parecen dedos surgiendo del fango. El paso firme se quiebra cuando una ráfaga imprevista y violenta golpea con precisión, desestabilizando el equilibrio y obligando a un tropiezo torpe que termina en un impacto seco contra la piedra abrasiva.\n\nAnselmo Vela no gira la cabeza, manteniendo el paso constante y la espalda recta a pesar de la ráfaga. Su voz llega seca y carente de ironía: \"El viento sopla para todos, pero solo derriba a quien cree que puede negociar con él\".\n\nEl terreno en la meseta es traicionero y el viento no amaina; cualquier nueva pérdida de equilibrio podría lanzar al grupo hacia las grietas de roca calcinada o el fango circundante."}]}}, {"id": "ue636b2", "piloto": false, "lore": "# Bruma Honda\n\n## El pueblo entre la niebla\n\nBruma Honda se asienta en una hondonada baja junto a una ciénaga que nunca termina de secarse del todo, protegida de las crecidas por un dique de tierra y piedra que los primeros pobladores levantaron hace más de un siglo. La niebla sube del agua casi todas las noches y se queda pegada a las calles hasta bien entrada la mañana -tan constante que nadie en el pueblo la menciona ya, como no se menciona el aire que se respira.\n\nHace cinco semanas empezó a aparecer un cansancio que no cede con el descanso: quien lo tiene duerme y despierta igual de agotado, pierde el apetito poco a poco, y en los casos peores deja de reconocer a quien tiene delante durante ratos cada vez más largos. No es un veneno conocido, no responde a ningún remedio que el pueblo haya probado hasta ahora, y nadie sabe todavía si viene del agua, de la niebla, o de algo que ninguna de las dos cosas explica del todo.\n\n## La Casa de Cuarentena\n\n**Herminda Coz**, curandera de Bruma Honda desde hace veinte años, ha convertido el antiguo granero del pueblo en una casa de cuarentena: quien muestra los primeros síntomas se traslada ahí, separado de su familia, hasta que mejore o hasta que ya no haya nada que hacer. No lo hace por crueldad -lo hace porque cada caso que ha visto propagarse rápido empezó por descuidar el aislamiento, y prefiere una separación dura a un contagio que se lleve al pueblo entero. Pero cada familia que ve a alguien querido llevado a la Casa de Cuarentena sin poder acompañarlo empieza a preguntarse si Herminda está curando Bruma Honda o vaciándolo de otra manera.\n\n**Amancio Bell** perdió a su esposa hace diez días, en la Casa de Cuarentena, sola, sin que él pudiera estar a su lado en sus últimas horas. Desde entonces reúne cada noche, en la capilla vieja del pueblo, a quien quiera escucharlo: cree que separar a los enfermos de quienes los quieren los mata de soledad casi tan rápido como la propia enfermedad, y que Bruma Honda debería tratar a los suyos en casa, acompañados, cueste lo que cueste el riesgo de contagio.\n\nNinguno de los dos miente sobre lo que ha visto. Herminda ha visto lo que pasa cuando el aislamiento llega tarde. Amancio ha visto lo que pasa cuando llega a tiempo mismo, pero a un precio impagable.\n\n## La Fosa Común Vieja\n\nEn el extremo más alejado del cementerio del pueblo hay una fosa común marcada solo con piedras sin nombre, mucho más vieja que cualquier tumba individual de Bruma Honda. Nadie recuerda ya, entera, la historia de por qué está ahí ni de cuándo se usó por última vez -pero los pocos ancianos que quedan hablan, cuando se les pregunta con paciencia, de \"la otra vez que la niebla se puso espesa\", hace más de setenta años, con una vaguedad que no parece del todo casual.\n\n## Gente del pueblo\n\n**Herminda Coz**, curandera, sostiene un aislamiento estricto porque cada caso que ha visto propagarse rápido empezó por no aislar a tiempo. **Amancio Bell**, viudo reciente, cree que separar a los enfermos de los suyos los mata de soledad casi tan rápido como la enfermedad misma. **Ivo Manque**, que reparte leña entre las casas del pueblo, es -por ahora- solo un vecino más; ver \"personas_par09.json\" para el perfil completo de los tres y el molde de promoción de PNJ de paso ya usado en pares anteriores.\n\n## Tono de la campaña\n\n`world_tone`: **`grimdark`**. Ya usado en Par 01, Par 02, Par 06 y Par 07, pero con una **estructura nueva**: ni monopolio que extrae (Par 01, Par 02), ni escasez de recursos sin villano (Par 06), ni infiltración oculta (Par 07), sino una **plaga misteriosa sin cura clara**, donde el propio origen del mal -natural, sobrenatural, o algo que ninguna de las dos categorías explica del todo- queda deliberadamente sin resolver en este documento. El conflicto real no es contra la enfermedad, que ningún personaje puede combatir directamente todavía, sino entre dos formas igualmente defendibles de proteger al pueblo mientras dure: el aislamiento estricto de Herminda frente al acompañamiento de Amancio.\n", "A": {"previo": "Los bordes de la piel necrosada están rígidos, secos como el pergamino antiguo. Al analizar la transición entre la carne muerta y el cuarzo, confirmas que no hay rastro de lucha celular ni respuesta inmunitaria; el tejido no murió por degradación, sino que fue sustituido instantáneamente. La precisión del patrón radial es quirúrgica, aunque la brutalidad de las agujas perforando la dermis sugiere una fuerza expansiva incontrolable.\n\nNo detectas ninguna anomalía orgánica que explique el fenómeno, pero la disposición de los cristales no sigue la anatomía natural del cuerpo, sino que parece forzar la estructura ósea para abrirse paso. El frío que emana de la zona de transición es antinatural, un vacío térmico que parece absorber el calor de tus propios dedos mientras los acercas a la herida.", "turnos": [{"jugador": "\"Esto no es una enfermedad, es una imposición.\"\n\nMe alejo un poco para observar el cuerpo en su totalidad, buscando si hay otros puntos de entrada o patrones similares en el resto del organismo.\n\n{Investigación}", "dm": "Al retroceder, la luz mortecina de la estancia revela que el patrón no es un incidente aislado. A través de la ropa rasgada y las manchas de sangre seca, percibes otras protuberancias cristalinas rompiendo la superficie de la piel en los hombros y la base del cráneo, todas siguiendo la misma geometría radial y fría.\n\nSin embargo, la disposición general es errática. No hay un eje central claro ni una simetría que sugiera un diseño deliberado en todo el cuerpo; los cristales parecen haber brotado donde encontraron menor resistencia ósea o donde la presión interna fue más insoportable, dejando el torso como un mapa de fracturas blancas sobre carne grisácea."}, {"jugador": "\"Dioses... esto no es una herida natural.\"\n\nMe acerco al cuerpo y trato de analizar la disposición de los cristales para comprender el origen de la infección.\n\n{Medicina}", "dm": "Al inclinarte sobre el cadáver, la fascinación por la geometría de los cristales te hace descuidar la fragilidad del tejido necrosado. Un movimiento brusco de tu mano presiona una de las protuberancias en el torso y, con un chasquido seco, el cristal se fragmenta violentamente hacia adentro. El impacto no solo desgarra la carne grisácea, sino que provoca que una pequeña esquirla afilada salte hacia atrás, rozándote la mejilla y dejando un rastro de sangre fresca.\n\nLa estructura del cuerpo se colapsa parcialmente bajo la presión, hundiendo el pecho en un amasijo de costillas rotas y fragmentos vítreos. Ahora, el mapa de fracturas que intentabas estudiar es un caos de esquirlas mezcladas con fluidos espesos y oscuros, borrando cualquier rastro de la disposición original que podrías haber analizado."}, {"jugador": "\"Maldita sea, qué torpe he sido.\"\n\nMe separo rápidamente del cuerpo y me limpio la sangre de la mejilla con la manga. Observo los restos del torso para ver si queda algún fragmento legible entre el desastre.\n\n{Investigación}", "dm": "Te alejas del cuerpo con el rastro cálido de la sangre bajando por tu mejilla, pero al volver la vista hacia el torso, la escena es desoladora. El colapso ha sido total; los cristales, que antes formaban un patrón preciso, ahora son solo astillas irregulares sumergidas en un lodo negro y viscoso que burbujea lentamente.\n\nNo hay patrones que rescatar ni geometría que analizar entre los restos. Solo queda un montón de carne podrida y vidrio roto que no sugiere nada más que la violencia del impacto. El rastro de la estructura original se ha perdido definitivamente en el amasijo de fluidos oscuros."}, {"jugador": "\"Qué desperdicio tan horrible...\"\n\nLimpio la sangre de mi rostro con la manga y me acerco al lodo negro para observar de cerca el burbujeo y la composición del fluido.\n\n{Investigación}", "dm": "El lodo negro exhala un hedor dulzón, similar al de la fruta madura olvidada en un sótano húmedo. Al inclinarte, notas que las burbujas no emergen por calor, sino por una reacción química lenta; el fluido parece digerir los restos orgánicos y el vidrio, deshaciéndolos en una masa homogénea y aceitosa que brilla con reflejos irisados bajo la luz.\n\nTus ojos detectan que el fluido no es un subproducto del impacto, sino que emanaba del interior de los cristales. La viscosidad del lodo es inconsistente: hay filamentos casi transparentes que se retuercen débilmente, como nervios expuestos que buscan desesperadamente un anclaje en la tierra fría, sugiriendo que esta sustancia posee una voluntad biológica rudimentaria."}, {"jugador": "\"Esto no es un simple derrame, es algo vivo.\"\n\nMe acerco con cuidado para observar los filamentos sin tocar el lodo, intentando comprender la naturaleza de esa sustancia.\n\n{Naturaleza}", "dm": "Te inclinas sobre el borde, manteniendo la distancia, mientras observas cómo los filamentos se agitan en un ritmo errático. A pesar de tu escrutinio, la sustancia se resiste a ser categorizada; los patrones de movimiento no siguen ninguna lógica biológica conocida y la composición química del lodo parece alterar sus propiedades cada vez que intentas fijar la vista en un detalle concreto.\n\nEl brillo irisado se intensifica brevemente, creando un efecto hipnótico que nubla tu comprensión. Te quedas con la certeza de que es algo orgánico y reactivo, pero su origen y su propósito permanecen ocultos tras una capa de viscosidad impenetrable."}, {"jugador": "\"Esto no es natural, ni siquiera para los estándares de una plaga.\"\n\nMe alejo un paso del borde para romper el efecto hipnótico y trato de recordar si he leído algo similar en mis estudios médicos o textos sagrados.\n\n{Religión}", "dm": "El eco de tus palabras rebota en las paredes húmedas, pero el silencio que sigue es pesado y gélido. Al cerrar los ojos y buscar en los anaqueles de tu memoria los dogmas y las escrituras que estudiaste, las imágenes se desdibujan; los versículos sobre pestilencias y los rituales de purificación parecen insuficientes o irrelevantes ante la naturaleza de lo que tienes delante.\n\nLo único que logras rescatar es una vaga noción de advertencias antiguas sobre \"la corrupción de la materia\", pero los detalles son borrosos y no te ofrecen una respuesta concreta ni un nombre para esa masa irisada. La sensación de vacío en tu conocimiento es tan tangible como el olor a azufre y descomposición que emana del foso."}, {"jugador": "\"No es una enfermedad común, esto es algo mucho más oscuro.\"\n\nMe acerco al borde del foso con cautela, tratando de observar la masa irisada desde distintos ángulos para encontrar algún patrón o signo de inteligencia.\n\n{Religión}", "dm": "El aire se vuelve denso, saturado de un hedor metálico que se pega a la garganta. Al inclinarte sobre el borde, el brillo irisado de la masa parece pulsar con un ritmo lento, casi orgánico, como un corazón que late en el fango. A través de los fragmentos de tus estudios, identificas que esa coloración no es natural; es el rastro típico de una transmutación aberrante, donde la materia orgánica es reescrita por una voluntad ajena a los planos conocidos.\n\nNo hay un patrón geométrico ni una respuesta consciente a tu mirada, pero notas que la masa se expande y contrae ligeramente, absorbiendo los restos descompuestos que la rodean. La certeza te golpea: no estás ante un brote epidémico, sino ante una infestación de naturaleza extraplanar que consume la esencia de los muertos para anclarse a este mundo."}, {"jugador": "\"Esto no es una enfermedad... es un parásito.\"\n\nMe alejo un paso del borde para evitar que la masa me alcance y busco cualquier rastro de supervivientes o heridos que puedan haber quedado atrapados cerca de esta cosa.\n\n{Percepción}", "dm": "Tus botas crujen sobre la tierra seca mientras te alejas del borde, el hedor metálico aún impregnando tu ropa. Al desplazar la mirada por el perímetro de la fosa, el paisaje es un cementerio de desolación donde el silencio solo es roto por el siseo rítmico de la masa irisada. Entre los montículos de escombros y los cuerpos ya reclamados por la transmutación, distingues un movimiento errático y débil a unos diez metros a tu derecha.\n\nUna mano pálida, con los dedos crispados, emerge de entre unos restos de madera carbonizada. Al fijar la vista, ves a una figura encogida, medio sepultada por los detritos, que respira con una dificultad sibilante. Sus ojos, abiertos y nublados por el terror, se clavan en ti, pero no emite sonido alguno; solo un temblor violento sacude su cuerpo mientras intenta, inútilmente, arrastrarse lejos de la pulsación orgánica que comienza a extenderse por el suelo hacia su posición."}]}, "B": {"previo": "El intento de consuelo se estrella contra una pared de pánico visceral. El hormigón agrietado del pasillo parece cerrarse sobre vosotros mientras el polvo en suspensión baila bajo la luz mortecina, y el muro de piedra y metal retorcido que sella la salida permanece imperturbable, recordándoles que no hay escapatoria inmediata.\n\nEl Abuelo Julián se retuerce violentamente entre tus brazos, con los ojos desorbitados y la voz quebrada, sin dejar de luchar contra tu agarre mientras el pánico nubla cualquier rastro de razón. \"¡No me prometas nada! ¡Tú no lo entiendes, no puedes entenderlo! ¡Sueltame, que me sueltes ahora mismo!\", grita, rechazando el afecto y la promesa con una desesperación que lo deshumaniza.\n\nEl forcejeo descontrolado de Julián está transmitiendo vibraciones peligrosas a las placas de hormigón inestables del techo; cualquier movimiento brusco adicional podría provocar un derrumbe parcial.", "turnos": [{"jugador": "\"¡Julián, mírame! Si seguimos así, el techo nos caerá encima a los dos.\"\n\nSuelto el agarre brusco para no agitarlo más, pero me mantengo cerca, intentando estabilizarlo con un tono firme y calmado.\n\n{Persuasión}", "dm": "Tus palabras cortan el aire cargado de polvo, imponiendo una calma gélida que logra frenar el espasmo del anciano. El pasillo de hormigón agrietado parece contener el aliento mientras la luz parpadea débilmente sobre el muro de metal retorcido que os sella la salida, dejando que el silencio sea llenado solo por el sonido de los escombros asentándose.\n\nAl sentir que el agarre desaparece, el Abuelo Julián no recupera la compostura; retrocede un paso, tropezando torpemente con sus propios pies. Su respiración es errática y superficial mientras clava la vista en el techo con un terror puro, para luego mirar la salida bloqueada y gritar: \"¡El techo... el techo! ¡No importa! ¡No importa si cae, solo quiero salir de aquí, quiero salir ya!\".\n\nEl pánico de Julián ha sido contenido, pero el muro de metal retorcido sigue bloqueando la única salida y la estructura superior continúa cediendo lentamente bajo el peso de los escombros."}, {"jugador": "\"Cálmese, Julián. No voy a dejar que ese techo nos aplaste; vamos a salir de aquí juntos.\"\n\nSujeto al anciano por el brazo para estabilizarlo y examino el muro de metal retorcido buscando algún punto débil o palanca.\n\n{Investigación}", "dm": "El metal se siente frío, inerte y absurdamente sólido bajo los dedos. Cada intento de encontrar una grieta, un saliente o cualquier punto de apoyo termina en un roce inútil contra la superficie retorcida, que parece haberse fundido en una masa impenetrable de acero y escombros. No hay palanca posible; el muro no es una puerta cerrada, sino una herida abierta en la estructura que ha sellado el camino con una finalidad absoluta.\n\nEl Abuelo Julián siente la frustración en el agarre y se aferra al brazo con una fuerza nacida del terror, convirtiéndose en un lastre tembloroso. Con la mirada perdida en el metal doblado, su voz tiembla, aunque ya no grita: \"Tú... tú lo dices... Pero mira ese muro, ¡está doblado como si fuera papel! No hay forma, no hay forma de mover eso antes de que todo se venga abajo\".\n\nLa salida sigue bloqueada y el tiempo se agota; la estructura superior sigue cediendo y el aire comienza a sentirse más pesado y viciado."}, {"jugador": "\"Tranquilo, Julián, no te voy a soltar. Vamos a encontrar otra salida.\"\n\nLe doy un apretón reconfortante en el brazo y miro hacia arriba, buscando cualquier signo de debilidad en el techo o alguna rendija por donde el aire se mueva.\n\n{Percepción}", "dm": "El apretón firme en el brazo del anciano logra anclarlo al presente. Julián suelta un suspiro tembloroso y se deja llevar por el gesto, hundiendo los hombros mientras sigue mirando el muro con incredulidad, aunque su tono ya no es de pánico, sino de una resignación agotada: \"Tú lo dices... pero el metal no miente. Mira cómo se ha retorcido todo. Solo espero que tengas razón, porque si no, este agujero será lo único que quede de nosotros.\"\n\nAl elevar la mirada, el techo se revela como un cementerio de hormigón fracturado, donde pesadas placas cuelgan peligrosamente sostenidas apenas por hilos de acero oxidado. En medio de ese caos suspendido, una corriente de aire gélido y rítmico desciende por una fisura estrecha y vertical, un tajo limpio en la piedra que sugiere la existencia de un conducto o un hueco hacia un nivel superior.\n\nLas placas de hormigón que cuelgan sobre sus cabezas oscilan con cada ráfaga de aire; cualquier vibración brusca o el paso del tiempo podrían provocar un derrumbe total del techo."}, {"jugador": "\"No te rindas ahora, Julián. Vamos a salir de aquí.\"\n\nLe doy una palmada afectuosa en el hombro y miro hacia arriba, analizando la fisura por donde baja el aire.\n\n{Investigación}", "dm": "La mirada se clava en la fisura, un tajo vertical y estrecho que corta el hormigón con una precisión quirúrgica. Las paredes interiores están pulidas, alisadas por el roce constante de corrientes de aire que parecen respirar desde lo alto. En el borde superior, el resquicio revela una luz grisácea y mortecina, mientras que una vibración sorda y profunda, el eco de maquinaria pesada, sacude la estructura rítmicamente, haciendo que el polvo caiga en finas cascadas sobre el suelo.\n\nEl Abuelo Julián suelta un suspiro largo, apoyando el peso de su cuerpo cansado en el brazo del jugador mientras sigue mirando hacia arriba con una mezcla de miedo y esperanza. \"Tengo la esperanza puesta en ti, hijo. Solo... no te alejes demasiado mientras miras ese hueco. Siento que el techo nos está observando, esperando que cometamos un error\", murmura con una voz que tiembla entre la devoción y el pavor.\n\nLa maquinaria pesada que vibra en el nivel superior está intensificando los temblores en el techo; las placas de hormigón fracturado comienzan a ceder milímetro a milímetro."}, {"jugador": "\"Tranquilo, Julián. No voy a dejar que te pase nada.\"\n\nSostengo al anciano con firmeza para darle seguridad y miro hacia arriba, analizando el estado de las placas de hormigón para ver si hay algún punto de apoyo o riesgo inminente de derrumbe.\n\n{Percepción}", "dm": "El agarre es firme y el análisis rápido; la mirada recorre el techo, un mosaico de placas de hormigón armado donde el acero oxidado asoma como costillas rotas. Hay una viga transversal desplazada que ofrece un saliente sólido justo sobre la fisura, un punto de apoyo viable, aunque las ráfagas de polvo que caen insistentemente advierten que el anclaje superior está cediendo lentamente.\n\nEl Abuelo Julián se aferra con más fuerza al brazo del jugador, comprimiendo ligeramente el tejido de su ropa, mientras señala con un dedo tembloroso hacia la estructura metálica superior. \"Gracias... pero mira ahí arriba, ese panel de metal... si logramos repararlo y restablecer la energía, quizá dejemos de sentir que el mundo se nos cae encima\", dice con una voz que oscila entre la fragilidad y una urgencia desesperada.\n\nEl anclaje de la viga transversal se debilita con cada vibración; si no se aprovecha el punto de apoyo pronto, el derrumbe parcial será inevitable."}, {"jugador": "\"No se mueva, Julián. Mantenga la calma que yo lo sostengo.\"\n\nSujeto al anciano con firmeza para que no pierda el equilibrio y busco el camino más seguro hacia ese saliente de la viga para alcanzar el panel.\n\n{Atletismo}", "dm": "El intento de avanzar hacia la viga termina en un deslizamiento torpe sobre los escombros. El suelo, una alfombra de hormigón triturado y polvo grisáceo, cede bajo el peso, provocando que el equilibrio se pierda justo cuando el cuerpo intenta impulsarse hacia el saliente. El panel de metal permanece inalcanzable, suspendido en un aire denso que asfixia la luz y oculta la profundidad de las grietas que serpentean por las paredes del pasillo industrial.\n\nEl Abuelo Julián cierra los ojos un instante y se apoya con todo su peso en el brazo del jugador, temblando visiblemente mientras siente que el suelo vibra. Con un hilo de voz, suplica: \"No me sueltes... por favor, no me sueltes. Ve, hazlo, pero vuelve rápido. No quiero que el techo sea lo último que vea\".\n\nEl fallo al alcanzar el saliente ha provocado un desplazamiento de escombros que ha desestabilizado el anclaje de la viga; el techo comienza a ceder más rápido."}, {"jugador": "\"Tranquilo, Julián, no te voy a soltar. No te dejaré aquí.\"\n\nSujeto al anciano con fuerza para estabilizarlo y busco otro punto de apoyo o una grieta en la pared para impulsarme de nuevo hacia el panel.\n\n{Atletismo}", "dm": "El pasillo industrial se ha transformado en una garganta de hormigón fracturado donde el aire vibra con un zumbido metálico constante. Las paredes, surcadas por grietas profundas que parecen venas negras, gotean un sedimento aceitoso que convierte cada superficie en una trampa resbaladiza. Al intentar buscar un nuevo punto de apoyo, la mano resbala violentamente sobre el muro lubricado por el aceite, perdiendo cualquier asidero y provocando un nuevo derrumbe de fragmentos de piedra que se hunden en el vacío.\n\nEl Abuelo Julián se aferra desesperadamente a la ropa del jugador, con los ojos muy abiertos por el pánico mientras siente el nuevo desplazamiento de los escombros bajo ellos. \"¡Cuidado! ¡El suelo... se está moviendo!\", grita con voz quebrada, mientras el terreno cede una vez más, arrastrando la estabilidad de ambos hacia la oscuridad de la grieta.\n\nEl deslizamiento ha provocado un colapso parcial del suelo bajo sus pies; el tiempo para encontrar una salida antes de que el techo termine de desplomarse se ha reducido drásticamente."}, {"jugador": "\"¡Sujétate fuerte, Julián! No te sueltes.\"\n\nIntento abrazar al anciano contra mí para protegerlo mientras busco desesperadamente cualquier saliente o grieta firme en la pared para anclarnos antes de caer.\n\n{Atletismo}", "dm": "El intento de anclaje fracasa estrepitosamente. Las manos resbalan sobre el aceite negro y viscoso que recubre las paredes, una sustancia que anula cualquier posibilidad de agarre y convierte el hormigón en un tobogán hacia el vacío. El pasillo se inclina violentamente, transformándose en una pendiente inestable de escombros que comienza a deslizarse, acompañada por el chirrido ensordecedor del metal retorciéndose bajo el peso del colapso estructural.\n\nEn medio del caos, el Abuelo Julián se aferra a la ropa con una fuerza desesperada, hundiendo los dedos en la tela mientras cierra los ojos con fuerza y se encoge contra el cuerpo del otro. \"¡No me sueltes! ¡Por favor, no me sueltes!\", suplica con una voz rota por el terror, mientras ambos son arrastrados hacia el abismo oscuro.\n\nEl deslizamiento es imparable y la pendiente se vuelve más pronunciada; si no encuentran un punto de apoyo real en los próximos segundos, caerán al vacío junto con los escombros."}]}}]}</script>
<script>
"use strict";
const D = JSON.parse(document.getElementById("datos").textContent);
const CLAVE = "val_" + D.evaluador + "_" + D.fase;
let S = { i: 0, r: {} };
try { S = JSON.parse(localStorage.getItem(CLAVE)) || S; } catch (e) { /* sin almacenamiento: exportar seguido */ }
const guardar = () => { try { localStorage.setItem(CLAVE, JSON.stringify(S)); } catch (e) {} };
let t0 = Date.now();

function el(tag, attrs, ...hijos) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") e.className = v; else e.setAttribute(k, v);
  }
  for (const h of hijos.flat()) e.append(h);
  return e;
}
function parrafos(txt) { return (txt || "").split(/\n{2,}/).filter(x => x.trim()).map(x => el("p", {}, x)); }
function reg(u) { return (S.r[u.id] = S.r[u.id] || { seg: 0, p: {}, adivina: "", graves: [], nota: "" }); }
function completa(u) { const r = S.r[u.id]; return !!r && D.dims.every(d => r.p[d[0] + "_A"] && r.p[d[0] + "_B"]) && !!r.adivina; }
function tiempo(u) { const r = reg(u); r.seg += Math.round((Date.now() - t0) / 1000); t0 = Date.now(); }

function columna(nombre, w) {
  return el("div", { class: "col" },
    el("h2", {}, "Texto " + nombre),
    el("div", { class: "previo" }, el("b", {}, "Contexto previo (no se califica): "), ...parrafos(w.previo)),
    w.turnos.map((t, i) => el("div", { class: "t" },
      el("div", { class: "j" }, "Turno " + (i + 1) + " · Jugador: " + t.jugador),
      el("div", { class: "dm" }, ...parrafos(t.dm)))));
}

function render() {
  const u = D.unidades[S.i], r = reg(u);
  t0 = Date.now();
  document.getElementById("titulo").textContent = "Evaluación ciega · " + D.evaluador + " · " + D.fase.toUpperCase() + " · unidad " + (S.i + 1) + " de " + D.unidades.length;
  document.getElementById("avance").textContent = D.unidades.filter(completa).length + " completas";
  document.getElementById("lorec").replaceChildren(...parrafos(u.lore));
  const rub = document.getElementById("rub");
  rub.replaceChildren(...D.dims.map(d => el("p", {}, el("b", {}, d[0] + " · " + d[1] + ". "), d[2], el("br"), el("span", { class: "def" }, d[3]))));

  const filas = D.dims.map(d => el("tr", {},
    el("td", {}, el("b", {}, d[1]), el("div", { class: "def" }, d[2])),
    ["A", "B"].map(lado => el("td", { class: "n" }, el("div", {}, "Texto " + lado),
      [1, 2, 3, 4, 5].map(n => {
        const inp = el("input", { type: "radio", name: d[0] + lado, value: n });
        inp.checked = r.p[d[0] + "_" + lado] === n;
        inp.onchange = () => { r.p[d[0] + "_" + lado] = n; guardar(); document.getElementById("avance").textContent = D.unidades.filter(completa).length + " completas"; };
        return el("label", { class: "r" }, inp, " " + n);
      })))));

  const sel = el("select", {}, ...[["", "— elige —"], ["A", "El Texto A"], ["B", "El Texto B"], ["?", "No sé"]].map(([v, t]) => { const o = el("option", { value: v }, t); o.selected = r.adivina === v; return o; }));
  sel.onchange = () => { r.adivina = sel.value; guardar(); document.getElementById("avance").textContent = D.unidades.filter(completa).length + " completas"; };
  const graves = ["Otro idioma / palabras raras", "Repetición evidente", "Habla fuera de la ficción (meta-comentario)"].map(g => {
    const c = el("input", { type: "checkbox" }); c.checked = r.graves.includes(g);
    c.onchange = () => { r.graves = c.checked ? [...r.graves, g] : r.graves.filter(x => x !== g); guardar(); };
    return el("label", { class: "r" }, c, " " + g);
  });
  const nota = el("textarea", { placeholder: "Comentarios (opcional): qué te llamó la atención, dudas con la rúbrica…" }); nota.value = r.nota;
  nota.oninput = () => { r.nota = nota.value; guardar(); };

  document.getElementById("unidad").replaceChildren(
    el("div", { class: "cols" }, columna("A", u.A), columna("B", u.B)),
    el("table", {}, el("tr", {}, el("th", {}, "Dimensión"), el("th", {}, "Texto A"), el("th", {}, "Texto B")), filas),
    el("div", { class: "fin" },
      el("p", {}, el("b", {}, "¿Cuál cree que es el sistema multiagente? "), sel),
      el("p", {}, el("b", {}, "Problemas graves que notaste: "), ...graves),
      nota));
  window.scrollTo(0, 0);
}

function ir(d) {
  tiempo(D.unidades[S.i]);
  S.i = Math.max(0, Math.min(D.unidades.length - 1, S.i + d));
  guardar(); render();
}
document.getElementById("ant").onclick = () => ir(-1);
document.getElementById("sig").onclick = () => ir(1);
document.getElementById("exp").onclick = () => {
  tiempo(D.unidades[S.i]); guardar();
  const cab = ["evaluador", "fase", "unidad", "segundos"].concat(D.dims.map(d => d[0] + "_A"), D.dims.map(d => d[0] + "_B"), ["adivina_multiagente", "graves", "nota"]);
  const esc = v => '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"';
  const filas = D.unidades.filter(u => S.r[u.id]).map(u => {
    const r = S.r[u.id];
    return [D.evaluador, D.fase, u.id, r.seg].concat(D.dims.map(d => r.p[d[0] + "_A"]), D.dims.map(d => r.p[d[0] + "_B"]), [r.adivina, r.graves.join("; "), r.nota]).map(esc).join(",");
  });
  const blob = new Blob(["﻿" + [cab.join(",")].concat(filas).join("\n")], { type: "text/csv;charset=utf-8" });
  const a = el("a", { href: URL.createObjectURL(blob), download: "ratings_" + D.evaluador + "_" + D.fase + ".csv" });
  document.body.append(a); a.click(); a.remove();
};
render();
</script>
</body>
</html>
