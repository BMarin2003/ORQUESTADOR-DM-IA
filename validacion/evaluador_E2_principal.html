ue trabaja con la Ruta de la Sal desde hace veinte años, defiende mantenerse leal a los contratos de siempre: precios más bajos que no cambian de un mes a otro, entregas puntuales durante dos siglos sin una sola crisis grave. Sostiene que un socio que ofrece un precio imposible de sostener no está siendo generoso, está preparando algo que Cruce Salado todavía no entiende.\n\n**Amaro Ventisca**, cabeza de los comerciantes que han empezado a trabajar con la Ruta del Ámbar, no ve motivo para rechazar un margen mejor solo porque sea nuevo: cree que la Ruta de la Sal se aferra a la costumbre porque teme a la competencia, y que Cruce Salado tiene la oportunidad de crecer con un socio dispuesto a invertir en el pueblo como nunca lo hizo la vieja ruta.\n\nNinguno de los dos miente sobre lo que ha visto funcionar. Ninguno de los dos sabe con certeza qué hay detrás de los precios de la Ruta del Ámbar.\n\n## La sede forastera\n\nA media jornada de Cruce Salado, en un almacén levantado hace apenas un año, la Ruta del Ámbar mantiene una sede de operaciones que ningún comerciante del pueblo ha visitado a fondo. Qué se decide ahí, y por qué los precios bajaron tanto justo cuando el pueblo empezaba a depender cada vez más de esa ruta, es algo que este documento no resuelve por adelantado.\n\n## Gente del pueblo\n\n**Fernanda Robles**, del gremio de la Sal, defiende la lealtad a un socio probado durante dos siglos frente a una oferta que no termina de entender. **Amaro Ventisca**, del gremio del Ámbar, defiende aprovechar la oportunidad de un socio nuevo y más generoso mientras dure. **Zoraida Puch**, que repara ejes y ruedas de carro en un taller fijo del mercado, es -por ahora- solo una vecina más; ver \"personas_par16.json\" para el perfil completo de los tres y el molde de promoción de PNJ de paso ya usado en pares anteriores.\n\n## Tono de la campaña\n\n`world_tone`: **`mixed`**. Ni heroico ni desesperanzado de forma limpia: hay una oportunidad real de crecimiento y también un riesgo real de ruina, sin que la historia empuje hacia un desenlace obvio. Estructura sin precedente en el corpus real -**una guerra de precios entre dos rutas comerciales rivales**, distinta de la disputa de sucesión de Vado Cabrero (Par 05, un cargo único que se gana por mérito) porque aquí no hay una sola posición que ganar: hay un pueblo entero fracturándose poco a poco entre dos lealtades económicas, y una pregunta sin responder sobre qué sostiene de verdad los precios imposibles del Ámbar.\n", "A": {"previo": "Tus dedos recorren las superficies rugosas y las vetas de la madera pesada, palpando las juntas y presionando los bordes en busca de algún mecanismo oculto. Sin embargo, las piezas encajan con una solidez aburrida y los cajones que logras abrir solo contienen papeles amarillentos y trastos sin valor que no ofrecen ninguna pista sobre el destino del metal.\n\nLa habitación permanece en silencio, envuelta en ese aroma a polvo y encierro. Los haces de luz siguen revelando el baile de las motas de polvo, indiferentes a tu búsqueda, mientras los muebles se mantienen mudos y cerrados ante tus intentos.", "turnos": [{"jugador": "\"Maldita sea, solo basura.\"\n\nSigo revisando la estancia, pero ahora me fijo en las paredes y el suelo, buscando cualquier señal de que algo haya sido arrastrado o movido recientemente.\n\n{Investigación}", "dm": "Te desplazas por el perímetro de la estancia, agachándote para observar las vetas del suelo y el roce de las paredes. En una esquina, detrás de un armario cuya madera ha sido desplazada unos centímetros, notas unas marcas lineales y profundas en la madera del suelo, como si un objeto pesado y angular hubiera sido arrastrado con fuerza hacia la pared opuesta.\n\nAl seguir el rastro, descubres que el papel tapiz de la pared lateral está ligeramente despegado en la parte inferior, revelando una fisura vertical que no coincide con la estructura natural de la piedra. Hay un pequeño rastro de polvo acumulado en el borde, sugiriendo que esa sección de la pared se ha movido recientemente, dejando una rendija oscura que conduce a un espacio oculto."}, {"jugador": "\"Vaya, vaya... alguien tiene secretos.\"\n\nMe acerco a la rendija y empujo la sección de la pared para intentar abrirla.\n{Atletismo}", "dm": "Apoyas el hombro contra la sección de pared y empujas con fuerza, pero la estructura no cede ni un milímetro. El papel tapiz se rasga un poco más bajo la presión, dejando ver la piedra fría y rugosa, pero el mecanismo que sostiene la puerta oculta permanece bloqueado, resistiendo el empuje como si fuera parte integral del muro.\n\nUn eco sordo resuena en la estancia al impactar contra la pared, rompiendo el silencio del lugar. El polvo acumulado en la rendija vuela levemente, manchando tu ropa, mientras la puerta secreta sigue herméticamente cerrada."}, {"jugador": "\"Maldita sea.\"\n\nMe separo de la pared y paso la mano por la rendija, buscando cualquier palanca, botón o ranura que pueda accionar el mecanismo.\n\n{Investigación}", "dm": "Tus dedos recorren la rugosidad de la piedra y el borde del papel rasgado, palpando con cuidado cada centímetro de la hendidura. Tras unos segundos de búsqueda meticulosa, sientes una protuberancia metálica, fría y circular, oculta tras una moldura de madera que parece estar ligeramente desplazada respecto al resto del marco.\n\nAl presionar el disco con firmeza, se escucha un chasquido metálico seco que reverbera en el suelo. Con un siseo de aire comprimido y el chirrido de engranajes oxidados que no han girado en décadas, la sección de la pared retrocede unos centímetros y comienza a deslizarse lateralmente, revelando un pasillo estrecho y oscuro que exhala un olor a humedad y cera vieja."}, {"jugador": "\"Vaya, así que había un secreto aquí.\"\n\nSaco mi hacha y entro en el pasillo, avanzando con cautela.\n\n{Percepción}", "dm": "El pasillo se extiende frente a ti como una garganta de piedra, donde la luz del exterior muere rápidamente, dejando paso a una penumbra densa. El eco de tus pasos suena apagado sobre un suelo cubierto por una fina capa de polvo grisáceo y telarañas que se desprenden del techo como jirones de tela vieja.\n\nA medida que avanzas, el aire se vuelve más pesado y el silencio es absoluto, roto únicamente por el roce del metal de tu hacha contra tu equipo. No percibes ninguna amenaza inmediata ni anomalías en las paredes, pero la oscuridad al fondo del corredor parece absorber la poca luz que logras llevar contigo."}, {"jugador": "\"Demasiado silencio.\"\n\nSigo avanzando lentamente, atento a cualquier cambio en el aire o sonidos que se me hayan escapado.\n\n{Percepción}", "dm": "A medida que te adentras en la penumbra, el silencio deja de ser absoluto para revelarse como una capa de sonidos amortiguados. Tu oído capta un rítmico goteo metálico, distante pero constante, que proviene de más adelante en el corredor, donde la oscuridad es más densa.\n\nAl mismo tiempo, el aire cambia; ya no es solo pesado, sino que trae consigo un aroma dulzón y rancio, similar al de la fruta podrida o la carne olvidada, que fluye desde el fondo del pasillo hacia ti en una corriente gélida."}, {"jugador": "\"Huele a muerte.\"\n\nSigo avanzando lentamente por el corredor, manteniendo la guardia alta y escuchando con atención el origen del goteo.\n\n{Percepción}", "dm": "El goteo metálico se vuelve más nítido a medida que avanzas, revelando un eco hueco que sugiere que el suelo adelante es de piedra desnuda o metal. Entre el aroma a putrefacción, distingues un sonido adicional: un siseo húmedo, casi imperceptible, que parece desplazarse lateralmente entre las paredes del corredor, siguiendo tu ritmo.\n\nA unos metros, donde la oscuridad se espesa, el brillo tenue de tu luz alcanza a revelar que el goteo no es agua; un líquido espeso y oscuro cae desde una viga del techo, formando un charco viscoso que burbujea levemente sobre el suelo. El siseo se detiene abruptamente justo detrás de una columna erosionada que bloquea la vista del final del pasillo."}, {"jugador": "\"Sal de donde estés.\"\n\nSaco mi hacha y me acerco a la columna con cautela, manteniendo la guardia alta.\n\n{Percepción}", "dm": "El silencio que sigue a tu orden es denso, roto únicamente por el rítmico *ploc* del líquido oscuro golpeando el suelo. A medida que te aproximas a la columna, el aire se vuelve más pesado y húmedo, cargado de un olor ferroso que se pega a la garganta.\n\nAl llegar al borde de la piedra erosionada, no ves nada más que sombras espesas y el rastro de una sustancia mucosa que se arrastra por la pared, desapareciendo hacia el techo. El siseo no regresa, pero sientes una vibración sutil en el suelo, como si algo pesado estuviera conteniendo la respiración justo al otro lado del pilar."}, {"jugador": "\"Sal de ahí antes de que te saque yo.\"\n\nSaco mi hacha y me pego a la columna, intentando escuchar cualquier movimiento del otro lado.\n\n{Percepción}", "dm": "Te pegas a la piedra fría y rugosa, apretando el mango del hacha mientras aguzas el oído. El silencio vuelve a reinar, roto solo por el goteo distante y el eco de tu propia respiración. A pesar de la tensión, el entorno se siente extrañamente vacío; no percibes ningún roce contra la piedra, ni el desplazamiento del aire, ni el rastro de una respiración ajena.\n\nDesde el otro lado de la columna no hay respuesta a tu advertencia. Solo queda la humedad pegajosa de la pared y esa vibración residual que parece haberse disuelto en la quietud del lugar."}]}, "B": {"previo": "El lubricante cede ante el roce brusco contra la rejilla, dejando el paso limpio y seguro. Al concentrar la vista, el patrón de corrosión del suelo se vuelve evidente entre el vapor blanco que oculta el final del camino; ahora es posible distinguir con precisión qué placas de metal resisten y cuáles están a punto de colapsar bajo el peso de un paso. A los lados, las tuberías vibran con un zumbido eléctrico constante que hace vibrar el aire.\n\nZoraida Puch ni siquiera se gira, sigue caminando con paso firme y rítmico, el sonido de sus botas metálicas marcando la pauta. \"Prefiero que me cierres la boca tú cuando el ácido te llegue a los tobillos. Sigue moviéndote, que el goteo está aumentando y no pienso cargar con un cadáver porque no sabes dónde poner el pie\", suelta sin romper la marcha.\n\nEl vapor comienza a espesarse, reduciendo la visibilidad del camino y obligando a confiar ciegamente en la ruta marcada por Zoraida.", "turnos": [{"jugador": "\"No necesito que me lleves, Zoraida.\"\n\nSigo su rastro con cuidado, pisando únicamente las placas de metal que he identificado como seguras.\n\n{Percepción}", "dm": "El pie se desliza sobre una placa que parecía firme, pero el metal cede con un chasquido seco y violento. El tobillo se tuerce mientras la bota se hunde en un hueco de corrosión profunda, rompiendo el ritmo y hundiendo la pierna en una mezcla viscosa de aceite y óxido que engulle el movimiento. El vapor blanco se cierra sobre la escena como una pared opaca, dejando solo los destellos anaranjados de las tuberías vibrantes y el brillo aceitoso de las placas corroídas como puntos de referencia en la penumbra industrial.\n\nZoraida Puch no se detiene ni mira atrás; el sonido rítmico de sus botas metálicas continúa alejándose por el pasillo. \"Sigue caminando entonces. Solo espero que tu orgullo sea más resistente que el acero de estas rejillas, porque el óxido no entiende de independencia\", suelta con un tono seco y pragmático, manteniendo la vista fija en el camino delante de ella.\n\nEl hundimiento ha dejado el pie atrapado en la estructura; intentar salir bruscamente podría romper el tobillo o atraer la atención de lo que sea que cause ese zumbido eléctrico en las tuberías."}, {"jugador": "\"¡Maldita chatarra!\"\n\nGruño mientras intento extraer la pierna con cuidado, evitando tirones bruscos para no romperme el tobillo.\n\n{Atletismo}", "dm": "El metal cede con un chirrido agudo mientras la bota se desliza fuera de la trampa de óxido, liberando la pierna del abrazo viscoso del lubricante negro. El esfuerzo deja el calzado empapado en esa grasa oscura y espesa, pero el tobillo permanece intacto, rescatado justo antes de que la tensión se volviera insoportable bajo el zumbido eléctrico que hace temblar las paredes del pasillo.\n\nZoraida Puch se detiene en seco y gira la cabeza ligeramente, observando el accidente con una expresión de aburrimiento profesional, sin moverse para ayudar. \"Menos gritos y más palanca. Si sigues tirando así, vas a dejar la bota y el tobillo fundidos con el suelo\", suelta con una frialdad mecánica antes de volver la vista al camino.\n\nEl rastro de aceite negro dejado en el suelo es una marca evidente en el pasillo; cualquier patrulla o entidad que recorra el sector sabrá exactamente dónde se detuvo el grupo y cuánto tiempo tardó en liberarse."}, {"jugador": "\"Cierra la boca y camina, Zoraida.\"\n\nMe limpio la bota en el suelo con brusquedad, aunque sé que solo extiendo la mancha. Sigo avanzando, atento a cualquier ruido en el pasillo.\n\n{Percepción}", "dm": "El zumbido eléctrico del pasillo parece intensificarse, haciendo que las paredes metálicas vibren contra las palmas de las manos. El aire, saturado de un olor penetrante a ozono y aceite rancio, se vuelve denso mientras el avance continúa por aquel corredor industrial. Los sentidos se agudizan, filtrando el ruido mecánico, y el entorno se revela con una claridad gélida: no hay rastro de movimiento inmediato en las sombras, pero la estructura misma parece respirar con un ritmo artificial y opresivo.\n\nZoraida no se detiene ni altera su paso constante y rítmico. Sin mirar atrás, su voz corta el aire con una sequedad cortante: \"Camino. Pero cuando el eje se te doble por no saber pisar, no me pidas que te lo arregle gratis\".\n\nEl ruido rítmico de las botas sobre el metal resuena en el pasillo, alertando a cualquier entidad que se encuentre en los niveles inferiores sobre la posición exacta del grupo."}, {"jugador": "\"No necesito que me arregles nada, Zoraida.\"\n\nSigo caminando, pero mantengo la guardia alta y escudriño las sombras del pasillo buscando cualquier anomalía.\n\n{Percepción}", "dm": "El zumbido eléctrico del pasillo continúa vibrando contra las paredes metálicas, envolviendo el avance en ese aire denso a ozono y aceite rancio. A pesar de la vigilancia, las sombras se mantienen herméticas, negándose a revelar cualquier anomalía; el entorno permanece gélido y opresivo, ocultando cualquier amenaza o detalle bajo una capa de oscuridad industrial que resulta imposible de penetrar.\n\nZoraida no responde a las palabras, manteniendo su paso constante y rítmico. Se limita a seguir avanzando, dejando que el eco de sus botas sobre el metal sea la única respuesta, mientras su figura se recorta contra la tenue iluminación del corredor.\n\nLa falta de detección de anomalías no significa que no las haya; el grupo avanza a ciegas hacia lo que sea que aceche en el siguiente tramo del pasillo."}, {"jugador": "\"Tú caminas mucho, pero no dices nada.\"\n\nAcelero el paso para alcanzar a Zoraida y trato de analizar su lenguaje corporal mientras avanzamos.\n\n{Perspicacia}", "dm": "El pasillo se ensancha en una zona de mantenimiento donde cables gruesos cuelgan del techo como lianas negras y el goteo rítmico de un líquido viscoso rompe el zumbido eléctrico. A pesar del intento de leer sus gestos, Zoraida mantiene la espalda rígida y la mirada fija al frente, ignorando la proximidad con una disciplina casi mecánica que no deja espacio para la interpretación.\n\nSin detenerse, sigue caminando con paso firme, con la mirada fija al frente y las manos enguantadas balanceándose con ritmo mecánico. \"Tú caminas mucho, pero preguntas poco. Si quieres que hable, dime qué pieza falla o qué ruta quieres tomar; si no, guarda el aire para el camino\", sentencia con una frialdad cortante.\n\nLa hermeticidad de Zoraida cierra la vía de la información intuitiva; seguir avanzando sin hacer preguntas concretas es caminar hacia el vacío sin guía ni mapa."}, {"jugador": "\"Tengo el aire que necesito. Lo que quiero es saber qué hay al final de este pasillo y quién manda aquí abajo.\"\n\nSigo caminando a su lado, manteniendo el paso pero observando los cables y el techo.\n\n{Percepción}", "dm": "El pasillo desemboca en un nodo de distribución, una estancia circular donde el aire vibra con el flujo constante de las turbinas. En el centro, una consola oxidada preside el espacio, rodeada por tres puertas selladas que parecen contener la presión de toda la infraestructura. A pesar de la pregunta, Zoraida no altera su ritmo ni gira la cabeza, avanzando con una cadencia mecánica que ignora cualquier intento de introspección.\n\n\"Al final hay grasa, metal oxidado y el ruido de los ventiladores. Y quien manda es el que tiene la llave del taller y sabe cómo no dejar que el eje se rompa a mitad de ruta. Ahora, o me dices si traes algo roto para arreglar, o deja de mirarte el techo y camina\", sentencia con una frialdad que corta cualquier hilo de curiosidad.\n\nLa indiferencia de Zoraida y la hermeticidad de las puertas selladas dejan al grupo en un punto ciego; sin una petición técnica o una razón práctica, la guía seguirá avanzando sin revelar la función de este nodo ni quién controla el acceso."}, {"jugador": "\"No traigo nada roto, pero me interesa saber quién guarda esas llaves.\"\nMe detengo frente a la consola oxidada e intento analizar los controles para ver si hay alguna pista sobre el mando del lugar.\n{Investigación}", "dm": "Tus dedos recorren el metal frío y descascarillado de la consola, un amasijo de interruptores analógicos y pantallas de fósforo verde que parpadean débilmente, luchando contra la oscuridad del nodo. Al deslizar la mano por un panel lateral parcialmente desprendido, el tacto revela un sello de fundición grabado en el acero: el emblema de la Castellanía del Eje. La marca es inequívoca; el mando de este nodo pertenece a la casta de los Supervisores Técnicos.\n\nZoraida se detiene a unos pasos, pero no se gira. Permanece inmóvil, con la espalda rígida y la mirada fija en el pasillo siguiente, sumida en un silencio absoluto que ignora tu hallazgo.\n\nZoraida empieza a impacientarse; si no retomas la marcha o planteas una demanda concreta, su disposición neutral se volverá hostil, cerrando cualquier posibilidad de obtener información sobre la Castellanía mientras avancen."}, {"jugador": "\"Castellanía del Eje. Supervisores Técnicos. ¿Tú también sirves a esos tipos, Zoraida?\"\n\nMe separo de la consola y me acerco a ella, manteniendo la mano cerca de mi arma.\n\n{Perspicacia}", "dm": "El zumbido eléctrico del nodo vibra en los dientes, llenando la cámara circular donde los cables cuelgan del techo bajo como lianas negras y aceitosas. La presión del arma no parece alterar el pulso de la mujer; Zoraida se gira lentamente, con una mirada fría y pragmática que ignora la amenaza Metallicamente. Se limpia la grasa de las manos en un trapo sucio, dedicando un gesto despectivo a la consola antes de responder.\n\n\"Sirvo a quien me pague el mantenimiento de las herramientas y no me ponga multas por el humo del taller. No me interesa el sello del acero, sino que el carro ruede\", sentencia con una voz seca, cerrando cualquier puerta a una confesión sobre lealtades o jerarquías.\n\nZoraida ha dejado claro que su lealtad es económica y no ideológica; insistir en el vínculo político sin ofrecer una recompensa o una razón pragmática agotará su paciencia, llevándola a detener la guía del grupo."}]}}, {"id": "u736f8a", "piloto": false, "lore": "# Brasas Lentas\n\n## El valle y el dragón\n\nEn la cresta roja que domina el Valle de los Tres Molinos vive desde hace seiscientos años un dragón llamado Brasas Lentas. Durante los últimos doscientos doce, el valle le ha pagado cada otoño el tributo acordado en un tratado que nadie ha releído: cien sacos de harina, dos vacas gordas, un cofre de plata y, por cortesía, un cuento nuevo cada primavera. A cambio, el dragón no arrasa el valle. Y hace mucho, según cuenta el abuelo de cada familia, ahuyentó a unos ogros del norte que ya nadie ha vuelto a ver.\n\nLos vecinos dicen «el dragón» como quien dice «el impuesto». Él dice «mis vecinos» como quien dice «mis clientes».\n\n## Lo que ha cambiado\n\nEste año, Brasas Lentas ha hecho llegar una carta por vía oficial: pide «la conversión del tributo en pensión de jubilación, con cobertura médica y alojamiento asegurado», y avisa de que a partir del primer frío pasará a «situación de inactividad». La carta está escrita en papel timbrado, con tres copias y un anexo.\n\nEn la aldea de Harinilla han reaccionado como se reacciona ante cualquier carta con anexo: con pánico contenido y una reunión. Han contratado, con cargo a la caja del molino, a una mercenaria forastera como mediadora. Cobra trescientas piezas si consigue un acuerdo firmado por las dos partes, y nada si no.\n\n## Pagar o no pagar\n\n**Matilde Harinosa**, molinera mayor y cabeza del Gremio de Molineros, quiere acabar con el tributo: el valle lleva dos siglos pagando por una protección que nadie recuerda haber recibido, y una pensión vitalicia para un dragón es, dicho con todas las letras, un tributo con otro nombre. Pero tampoco quiere un valle sin dragón: los ogros del norte siguen ahí arriba, y sin él, ¿quién ahuyenta a nadie?\n\n**Brasas Lentas**, seiscientos años de servicio ininterrumpido, exige lo que le corresponde: ha cumplido, ha guardado el valle, ha dormido en una cueva que le da artrosis, y quiere retirarse con lo que le prometieron, o algo parecido, antes del primer frío. Lo dice con toda la dignidad de un funcionario veterano y muy poca prisa.\n\nNinguno quiere un final malo. Ninguno se fía del otro, y menos aún de sus abogados.\n\n## Los papeles del molino\n\nEn el archivo del Molino Mayor, en un cofre que no se abre desde que murió el molinero anterior, guardan la copia original del tratado. Nadie del gremio la ha leído entera. Es larga, está en letra gótica y tiene cláusulas con títulos como «De la reciprocidad» y «Del cómputo de los años».\n\n## Gente del valle\n\n**Matilde Harinosa**, molinera mayor, defiende dejar de pagar sin quedarse sin protección. **Brasas Lentas**, dragón jubilable, defiende su pensión con toda la calma de quien tiene siglos por delante. **Pip Ábaco**, gnomo contable de la cueva y único empleado del dragón, es -por ahora- solo el que lleva los libros; ver «personas_par20.json» para el perfil completo de los tres.\n\n## Tono de la campaña\n\n`world_tone`: **`mixed`**, registro **`comedic`**. Comedia de tono seco y con cariño: el humor nace de tratar un dragón, un tributo milenario y un puñado de molineros con la solemnidad de una negociación laboral, sin que nadie se ría de sí mismo. Debajo hay un riesgo real, pequeño pero cierto: los ogros del norte y el invierno. Estructura sin precedente en el corpus: **una negociación entre iguales cómicos con un mediador a sueldo**, sin villano y sin nadie a quien vencer; distinta de la sátira institucional de Nubarrón (Par 18) porque aquí las partes se conocen, se temen y se necesitan.\n", "A": {"previo": "El metal de la herramienta raspa la superficie del pergamino con un sonido seco. Al aplicar la presión necesaria para remover la costra de humedad, el papel, debilitado por los años y el moho, cede con un chasquido sordo. Un trozo irregular de fibra amarillenta se desprende y se deshace en polvo gris entre tus dedos, llevándose consigo los trazos de tinta que ocultaba la mancha.\n\nDonde antes había una promesa de propiedad, ahora solo queda un agujero irregular y el vacío blanco del papel roto. La frase queda truncada permanentemente: \"...el Gremio de Molineros reclamará la propiedad de...\".", "turnos": [{"jugador": "\"Maldita sea. Justo en la parte importante.\"\n\nSuelto el resto del pergamino con fastidio y observo los fragmentos de polvo gris que quedan en mis dedos. Intento analizar si queda algún trazo legible en los bordes del agujero.\n\n{Investigación}", "dm": "Te inclinas sobre el pergamino, forzando la vista para encontrar algún rastro de tinta que haya sobrevivido al desastre. Los bordes del agujero son irregulares y deshilachados, como si el papel hubiera sido devorado por una polilla especialmente meticulosa. \n\nAl pasar los dedos con cuidado por el perímetro de la rotura, solo encuentras más fibras sueltas que se deshacen al contacto. No hay letras remanentes, ni trazos parciales, ni una sola curva que sugiera el nombre del lugar o la persona que el Gremio de Molineros pretende reclamar. El vacío es absoluto."}, {"jugador": "\"Maldita sea. Justo la parte importante.\"\n\nSuelto el pergamino con fastidio y miro alrededor de la habitación buscando cualquier otro documento o nota que pueda haber pasado desapercibida.\n\n{Investigación}", "dm": "Tus ojos recorren la estancia, descartando pilas de papeles amarillentos y libros de contabilidad llenos de números tediosos. Tras mover un pesado tintero de peltre que deja un cerco de tinta seca sobre la madera, detectas un sobre de cuero grasiento oculto bajo el borde de un tapete raído.\n\nAl extraerlo, el cuero cruje y libera un olor a humedad y tabaco viejo. Dentro no hay un contrato, sino una serie de notas manuscritas, escritas con una caligrafía apresurada y nerviosa, que mencionan repetidamente una dirección en el valle y el nombre de una residencia: \"La Casa de Brasas Lentas\"."}, {"jugador": "\"La Casa de Brasas Lentas... No suena a lugar de vacaciones.\"\n\nGuardo las notas en mi cinturón y vuelvo a revisar el escritorio para ver si hay algo de valor que pueda llevarme.\n\n{Investigación}", "dm": "Tus dedos tantean el resto de la superficie, pero el escritorio parece haberse vaciado de cualquier interés práctico. Solo quedan migas de pan seco que se desmoronan al tacto y una mancha de cera endurecida que ha fusionado un pisapapeles de piedra con la madera, convirtiéndolo en una extensión inútil del mueble.\n\nEl silencio de la habitación se vuelve pesado, roto únicamente por el crujido de las tablas del suelo bajo tus botas. No hay más secretos ocultos entre los papeles amarillentos ni tesoros escondidos en los cajones descuadrados."}, {"jugador": "\"Qué pérdida de tiempo.\"\n\nMe alejo del escritorio y me pongo a observar las paredes y las esquinas de la habitación, buscando cualquier marca, símbolo o rastro de que alguien haya estado aquí recientemente.\n\n{Percepción}", "dm": "Tus ojos recorren la estancia con precisión quirúrgica, ignorando el polvo suspendido en la luz y centrándose en las anomalías. En la esquina opuesta al escritorio, donde el papel tapiz se ha despegado formando una burbuja amarillenta, notas un rastro casi imperceptible: una serie de huellas dactilares grasientas que forman un arco hacia el suelo. Al bajar la mirada, descubres que una de las tablas del parqué no encaja perfectamente con las demás; hay una fina línea de desgaste circular, como si alguien hubiera girado la madera repetidamente para acceder a algo oculto debajo.\n\nCerca del marco de la puerta, un pequeño trozo de tela carmesí, de una calidad sospechosamente alta para este lugar, cuelga de una astilla de madera. La tela aún conserva un ligero aroma a azufre y ceniza fría, un rastro olfativo que contrasta con el olor a humedad y papel viejo de la habitación."}, {"jugador": "\"Interesante.\"\n\nIgnoro la tela por un momento y me arrodillo ante la tabla del suelo para intentar girarla y ver qué hay debajo.\n\n{Investigación}", "dm": "Te arrodillas frente a la tabla del parqué y aplicas presión para intentar girar la madera. Sin embargo, el mecanismo parece estar encasquillado por los años de suciedad o quizás por un diseño más complejo de lo que parece a simple vista; la madera apenas cede un milímetro y se queda atascada con un chasquido seco, resistiéndose a revelar su secreto.\n\nEl esfuerzo solo consigue que una nube de polvo acumulado suba violentamente hacia tu rostro, dejándote un rastro de ceniza gris en la punta de la nariz mientras la tabla permanece firmemente en su sitio."}, {"jugador": "\"Maldita sea.\"\n\nMe limpio la nariz con la manga y observo la tabla más de cerca, buscando alguna ranura o palanca que haya pasado por alto.\n{Investigación}", "dm": "Al acercar la vista, el polvo que aún flota en el aire revela un patrón: hay finas líneas de desgaste que no siguen la veta natural de la madera, sino que forman un círculo imperfecto alrededor de un nudo oscuro. Al tacto, ese nudo se siente ligeramente más frío que el resto del suelo y tiene una holgura mínima, casi imperceptible, que sugiere que no es una pieza fija, sino un pivote.\n\nEl silencio de la estancia se rompe solo por el crujido lejano de la estructura de la casa, mientras la tabla sigue allí, burlona, guardando lo que sea que el mecanismo oculte bajo el parqué."}, {"jugador": "\"A ver qué escondes aquí abajo.\"\n\nMe agacho y trato de girar el nudo oscuro para accionar el mecanismo.\n\n{Investigación}", "dm": "Te inclinas sobre la madera y aplicas fuerza sobre el nudo oscuro, intentando que el pivote ceda y revele su secreto. Sin embargo, el mecanismo no responde con la elegancia de una cerradura bien aceitada; el nudo se resiste, girando apenas unos milímetros antes de quedar encallado con un chasquido seco y metálico que resuena en toda la habitación.\n\nLa tabla permanece intacta, cerrada con terquedad, y el esfuerzo solo ha servido para dejar una marca de fricción más evidente en la madera. El silencio vuelve a reinar en la estancia, aunque ahora el nudo parece haberse quedado bloqueado en una posición ligeramente distinta a la original."}, {"jugador": "\"Maldita sea.\"\n\nSuelto la madera y me separo un paso para observar el nudo desde otro ángulo, buscando alguna ranura o marca que haya quedado expuesta tras el giro.\n\n{Investigación}", "dm": "Al cambiar la perspectiva, la luz incide de forma distinta sobre el nudo desplazado. El giro forzado, aunque no abrió el compartimento, ha hecho que una pequeña lasca de madera se desprenda, revelando una hendidura metálica que antes estaba oculta bajo la superficie. No es una cerradura convencional, sino una ranura estrecha y profunda que parece diseñada para recibir una llave plana o, quizás, una hoja de metal muy fina.\n\nJunto a la ranura, grabada con una caligrafía minúscula y casi imperceptible que solo ahora es visible gracias al ángulo, se lee una sola palabra: *«Soplo»*. El mecanismo sigue bloqueado, pero el secreto ya no es un muro ciego, sino un enigma con una entrada definida."}]}, "B": {"previo": "El movimiento es preciso y el cuerpo se funde con la piedra húmeda del corredor, aprovechando los rincones más oscuros donde la luz de las antorchas distantes no alcanza a llegar. El eco se aplaca, permitiendo que el avance sea fluido y casi invisible entre las sombras alargadas que bailan sobre los muros estrechos.\n\nMatilde Harinosa se recoloca la ropa con un gesto brusco, recuperando su compostura mientras vigila el corredor con la cautela de quien cuenta cada moneda antes de soltarla. Su voz emerge como un hilo gélido y seco, sin llegar a gritar pero cargada de una intensidad pesada: \"No me apartes la mano como si fuera un saco de avena podrida. Camina, y hazlo en silencio, que ya hemos gastado demasiada paciencia para un solo pasillo.\"\n\nAunque el avance es exitoso, la tensión entre el grupo y Matilde es palpable; cualquier nuevo roce o falta de respeto podría hacer que ella deje de priorizar el sigilo sobre su propio orgullo.", "turnos": [{"jugador": "\"Menos quejas y más pasos, Matilde. El silencio no cuesta monedas.\"\n\nSigo avanzando por el corredor, manteniendo la guardia alta y vigilando los flancos.\n\n{Percepción}", "dm": "El corredor se ensancha ligeramente en una galería de arcos góticos, donde las paredes exudan salitre y el aire se vuelve denso, saturado por un olor a metal oxidado y humedad estancada. El intento de vigilar los flancos resulta torpe; la pesadez del ambiente y la falta de atención hacen que el entorno se vuelva un borrón de sombras confusas, dejando pasar detalles críticos que podrían haber sido advertidos.\n\nMatilde se detiene un segundo, bajando la voz hasta convertirla en un susurro peligroso mientras levanta el dedo índice, luego el corazón, contando las faltas de respeto en el aire: \"El silencio no cuesta, pero la insolencia sale cara, muchacho. Y yo soy la que lleva la cuenta.\"\n\nTu falta de atención te ha dejado vulnerable y Matilde ha empezado a contabilizar tus agravios; un error más podría hacer que ella deje de cooperar en el sigilo para darte una lección de modales."}, {"jugador": "\"Ya basta de juegos, Matilde. El silencio es mutuo.\"\n\nMe detengo en seco y trato de concentrarme en los sonidos del entorno, ignorando sus reproches.\n\n{Percepción}", "dm": "El esfuerzo de concentración rinde frutos: el ruido mental se disipa y los sentidos se agudizan, permitiendo que cada detalle del entorno cobre una nitidez absoluta. La galería de arcos desemboca en un vestíbulo circular donde el techo, vencido por el tiempo, ha cedido parcialmente, dejando caer una lluvia fina y constante de polvo calizo que flota en el aire como nieve gris. En el centro del espacio, un altar de piedra negra, agrietado y devorado por el moho, preside la estancia mientras el eco de los pasos resuena con una claridad inquietante, revelando la vacuidad del lugar.\n\nMatilde se detiene en seco, mirándole con los ojos entornados y una expresión de sequedad absoluta. Baja el brazo, pero mantiene una postura rígida, evaluando al jugador como quien evalúa un saco de grano húmedo. \"El silencio no es mutuo cuando uno de los dos está haciendo ruido con la lengua y el otro está tratando de que no nos muerdan el cuello. Si quieres que dejemos los juegos, empieza por mirar los flancos con el mismo empeño que pones en darme órdenes\", sentencia con una frialdad cortante.\n\nEl eco en el vestíbulo es traicionero; cualquier movimiento brusco o ruido innecesario ahora alertará a cualquier cosa que esté acechando más allá del altar de piedra negra."}, {"jugador": "\"Menos sermones y más vigilancia, Matilde.\"\n\nMe muevo con cautela hacia el perímetro del vestíbulo, tratando de no hacer ruido mientras mantengo la vista fija en las sombras tras el altar.\n\n{Sigilo}", "dm": "El intento de avance es torpe. Un trozo de mampostería cede bajo el peso del paso, produciendo un chasquido seco y estridente que rebota en las paredes del vestíbulo, rompiendo la tensión del silencio. El anillo de columnas erosionadas y los escombros que ocultan la base del altar parecen cerrarse sobre la posición, mientras que las sombras tras la piedra negra vibran con una intensidad nueva, alimentadas por la caída del polvo calizo.\n\nMatilde no levanta la vista, pero baja la voz hasta convertirla en un susurro peligroso. Empieza a contar con los dedos los errores de movimiento cometidos, con una meticulosidad gélida. \"Vigilo más que tú, que te mueves como un buey en un campo de porcelana. Si pisas una sola piedra suelta, que no sea mi nombre el que grites cuando aquello que sea nos encuentre.\"\n\nEl ruido ha eliminado el factor sorpresa; algo en las sombras del altar ha reaccionado al sonido y ahora se desplaza hacia vuestra posición."}, {"jugador": "\"Cierra la boca y prepárate.\"\n\nSaco mi arma y me pongo en guardia, fijando la mirada en las sombras del altar.\n\n{Iniciativa}", "dm": "El arma se despliega con una precisión quirúrgica, cortando el aire justo a tiempo para que el acero encuentre su posición de guardia. La reacción es instantánea y perfecta; el cuerpo se tensa en el ángulo exacto mientras los ojos clavan su objetivo en la penumbra del altar. El vestíbulo, convertido ahora en una trampa de ecos, vibra bajo la presencia del altar de piedra negra, cuyas columnas rotas proyectan sombras erráticas que parecen bailar al ritmo de algo rápido y silencioso que emerge del polvo calizo, cerrando la distancia con una velocidad depredadora.\n\nMatilde continúa contando con los dedos, pero cierra el puño con fuerza, plantándose firme. No se amilana; mantiene la mirada afilada y lanza sus palabras con una seguridad cortante: \"No me mandes callar, que mi lengua es lo único que no hace ruido en este agujero. Prepárate tú, que ya has avisado a medio valle con ese zapatazo.\"\n\nLa criatura del polvo ya está sobre vosotros; cualquier duda en el primer ataque permitirá que el enemigo dicte el ritmo del combate."}, {"jugador": "\"A un lado, Matilde.\"\n\nAprovecho mi velocidad para lanzar un tajo descendente contra la criatura antes de que termine de emerger.\n\n{Ataque}", "dm": "El acero desciende como un rayo, cortando el aire con una fuerza devastadora que no deja margen de error. El tajo impacta con precisión quirúrgica justo cuando la criatura termina de emerger del polvo, hundiendo la hoja en su cuerpo y anclándola contra el suelo de piedra caliza. El golpe resuena en toda la cámara circular, haciendo que el polvo acumulado en las columnas fracturadas vibre mientras el altar de obsidiana observa el impacto en un silencio sepulcral.\n\nMatilde se planta firme, sin retroceder un centímetro, mientras observa el tajo con un ojo crítico, como quien evalúa si un saco de grano está bien cosido. \"¡A un lado no me mueve ni un derrumbe! Pero dale fuerte, que no nos cobre el alquiler de este agujero\", exclama con una seguridad inquebrantable.\n\nLa criatura ha quedado herida y aturdida por el golpe, pero el estrépito del impacto podría haber despertado a otras presencias ocultas entre las sombras de las columnas."}, {"jugador": "\"No te distraigas con el alquiler, Matilde. Acaba con esto.\"\n\nAprovecho que la criatura está anclada al suelo para asestar un golpe definitivo.\n\n{Ataque}", "dm": "El acero desciende con una fuerza implacable, aprovechando la inmovilidad de la bestia para descargar todo el peso del impacto en un solo punto. El golpe es definitivo; el cuerpo de la criatura cede bajo la presión, quedando reducido a un montón de restos inertes sobre el suelo de piedra caliza, mientras el eco del choque rebota en las columnas fracturadas y se pierde en las sombras que rodean el altar de obsidiana.\n\nMatilde se mantiene plantada con los brazos cruzados, asintiendo con un gesto seco mientras observa el golpe definitivo con ojos evaluadores. \"¡No me digas que no me distraiga, que yo solo estoy haciendo cuentas! Dale el golpe final antes de que el ruido traiga a más invitados, que no pienso pagar el coste de limpiar este sitio dos veces\", suelta con su habitual pragmatismo, sin apartar la vista de los escombros.\n\nEl silencio que sigue a la muerte de la criatura es artificial; las vibraciones del golpe final han viajado por los cimientos de la cámara y algo, en los niveles inferiores, ha empezado a responder al llamado."}, {"jugador": "\"Ya está muerta, Matilde. Deja de contar monedas un segundo.\"\n\nLimpio la hoja de mi arma en los restos de la criatura y me pongo en guardia, escuchando con atención hacia el suelo.\n\n{Percepción}", "dm": "La cámara de piedra caliza recupera un silencio sepulcral, aunque las columnas fracturadas parecen amplificar el más mínimo roce. El altar de obsidiana, negro y gélido en el centro del círculo, refleja la penumbra densa que se cierne sobre el lugar. Al agudizar el oído, el ruido es inconfundible: un retumbar rítmico y sordo que asciende desde las profundidades, como si algo pesado y hambriento estuviera escalando los cimientos de la estructura.\n\nMatilde suelta un bufido corto, descruza los brazos y señala con el dedo hacia el suelo, frunciendo el ceño mientras se inclina ligeramente para escuchar. \"Si dejo de contar las monedas, alguien tendrá que pagar la factura por el tiempo perdido, y yo no pienso poner un solo saco de mi molino para cubrir tu falta de ritmo. Muévete, que el suelo vibra más que una muela de grano en agosto y no me gusta el sonido\", sentencia con su habitual rigor contable.\n\nEl retumbar se vuelve más frenético y el suelo empieza a agrietarse; si no abandonan el centro de la cámara o preparan una defensa, serán sorprendidos por lo que sea que sube desde el abismo."}, {"jugador": "\"Deja de contar monedas y prepárate para luchar, Matilde.\"\n\nSaco mi arma y me coloco en guardia, buscando una posición defensiva que proteja el centro de la sala.\n\n{Iniciativa}", "dm": "El intento de asegurar el perímetro llega tarde. El suelo de caliza estalla en fragmentos blancos con un estruendo seco que desestabiliza cualquier postura defensiva, lanzando esquirlas de piedra al aire. Desde las grietas que rodean el altar de obsidiana, emergen extremidades quitinosas y pálidas, anclando a la criatura al plano físico con una brusquedad violenta.\n\nMatilde reacciona con un salto hacia atrás, su rostro contraído en una mueca de irritación mientras intenta recuperar el equilibrio sobre el terreno fracturado. Se queda inmóvil un instante, observando las patas articuladas que ahora rodean el centro de la sala, sin emitir palabra pero con la mirada fija en la amenaza.\n\nLa criatura ha emergido completamente y se encuentra en posición de ataque; si no reaccionas inmediatamente, el primer golpe caerá sobre ti mientras intentas estabilizarte en el suelo roto."}]}}, {"id": "u146812", "piloto": false, "lore": "# Bruma Honda\n\n## El pueblo entre la niebla\n\nBruma Honda se asienta en una hondonada baja junto a una ciénaga que nunca termina de secarse del todo, protegida de las crecidas por un dique de tierra y piedra que los primeros pobladores levantaron hace más de un siglo. La niebla sube del agua casi todas las noches y se queda pegada a las calles hasta bien entrada la mañana -tan constante que nadie en el pueblo la menciona ya, como no se menciona el aire que se respira.\n\nHace cinco semanas empezó a aparecer un cansancio que no cede con el descanso: quien lo tiene duerme y despierta igual de agotado, pierde el apetito poco a poco, y en los casos peores deja de reconocer a quien tiene delante durante ratos cada vez más largos. No es un veneno conocido, no responde a ningún remedio que el pueblo haya probado hasta ahora, y nadie sabe todavía si viene del agua, de la niebla, o de algo que ninguna de las dos cosas explica del todo.\n\n## La Casa de Cuarentena\n\n**Herminda Coz**, curandera de Bruma Honda desde hace veinte años, ha convertido el antiguo granero del pueblo en una casa de cuarentena: quien muestra los primeros síntomas se traslada ahí, separado de su familia, hasta que mejore o hasta que ya no haya nada que hacer. No lo hace por crueldad -lo hace porque cada caso que ha visto propagarse rápido empezó por descuidar el aislamiento, y prefiere una separación dura a un contagio que se lleve al pueblo entero. Pero cada familia que ve a alguien querido llevado a la Casa de Cuarentena sin poder acompañarlo empieza a preguntarse si Herminda está curando Bruma Honda o vaciándolo de otra manera.\n\n**Amancio Bell** perdió a su esposa hace diez días, en la Casa de Cuarentena, sola, sin que él pudiera estar a su lado en sus últimas horas. Desde entonces reúne cada noche, en la capilla vieja del pueblo, a quien quiera escucharlo: cree que separar a los enfermos de quienes los quieren los mata de soledad casi tan rápido como la propia enfermedad, y que Bruma Honda debería tratar a los suyos en casa, acompañados, cueste lo que cueste el riesgo de contagio.\n\nNinguno de los dos miente sobre lo que ha visto. Herminda ha visto lo que pasa cuando el aislamiento llega tarde. Amancio ha visto lo que pasa cuando llega a tiempo mismo, pero a un precio impagable.\n\n## La Fosa Común Vieja\n\nEn el extremo más alejado del cementerio del pueblo hay una fosa común marcada solo con piedras sin nombre, mucho más vieja que cualquier tumba individual de Bruma Honda. Nadie recuerda ya, entera, la historia de por qué está ahí ni de cuándo se usó por última vez -pero los pocos ancianos que quedan hablan, cuando se les pregunta con paciencia, de \"la otra vez que la niebla se puso espesa\", hace más de setenta años, con una vaguedad que no parece del todo casual.\n\n## Gente del pueblo\n\n**Herminda Coz**, curandera, sostiene un aislamiento estricto porque cada caso que ha visto propagarse rápido empezó por no aislar a tiempo. **Amancio Bell**, viudo reciente, cree que separar a los enfermos de los suyos los mata de soledad casi tan rápido como la enfermedad misma. **Ivo Manque**, que reparte leña entre las casas del pueblo, es -por ahora- solo un vecino más; ver \"personas_par09.json\" para el perfil completo de los tres y el molde de promoción de PNJ de paso ya usado en pares anteriores.\n\n## Tono de la campaña\n\n`world_tone`: **`grimdark`**. Ya usado en Par 01, Par 02, Par 06 y Par 07, pero con una **estructura nueva**: ni monopolio que extrae (Par 01, Par 02), ni escasez de recursos sin villano (Par 06), ni infiltración oculta (Par 07), sino una **plaga misteriosa sin cura clara**, donde el propio origen del mal -natural, sobrenatural, o algo que ninguna de las dos categorías explica del todo- queda deliberadamente sin resolver en este documento. El conflicto real no es contra la enfermedad, que ningún personaje puede combatir directamente todavía, sino entre dos formas igualmente defendibles de proteger al pueblo mientras dure: el aislamiento estricto de Herminda frente al acompañamiento de Amancio.\n", "A": {"previo": "El hombre exhala un suspiro largo y tembloroso, dejando que su cabeza caiga pesadamente contra el suelo frío. Sus pupilas comienzan a contraerse al reconocer la calidez de tu mano sobre su hombro, y el pánico que nublaba su mirada se transforma en una gratitud desesperada, casi infantil. Se queda inmóvil un instante, escuchando el ritmo ahora estable de su propio corazón, mientras el sudor frío le empapa la frente.\n\nAl analizar su estado, notas que aunque el agujero en su tórax ha cerrado, el daño interno ha sido severo. Sus constantes son estables, pero sus pulmones aún luchan contra el residuo de sangre y el trauma del colapso; presenta una fatiga profunda, una languidez que va más allá de la herida física, como si el esfuerzo de sobrevivir hubiera drenado cada gota de su voluntad.", "turnos": [{"jugador": "\"Tranquilo, ya estás a salvo. No intentes hablar todavía.\"\n\nLe doy unas palmadas suaves en el brazo para tranquilizarlo y reviso sus signos vitales con más detalle para evaluar la gravedad de esa fatiga.\n\n{Medicina}", "dm": "El hombre cierra los ojos y deja escapar un gemido sordo, relajando los músculos bajo tu tacto. Su respiración es superficial y rítmica, pero al profundizar en el examen, percibes que el problema no reside en la anatomía, sino en la esencia. No hay infección, ni hemorragias ocultas, ni fallos orgánicos que justifiquen tal letargo; es un agotamiento sistémico, una erosión del espíritu que ha dejado sus reservas vacías.\n\nSus pupilas reaccionan con lentitud y su pulso, aunque constante, es débil, como el de alguien que ha estado huyendo durante años sin descanso. El daño interno ha sanado físicamente, pero el cuerpo se niega a recuperar el vigor, atrapado en un estado de shock prolongado que consume su energía más rápido de lo que puede regenerarla."}, {"jugador": "\"Tranquilo, ya no tienes que huir más. Estás a salvo.\"\n\nSigo examinando su pulso mientras busco cualquier signo externo de trauma psicológico o marcas que sugieran el origen de ese desgaste.\n{Medicina}", "dm": "El hombre no responde a tus palabras, pero el ligero temblor de sus párpados sugiere que el sonido de tu voz llega a él como un eco lejano. Su cuerpo permanece inerte, una cáscara vacía que exhala un aire frío y rancio, mientras el pulso sigue latiendo con esa fragilidad monocorde, sin acelerarse ni alterarse ante el consuelo.\n\nAl recorrer la piel de sus brazos y cuello, no encuentras cicatrices recientes ni marcas de cautiverio, pero notas que su piel tiene una palidez cenicienta, casi mineral, que no se debe a la falta de sol. No hay señales externas de trauma físico que expliquen este colapso, solo una fragilidad generalizada, como si los cimientos mismos de su voluntad se hubieran desmoronado."}, {"jugador": "\"Tranquilo, no estás solo. Voy a intentar ayudarte.\"\n\nColoco mis manos sobre su pecho y cierro los ojos, concentrándome en sentir cualquier rastro de energía anómala o enfermedad que no sea visible a simple vista.\n\n{Medicina}", "dm": "Tus dedos presionan el esternón del hombre y, mientras buscas una explicación lógica al letargo, la sensación que te devuelve su cuerpo es la de tocar piedra fría envuelta en cuero. No hay fiebre, ni inflamaciones, ni el rastro pegajoso de una infección común. Sin embargo, el ritmo de su corazón es tan lento y constante que parece mecánico, ajeno a cualquier respuesta biológica natural.\n\nA pesar de tu esfuerzo por hallar un síntoma concreto, la causa de su estado permanece oculta tras esa palidez mineral. Solo percibes una vacuidad abrumadora; no es que haya algo malo en su organismo, es que parece que algo fundamental ha sido extraído de él, dejándolo como un recipiente hueco que apenas sostiene la chispa de la vida."}, {"jugador": "\"Esto no es una enfermedad común.\"\n\nRetiro las manos y observo el rostro del hombre buscando cualquier señal de trauma externo o marcas rituales.\n\n{Medicina}", "dm": "El rostro del hombre es una máscara de cera, tersa y desprovista de cualquier rastro de lucha o agonía. No hay hematomas, ni cortes, ni las incisiones precisas que dejaría un ritual de sangre; la piel está intacta, pero posee una cualidad antinatural, como si hubiera perdido la elasticidad propia de la carne viva.\n\nA pesar de tu escrutinio, no logras identificar ninguna marca física que explique este vacío. El hombre permanece allí, con los ojos abiertos y nublados, mirando hacia un punto inexistente en el techo, mientras su respiración casi imperceptible sigue moviendo el pecho con una lentitud exasperante."}, {"jugador": "\"Tranquilo, estoy aquí contigo. No te voy a dejar solo.\"\n\nLe acaricio la mano con suavidad mientras intento analizar el estado de su respiración y el tono de su piel.\n\n{Medicina}", "dm": "Al contacto de tu mano, la piel del hombre se siente fría y excesivamente lisa, carente de la textura orgánica del poro humano; es como tocar pergamino impregnado en aceite. Al centrar tu atención en el ritmo de su pecho, notas que no hay una secuencia natural de inhalación y exhalación, sino un ciclo mecánico y distante, una pulsación rítmica que no responde a la necesidad de oxígeno, sino a un impulso externo o residual.\n\nEl tono de su piel, bajo el escrutinio de tu conocimiento médico, revela una palidez cenicienta que no es producto de la anemia o la muerte, sino de una sustitución celular. No hay flujo sanguíneo visible en las venas superficiales; en su lugar, percibes una sustancia translúcida y densa que se desplaza con una lentitud antinatural, manteniendo el cuerpo en un estado de suspensión biológica donde la descomposición ha sido detenida por completo."}, {"jugador": "\"Esto no es medicina, es una aberración.\"\n\nRetiro la mano con brusquedad y busco cualquier costura, placa o punto de entrada artificial en su cuello o torso.\n\n{Investigación}", "dm": "Tus dedos recorren con urgencia la piel aceitosa, buscando el rastro de una costura o el relieve de un metal implantado. Bajo la base del cuello, justo donde la mandíbula se une al torso, detectas una irregularidad: una línea casi invisible, una hendidura milimétrica que recorre el perímetro de la garganta como un hilo de seda surgically preciso. No es una cicatriz, sino una unión mecánica camuflada con una maestría perturbadora.\n\nAl presionar ligeramente el borde de esa hendidura, sientes un clic sordo, una vibración metálica que resuena profundamente en el pecho del hombre. El ciclo rítmico de su respiración artificial se altera por un instante, emitiendo un zumbido agudo y metálico que vibra contra tus yemas antes de recuperar su cadencia monótona."}, {"jugador": "\"Cielos... esto no es medicina, es ingeniería.\"\n\nSigo palpando la zona con cuidado, intentando localizar si hay algún otro punto de presión o un mecanismo de apertura oculto en esa unión mecánica.\n\n{Investigación}", "dm": "Tus dedos se deslizan con cautela sobre la unión, trazando la circunferencia de la garganta mientras buscas cualquier anomalía en la textura del metal camuflado. La piel se siente fría, casi inerte, y el zumbido interno persiste como un recordatorio de que lo que hay debajo no es carne.\n\nSin embargo, la precisión de la ingeniería es absoluta. A pesar de tus esfuerzos, la superficie permanece lisa y hermética; no hay pestañas, ni hendiduras adicionales, ni ningún punto de presión que ceda bajo tu tacto. La costura es un sello perfecto que se resiste a revelar el mecanismo que oculta."}, {"jugador": "\"No te preocupes, no voy a hacerte daño, solo intento entender cómo funcionas.\"\n\nSigo examinando la zona del cuello, pero ahora busco cualquier marca de desgaste o una pequeña ranura que haya pasado por alto.\n\n{Investigación}", "dm": "El Superviviente de la ceniza se queda inmóvil, permitiendo que tus dedos sigan explorando su cuello sin oponer resistencia. Sus ojos, apagados y carentes de brillo humano, te observan con una quietud inquietante mientras su voz emerge, plana y carente de inflexión: «Mi funcionamiento es un mapa de cicatrices y engranajes que ya nadie sabe leer. No busques un interruptor; busca el cansancio».\n\nAl concentrarte en las micro-fisuras del metal, notas que el sello no es perfecto debido a la fabricación, sino al uso. Justo debajo de la base de la mandíbula, donde el metal se encuentra con la estructura clavicular, detectas una línea de desgaste casi invisible: una muesca milimétrica causada por el roce constante de una pieza interna que se ha desplazado ligeramente con el paso de los años. No es una ranura diseñada, sino una falla estructural que revela que el mecanismo interno está empezando a ceder."}]}, "B": {"previo": "El abrazo se vuelve un muro contra la ventisca, una barrera de carne y tela que logra detener el avance del frío. Tras el rechazo instintivo, el anciano cede finalmente, dejándose caer en el refugio del pecho ajeno. Se aferra con desesperación a la ropa del jugador, hundiendo el rostro en su hombro mientras exhala un suspiro tembloroso que se pierde en el viento: \"Tienes razón... tienes razón. No me sueltes, por favor. No me sueltes\".\n\nMientras el cuerpo de Julián comienza a recuperar un calor mínimo, la mirada recorre la piedra volcánica y encuentra, a pocos metros, una grieta profunda y estrecha en la pared de la cornisa. Es un resquicio angosto, apenas un tajo en la roca oscura, pero lo suficientemente profundo como para romper la línea directa del viento y ofrecer un resguardo precario contra la blancura del valle.\n\nEl refugio es estrecho y el suelo de la grieta está helado; si no logran aislarse de la piedra volcánica rápidamente, el frío empezará a succionar el calor que acaban de recuperar.", "turnos": [{"jugador": "\"Tranquilo, Julián. No te voy a soltar, pero tenemos que movernos ahora mismo.\"\n\nSujeto al anciano con firmeza para ayudarlo a levantarse y lo guío con cuidado hacia la grieta en la roca.\n\n{Atletismo}", "dm": "El intento de levantar al anciano con rapidez resulta torpe; el cuerpo de Julián, exhausto y entumecido, se resiste al movimiento y ambos vacilan en un equilibrio precario antes de lograr avanzar. Finalmente alcanzan la hendidura en la piedra volcánica, un tajo estrecho y gélido donde las paredes rugosas cortan el viento, pero el suelo de roca negra irradia un frío sepulcral que cala los huesos al instante.\n\nEl Abuelo Julián se aferra con fuerza al brazo, apoyando casi todo su peso mientras camina con pasos torpes hacia la profundidad de la grieta. Con la voz quebrada y todavía temblando, susurra: \"Voy... voy contigo. Solo... no me dejes atrás\".\n\nEl suelo de roca volcánica actúa como un sumidero térmico; si no encuentran una forma de aislar sus cuerpos de la piedra negra, la hipotermia regresará con más fuerza que el viento."}, {"jugador": "\"No te dejaré, Julián. Tranquilo, ya estamos a salvo del viento.\"\n\nSigo apoyándolo mientras busco con la mirada cualquier resto de vegetación seca o telas abandonadas en la grieta para poner entre nosotros y el suelo frío.\n\n{Percepción}", "dm": "La mirada recorre las paredes de la grieta, pero la roca volcánica es implacable y estéril. No hay musgo, ni jirones de tela, ni una sola brizna de materia orgánica que pueda servir de aislante; solo el negro absoluto de la piedra que parece absorber cualquier rastro de calor remanente. El suelo sigue siendo un sumidero gélido que muerde la piel a través de las botas.\n\nEl Abuelo Julián se deja caer con un suspiro pesado, aunque mantiene el agarre en el brazo por un instante más antes de soltarlo, tiritando violentamente. Se encoge sobre sí mismo, buscando un refugio inexistente en el vacío de la hendidura, y susurra con una gratitud rota: \"Gracias... gracias, hijo. No sé qué haría yo solo en este agujero.\"\n\nEl frío del suelo es una trampa silenciosa; sin aislamiento, la hipotermia empezará a nublar el juicio de Julián y el tuyo en cuestión de minutos."}, {"jugador": "\"No se rinda ahora, Julián. Vamos a salir de este agujero.\"\n\nMe quito mi propia capa y la extiendo en el suelo para que él se siente sobre ella, intentando apartarlo del contacto directo con la piedra fría.\n\n{Medicina}", "dm": "El basalto negro de la grieta se alza como muros verticales y asfixiantes, atrapando un frío gélido que convierte el aire en cristales invisibles. En ese espacio reducido, hacinados contra la roca estéril, la capa se despliega sobre el suelo como una pequeña isla de piedad en medio de un congelador natural. El tejido corta el contacto directo con la piedra y ofrece un alivio inmediato, aunque precario, contra la succión térmica del suelo.\n\nEl Abuelo Julián tiembla violentamente mientras intenta rechazar el gesto por instinto, pero termina dejándose conducir hacia la capa con una mirada de profunda tristeza y devoción. \"No... no puedes hacer eso, me estás dejando a mí el calor y tú te quedarás... Dios, eres demasiado bueno para este mundo, hijo\", susurra con la voz quebrada, hundiéndose en la tela mientras el frío sigue acechando desde las paredes de la hendidura.\n\nAhora eres tú quien está expuesto al contacto directo con la roca volcánica; el frío empezará a drenar tu energía y a entumecer tus extremidades si no encuentran una salida pronto."}, {"jugador": "\"No diga tonterías, Julián. El frío es un enemigo que se combate con paciencia y abrigo, y yo soy más fuerte que usted.\"\n\nLe doy una palmada afectuosa en el hombro y me pongo de pie para observar los muros de la grieta buscando alguna salida.\n\n{Percepción}", "dm": "La mirada recorre las paredes de basalto negro y pulido, pero la roca es un espejo oscuro y traicionero que no entrega ningún secreto. El cañón es tan estrecho que el cielo se reduce a una línea blanca y distante, una promesa de libertad inalcanzable que solo acentúa la sensación de encierro. Al intentar buscar un camino hacia arriba, el suelo irregular y plagado de esquirlas volcánicas traiciona cada movimiento, cortando el cuero de las botas y negando cualquier punto de apoyo sólido para escalar.\n\nEl Abuelo Julián permanece en silencio, ovillado sobre la capa, observando la espalda del protector con una mirada cargada de una devoción silenciosa y triste. No hay grietas aprovechables, ni salientes, ni rastros de paso previo; solo la verticalidad absoluta de una piedra que parece haber sido diseñada para sepultar vivos a quienes caen en su interior.\n\nEl frío del basalto comienza a filtrarse a través de tus botas y el agotamiento se vuelve más pesado; cada minuto de indecisión en el fondo del cañón consume las últimas reservas de calor de tu cuerpo."}, {"jugador": "\"No se rinda, Julián. No vamos a quedarnos aquí.\"\n\nMe acerco al anciano y lo ayudo a acomodarse mejor para que conserve el calor. {Medicina}", "dm": "El frío del cañón de basalto negro se siente como un peso físico, una presión gélida que intenta aplastar cualquier rastro de voluntad mientras el viento silba, cortante, en la remota línea blanca del cielo. Al acomodar al anciano con precisión, asegurando que el calor no se escape por las costuras de su ropa, la fragilidad de Julián se vuelve palpable bajo el tacto, pero el gesto logra estabilizar su respiración y frenar el temblor de sus extremidades.\n\nEl Abuelo Julián se deja ayudar con un suspiro tembloroso, apoyando su peso en el protector mientras cierra los ojos un instante, disfrutando del gesto de cuidado. Con una voz que parece quebrarse como el cristal, susurra: \"Sé que no lo harás... siempre has sido el fuego que me mantiene despierto.\"\n\nAunque Julián está estable, el basalto sigue absorbiendo el calor del entorno y el silencio del cañón es absoluto; sin una fuente de fuego o un refugio real, el alivio es temporal y la hipotermia volverá a atacar en cuanto el sol termine de bajar."}, {"jugador": "\"No digas tonterías, Julián. No voy a dejar que te congeles aquí.\"\n\nLe doy una palmada suave en la mano para animarlo y miro a mi alrededor buscando cualquier saliente en las paredes de basalto o una cueva donde refugiarnos del viento.\n\n{Percepción}", "dm": "El Abuelo Julián aprieta débilmente la mano con la suya, manteniendo los ojos entornados y la respiración aún errática, mientras sigue la mirada hacia las paredes del cañón. \"Tus palabras pesan más que el abrigo, hijo... pero mira esas paredes. El basalto no tiene piedad con quien no tiene dónde esconderse\", murmura con un tono cargado de una resignación antigua.\n\nEl entorno es una garganta de basalto negro que se eleva en columnas geométricas, creando un pasillo opresivo que parece absorber la poca luz del día. Sin embargo, el escrutinio del terreno rinde frutos: a unos diez metros, una grieta irregular rompe la simetría perfecta de la roca, revelando un refugio natural donde el viento, finalmente, deja de silbar.\n\nLa grieta ofrece resguardo del viento, pero el basalto sigue siendo un sumidero térmico; si no se consigue encender un fuego o encontrar aislantes naturales dentro de la hendidura, el frío volverá a mermar las fuerzas de Julián rápidamente."}, {"jugador": "\"No se rinda ahora, Julián. Vamos a ponerlo a salvo.\"\n\nLe ayudo a levantarse con cuidado para llevarlo hacia la grieta.\n\n{Atletismo}", "dm": "El movimiento es fluido y firme, evitando cualquier sacudida que pudiera quebrantar la fragilidad del anciano. Al entrar en la grieta, el ruido blanco del exterior desaparece, sustituido por un silencio absoluto y pesado. El suelo, cubierto de ceniza grisácea y fragmentos de roca, amortigua el frío del basalto y ofrece un respiro momentáneo frente a la hostilidad del cañón.\n\nEl Abuelo Julián apoya gran parte de su peso en el brazo, luchando contra una respiración que suena a cristal roto, pero fuerza una pequeña y débil sonrisa de gratitud. \"Tengo la fuerza suficiente para dar unos pasos más... solo no me sueltes\", murmura mientras se aferra a la única estabilidad que le queda en medio de la piedra negra.\n\nEl silencio de la grieta es engañoso; el basalto actúa como un sumidero térmico y el frío comienza a filtrarse desde las paredes. Sin un fuego o materiales aislantes, la hipotermia de Julián avanzará inexorablemente a pesar del resguardo."}, {"jugador": "\"No te suelto, Julián. Tranquilo, ya estamos a salvo del viento.\"\n\nLe ayudo a sentarse con cuidado contra la pared, buscando el rincón menos frío, y comienzo a examinar su estado respiratorio.\n\n{Medicina}", "dm": "La hendidura de basalto negro corta el viento, envolviendo la escena en un silencio casi absoluto donde el suelo de ceniza gris amortigua cualquier movimiento. Al intentar examinar la respiración del anciano, los dedos no encuentran el ritmo ni la claridad necesaria; la fragilidad de Julián es un mapa confuso de sibilancias y espasmos que escapan a cualquier diagnóstico rápido, dejando la incertidumbre instalada en el aire gélido.\n\nEl Abuelo Julián cierra los ojos un instante mientras se deja acomodar contra la roca, soltando un suspiro tembloroso que termina en una tos seca y débil. \"Gracias, hijo... gracias. No sé qué habría sido de mí sin tu brazo\", murmura con una voz que se deshace como la ceniza que los rodea.\n\nEl frío del basalto comienza a absorber el calor corporal de Julián. Sin una intervención médica efectiva o una fuente de calor inmediata, sus pulmones empezarán a colapsar bajo el peso de la hipotermia."}]}}, {"id": "u8958ef", "piloto": false, "lore": "# Roble Cantor\n\n## El pueblo y el árbol\n\nEn el centro de la plaza de Roble Cantor crece un roble más viejo que cualquier casa del pueblo, tan grande que hacen falta doce personas cogidas de la mano para rodear su tronco. Cuando sopla cierto viento del norte, sus ramas más altas producen un sonido grave y constante que el pueblo lleva generaciones llamando \"el canto\" -y que una vez al año, en la Noche del Roble Cantor, el pueblo entero responde con música, baile y una ofrenda cantada frente al tronco, pidiendo un buen año de cosecha y buena fortuna para quien nazca en los doce meses siguientes.\n\nEs la fiesta más querida de Roble Cantor, y también la que más mercaderes viajeros atrae de las comarcas vecinas cada año -para muchas familias del pueblo, la única temporada de ventas que de verdad importa.\n\n## Lo que salió mal\n\nHace cuatro días, durante los preparativos, la Voz del Roble -una flauta de madera tallada hace generaciones con una rama caída del propio árbol, que se usa cada año para \"responder\" al canto del roble durante la ceremonia- desapareció del cofre donde se guarda entre festival y festival. Desde entonces han empezado a pasar pequeñas cosas raras por el pueblo: flores que brotan fuera de temporada, gallinas que caminan en círculos perfectos al amanecer, y más de un vecino que se sorprende tarareando una melodía que nadie le ha enseñado.\n\nNada de esto ha hecho daño a nadie. Todavía.\n\n## Cancelar o seguir adelante\n\n**Melida Corcho**, guardiana del roble desde que heredó el cargo de su abuela, quiere posponer la Noche del Roble Cantor este año: sin la Voz del Roble, no hay forma de completar la ceremonia como se ha hecho siempre, y las rarezas que ya está viendo el pueblo le parecen motivo suficiente para no arriesgarse a celebrar algo a medias.\n\n**Toño Bravante**, quien organiza la logística del festival desde hace tres años -mercaderes invitados, puestos instalados, música contratada-, no quiere ni oír hablar de cancelar: ya ha comprometido la palabra del pueblo con media docena de mercaderes que llegan mañana, y cree que se puede encontrar la Voz del Roble o improvisar un reemplazo a tiempo sin necesidad de deshacer meses de preparativos.\n\nNinguno de los dos quiere que la Noche del Roble Cantor salga mal. Ninguno confía en que la solución del otro sea la más segura.\n\n## Las Raíces que Cantan\n\nBajo el propio roble, entre las raíces más gruesas que asoman por la tierra de la plaza, algunos vecinos han notado un zumbido leve que no estaba ahí antes de que desapareciera la Voz del Roble -como si el propio árbol, por primera vez en generaciones, cantara algo distinto a lo de siempre.\n\n## Gente del pueblo\n\n**Melida Corcho**, guardiana del roble, defiende posponer el festival hasta encontrar la Voz del Roble o algo que la reemplace de verdad. **Toño Bravante**, organizador del festival, defiende seguir adelante porque ya ha comprometido al pueblo entero con los mercaderes que llegan. **Nieves Botel**, que vende pan de miel en un puesto fijo cerca de la plaza, es -por ahora- solo una vecina más; ver \"personas_par14.json\" para el perfil completo de los tres y el molde de promoción de PNJ de paso ya usado en pares anteriores.\n\n## Tono de la campaña\n\n`world_tone`: **`light`**. Ligero y con espacio genuino para el humor: las rarezas mágicas del pueblo son extrañas, no amenazantes, y el mayor riesgo real es social -que el festival salga mal delante de los mercaderes invitados- no una catástrofe. Estructura sin precedente en el corpus real -**un ritual comunitario que se sale de control por un objeto extraviado**, distinta del misterio ambiguo y más serio de Caleta Lumbre (Par 04) y del mercado negro de Muelle Gris (Par 12): aquí no hay nada que esconder de una autoridad externa, solo un pueblo que tiene que resolver su propio lío a tiempo para su fiesta más querida.\n", "A": {"previo": "Tus dedos se hunden en el vacío del compartimento secreto, rozando una superficie fría y ligeramente rugosa. Sin embargo, al intentar extraer el contenido, el roce de tu mano contra la madera interior produce un chirrido agudo y traicionero que corta el aire.\n\nEl hombre se tensa bruscamente y gira la cabeza hacia tu brazo, que permanece parcialmente sumergido en la moldura. Sus sollozos se detienen en seco y sus ojos, aún húmedos, se clavan en el hueco abierto con una mezcla de desconcierto y sospecha creciente.", "turnos": [{"jugador": "\"¡Oh, cielos! No creerás lo que he encontrado, parece que tienes una filtración de humedad justo aquí.\"\n\nSaco la mano rápidamente mientras intento poner cara de sorpresa y preocupación genuina.\n\n{Engaño}", "dm": "El hombre parpadea, confundido, mientras retiras la mano con un gesto teatral de alarma. Sus ojos viajan del compartimento secreto a tu rostro, buscando alguna señal de engaño en tu expresión de preocupación. El silencio se prolonga un instante, cargado de una tensión que se disuelve lentamente cuando el hombre suspira, dejando que sus hombros caigan con una pesadez derrotada.\n\n—¿Humedad? —murmura con voz quebrada, limpiándose una lágrima con el dorso de la mano—. No me sorprendería... Esta casa se cae a pedazos, igual que todo lo demás.\n\nSe vuelve a hundir en su tristeza, ignorando el hueco abierto en la madera y dándote la espalda mientras vuelve a sollozar suavemente."}, {"jugador": "\"Pobre alma, la tragedia es una carga pesada. Deje que yo me encargue de revisar el daño.\"\n\nAprovecho que me ha dado la espalda para intentar sustraer el contenido del compartimento sin que se dé cuenta.\n{Juego de Manos}", "dm": "Tus dedos se deslizan con rapidez quirúrgica hacia el hueco de madera, aprovechando el ritmo sincopado de los sollozos del hombre. El roce de la tela y el deslizamiento del objeto son casi imperceptibles, camuflados por el eco de los lamentos que llenan la estancia polvorienta.\n\nCon un movimiento fluido, el contenido del compartimento desaparece bajo tu manga justo antes de que el hombre recupere un poco el aliento, dejando el espacio vacío y el secreto robado en la palma de tu mano."}, {"jugador": "\"Siento mucho que esté pasando por esto, de verdad.\"\n\nGuardo el objeto rápidamente y me alejo del hombre con un gesto de fingido consuelo, buscando una salida discreta de la estancia.\n\n{Sigilo}", "dm": "El hombre, sumido en su desesperación, ni siquiera levanta la vista mientras asiente débilmente, absorto en su propio dolor. Sin embargo, al intentar deslizarte hacia la salida, el roce de tu bota contra una tabla suelta de madera provoca un crujido seco y estridente que resuena en el silencio relativo de la habitación.\n\nEl hombre se tensa y gira la cabeza bruscamente hacia ti, con los ojos enrojecidos y la mirada confundida. El movimiento ha sido lo suficientemente torpe como para romper la ilusión de tu discreción, dejándote expuesto en medio de la estancia mientras el eco del tablón aún vibra en el aire."}, {"jugador": "\"Vaya, parece que las tablas de este sitio están tan descuidadas como tu ánimo.\"\n\nLe dedico una sonrisa tranquilizadora mientras me detengo, intentando disimular mi torpeza con naturalidad.\n\n{Persuasión}", "dm": "El hombre parpadea, procesando el comentario mientras el rastro de su dolor se mezcla con una expresión de desconcierto. Su mirada viaja desde la tabla crujida hasta tu sonrisa, pero no encuentra consuelo en ella; solo ve a un extraño que ha irrumpido en su intimidad y que ahora intenta pasar el momento con una broma que cae en saco roto.\n\nSe encoge de hombros con un gesto lento y amargo, volviendo a bajar la cabeza para ocultar el rostro. No responde a la provocación ni a la amabilidad, limitándose a emitir un suspiro ronco que suena a rendición, dejándote el camino libre pero envuelto en un silencio gélido y pesado."}, {"jugador": "\"No seas así, amigo. El silencio no paga las cuentas ni cura las heridas.\"\n\nMe acerco con cautela y trato de echar un vistazo rápido a sus pertenencias o a cualquier objeto que tenga a mano mientras está distraído.\n\n{Percepción}", "dm": "El hombre suelta un bufido nasal, una risa seca y carente de alegría, pero sigue sin levantar la vista. Se mantiene encogido, como si quisiera hacerse pequeño y desaparecer entre las sombras del callejón, ignorando tus palabras mientras el frío de la tarde cala en sus harapos.\n\nAl intentar escudriñar sus pertenencias, tu mirada barre rápidamente el suelo y sus ropas raídas. Solo alcanzas a distinguir el cuero desgastado de unas botas viejas y el montón de tablas rotas que lo rodean, pero no logras discernir ningún objeto de valor ni nada que llame la atención entre la suciedad del entorno."}, {"jugador": "\"Vaya, qué hospitalidad. No parece que tengas mucho que ofrecer, pero seguro que tienes alguna historia que valga oro.\"\n\nMe inclino hacia él, bajando la voz para sonar confidente, e intento captar cualquier gesto o palabra que delate un secreto.\n\n{Perspicacia}", "dm": "El hombre se tensa visiblemente cuando te inclinas, encogiéndose aún más contra las tablas rotas. Aunque no te mira, el ligero temblor de sus manos y la forma en que evita cualquier contacto visual sugieren que no es solo el frío lo que lo mantiene así; hay una paranoia palpable en su postura, como si esperara que alguien, o algo, estuviera escuchando la conversación desde los tejados del callejón.\n\nA pesar de su hermetismo, notas que el hombre no está simplemente ignorándote por desprecio. El ritmo de su respiración se acelera y sus labios se mueven en un susurro casi imperceptible, repitiendo una palabra una y otra vez, demasiado baja para ser comprendida, pero con una urgencia que delata que guarda algo que le aterra mencionar en voz alta."}, {"jugador": "\"Tranquilo, amigo. No soy quien tú crees, ni quien tú temes.\"\n\nMe pongo a su altura y trato de captar esa palabra que susurra.\n\n{Percepción}", "dm": "El hombre se encoge aún más, pegando la espalda contra la madera astillada del callejón. Al escuchar tus palabras, sus ojos se abren con un brillo de pánico y lanza una mirada fugaz y errática hacia la entrada de la calle, como si el simple hecho de que alguien le hable fuera una señal de peligro inminente.\n\nTe inclinas hacia él, intentando filtrar el sonido de sus labios entre el viento y el ruido distante de la ciudad, pero el hombre cierra la boca bruscamente. El susurro se corta en seco y se queda rígido, conteniendo la respiración, mientras te observa con una mezcla de sospecha y terror puro."}, {"jugador": "\"Tranquilo, amigo. No soy quien tú crees, pero sí alguien que puede ayudarte si hablas.\"\n\nLe pongo una mano en el hombro con suavidad, tratando de transmitirle calma mientras miro hacia donde él miró.\n\n{Persuasión}", "dm": "Ante el contacto de tu mano, el hombre reacciona con un espasmo violento, encogiéndose como si lo hubieras quemado. Se aleja lo más posible, raspando su espalda contra la madera y soltando un jadeo ahogado que suena más a un sollozo que a una palabra. Sus pupilas están dilatadas y el temblor de sus manos es tan evidente que el roce ha servido para activar su pánico en lugar de aplacarlo.\n\nLanza una mirada frenética hacia la calle, donde el ruido de la ciudad continúa imperturbable, y luego vuelve a mirarte con una desconfianza absoluta. Aprieta los labios con fuerza, negando con la cabeza en gestos cortos y rápidos, hundiéndose más en las sombras del callejón mientras se abraza a sí mismo, cerrando cualquier vía de comunicación."}]}, "B": {"previo": "La tienda es un caos organizado de estanterías que llegan hasta el techo, donde frascos de colores turbios y pergaminos amarillentos parecen observar el encuentro desde las sombras. El cumplido cae en el aire, pero no logra desviar la atención de la mujer; la inclinación del cuerpo y la risa ligera no son suficientes para camuflar la intención oculta tras las palabras.\n\nMelida mantiene la sonrisa, pero inclina ligeramente la cabeza hacia un lado, observando con una mirada analítica y pausada, sin apartar la vista. \"Cuidado con los halagos, que pueden ser tan peligrosos como un hechizo mal conjurado. Me gusta tu entusiasmo, pero ese brillo en tus ojos no me dice que estés admirando el pergamino... sino que estás buscando algo más\", sentencia con una calma que congela el intento de persuasión.\n\nMelida ha traspasado la fachada del cumplido y ahora sospecha activamente que hay un motivo oculto tras la visita; cualquier movimiento errático ahora confirmará que buscas algo que no deberías.", "turnos": [{"jugador": "\"Tienes un ojo clínico, Melida. Me has pillado.\"\n\nSuelto una carcajada genuina y me encojo de hombros, relajando la postura para parecer inofensivo.\n\n{Engaño}", "dm": "La risa resuena en el espacio confinado de la tienda, rebotando entre los frascos de colores turbios y los pergaminos amarillentos. Sin embargo, la relajación de la postura no logra engañar a Melida. La mujer no se deja seducir por la naturalidad del gesto ni por la confesión; al contrario, su mirada se vuelve aún más afilada, como si el intento de parecer inofensivo fuera la pieza final del rompecabezas que confirma sus sospechas.\n\nMelida permanece en silencio, observando cada movimiento con una calma gélida. No hay palabras, solo una ceja ligeramente arqueada y una distancia prudencial que marca un límite invisible pero infranqueable entre ambos. La atmósfera, antes meramente curiosa, se ha vuelto densa, cargada con la certeza de que la máscara ha caído.\n\nLa confianza de Melida se ha roto por completo. Ahora está convencida de que mientes o manipulas, y cualquier intento posterior de persuasión será recibido con un escepticismo absoluto o el rechazo directo."}, {"jugador": "\"Parece que hemos llegado a un punto muerto, querida.\"\n\nHago un gesto de resignación y empiezo a echar un vistazo rápido a los estantes cercanos, buscando algún objeto que parezca valioso o fuera de lugar.\n\n{Percepción}", "dm": "La mirada se desliza con precisión quirúrgica sobre el caos organizado de la tienda. Entre el aroma a ozono y canela seca, destacan los estantes que crujen bajo el peso de frascos con sedimentos irisados y rollos de cuero atados con hilos de plata; el ojo experto detecta rápidamente un objeto que desentona con la armonía de la botica.\n\nSin embargo, antes de que se pueda alcanzar cualquier pieza, Melida Corcho se interpone físicamente entre el buscador y la estantería. Con la espalda recta y una expresión gélida, la mujer corta el paso con un movimiento seco, manteniendo un volumen de voz bajo y controlado que corta el aire: \"No me llame 'querida' mientras sus manos vagan por mis estantes. El punto muerto no lo ha creado mi silencio, sino su falta de honestidad.\"\n\nMelida ha bloqueado el acceso a sus archivos y suministros. Seguir insistiendo en registrar la tienda sin recuperar su confianza podría provocar que eche al grupo al camino o que alerte a los Guardianes del Roble sobre la presencia de un intruso manipulador."}, {"jugador": "\"Tiene razón, la honestidad es un recurso escaso y yo he sido... impreciso.\"\n\nLevanto las manos en señal de paz y esbozo una sonrisa apenada, tratando de suavizar mi expresión.\n\n{Persuasión}", "dm": "La tensión en el aire, espesa como el aroma m
