etálico y dulce de la botica, parece ceder un instante. Melida Corcho mantiene la postura, pero la rigidez de sus hombros se suaviza mientras observa el gesto de rendición. Alrededor, la luz se filtra débilmente entre los haces de hierbas secas que cuelgan del techo, proyectando sombras alargadas sobre las estanterías repletas de frascos de vidrio soplado y pergaminos amarillentos que parecen observar la escena en silencio.\n\nLa mujer no dice nada, pero el gélido muro de su expresión se resquebraja. Tras un breve silencio, desplaza su cuerpo hacia un lado, liberando el acceso a la estantería con un movimiento lento, casi imperceptible, que concede el espacio reclamado.\n\nAunque ha cedido el paso, Melida sigue vigilando cada movimiento; cualquier intento de tomar algo sin permiso o una nueva imprecisión romperán la frágil tregua y cerrarán el acceso a la información."}, {"jugador": "\"Te agradezco la cortesía, Melida. No quiero quitarte más tiempo del necesario.\"\n\nMe acerco a la estantería y busco entre los pergaminos aquel que parece contener la información más valiosa o secreta.\n\n{Investigación}", "dm": "La búsqueda se vuelve frustrante entre los estantes. En una sección donde el polvo se acumula con más espesura que en el resto, los pergaminos aparecen atados con cuerdas de cuero curtido y carecen de etiquetas claras, formando un archivo personal y deliberadamente desorganizado que parece diseñado para desorientar a cualquier mirada curiosa. Los dedos recorren el papel amarillento, pero los secretos permanecen ocultos tras un caos de notas inconexas y caligrafías borrosas que no revelan nada concreto.\n\nMelida Corcho permanece de pie, con las manos entrelazadas al frente, observando fijamente cada movimiento de los dedos sobre los documentos. Su voz recupera esa cadencia casi recitada, solemne y pausada: \"De nada. Pero recuerda que los pergaminos del Roble no son simples papeles; son la memoria de quienes estuvieron aquí antes que nosotros. Trátalos con el respeto que merecen, o te pediré que los devuelvas inmediatamente\".\n\nLa paciencia de Melida es tan frágil como el papel que se hojea; seguir rebuscando sin éxito o mostrar un descuido con los archivos provocará que retire el acceso a la estantería definitivamente."}, {"jugador": "\"Toda esta memoria es un caos absoluto. Es casi un arte cómo lo han guardado.\"\n\nSuelto el pergamino con cuidado y le dedico a Melida mi sonrisa más encantadora mientras retrocedo un paso.\n\n{Persuasión}", "dm": "La tensión que espesaba el aire entre los estantes polvorientos se disipa súbitamente. Melida suelta un suspiro breve, relajando la tensión de sus hombros mientras observa el gesto. Aunque no devuelve la sonrisa del todo, sus ojos se suavizan y asiente levemente, permitiendo que la atmósfera se alivie.\n\n\"El caos es, a veces, la única forma de proteger lo que es sagrado de quienes solo buscan respuestas rápidas. Pero... tienes razón en que alguien tuvo un sentido del humor muy particular con el orden\", admite con un tono más humano, rompiendo la solemnidad de su postura.\n\nEl ambiente se ha relajado, pero el tiempo sigue corriendo; mientras el diálogo fluya, Melida mantendrá el acceso a los archivos, pero cualquier nuevo desplante o descuido con los pergaminos reactivará su desconfianza."}, {"jugador": "\"Me alegra que coincidamos en eso. El orden es una sugerencia, no una ley.\"\n\nAprovecho la distracción de Melida para echar un vistazo rápido a los pergaminos cercanos, buscando cualquier anotación marginal o secreto que no parezca parte del registro oficial.\n\n{Investigación}", "dm": "La mirada se desliza con agilidad sobre los bordes amarillentos de los pergaminos acumulados. Entre el olor a cuero viejo y tinta seca, y bajo una luz cenital que hace bailar las motas de polvo en el aire, el ojo capta algo que escapa al registro oficial: una anotación marginal, escrita con una caligrafía apresurada y casi invisible, que sugiere un vacío en los archivos deliberado.\n\nMelida suelta una risita contenida, casi involuntaria, mientras se gira para organizar unos folios, quedando momentáneamente de espaldas. \"Una sugerencia... Vaya. Si el bosque escuchara tales blasfemias, probablemente nos soltaría una lluvia de bellotas en la cabeza solo para recordarnos quién manda aquí\", comenta con un tono ligero, ajena al descubrimiento.\n\nEl descuido de Melida es temporal; en cuanto termine de organizar los folios y vuelva a girarse, cualquier intento de hurgar más profundamente en los documentos sin su permiso será evidente."}, {"jugador": "\"Tienes razón, el bosque es muy caprichoso.\"\n\nAprovecho que Melida está de espaldas para intentar copiar la anotación marginal rápidamente en un trozo de papel.\n\n{Juego de Manos}", "dm": "El roce del papel es el único sonido que compite con el murmullo de Melida mientras ella sigue absorta en sus folios. En ese rincón asfixiante de la biblioteca, donde las estanterías de roble oscuro se curvan sobre el escritorio creando una burbuja de penumbra, el movimiento es fluido y preciso. La punta del lápiz recorre el margen del pergamino con velocidad quirúrgica, trasladando la caligrafía apresurada al papel oculto antes de que la luz cambie o una sombra se proyecte sobre el escrito.\n\nMelida permanece de espaldas, moviéndose con tranquilidad entre los documentos, totalmente ajena a que el secreto del archivo acaba de cambiar de dueño.\n\nLa copia está hecha, pero el papel ahora es una prueba incriminatoria; si Melida decide revisar el escritorio o notar un trozo de papel fuera de lugar al girarse, el engaño se desmoronará."}, {"jugador": "\"Parece que tienes mucho trabajo, Melida. No quisiera distraerte más.\"\n\nGuardo la copia rápidamente y trato de dejar el escritorio exactamente como estaba antes de empezar.\n\n{Juego de Manos}", "dm": "El papel se desliza sin ruido, regresando a su sitio con una precisión milimétrica que deja el escritorio intacto, como si nadie lo hubiera tocado. En ese rincón claustrofóbico de la biblioteca, donde las estanterías de roble se cierran sobre la mesa como una caja de sombras, el aire parece espesarse mientras el silencio vuelve a reinar.\n\nMelida se gira lentamente, con una sonrisa suave y cansada, mientras cierra un folio con delicadeza, sin mirar el escritorio, enfocando su mirada directamente en el jugador. \"El trabajo nunca termina cuando se cuida lo que es eterno, aunque a veces sientas que los papeles te devoran. Ve tranquilo, que el silencio de esta sala es el mejor compañero que me queda ahora mismo.\"\n\nHas salido limpio de la escena, pero el documento ahora está en tu poder; cualquier registro posterior de los folios originales o una revisión exhaustiva de la sala podría revelar que alguien accedió a información restringida."}]}}, {"id": "u2d4416", "piloto": false, "lore": "# Cima Clara\n\n## El pueblo bajo el cielo\n\nCima Clara se asienta en la meseta más alta de una cadena de picos donde el aire es tan limpio que, en noches sin luna, se dice que se puede leer el cielo entero sin perder una sola estrella. De ahí viene tanto el nombre del pueblo como su oficio más antiguo: durante generaciones, Cima Clara ha dado sabios lectores del cielo, gente que interpreta lo que pasa arriba para explicar lo que puede venir abajo.\n\nHace nueve noches, dos soles asomaron a la vez sobre la cresta oriental durante casi un minuto, antes de que uno se desvaneciera como si nunca hubiera estado ahí. Cientos de personas lo vieron. Nadie en el pueblo, ni siquiera los más ancianos, recuerda un presagio parecido en su tiempo de vida -y las crónicas que sí lo mencionan, de hace más de dos siglos, no se ponen de acuerdo en qué significó entonces.\n\n## La Ofrenda y la prudencia\n\n**Illian Vasto**, la sabia de mayor rango de la Orden del Cielo, sostiene que un presagio de ese tamaño exige la Ofrenda: una peregrinación de todo el pueblo, casa por casa, hasta el Picacho Sagrado, para completar un rito que no se realiza entero desde hace generaciones porque nunca hizo falta. Cree, con la misma certeza con que ha leído el cielo toda su vida, que no cumplir la Ofrenda a tiempo invita al desastre que el segundo sol anunciaba.\n\n**Rodrigo Fenz**, quien preside el concejo del pueblo desde hace una década, no niega que el presagio sea real ni que la Orden lo lea con sinceridad. Lo que le preocupa es el costo: la Ofrenda exige semanas de trabajo y provisiones que el pueblo necesita para el invierno, y una peregrinación completa por el Sendero de la Ofrenda no está exenta de riesgo real. Prefiere reforzar los graneros y las defensas del pueblo por si el desastre llega de una forma más terrenal, y dejar la Ofrenda como último recurso, no como primera respuesta.\n\nIllian no miente sobre lo que cree. Rodrigo no miente sobre lo que teme perder. Cima Clara entera, dividida en susurros primero y en discusiones abiertas después, todavía no sabe a cuál de los dos seguir.\n\n## El Archivo de Presagios\n\nEn un cuarto trasero del Observatorio Viejo se guardan crónicas de más de dos siglos de antigüedad, con cada presagio importante que el pueblo ha registrado y lo que pasó después de cada uno. Ni Illian ni Rodrigo las han revisado enteras en años -ambos citan de memoria solo los fragmentos que respaldan su propia postura. Lo que dicen de verdad esas crónicas sobre presagios de dos soles, si es que alguna vez se registró uno, es algo que este documento no resuelve por adelantado.\n\n## Gente del pueblo\n\n**Illian Vasto**, sabia de la Orden del Cielo, defiende la Ofrenda completa porque su lectura del presagio no le deja otra salida honesta. **Rodrigo Fenz**, presidente del concejo, defiende la prudencia y la preparación terrenal porque no está dispuesto a arriesgar el invierno del pueblo en un rito que nadie viviente ha visto funcionar. **Prudencio Aza**, que talla las marcas del calendario en la piedra del observatorio cada amanecer, es -por ahora- solo un vecino más; ver \"personas_par11.json\" para el perfil completo de los tres y el molde de promoción de PNJ de paso ya usado en pares anteriores.\n\n## Tono de la campaña\n\n`world_tone`: **`heroic`**. Heroico en el sentido de que ambas posturas nacen de una fe genuina -en el cielo o en el propio pueblo- y no de cinismo ni de cálculo. Estructura sin precedente en el corpus real: una **profecía que divide a la comunidad**, distinta de la amenaza externa organizada de Vega del Yelmo (Par 03, con un enemigo activo y visible) y de la disputa de sucesión de Vado Cabrero (Par 05, sin ningún elemento sobrenatural de por medio). Aquí el propio significado del presagio -y si la Ofrenda serviría de algo- queda deliberadamente sin resolver en este documento, para que la partida lo descubra jugando.\n", "A": {"previo": "La Guardiana cierra los ojos un instante, asintiendo con una calma profunda mientras procesa tu promesa. Al volver a mirarte, sus ojos parecen reflejar constelaciones antiguas. —El Archivo no reside en un lugar que pueda alcanzarse con simples pasos, sino en el corazón de la Ciudad Suspendida, velada por los vientos del olvido. Solo aquellos que portan la marca del destino pueden cruzar el umbral sin desvanecerse en la nada.\n\nSe inclina ligeramente, bajando la voz como si el aire mismo pudiera traicionar el secreto. —El presagio vibra porque el sello que lo mantenía silente se ha agrietado. Algo, o alguien, ha empezado a buscar las piezas del rompecabezas en el mundo exterior, despertando ecos que no deberían sonar. La armonía se ha roto y el silencio ya no es suficiente para contener la verdad.", "turnos": [{"jugador": "\"¿Quién podría tener el poder o la osadía para agrietar un sello así?\"\n\nMe acerco un paso hacia ella, buscando comprender la gravedad de esa ruptura.\n{Perspicacia}", "dm": "La Guardiana no retrocede ante tu avance; al contrario, su postura se vuelve más firme, aunque una sombra de genuina preocupación nubla la serenidad de su mirada. —No es cuestión de poder bruto, sino de una sintonía prohibida —responde en un susurro—. Alguien ha encontrado la frecuencia exacta para hacer resonar la grieta, alguien que conoce los nombres que el tiempo borró.\n\nAl observarla, notas que su calma es una máscara cuidadosamente mantenida. El leve temblor de sus dedos al sujetar sus vestiduras y la forma en que sus ojos evitan los tuyos por un instante revelan que no solo teme a quien agrietó el sello, sino que siente una culpa profunda, como si ella misma hubiera sido negligente en su vigilancia o conociera la identidad del culpable y el peso de esa verdad la estuviera consumiendo."}, {"jugador": "\"No tienes que cargar con este peso tú sola. Si cometiste un error, confesarlo es el primer paso para enmendarlo.\"\n\nPongo una mano suavemente sobre su brazo, buscando transmitirle calma y apoyo.\n{Perspicacia}", "dm": "La Guardiana se tensa momentáneamente ante el contacto, pero no se aparta. Sus hombros caen ligeramente y exhala un suspiro trémulo que rompe la rigidez de su postura. Te mira a los ojos, y aunque el brillo de la gratitud es visible, su expresión sigue siendo un muro de dudas; parece luchar contra el impulso de hablar, pero el miedo al juicio o a las consecuencias sigue anclándola al silencio.\n\n—La redención es un camino largo para quien ha visto el abismo abrirse por su propia mano —murmura, retirando el brazo con lentitud para entrelazar sus dedos en un gesto de nerviosismo—. No busco clemencia, sino una solución. Si realmente estás dispuesto a ayudar, debemos movernos antes de que la resonancia atraiga a aquello que habita en el vacío."}, {"jugador": "\"No busco juzgarte, sino acompañarte en esa solución. No estás sola en esto.\"\n\nSigo el ritmo de sus pasos, pero mantengo la mirada atenta a su lenguaje corporal para comprender qué es exactamente lo que teme.\n\n{Perspicacia}", "dm": "La Guardiana asiente levemente, sus pasos apresurándose mientras te guía a través del pasillo en penumbra. El eco de sus botas contra la piedra resuena con una urgencia creciente, y el roce de sus vestiduras al caminar parece cargar el aire de una electricidad estática que eriza el vello de la nuca.\n\nAl intentar descifrar sus temores, el lenguaje corporal de la mujer te resulta confuso y contradictorio. Interpretas un ligero estremecimiento de sus hombros como un signo de desprecio hacia tu compañía y percibes que su silencio no es miedo, sino una calculada desconfianza; llegas a la conclusión errónea de que te está guiando hacia una trampa o que oculta una intención maliciosa detrás de su fragilidad."}, {"jugador": "\"Sé que hay algo que no me estás contando, pero confío en que lo hagas por un motivo.\"\n\nSigo caminando a su lado, pero mantengo la mano cerca de mi símbolo sagrado, alerta a cualquier movimiento brusco.\n\n{Perspicacia}", "dm": "La Guardiana se detiene en seco, girándose hacia ti con una expresión de dolor genuino que desmiente cualquier sospecha de traición. Sus ojos, húmedos y cargados de una lealtad casi desesperada, recorren tu rostro y luego bajan hacia tu mano tensa sobre el símbolo sagrado. Un suspiro tembloroso escapa de sus labios y, lejos de mostrar hostilidad, se encoge ligeramente, como si el peso de su secreto fuera una carga física que la estuviera aplastando.\n\n\"No es desconfianza lo que me consume, sino el terror de que el tiempo se nos agote\", susurra con la voz quebrada, mientras vuelve a avanzar, aunque ahora lo hace con pasos más lentos, casi vacilantes. \"Mi silencio no es un arma contra ti, sino un escudo para lo que estamos a punto de encontrar. Solo ruego que tu fe sea tan fuerte como tu intuición cuando las puertas se abran\"."}, {"jugador": "\"Tu miedo no me asusta, pero tu silencio me inquieta. Confío en ti, pero no puedo caminar a ciegas.\"\n\nSuelto la tensión de mi mano sobre el símbolo y me acerco a ella para ponerle una mano reconfortante en el hombro.\n\n{Perspicacia}", "dm": "La Guardiana cierra los ojos al sentir el contacto de tu mano en su hombro, dejando escapar un sollozo ahogado que parece liberar una presión contenida durante años. Al abrir los párpados, la mirada que te devuelve es de una gratitud absoluta, casi religiosa; el gesto ha derribado la última barrera de su reserva, aunque el temblor de sus manos persiste.\n\nAl observarla, notas que su miedo no nace de una intención oculta ni de una traición planeada, sino de una certeza devastadora. No te oculta información por malicia, sino porque cree firmemente que hay verdades que, de ser reveladas antes de tiempo, podrían quebrantar tu voluntad o condenar la misión. Su lealtad hacia ti es incondicional, pero su terror hacia lo que aguarda tras las puertas es, en este momento, más fuerte que su capacidad de hablar."}, {"jugador": "\"No tienes que cargar con este peso tú sola. Confío en ti, pero necesito que me ayudes a entenderlo para poder enfrentarlo.\"\n\nSigo sosteniendo su hombro con suavidad, intentando transmitirle calma y seguridad.\n\n{Persuasión}", "dm": "La Guardiana se tensa bajo tu mano, y el gesto que pretendía ser reconfortante parece, en su estado de fragilidad, una presión asfixiante. Sus ojos se dilatan y retrocede con un espasmo brusco, rompiendo el contacto físico mientras un jadeo errático escapa de su garganta. La mención de \"enfrentarlo\" actúa como un detonante; para ella, tu confianza no es un apoyo, sino una señal de que no comprendes la magnitud del horror que acecha, convirtiendo tu seguridad en una imprudencia insoportable.\n\nSe lleva las manos a la cabeza, ocultando el rostro entre los dedos mientras comienza a balancearse levemente. \"No... no entiendes\", susurra con una voz quebrada que roza la desesperación, \"creer que puedes enfrentarlo es precisamente lo que te llevará a la ruina\". Se encoge sobre sí misma, cerrando el círculo de su aislamiento y volviendo a sumergirse en un silencio gélido, ahora teñido por el pánico de quien cree que su protector es ciego ante el abismo."}, {"jugador": "\"Lo siento, no quería asustarte. Solo quiero ayudarte a cargar con este peso.\"\n\nRetrocedo un paso para darle espacio y observo sus gestos con atención, intentando comprender qué es exactamente lo que la aterra tanto.\n\n{Perspicacia}", "dm": "La Guardiana permanece encogida, con los hombros hundidos y la respiración aún agitada, aunque el espacio que le has concedido parece aliviar la presión inmediata. No levanta la mirada; sus dedos siguen apretados contra su sien, como si intentara físicamente contener algo que amenaza con desbordarse desde su interior. El silencio que sigue a tus palabras es denso, cargado de una melancolía que parece consumir el aire de la estancia.\n\nA través de sus espasmos y el temblor de sus manos, no logras descifrar la naturaleza exacta de su miedo ni el origen de ese horror que la paraliza. Solo percibes una masa informe de angustia y una convicción absoluta de que cualquier intento de ayuda es, en realidad, un camino hacia el desastre. Se limita a emitir un gemido ahogado, negando con la cabeza lentamente, mientras se mantiene sumergida en su propio abismo."}, {"jugador": "\"No tienes que cargar con esto sola. Déjame ayudarte a encontrar un poco de paz.\"\n\nMe acerco lentamente y pongo una mano suave sobre su hombro, intentando transmitirle calma.\n\n{Persuasión}", "dm": "Ante el contacto de tu mano, la Guardiana se tensa violentamente, como si el roce fuera una descarga eléctrica. Se encoge aún más sobre sí misma, alejando el hombro de tu tacto con un movimiento brusco y errático. El gemido ahogado se transforma en un sollozo seco que sacude todo su cuerpo, mientras sus dedos se clavan con fuerza en su propia piel.\n\n—No... no entiendes... —susurra con una voz quebrada, apenas un hilo de sonido que lucha por salir—. La paz es un velo que se rasga. Si te acercas al abismo, el abismo no solo te mirará... te reclamará. Por favor, aléjate. Por tu propio bien, aléjate."}]}, "B": {"previo": "La plataforma de piedra blanca se ha convertido en el epicentro de un vórtice silencioso. El anillo de escombros geométricos pulsa con una luz fría y distante, proyectando sombras fractales que se alargan y encogen sobre el suelo como dedos inquietos, mientras el aire se vuelve denso, cargado de una electricidad que eriza la piel. A pesar del esfuerzo por descifrar la naturaleza de este fenómeno, los patrones del anillo permanecen crípticos, una arquitectura sagrada que se resiste a entregar sus secretos y deja la comprensión fuera de alcance.\n\nIllian cierra los ojos un instante, permitiendo que el peso de la mano sobre su hombro lo ancle a la realidad física, aunque su voz conserva ese tono pausado y litúrgico, ahora teñido de una fragilidad nueva. \"La *Sideris Vigilantia* no se equivoca en el dibujo, solo en el tiempo... pero el tiempo es un lujo que Aethelgard ya no posee. Respira, sí... pero no olvides que el cielo no respira, solo observa\".\n\nLa luz fría del anillo comienza a parpadear con una irregularidad alarmante; el vórtice está empezando a succionar la estabilidad de la plataforma, y el suelo de piedra blanca empieza a agrietarse bajo sus pies.", "turnos": [{"jugador": "\"No permitas que el miedo te quite la voz, Illian. Estamos aquí.\"\n\nMe acerco a él para darle apoyo y miro las grietas del suelo, intentando comprender el patrón de la rotura.\n\n{Religión}", "dm": "La plataforma de piedra blanca cede bajo vuestros pies, pero no con el caos de un derrumbe, sino con una precisión quirúrgica. Las grietas se abren en líneas rectas y ángulos perfectos, trazando una red geométrica que converge violentamente hacia el centro del vórtice, mientras la luz fría parpadea con un ritmo frenético y alarmante. Al observar el patrón, la arquitectura sagrada finalmente se revela: no es una rotura accidental, sino una activación.\n\nIllian Vasto mantiene la mirada fija en las fracturas del suelo, sin apartarse del contacto físico, aunque su cuerpo permanece tenso, como si estuviera contando los segundos de un reloj invisible. \"El miedo es un ruido, y yo he pasado mi vida aprendiendo a escuchar el silencio de las estrellas. Pero mira el suelo... las grietas no siguen el flujo de la piedra, sino la geometría del *Aethel-Kore*. El cielo no nos está hablando, nos está reclamando\", sentencia con una voz que oscila entre la devoción y la urgencia.\n\nLa red de grietas se expande rápidamente hacia los bordes de la plataforma; si no encontráis una salida o estabilizáis el núcleo, quedaréis atrapados en el centro del colapso geométrico."}, {"jugador": "\"Mantente firme, Illian. No dejaremos que este lugar se pierda en el caos.\"\n\nIntento buscar algún punto de anclaje o mecanismo en la geometría del suelo que me permita estabilizar la estructura.\n\n{Religión}", "dm": "Tus dedos recorren los surcos de la piedra blanca y, siguiendo la lógica sagrada del diseño, logras identificar el nodo maestro donde las tensiones del Aethel-Kore se anulan entre sí. Al aplicar la presión en el punto exacto, el temblor violento de la plataforma se transforma en una vibración armónica, frenando la expansión de las grietas y devolviendo una estabilidad precaria pero tangible a la estructura.\n\nIllian Vasto no suelta el contacto físico, señalando con un gesto lento y preciso el centro exacto de la red de grietas. Mantiene su tono litúrgico a pesar de la vibración del suelo: \"Tus manos buscan el ancla, pero recuerda que el Aethel-Kore no se estabiliza con fuerza, sino con alineación. No luches contra la fractura; busca el punto donde las líneas convergen en el Vacío Plateado, allí donde la geometría se vuelve silencio\".\n\nAunque el colapso ha sido frenado, la energía del núcleo sigue pulsando con fuerza; si no conseguís cerrar la brecha definitivamente o evacuar la plataforma, la geometría se saturará y estallará en una onda de choque."}, {"jugador": "\"Entiendo, buscaré el silencio en medio de este ruido.\"\n\nCierro los ojos un instante para concentrarme en la vibración y trato de localizar ese punto de convergencia que menciona Illian.\n\n{Religión}", "dm": "La plataforma de piedra blanca vibra con una frecuencia creciente, haciendo que el suelo sea un terreno traicionero e inestable. En el centro, el Aethel-Kore pulsa como un corazón de luz fracturada, arrojando sombras geométricas que se retuercen y se alargan sobre la superficie, burlándose de cualquier intento de encontrar un centro estable. A pesar de la concentración, el punto de convergencia se escapa, deslizándose entre los dedos como arena; la armonía buscada no llega y la estructura vuelve a gemir bajo la presión de la energía.\n\nIllian Vasto mantiene la presión sobre la estructura, sin apartar la mirada del núcleo, con una calma imperturbable que contrasta con la inestabilidad del suelo. \"El silencio no es la ausencia de ruido, sino la aceptación de la frecuencia correcta. No fuerces la vista, deja que la piedra te hable antes de que el Vacío Plateado decida callar para siempre\", sentencia con una serenidad gélida mientras la luz del núcleo se vuelve más errática.\n\nLa saturación energética del Aethel-Kore se acelera tras el intento fallido; la plataforma comienza a fragmentarse en los bordes y la onda de choque es ahora inminente."}, {"jugador": "\"¡No se rinda, maestro! Buscaremos esa frecuencia juntos.\"\n\nCierro los ojos para ignorar el caos visual y trato de sentir la vibración de la piedra bajo mis pies.\n\n{Religión}", "dm": "La vibración ascendente deja de ser un ruido caótico para convertirse en un mapa táctil bajo las plantas de los pies. Al cerrar los ojos, el caos visual desaparece y el punto de convergencia emerge con una claridad absoluta, una nota pura que ancla la voluntad al centro de la tormenta. El Aethel-Kore responde a esa sintonía, estabilizando su pulso en un instante de armonía geométrica.\n\nSin embargo, la estructura física no olvida el trauma del desbordamiento. La plataforma de piedra blanca se resquebraja con chasquidos violentos, abriendo grietas que emiten destellos cian mientras el núcleo sigue pulsando con una fuerza bruta. El aire se ha vuelto denso, cargado de una electricidad estática que eriza la piel y distorsiona los sonidos, convirtiendo cada respiración en un esfuerzo contra la presión atmosférica.\n\nAunque el núcleo está estable, la plataforma física está al límite; las grietas cian se expanden rápidamente y el suelo podría colapsar bajo el peso de la energía estática."}, {"jugador": "\"Mantened la calma, que la luz nos sostenga.\"\n\nIntento buscar algún punto de apoyo sólido o una forma de reforzar la estructura antes de que cedamos.\n\n{Religión}", "dm": "El esfuerzo por anclar la estructura se desvanece en un eco inútil. A pesar de la voluntad puesta en la plegaria, la piedra blanca no responde; las placas irregulares continúan separándose con un gemido mineral, flotando ahora sobre un abismo de energía cian que devora la solidez del suelo. El núcleo late en el centro de un vacío donde los puentes de luz intermitente son la única conexión entre islas de roca inestables que se hunden lentamente.\n\nIllian Vasto permanece inmóvil a pesar de los temblores, con la mirada fija en las grietas cian y la voz proyectada con una calma imperturbable, casi hipnótica: \"El Aethel-Kore ha aceptado tu sintonía, pero la piedra es materia, y la materia tiene memoria del dolor. No busques apoyo en lo que ya se ha roto; el suelo es ahora un espejo fragmentado de la voluntad del cielo.\"\n\nLa fragmentación se acelera. Si no encontráis una ruta de escape o una forma de saltar entre las islas flotantes, quedaréis aislados o caeréis al abismo de energía cian."}, {"jugador": "\"No puedo permitir que este lugar se pierda en el vacío.\"\n\nIntento analizar la naturaleza de esa energía cian y los puentes de luz para encontrar una salida segura.\n\n{Religión}", "dm": "El análisis falla; la energía cian no se entrega a la razón, sino que vibra con una frecuencia desorientadora que nubla los sentidos y hace que los puentes de luz parpadeen como nervios expuestos. Las islas de piedra blanca derivan ahora en un caos geométrico, alejándose unas de otras en un silencio absoluto que solo es roto por el zumbido eléctrico y agresivo del núcleo.\n\nIllian Vasto permanece estática, con los brazos recogidos en las mangas de su túnica y la vista fija en el flujo cian. Sin mirar a Marta, habla con una cadencia lenta que choca contra la urgencia del colapso: \"La voluntad es un ancla noble, pero el Aethel-Kore no entiende de permisos. Mira los puentes, Marta; no son caminos, son hilos de *Sideris-Vael*. No intentes comprender su naturaleza con la razón, siente la frecuencia del pulso. Si no te mueves ahora, tu deseo de salvar este lugar será el único testigo de tu caída.\"\n\nEl caos geométrico se intensifica. Si no abandonáis la plataforma actual, el distanciamiento de las islas os dejará atrapados en un fragmento de roca sin salida antes de que el núcleo termine de desintegrar el entorno."}, {"jugador": "\"No dejaré que este lugar se pierda en el caos.\"\n\nCierro los ojos para ignorar la geometría errática y trato de sintonizarme con el pulso del núcleo, buscando ese hilo de frecuencia que menciona Illian.\n\n{Religión}", "dm": "El ruido visual de la geometría errática desaparece al cerrar los párpados, y en esa oscuridad, la frecuencia del núcleo deja de ser un zumbido agresivo para convertirse en un ritmo tangible. Al sintonizar el espíritu con ese pulso, el hilo de luz se vuelve una guía sólida bajo los pies, permitiendo un tránsito seguro mientras el entorno colapsa.\n\nLa plataforma de piedra blanca vibra violentamente, fragmentándose en ángulos imposibles mientras el flujo cian se convierte en un torrente eléctrico. El abismo entre las islas se ensancha, dejando solo hilos temblorosos de luz que conectan el vacío, pero el camino permanece firme justo donde la voluntad se ha anclado a la frecuencia.\n\nEl torrente eléctrico cian comienza a erosionar los hilos de luz restantes; si no aceleráis el paso hacia la siguiente isla, la conexión se romperá definitivamente, dejándoos aislados en el vacío."}, {"jugador": "\"No permitáis que el miedo os detenga, ¡seguid el pulso!\"\n\nAvanzo con paso firme sobre el hilo de luz, intentando mantener la calma para servir de apoyo a quien me siga.\n\n{Atletismo}", "dm": "El paso firme se quiebra en un instante; el pie resbala sobre la superficie vibrante del hilo de luz y el equilibrio desaparece, dejando el cuerpo a merced de la inercia y el vacío. La piedra blanca de la isla flota en un vacío eléctrico donde la geometría se retuerce, y el suelo vibra con una violencia sorda bajo la presión aplastante de un torrente cian que amenaza con engullirlo todo.\n\nIllian Vasto no grita, pero su tono litúrgico corta el ruido del colapso mientras extiende una mano hacia atrás, intentando estabilizar la posición del grupo. Sus ojos están fijos en la erosión del flujo cian y su voz suena calmada, casi rítmica: \"El pulso es la única verdad ahora... No os distraigáis con el abismo. ¡Sostened el hilo!\".\n\nLa inestabilidad del avance ha retrasado al grupo; el torrente eléctrico cian acelera su erosión y el hilo de luz comienza a desintegrarse bajo vuestros pies."}]}}, {"id": "u1dd3a3", "piloto": false, "lore": "# Muelle Gris\n\n## El pueblo y el muelle\n\nMuelle Gris vive de la pesca y de un puerto pequeño que ningún mapa comercial del reino marca como ruta oficial -demasiado poco profundo para barcos grandes, demasiado alejado de cualquier aduana para que a nadie en la capital le importe vigilarlo de cerca. Durante generaciones, esa misma distancia ha sido la fortuna discreta del pueblo: una parte de lo que entra y sale por Muelle Gris nunca pasa por ningún registro oficial, y el pueblo entero, de una forma u otra, vive un poco mejor gracias a eso.\n\nNadie lo llama contrabando en voz alta. Se llama \"lo de siempre\", y durante años ha bastado con no hablar de ello delante de forasteros.\n\n## La inspección que se acerca\n\nHace ocho días llegó la noticia: la Corona ha nombrado un nuevo inspector de aduanas para toda la costa, con instrucciones explícitas de revisar puertos pequeños que \"llevan demasiado tiempo sin visitar\". Nadie sabe todavía cuándo llegará a Muelle Gris exactamente, pero todos saben que llegará.\n\n**Selmira Ondas**, patrona del muelle y quien más ha coordinado durante años qué barca lleva qué y a quién, cree que la única salida es seguir \"lo de siempre\" con más cuidado que nunca hasta que la inspección pase de largo -parar de golpe ahora, dice, sería como colgar un cartel confesando lo que el pueblo lleva haciendo desde siempre, y dejaría a media Muelle Gris sin ingresos justo cuando más discreción hace falta.\n\n**Osvaldo Prín**, dueño de la única tienda de aparejos del pueblo y voz respetada en las reuniones del muelle, cree exactamente lo contrario: que Muelle Gris debería adelantarse y declarar voluntariamente parte de lo que mueve, antes de que el inspector llegue y encuentre algo que ya no pueda explicarse como descuido. Piensa que una confesión parcial y a tiempo pesa mucho más a favor del pueblo que ser descubiertos con las manos llenas.\n\nNinguno de los dos quiere ver a nadie del pueblo en un calabozo. Ninguno confía del todo en el cálculo del otro.\n\n## El Almacén del Fondeadero\n\nEn un cobertizo apartado, al final del muelle, se guarda lo que Muelle Gris nunca ha declarado en ningún registro: no es gran cosa a ojos de un contrabandista de verdad, pero es más que suficiente para que un inspector con ganas de hacer carrera lo llame delito organizado. Selmira lo administra con una libreta que solo ella sabe leer del todo.\n\n## Gente del pueblo\n\n**Selmira Ondas**, patrona del muelle, defiende seguir como siempre porque un cambio brusco ahora mismo delataría al pueblo entero. **Osvaldo Prín**, tendero de aparejos, defiende declarar algo a tiempo porque prefiere una verdad parcial y controlada a que la descubran completa y sin permiso. **Susa Molledo**, que remienda velas en un banco fijo cerca del muelle, es -por ahora- solo una vecina más; ver \"personas_par12.json\" para el perfil completo de los tres y el molde de promoción de PNJ de paso ya usado en pares anteriores.\n\n## Tono de la campaña\n\n`world_tone`: **`light`**. Ligero pese a la tensión real: nadie en Muelle Gris es un criminal de verdadera maldad, la inspección es un problema serio pero manejable, y hay espacio genuino para el ingenio y el humor en cómo el grupo decida ayudar al pueblo a salir bien parado. Estructura sin precedente en el corpus real -**un mercado negro comunitario amenazado de exposición**, distinta del contrabando marginal y desesperado de los Muelles Bajos de Puerto Salazón (Par 01, resistencia contra un monopolio opresor) porque aquí no hay villano que oprima a nadie: es el propio pueblo, unido, decidiendo cómo protegerse de una ley que llega de fuera.\n", "A": {"previo": "El túnel de rejillas termina abruptamente en un nodo de cables expuestos, donde una puerta de servicio oxidada vibra con una corriente eléctrica constante que llena el aire de ozono. El intento de deslizarse lateralmente es torpe y predecible; Osvaldo Prín ni siquiera parpadea, desplazando el peso de su cuerpo para bloquear el eje del pasillo con una calma gélida, observando la maniobra con un desprecio evidente.\n\nSin moverse ni un centímetro para dejar paso, Prín sentencia con voz cortante: \"El problema de los tratos, muchacho, es que para que haya uno, ambos tenemos que sentir que no estamos siendo estafados. Y ahora mismo, tú solo tienes una mano llena de mis cosas y la otra intentando esquivar la puerta\".\n\nLa paciencia de Prín se ha agotado; cualquier movimiento brusco o intento fallido de negociación llevará al hombre a cerrar el paso definitivamente o a llamar a seguridad.", "turnos": [{"jugador": "\"Tienes razón, Prín. No me gusta que me estafen, y mucho menos que me miren por encima del hombro.\"\n\nSuelto los objetos que he robado sobre el suelo, pero me mantengo alerta, buscando cualquier punto débil en su postura o algún objeto útil a mi alcance.\n\n{Perspicacia}", "dm": "El olor a ozono se vuelve asfixiante en el espacio angosto, mientras las chispas erráticas del nodo de cables iluminan la puerta de servicio con destellos violentos. Los objetos robados golpean el suelo metálico con un ruido seco, quedando esparcidos a los pies de un hombre que no se inmuta ante el gesto.\n\nOsvaldo Prín se mantiene inmóvil, bloqueando el paso con los brazos cruzados. No baja la cabeza para mirar lo que ha sido devuelto; mantiene un contacto visual directo y frío, como si los objetos en el suelo ya no tuvieran valor frente a la falta cometida. \"Tirar las cosas al suelo no es devolverlas, es simplemente dejar de robarlas. No confundas el hecho de que hayas dejado de hacer el daño con que yo haya olvidado que lo intentaste\", sentencia con una calma gélida que no deja espacio a la negociación.\n\nPrín no ha aceptado la restitución como una reparación del daño; cualquier intento más de manipulación o un movimiento brusco provocará que cierre el acceso definitivamente."}, {"jugador": "\"No busco tu perdón, Prín, solo que el camino esté despejado.\"\n\nDoy un paso atrás para darle espacio y levanto las manos en señal de paz, tratando de mantener la compostura.\n\n{Persuasión}", "dm": "Osvaldo Prín no se mueve ni un centímetro para abrir paso. Mantiene los brazos cruzados y la mirada fija, con una calma imperturbable que resulta más asfixiante que la hostilidad gritada. El espacio sigue oliendo a ozono y las chispas del nodo de cables continúan iluminando la escena con destellos violentos, subrayando la tensión del momento.\n\n\"El camino estará despejado cuando yo decida que tu presencia aquí ya no es un riesgo. Que levantes las manos no borra que estuvieras hurgando en mi cinturón hace un instante. Ahora te vas, pero no creas que el silencio es un trato; el Concejo de Aparejos sabrá exactamente cómo has 'visitado' mi tienda\", sentencia sin apartar la vista, cerrando cualquier posibilidad de acuerdo amistoso.\n\nLa actitud de Prín es inflexible; cualquier insistencia en negociar o intentar forzar la salida solo acelerará el reporte formal al Concejo de Aparejos, complicando la estancia en el sector."}, {"jugador": "\"Tú decides el camino, pero yo decido cómo salir.\"\n\nBajo las manos lentamente, pero mientras lo hago, intento deslizarme hacia un lado para buscar una alternativa de salida que no implique pasar por delante de él.\n\n{Sigilo}", "dm": "El intento de esquivar la mirada de Prín fracasa; el movimiento es detectable en el angosto pasillo, donde el olor a ozono se vuelve más denso entre pilas de chatarra tecnológica y el zumbido errático de ventiladores que parecen agonizar. El espacio es demasiado reducido para que el sigilo sea efectivo, y cada roce con el metal oxidado del entorno delata la posición.\n\nOsvaldo Prín no se desplaza ni un milímetro para bloquear el paso, pero gira levemente la cabeza para seguir el desplazamiento con una mirada gélida y vigilante. \"Puedes deslizarte todo lo que quieras, pero no vas a salir de aquí habiendo dejado una mancha en mi tienda que yo no haya registrado\", sentencia con una calma amenazante. \"Hazlo lento, hazlo con cuidado... que no sea necesario que yo te ayude a encontrar la puerta\".\n\nPrín tiene el control total del espacio. Cualquier intento posterior de evasión o un movimiento brusco provocará una intervención física inmediata para forzar la salida del establecimiento."}, {"jugador": "\"No hace falta que me ayudes con la puerta, Prín. Sé perfectamente dónde está.\"\n\nMe detengo en seco y lo miro a los ojos, manteniendo una postura relajada pero alerta.\n\n{Perspicacia}", "dm": "El pasillo se cierra sobre la escena, un túnel claustrofóbico donde el zumbido eléctrico de los circuitos chamuscados y la chatarra electromecánica vibra en el aire, cargando el ambiente de una tensión estática. La postura relajada no sirve de escudo frente a la presencia de Prín; el hombre se mantiene anclado al suelo, con los brazos cruzados y la mirada fija, convirtiéndose en un muro humano infranqueable que bloquea cualquier salida.\n\nSin pestañear, Osvaldo sostiene el contacto visual y su voz corta la vibración del entorno: \"Sé dónde está la puerta, y también sé que ahora mismo te mueres por cruzarla. Pero antes de que pongas un pie fuera de mi propiedad, vas a decirme qué hacías hurgando en mis cosas y dónde demonios has dejado mi libro de cuentas\".\n\nPrín no se moverá hasta obtener respuestas. Cualquier intento de forzar la salida o evadir la pregunta aumentará la hostilidad del tendero, quien ya tiene el control físico del pasillo."}, {"jugador": "\"No tengo ni idea de qué libro hablas, pero no me gusta que me cierren el paso.\"\n\nMe mantengo tranquilo, pero busco algún punto débil en su postura o algún objeto distraído en el pasillo que pueda usar a mi favor.\n\n{Percepción}", "dm": "El pasillo se siente aún más estrecho, una trampa de metal y cables que cuelgan como lianas negras y exhalan un hedor a ozono y aceite rancio. Al intentar analizar la postura de Prín o buscar algún elemento útil entre la chatarra desbordante, la vista se pierde en el caos de trastos acumulados; no hay ningún punto débil evidente ni ningún objeto que pueda ser aprovechado en este momento. Todo en el entorno parece jugar a favor de la inamovilidad del tendero.\n\nOsvaldo Prín no se mueve ni un centímetro. Mantiene los brazos cruzados y el peso equilibrado, con una calma gélida y una mirada que no admite réplicas mientras sentencia: \"No me hables de gustos mientras tienes las manos sucias de mis archivos. He pasado treinta años escuchando a la gente de este muelle, y he aprendido a distinguir el ruido de una mentira a kilómetros. El libro no camina solo; o lo devuelves ahora, o el Concejo de Aparejos se enterará de que tienes una afición muy peligrosa por registrar propiedades ajenas\".\n\nLa paciencia de Prín se agota. Si el jugador insiste en la negación o intenta una maniobra brusca en el espacio reducido, el tendero recurrirá a la fuerza o llamará al Concejo de Aparejos, complicando permanentemente la reputación del personaje en el muelle."}, {"jugador": "\"No me interesa el Concejo ni tus archivos, solo quiero saber qué hay en ese libro que te pone tan nervioso.\"\n\nDoy un paso atrás para ganar espacio y trato de analizar su lenguaje corporal para ver si realmente tiene el apoyo del Concejo o si solo intenta asustarme.\n\n{Perspicacia}", "dm": "El paso hacia atrás despeja la visión y permite observar a Prín desde un ángulo más amplio. En el cuello de botella de chatarra, donde el aire vibra con el zumbido persistente de maquinaria vieja, la postura del tendero revela una grieta. A pesar de su tono gélido, hay una rigidez excesiva en sus hombros y una frecuencia nerviosa en el parpadeo que no encaja con la autoridad de quien cuenta con el respaldo total de una institución. El miedo es real, pero no es miedo al jugador, sino a lo que el libro representa; Prín no está protegiendo un secreto del Concejo, está intentando evitar que el Concejo descubra que él posee ese libro.\n\nDetrás de él, una estantería tambaleante de piezas oxidadas parece el único límite físico antes de que el espacio se vuelva intransitable, subrayando la sensación de encierro. El hombre permanece en silencio, apretando la mandíbula, mientras su mirada vacila por un instante, confirmando que su amenaza sobre el Concejo de Aparejos es, en gran medida, un escudo para ocultar su propia vulnerabilidad.\n\nPrín se siente expuesto. Si el jugador presiona sobre esta debilidad, el tendero podría entrar en pánico y reaccionar de forma impredecible, ya sea intentando deshacerse del libro o recurriendo a la violencia para terminar la conversación."}, {"jugador": "\"Parece que tienes más miedo de que el Concejo se entere de que tienes el libro que de lo que yo pueda hacerte.\"\n\nMe acerco un paso, bajando la voz para que solo él me oiga.\n\n{Persuasión}", "dm": "El intento de acercamiento resulta torpe; el espacio es tan reducido que el movimiento provoca que el hombro choque contra una pila de chatarra, provocando un ruido metálico que resuena en las paredes del callejón. El aire, espeso por el olor a aceite rancio y ozono, parece cerrarse sobre la escena mientras el zumbido de la maquinaria lejana se vuelve más insistente.\n\nOsvaldo Prín no cede ante la insinuación. En lugar de quebrarse, el tendero se tensa, recuperando una máscara de frialdad absoluta. Su mirada se clava con hostilidad, endureciendo la mandíbula y cerrando cualquier espacio para la negociación. El silencio que sigue es gélido, roto únicamente por el goteo de algún fluido industrial sobre el metal oxidado.\n\nLa actitud condescendiente ha cerrado la vía del diálogo. Prín ahora ve el intento de manipulación como una amenaza directa a su seguridad, lo que lo empuja a buscar una salida rápida y agresiva para terminar el encuentro."}, {"jugador": "\"Vaya, parece que no estamos de humor para charlas.\"\n\nDoy un paso atrás para recuperar espacio y busco algún objeto en su cinturón o bolsillos que pueda distraerlo o servirme.\n\n{Percepción}", "dm": "El paso hacia atrás es insuficiente para compensar la tensión del momento. A pesar del esfuerzo por analizar el equipo del tendero, la mirada hostil de Osvaldo Prín actúa como un muro; su postura es cerrada y sus manos se mantienen firmes, ocultando cualquier objeto útil bajo los pliegues de su ropa industrial. No hay nada a la vista que pueda ser aprovechado para una distracción rápida, solo la fría determinación de un hombre que ya no quiere escuchar.\n\nPrín permanece inmóvil, con la mandíbula apretada y los ojos fijos, rechazando cualquier intento de interacción. El silencio vuelve a instalarse en el callejón, cargado de una electricidad estática que hace que el vello de los brazos se erice, mientras el ruido de la maquinaria lejana parece marcar el ritmo de una paciencia que se ha agotado definitivamente.\n\nLa falta de resultados y la insistencia en husmear han terminado de irritar a Prín. El tendero ya no ve un interlocutor, sino un estorbo peligroso que debe ser removido de su camino inmediatamente."}]}, "B": {"previo": "Justo cuando tus dedos cierran el agarre sobre el pergamino para retirarlo, el cuero de la bolsa se engancha en una costura del uniforme. El tirón brusco provoca que la bolsa caiga al suelo con un golpe seco y sordo contra las tablas de madera del muelle, justo en el momento en que el guardia se detiene y gira la cabeza hacia atrás.\n\nEl hombre frunce el ceño, alertado por el ruido, y comienza a caminar a paso rápido en tu dirección, escudriñando el espacio entre los fardos de algodón con una expresión de sospecha.", "turnos": [{"jugador": "\"Maldita sea.\"\nMe lanzo al suelo para recuperar la bolsa y el pergamino rápidamente antes de que el guardia llegue a mi posición.\n{Acrobacias}", "dm": "Te deslizas con agilidad felina, fundiéndote con las sombras y el polvo debajo de los fardos justo cuando el guardia llega al lugar del impacto. Tus dedos atrapan el pergamino y la bolsa en un movimiento fluido, desapareciendo de la vista del hombre un instante antes de que sus botas golpeen la madera exactamente donde estabas hace un segundo.\n\nEl guardia se detiene en seco y se inclina, escudriñando el suelo vacío con el ceño fruncido. Mira a izquierda y derecha, confundido por el ruido pero sin encontrar rastro de nada ni de nadie entre las balas de algodón. Suelta un bufido de irritación y, tras un momento de duda, comienza a alejarse lentamente, aunque mantiene la cabeza girada, alerta."}, {"jugador": "Sigo agazapado, sin hacer ruido, esperando a que el guardia se aleje lo suficiente para que su espalda esté totalmente expuesta.\n\n{Sigilo}", "dm": "El aire huele a salitre y algodón húmedo mientras permaneces inmóvil, sintiendo el roce de las fibras contra tu ropa. Las botas del guardia resuenan con un eco sordo sobre la madera, alejándose paso a paso. El hombre sigue lanzando miradas rápidas sobre su hombro, pero la distancia crece y su silueta se vuelve más pequeña contra la luz del muelle.\n\nFinalmente, el guardia da la espalda por completo, convencido de que el ruido ha sido solo una jugarreta del viento o una rata despistada. El entorno vuelve a sumirse en el silencio habitual del puerto, roto únicamente por el graznido lejano de las gaviotas y el chapoteo del agua contra los pilares."}, {"jugador": "Me deslizo fuera de las fibras con cuidado, tratando de no hacer ruido. Me acerco al guardia por la espalda para sorprenderlo.\n\n{Sigilo}", "dm": "Al intentar deslizarte, una de las pesadas fibras de algodón se engancha con fuerza en tu bota, tirando de ti hacia atrás con un sacudón brusco. El movimiento provoca que tropieces y caigas pesadamente contra una pila de cajas de madera vacías, que se desploman con un estruendo seco y ensordecedor que retumba en todo el muelle.\n\nEl guardia se detiene en seco y gira sobre sus talones con el rostro desencajado por la sorpresa. Su mano vuela a la empuñadura de la espada mientras clava la mirada en ti, con los ojos muy abiertos y una expresión de pura irritación.\n\n—¡Pero qué demonios...! —exclama, dando un paso rápido hacia adelante—. ¡Tú! ¡Identifícate ahora mismo o te arrestaré por intrusión!"}, {"jugador": "\"Solo estoy buscando un lugar donde descansar, buen hombre. No busco problemas.\"\n\nMe levanto rápidamente de entre las cajas, tratando de parecer confundido y no culpable.\n\n{Engaño}", "dm": "El guardia no se mueve ni un centímetro, manteniendo la mano apretada sobre la empuñadura de su arma. Sus ojos recorren el desorden de las cajas y luego se clavan en tu postura, analizando cada gesto con un escepticismo gélido. Una ceja se arquea mientras una mueca de desprecio curva sus labios.\n\n—¿Descansar? —escupe con voz cortante—. Descansarías en una posada o en el suelo del mercado, no deslizándote entre la carga del muelle como una rata de alcantarilla. No me tomes por idiota. ¡Al suelo, ahora!"}, {"jugador": "\"No soy ninguna rata, aunque sé moverme mejor que tú por aquí.\"\n\nMe deslizo rápidamente hacia un lado, intentando flanquearlo para salir de su alcance.\n{Acrobacias}", "dm": "El guardia comienza a abrir la boca para soltar otra reprimenda, pero el movimiento es tan fluido y repentino que solo alcanza a ver un borrón de ropa y polvo. Te deslizas por el espacio reducido entre las cajas con una agilidad felina, aprovechando el ángulo muerto del hombre y dejando que la inercia te impulse lejos de su alcance.\n\nValerius reacciona con un gruñido de sorpresa, girando el cuerpo bruscamente mientras su mano aprieta el arma, pero solo encuentra el aire donde hace un segundo estabas tú. Se queda congelado un instante, con la mirada perdida en el hueco que dejaste, mientras el eco de tu comentario aún flota en el aire salitre del muelle."}, {"jugador": "\"No te molestes en girar, Valerius. Ya no estoy donde me quieres.\"\n\nSigo corriendo hacia la zona más oscura de los almacenes para desaparecer de su vista.\n{Sigilo}", "dm": "Tus pasos no producen sonido alguno sobre las tablas gastadas del muelle, fundiéndote con las sombras proyectadas por las pilas de redes y barriles de brea. El aire se vuelve denso, cargado de olor a pescado seco y madera podrida, mientras te deslizas entre los intersticios de los almacenes como una mancha más de oscuridad en la penumbra.\n\nDetrás de ti, el grito de Valerius rompe el silencio, cargado de una furia contenida y frustración. \"¡Vuelve aquí, rata! ¡No llegarás lejos en este puerto!\", ruge el guardia, pero su voz suena distante, ya amortiguada por las paredes de madera y los fardos de tela que ahora te sirven de escudo. El sonido de sus botas golpeando la madera se aleja en la dirección opuesta, confundido por el laberinto de cajas."}, {"jugador": "\"Sigue gritando, idiota.\"\n\nMe deslizo rápidamente hacia la zona más oscura entre los almacenes para desaparecer por completo de su vista.\n\n{Sigilo}", "dm": "Te fundes con la negrura de un callejón estrecho, donde el olor a salitre se mezcla con el moho de las paredes. El espacio es tan angosto que los fardos de tela rozan tus hombros, pero el vacío de luz te envuelve por completo, convirtiéndote en una extensión más de los muros húmedos.\n\nA unos metros, el eco de las botas de Valerius se detiene bruscamente. Se escucha un gruñido de irritación y el sonido de una espada chocando contra una armadura mientras el guardia maldice entre dientes. \"Maldito seas... te encontraré, no importa dónde te escondas\", sisea su voz, ahora mucho más cercana, pero incapaz de localizar el punto exacto donde te has desvanecido."}, {"jugador": "\"Sigue buscando, idiota.\"\nMe deslizo en silencio hacia la salida del callejón para intentar flanquearlo sin que me vea.\n{Sigilo}", "dm": "Tus pasos son apenas un susurro sobre la piedra húmeda, fundiéndote con las sombras que proyectan los fardos de tela. El roce de tu ropa contra las paredes es imperceptible, y el sonido de tu movimiento queda enmascarado por el lejano bullicio del puerto y el goteo constante del moho.\n\nValerius permanece inmóvil, con la respiración agitada y la mano apretando el pomo de su espada, mirando fijamente hacia el vacío donde te vio por última vez. Sus ojos recorren el callejón con desconfianza, pero no detectan tu avance. Logras alcanzar la salida del callejón y asomarte al borde de la calle, quedando justo a sus espaldas mientras él sigue maldiciendo en voz baja, ajeno a tu nueva posición."}]}}, {"id": "u2c0955", "piloto": false, "lore": "# Sal Negra\n\n## El pueblo y la sal\n\nSal Negra vive de una sal oscura, casi violeta, que solo se da en las salinas de la vertiente norte y que los cocineros de tres reinos pagan al peso de la plata. El pueblo son ochocientas personas, una refinería, una mina de sal gema y una única plaza donde la gente se saluda con la cabeza, sin palabras, desde que empezaron las muertes.\n\nHace cuarenta días, treinta y un vecinos enfermaron en una sola semana tras comer con sal del último lote refinado. Los treinta y uno murieron. Los médicos que vinieron de fuera dijeron que era veneno.\n\n## Lo que salió mal\n\nSe detuvo a una sola persona: **Inés Solana**, refinadora de la sala de purificación, que trabajó en el lote del que salió la sal contaminada. Desde entonces está en la cárcel del pueblo, sin haber dicho ni una palabra en su defensa.\n\nEl Tribunal Superior ha enviado a un Juez Visitador con autoridad para juzgar el caso y dictar sentencia. Llega un día después de que se cumplan los cuarenta días del duelo, y la ley del reino es clara: el juicio debe abrirse antes de que termine la estación de la sal, y la sentencia, una vez dictada, no admite apelación.\n\n## Sentencia o verdad\n\n**Rosendo Pardo**, capataz de la mina y viudo desde hace cuarenta días, portavoz de las familias de los muertos, exige sentencia sin más demora: treinta y un vecinos no van a esperar a que un tribunal de fuera «estudie» lo que ya saben todos, y el pueblo, dice, está a un mal día de hacer justicia por su cuenta. Lo dice sin gritar y con los ojos secos de quien ya ha llorado todo.\n\n**Aldonza Cárcava**, abogada nombrada de oficio para la defensa, pide que el juicio no se cierre sin una investigación completa: una acusada que no dice nada no es una culpable confesa, hay demasiadas preguntas sobre cómo llegó el veneno a la sal y cuestionar una sentencia irrevocable después de ejecutada ya no sirve para nada. Lo dice con voz serena y un legajo bajo el brazo.\n\nAmbos quieren justicia. Ninguno confía en que el otro sepa qué significa.\n\n## La galería inferior\n\nEn lo más hondo de la mina, la galería inferior lleva tres meses cerrada por una inundación que la empresa dice haber resuelto. Los mineros que trabajaban allí fueron reasignados sin explicaciones. Nadie ha bajado desde entonces.\n\n## Gente del pueblo\n\n**Rosendo Pardo**, capataz, defiende sentencia inmediata para las familias de los muertos. **Aldonza Cárcava**, abogada de oficio, defiende una investigación completa antes de sentenciar. **Inés Solana**, la acusada, guarda silencio; ver «personas_par23.json» para el perfil de los tres, incluido el de la que no habla.\n\n## Tono de la campaña\n\n`world_tone`: **`grimdark`**, registro **`serious`**. Solemne y grave, sin ironía: el peso está en la justicia, en el dolor concreto de las familias y en la posibilidad de equivocarse de manera irreparable. Las escenas se cuentan con contención y sobriedad, dando lugar al silencio y al procedimiento. Estructura sin precedente en el corpus: **un proceso judicial con sentencia irrevocable** y un dilema entre la justicia para las víctimas y la verdad completa; distinto de las disputas comunitarias de otros pares porque aquí una persona concreta puede morir si el Juez se equivoca.\n", "A": {"previo": "El golpe impacta, pero no con la fuerza necesaria para quebrar la voluntad de acero de la criatura. El metal resiste, desviando la trayectoria del ataque en un choque sordo que no logra asestar el golpe definitivo. El pasillo se ha convertido en un caos de metal retorcido y aceite negro que sube por los tobillos, mientras el aire vibra con el silbido agudo de la presión hidráulica acumulándose en las paredes.\n\nLa masa blindada no responde; solo se escucha el sonido metálico de una placa chocando contra el suelo mientras intenta, torpemente, recuperar el equilibrio. Un chispazo eléctrico recorre su brazo derecho, dejándolo inerte por un instante, pero el silencio persiste: \"...\", una ausencia de voz que se funde con el chirrido de las tuberías.\n\nEl aceite negro comienza a subir más rápido y el silbido de las paredes se vuelve un grito; la presión hidráulica está a punto de reventar, lo que podría aplastar a cualquiera que permanezca en el pasillo.", "turnos": [{"jugador": "\"Tu silencio no oculta tu naturaleza, solo la hace más patética.\"\n\nAprovecho que la criatura ha perdido el equilibrio y el brazo para asestar un golpe decisivo.\n\n{Ataque}", "dm": "El impacto es seco, insuficiente. El golpe choca contra el chasis de la criatura, pero el metal, aunque abollado y sucio, absorbe la energía sin ceder. La masa blindada se tambalea, pero recupera la estabilidad con un movimiento brusco y pesado que desplaza el aceite negro acumulado en el suelo, salpicando las botas y las paredes del pasillo.\n\nNo hay respuesta a las palabras, ni un solo sonido que emane de su interior. El PNJ permanece inmóvil, observando con una vacuidad mecánica mientras el brazo inerte cuelga a un costado, balanceándose al ritmo de los espasmos hidráulicos que sacuden la estructura del lugar.\n\nEl aceite negro ya alcanza las pantorrillas y el silbido de las tuberías ha pasado a ser un rugido ensordecedor; la presión hidráulica está en el límite y el colapso del pasillo es inminente."}, {"jugador": "\"No eres más que chatarra oxidada.\"\n\nIgnoro la criatura y busco desesperadamente una válvula o palanca en las paredes para liberar la presión del pasillo.\n\n{Investigación}", "dm": "Los dedos encuentran el metal frío y grasiento de una palanca oculta tras una rejilla deformada. Al tirar de ella con fuerza, el mecanismo cede con un chasquido violento, liberando una descarga de vapor hirviente que silba a través de las juntas y detiene, momentáneamente, el rugido ensordecedor de las tuberías.\n\nLa masa blindada reacciona al movimiento. Un sonido metálico, como un engranaje saltando un diente, emite un chirrido seco. No hay palabras, solo el ruido de una válvula hidráulica abriéndose violentamente en el interior de su chasis mientras gira la cabeza lentamente hacia donde se encuentra la palanca. \"...\", el silencio de la máquina es absoluto, interrumpido únicamente por el goteo rítmico del aceite negro sobre el suelo.\n\nEl vapor ha despejado la vista, pero el ruido del mecanismo ha alertado a la masa blindada; la criatura ya no permanece inmóvil y el camino de salida sigue bloqueado por su volumen metálico."}, {"jugador": "\"No eres más que un montón de chatarra en el camino de la justicia.\"\n\nSaco mi arma y me planto frente a la máquina, preparándome para el choque.\n\n{Iniciativa}", "dm": "El arma se siente pesada, pero la determinación se quiebra cuando el tiempo parece dilatarse y los reflejos fallan. El intento de ganar la posición es torpe; el pie resbala en una mancha de aceite negro y la postura se desmorona justo cuando el aire se vuelve denso. El pasillo industrial, saturado de tuberías que gotean un fluido viscoso, se cierra sobre el espacio disponible mientras el vapor se disipa lentamente.\n\nFrente a los ojos, la silueta masiva y oxidada de la máquina emerge de la bruma, bloqueando la única salida con una inmovilidad opresiva. No hay respuesta al insulto, solo el chirrido del metal contra el metal y la certeza de que el volumen blindado es ahora un muro infranqueable que domina el corredor.\n\nLa falta de iniciativa deja al personaje expuesto y fuera de posición; la máquina blindada tiene la ventaja táctica para iniciar el ataque antes de que pueda disparar."}, {"jugador": "\"Maldito montón de chatarra.\"\n\nMe levanto rápidamente del suelo, ignorando el aceite, y me planto frente a la máquina con el arma en alto para bloquear cualquier golpe.\n\n{Ataque}", "dm": "El metal choca contra el metal con un estrépito ensordecedor que reverbera en las paredes del pasillo industrial. El arma, levantada a tiempo, intercepta el embate, desviando la fuerza bruta del golpe y evitando que el impacto sea devastador. El suelo, resbaladizo por el aceite negro, vibra bajo los pies mientras el fluido viscoso que gotea de las tuberías salpica el blindaje oxidado de la máquina.\n\nLa entidad no emite sonido alguno, ni siquiera un gruñido mecánico ante el insulto. Solo se escucha el siseo hidráulico de un pistón activándose, un movimiento gélido y preciso que precede al impacto seco del metal contra el cuerpo, una fuerza inerte que no reconoce la voluntad humana ni la rabia, limitándose a ejecutar su función con una eficiencia aterradora.\n\nA pesar del bloqueo, lamasa blindada mantiene su posición dominante en el estrecho corredor; cualquier error en el siguiente movimiento permitirá que la máquina use su peso para aplastar la defensa."}, {"jugador": "\"No eres más que una herramienta rota.\"\n\nAprovecho la inercia del bloqueo para intentar empujar la máquina hacia atrás y ganar espacio.\n\n{Atletismo}", "dm": "El impulso del bloqueo se transforma en una fuerza coordinada que choca contra el chasis de la máquina. Con un esfuerzo bruto, el metal oxidado cede ante la presión, y la masa blindada retrocede varios pasos, sus articulaciones emitiendo un chirrido agudo que rebota en las paredes del pasillo industrial. El espacio ganado es mínimo, pero suficiente para dejar de sentir el aliento gélido del acero.\n\nAlrededor, el entorno sigue su curso implacable; las tuberías saturadas continúan goteando aceite negro sobre el suelo, creando charcos viscosos que reflejan la luz mortecina. El silencio que sigue al empujón es sepulcral, roto únicamente por el rítmico y lento goteo del fluido industrial que cae sobre el metal corroído.\n\nLa máquina ha recuperado el equilibrio y comienza a recalibrar su centro de gravedad; si no se aprovecha la distancia para flanquearla o atacar un punto débil, cargará con todo su peso para cerrar el hueco."}, {"jugador": "\"No retrocedas ahora que tenemos espacio.\"\n\nAprovecho la distancia para moverme rápidamente hacia el lateral de la máquina, buscando un ángulo muerto en su blindaje.\n\n{Ataque}", "dm": "El movimiento es preciso y veloz, aprovechando el vacío dejado por el retroceso de la máquina. El acero del blindaje, corroído por el tiempo y la salitre, no ofrece la resistencia esperada; el golpe impacta con fuerza bruta en el ángulo muerto, provocando un estrépito metálico que resuena en todo el pasillo industrial. El chasis de la masa blindada se sacude violentamente, perdiendo la estabilidad mientras el aceite negro salpica las paredes de metal.\n\nEl entorno reacciona al impacto con un eco ensordecedor que se pierde entre el goteo constante de las tuberías. La máquina emite un zumbido eléctrico errático, una vibración que se siente en las plantas de los pies, mientras intenta compensar la inercia del golpe en el espacio estrecho y asfixiante del corredor.\n\nLa estructura interna de la máquina ha sufrido un daño visible, pero el sistema de emergencia está activando un protocolo de purga térmica; si no se remata el núcleo ahora, el calor irradiado hará imposible mantenerse cerca del blindaje."}, {"jugador": "\"No te levantarás.\"\n\nAprovecho el desequilibrio de la máquina y golpeo con toda mi fuerza el núcleo expuesto para destruirlo antes de que el calor me obligue a retroceder.\n\n{Ataque}", "dm": "El golpe impacta, pero el núcleo se resiste; el metal no cede y la fuerza del impacto es absorbida por la inercia del chasis, que vuelve a estabilizarse con una brusquedad gélida. En el pasillo industrial, donde el aceite negro gotea desde el techo sobre el metal corroído, el aire comienza a vibrar con un calor creciente y errático que vuelve la atmósfera asfixiante.\n\nLa masa blindada emite un sonido metálico y seco, como una válvula cerrándose violentamente: \"...\". No hay palabras, solo un espasmo mecánico. Un siseo agudo rasga el silencio mientras el vapor térmico brota violentamente de las juntas del blindaje, creando una barrera de calor blanco que empuja el cuerpo hacia atrás.\n\nEl vapor térmico ahora es una cortina abrasadora; intentar acercarse al núcleo sin protección resultará en quemaduras graves, y la máquina comienza a recuperar su operatividad ofensiva."}, {"jugador": "\"No me apartarás de mi camino con un poco de vapor.\"\n\nMe planto firmemente, apretando los dientes y resistiendo el empuje del calor para no retroceder.\n\n{Atletismo}", "dm": "La voluntad se impone al instinto de supervivencia. A pesar del siseo abrasador, los pies se clavan en el metal oxidado y el cuerpo resiste la embestida del vapor, manteniendo la posición frente a la masa blindada. El esfuerzo es extenuante; el calor calcina el aire y la bruma blanca, espesa y hirviente, envuelve el pasillo industrial, distorsionando la visión y convirtiendo el entorno en un horno de aceite y metal.\n\nLa máquina permanece inmóvil tras la cortina térmica, sumida en un silencio mecánico mientras el vapor continúa brotando de sus juntas, pero el terreno ha sido ganado. El espacio entre el cuerpo y el núcleo se ha reducido, y la presión del aire saturado vibra contra la piel.\n\nLa máquina ha terminado su purga y el vapor comienza a disiparse, revelando que el núcleo está ahora expuesto y vulnerable, pero el blindaje está reiniciando sus sistemas de ataque."}]}, "B": {"previo": "El rastro de aceite corta la penumbra del canal como una herida abierta, reflejando destellos violetas que no provienen de ninguna fuente de luz visible. Mientras avanzas, el goteo rítmico se funde con un sonido nuevo: un siseo casi imperceptible, como si el aire mismo estuviera siendo succionado hacia un punto concreto.\n\nAl doblar la esquina de un muro descascarillado, el flujo se detiene abruptamente en una cuenca de piedra tallada. Allí, suspendido a unos centímetros del agua, flota un fragmento de cristal negro que late con una luz fría y rítmica. El cristal no solo atrae el aceite, sino que parece estar consumiendo la ceniza irisada que el agua arrastra, integrándola en su estructura mediante filamentos de energía que vibran en la misma frecuencia discordante que sentiste en tus dedos.", "turnos": [{"jugador": "\"Esto no pertenece a este mundo.\"\n\nMe acerco al cristal negro con cautela, manteniendo la mano sobre el pomo de mi arma, e intento comprender la naturaleza de esa energía.\n\n{Arcanos}", "dm": "Te acercas al fragmento, sintiendo cómo el aire se vuelve denso y gélido a medida que reduces la distancia. Al observar los filamentos de energía y el pulso rítmico del cristal, intentas desgranar la arquitectura mágica que sostiene aquel fenómeno, pero la frecuencia es demasiado ajena. El flujo de poder no sigue los patrones conocidos de la urdimbre; es una vibración caótica que se resiste a cualquier categorización académica o intuitiva, dejándote solo con la certeza de que su funcionamiento es opaco y perturbador.\n\nEl siseo se intensifica mientras el cristal absorbe una nueva racha de ceniza irisada, expandiendo brevemente sus filamentos hacia el agua. El reflejo violeta del aceite comienza a agitarse, formando pequeños vórtices alrededor de la cuenca de piedra, como si la presencia del objeto estuviera empezando a distorsionar la gravedad inmediata del lugar."}, {"jugador": "\"Esto no pertenece a este mundo.\"\n\nEstiro la mano para tocar el cristal, ignorando el frío, buscando sentir la naturaleza de esa vibración caótica.\n\n{Religión}", "dm": "Tus dedos rozan la superficie del cristal y un choque gélido, similar al de sumergir la mano en nitrógeno, te recorre el brazo. La vibración caótica que percibías se traduce en un zumbido ensordecedor que resuena no en tus oídos, sino directamente en la base de tu cráneo. Buscas en tu conocimiento sagrado algún rastro de esta energía, alguna plegaria o dogma que explique tal aberración, pero el vacío es absoluto; no hay rastro de esta frecuencia en los textos ni en los mitos que conoces.\n\nAl retirar la mano, notas que la piel de tus yemas ha quedado blanquecina y entumecida, desprovista de sensibilidad. El cristal, imperturbable, continúa absorbiendo la ceniza irisada, y los vórtices de aceite violeta a sus pies cobran fuerza, succionando pequeñas piedras y sedimentos hacia el centro de la cuenca con un gorgoteo rítmico y hambriento."}, {"jugador": "\"Esto no es obra de ninguna divinidad conocida.\"\n\nRetiro la mano y observo con detenimiento el patrón de los vórtices de aceite violeta para entender cómo succionan los sedimentos. \n{Investigación}", "dm": "Te quedas inmóvil, observando el flujo viscoso del aceite violeta. Intentas descifrar la lógica geométrica de los vórtices y la cadencia de su succión, buscando un patrón físico o mágico que explique el movimiento, pero el caos es absoluto. El líquido se retuerce en ángulos imposibles y las piedras son arrastradas en espirales que parecen contraerse y expandirse simultáneamente, desafiando cualquier principio de hidrodinámica que recuerdes.\n\nEl gorgoteo rítmico continúa, ahora más profundo, mientras el aceite parece palpitar como un corazón oscuro. El sedimento desaparece en el centro de la cuenca sin dejar rastro, dejando tras de sí solo un rastro de espuma irisada que se disuelve rápidamente en la penumbra."}, {"jugador": "\"Esto no es naturaleza, es una aberración.\"\n\nMe acerco al borde de la cuenca para intentar comprender el origen de este flujo.\n{Arcanos}", "dm": "Te inclinas sobre el borde de la cuenca, donde el aire se vuelve pesado y huele a ozono y descomposición química. Al intentar desgranar la esencia arcana del fluido, los patrones se resisten a cualquier categorización conocida; el aceite violeta no fluye según una corriente mágica detectable, sino que parece existir en una frecuencia que repele la comprensión lógica.\n\nLa superficie irisada devuelve un reflejo distorsionado de tu rostro, pero el movimiento del líquido es errático, una cacofonía de impulsos que no dejan rastro de un conjuro activo ni de una fuente de energía identificable. Solo queda la certeza de que el flujo obedece a leyes que no pertenecen a este plano."}, {"jugador": "\"Leyes ajenas a este mundo... una aberración que no puede permitirse el lujo de permanecer oculta.\"\n\nSumerjo la mano en el fluido violeta para sentir su naturaleza y ver si puedo extraer una muestra.\n\n{Arcanos}", "dm": "Al sumergir la mano, el líquido no se siente como aceite ni como agua, sino como una presión gélida y vibrante que envuelve tu piel. El fluido se aferra a tus dedos con una tensión superficial antinatural, trepando por tu muñeca en filamentos que parecen buscar los poros de tu carne. A medida que concentras tu mente, el caos del flujo se ordena brevemente: percibes que el líquido no es una sustancia, sino una herida abierta en la realidad, un conducto que drena la entropía de un lugar donde el tiempo no es lineal.\n\nLogras cerrar el puño con precisión, atrapando una esfera de la sustancia que se resiste a separarse de la cuenca, estirándose como un tendón translúcido antes de romperse con un chasquido sordo. El fragmento violeta ahora palpita en tu palma, emitiendo un zumbido persistente que resuena en tus dientes y deja un rastro de escarcha negationista sobre tu piel."}, {"jugador": "\"Una aberración que drena la realidad misma. No puede quedar oculta.\"\n\nObservo la esfera violeta con detenimiento, buscando cualquier patrón o signo que revele su origen.\n\n{Arcanos}", "dm": "La esfera palpita con una irregularidad orgánica, pero sus reflejos internos son caóticos. Al intentar diseccionar su naturaleza con la mente, los patrones se deshacen antes de que puedas fijarlos; el zumbido que resuena en tus dientes se intensifica, convirtiéndose en un ruido blanco que nubla tu capacidad de análisis. La sustancia parece rechazar activamente ser comprendida, deslizándose entre tus dedos como si intentara borrar el rastro de tu observación.\n\nLa escarcha que cubre tu piel comienza a extenderse, volviéndose más opaca y fría. No logras descifrar el origen de la aberración ni el propósito de su diseño, solo confirmas que su presencia es un insulto a las leyes naturales que conoces."}, {"jugador": "\"Esto no pertenece a este mundo.\"\n\nSujeto la esfera con más fuerza, obligándome a soportar el frío y el ruido blanco para no dejar que se escape.\n\n{Atletismo}", "dm": "La esfera se resbala con una fluidez aceitosa, ignorando la presión de tus dedos. Al intentar cerrarte sobre ella, el objeto vibra con una intensidad violenta que repele tu agarre, deslizándose hacia el suelo con un sonido sordo y húmedo. El esfuerzo solo ha servido para que el frío penetre más profundamente en tus articulaciones, dejando tus manos entumecidas y torpes.\n\nEl artefacto queda ahora a unos pasos de ti, pulsando débilmente sobre la piedra fría. La escarcha que ha colonizado tu piel se vuelve más densa, formando cristales opacos que crujen con cada uno de tus movimientos."}, {"jugador": "\"No me rechazarás dos veces.\"\n\nIgnoro el entumecimiento de mis manos y me lanzo hacia delante para intentar atrapar la esfera contra el suelo, usando mi peso para inmovilizarla.\n\n{Atletismo}", "dm": "Te lanzas con un impulso brusco, ignorando el crujido de la escarcha en tu piel. El impacto de tu cuerpo contra el suelo es seco, y el peso de tu torso cae con precisión sobre la superficie curva del objeto. La esfera emite un gemido sordo, una vibración que resuena en tus costillas, pero esta vez no logra deslizarse; queda atrapada entre la piedra fría y la presión de tu pecho.\n\nEl objeto late bajo ti, transmitiendo un frío glacial que comienza a traspasar la ropa y la carne, mientras la superficie aceitosa se adhiere a tu vestimenta como un pegamento gélido. La esfera ha dejado de luchar, quedando inmovilizada en el centro de tu peso, aunque el aire a tu alrededor comienza a espesarse con una bruma blanquecina."}]}}, {"id": "u342c81", "piloto": false, "lore": "# Solar Viejo\n\n## El pueblo y la casa solariega\n\nSolar Viejo creció alrededor de El Solar, la casa señorial de piedra clara que ha dado nombre, trabajo y cierta protección al pueblo entero durante cinco generaciones de la familia que la habitó. Quien fuera dueña de El Solar administraba también las tierras de cultivo que rodean el pueblo, arrendadas a precio justo desde hace tanto tiempo que casi nadie recuerda ya que podría ser de otra manera.\n\nDoña Rosalina del Solar, última de su línea directa, murió hace tres semanas sin haber dejado testamento escrito -algo impropio de ella, que llevaba años enferma y con tiempo de sobra para prepararlo todo. No dejó ningún documento. Dejó, en cambio, dos personas con un reclamo igual de legítimo sobre El Solar y las tierras que administra.\n\n## Dos reclamos, ninguna mentira\n\n**Herminia Solar**, sobrina de Rosalina por línea de sangre directa, es la heredera natural según la costumbre del condado en ausencia de testamento: cuando no hay voluntad escrita, la sangre decide, y ningún notario del condado discutiría su derecho si las cosas quedaran ahí.\n\n**Doroteo Vann** no comparte una sola gota de sangre con la familia Solar, pero Rosalina lo acogió y crió como propio hace treinta años, tras la muerte de sus padres, mediante un prohijamiento formal reconocido por la costumbre del condado tanto como la herencia de sangre -aunque mucho menos invocado, y por eso mismo más difícil de probar sin el documento original, que nadie ha encontrado todavía. Doroteo sostiene que Rosalina, en sus últimos meses, le dijo más de una vez y delante de testigos que El Solar sería suyo -pero una promesa hablada no es un papel firmado, y él lo sabe mejor que nadie.\n\nHerminia no niega el cariño real entre Rosalina y Doroteo. Doroteo no niega que la costumbre, sin pruebas, favorece a Herminia. Ninguno de los dos ha faltado a la memoria de Rosalina acusando al otro de nada.\n\n## El tribunal que se acerca\n\nEl tribunal de sucesión del condado se reúne en pocos días para fallar sobre El Solar si nadie presenta pruebas nuevas antes de esa fecha. Sin el documento de prohijamiento o algo que lo respalde, la costumbre del condado fallará automáticamente a favor de la línea de sangre -no porque el tribunal dude de la palabra de Doroteo, sino porque una costumbre sin papel que la sostenga no es, legalmente, una costumbre invocable.\n\n## La Carta Perdida\n\nEn algún lugar entre la capilla familiar donde descansa Rosalina y el archivo del notario del pueblo, podría existir todavía el documento de prohijamiento original -o Rosalina pudo haberlo destruido, perdido, o nunca haber llegado a formalizarlo del todo pese a sus palabras. Qué hay de verdad ahí es algo que este documento no decide de antemano.\n\n## Gente del pueblo\n\n**Herminia Solar**, sobrina de sangre, defiende su derecho porque la costumbre del condado lo respalda sin necesidad de ningún papel adicional. **Doroteo Vann**, hijo de crianza, defiende la voluntad real de Rosalina porque la vivió de cerca durante treinta años, aunque no pueda probarla con un documento. **Baldor Enna**, que cuida los caballos de El Solar desde que era niño, es -por ahora- solo un vecino más; ver \"personas_par15.json\" para el perfil completo de los tres y el molde de promoción de PNJ de paso ya usado en pares anteriores.\n\n## Tono de la campaña\n\n`world_tone`: **`heroic`**. Heroico porque ambos reclamantes actúan de buena fe y con cariño genuino hacia la memoria de Rosalina, sin que ninguno recurra a la mentira o al sabotaje para ganar. Estructura sin precedente en el corpus real -**una disputa de herencia sobre una propiedad ancestral**, distinta de la disputa de sucesión política de Vado Cabrero (Par 05, un cargo se gana por mérito demostrado en una prueba pública) porque aquí no hay prueba que superar: hay un documento que puede o no existir, y una carrera contra el tiempo del tribunal para encontrarlo.\n", "A": {"previo": "La criatura emite un gorgoteo ahogado mientras el acero atraviesa su núcleo gelatinoso con un sonido sordo. El impacto final provoca una reacción en cadena: el núcleo estalla en una descarga de luz pálida y el cuerpo de la aberración pierde cohesión instantáneamente, deshaciéndose en un charco de moco inerte y translúcido que se extiende bajo tus botas.\n\nEl silencio regresa al lugar, roto solo por el eco de tus palabras y el goteo de la viscosidad que resbala por el arma. El aire, antes cargado de un olor a ozono y podredumbre, comienza a aclararse mientras los restos de la masa se evaporan lentamente, dejando tras de sí una mancha blanquecina sobre el pavimen
