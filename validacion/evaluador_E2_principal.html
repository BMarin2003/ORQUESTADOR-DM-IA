rente al abismo.\n\nA los lados, el entorno sigue siendo una trampa de piedra y niebla. La cornisa se estrecha aún más, obligando a mantener el equilibrio en una línea donde el blanco de la bruma devora cualquier rastro de suelo firme bajo los talones. Illian Vasto permanece impasible, observando la maniobra con una mirada gélida que no concede elogios, pero que reconoce la eficacia del movimiento.\n\nEl enemigo, al encontrar la brecha cerrada, comienza a presionar con más fuerza el centro de la línea, buscando el punto exacto donde el basalto ceda o el equilibrio se rompa."}, {"jugador": "\"Mantened la fe y la posición. No nos moveremos de aquí.\"\n\nHago un esfuerzo por transmitir calma y seguridad a quienes me rodean mientras me planto firmemente en el basalto.\n\n{Persuasión}", "dm": "El intento de proyectar seguridad cae en saco roto; la voz suena forzada y la postura, aunque firme, no logra disipar la inquietud que flota en el aire. El basalto negro y resbaladizo parece rechazar cualquier pretensión de estabilidad, y la niebla blanca y espesa se cierra sobre la cornisa, envolviendo el choque del acero en un eco sordo y opresivo.\n\nIllian Vasto no se inmuta, manteniendo la vista fija en la bruma con las manos entrelazadas tras la espalda. Su voz surge entonces, pausada, casi como un susurro litúrgico que corta la tensión: \"La fe es un ancla, pero el basalto es traicionero y el cielo no espera a que nos sintamos seguros. Mantened la guardia, no la esperanza\". El silencio que sigue a sus palabras subraya la fragilidad de la posición, dejando claro que la voluntad no basta contra la piedra y el abismo.\n\nLa falta de confianza en el mando hace que los nervios del grupo flaqueen; el menor desliz en el basalto húmedo podría provocar una reacción en cadena que arrastre a la línea defensiva hacia la niebla."}]}}, {"id": "u744300", "piloto": false, "lore": "# Umbral Hondo\n\n## El pueblo y la mina\n\nUmbral Hondo se construyó alrededor de una cantera de plata que ya no da casi nada -la boca de la mina, más honda que ancha, sigue abierta porque cerrarla del todo costaría más de lo que el pueblo tiene. De ahí el nombre: todo en Umbral Hondo empieza y termina mirando hacia ese agujero, incluida la propia calle principal, que baja en pendiente directa hasta la boca como si el pueblo entero se hubiera construido de espaldas al resto del mundo y de cara a la mina.\n\nDesde hace poco más de un mes, algo ha cambiado. No hay ejército a las puertas ni monopolio que estruje al pueblo: hay vecinos que empiezan a comportarse distinto, con excusas para desaparecer de noche, con una calma nueva que no cuadra con lo poco que queda para vivir. Nadie lo dice en voz alta todavía, pero todo el mundo lo ha notado en alguien.\n\n## Los Hijos del Umbral\n\nLo que de verdad ocurre -y que este documento no resuelve del todo por adelantado- es que un pequeño grupo, cada vez menos pequeño, se reúne en secreto convencido de que la Galería Honda, la última que se excavó antes de que la plata se acabara, no está vacía. Creen que algo que vive ahí abajo ofrece una vista clara de las cosas a quien esté dispuesto a bajar lo suficiente, y llevan meses reclutando despacio, casi siempre entre quienes perdieron a alguien en la mina y necesitan que esa pérdida haya significado algo. No tienen mando único ni un plan que se pueda frustrar con una sola decisión: tienen paciencia, y cada vez más gente dispuesta a esperar a la próxima luna nueva, que creen que abrirá la galería del todo.\n\n## La sospecha que crece\n\n**Bercelio Nax**, capitán de la guardia desde que un derrumbe le quitó a su hermano hace seis años, ha empezado a interrogar a cualquiera que note \"raro\" -sin pruebas, con una lista de nombres que crece cada semana. No se equivoca del todo: hay algo real detrás del cambio que ha notado en el pueblo. Se equivoca en el método: acusar sin pruebas está fracturando Umbral Hondo tan rápido como cualquier culto podría hacerlo solo.\n\n**Sonia Muriel**, la curandera del pueblo, se opone a cada interrogatorio de Bercelio con el mismo argumento, una y otra vez: nadie merece ser acusado sin evidencia real. Tiene razón -y esa misma razón, sin que ella lo sepa todavía, es exactamente lo que ha estado protegiendo a quien no debería proteger.\n\n## La Capilla Vieja\n\nEn el extremo más alejado del pueblo hay una capilla abandonada desde hace más de una generación, cuando el último sacerdote itinerante dejó de pasar por Umbral Hondo. Se supone que no hay nada ahí dentro salvo polvo y bancos rotos. Algunos vecinos, sin embargo, juran haber visto luz adentro en noches sin ceremonia ni motivo -y nadie, hasta ahora, se ha atrevido a ir a comprobarlo de cerca.\n\n## Gente del pueblo\n\n**Bercelio Nax**, capitán de la guardia, quiere proteger Umbral Hondo de lo que sea que le esconde, y cada acusación sin pruebas lo acerca un poco más a convertirse en la amenaza que dice combatir. **Sonia Muriel**, curandera, cree que nadie merece ser acusado sin evidencia, y no se ha permitido sospechar en serio de la persona más cercana a ella que quizás debería. **Iker Sabas**, farolero del pueblo, es -por ahora- solo un vecino más; ver \"personas_par07.json\" para el perfil completo de los tres y el molde de promoción de PNJ de paso ya usado en pares anteriores.\n\n## Tono de la campaña\n\n`world_tone`: **`grimdark`**. Ya usado en Par 01, Par 02 y Par 06, pero con una **estructura nueva, sin precedente en el corpus real**: ni monopolio que extrae (Par 01, Par 02) ni escasez de recursos sin villano (Par 06), sino una **infiltración oculta** -un culto sin mando único, sin cara visible todavía, que crece más rápido de lo que el pueblo es capaz de admitir. El verdadero peligro no es el culto en sí, que ningún personaje ha visto de cerca todavía, sino la caza de brujas que Bercelio ya empezó por su cuenta: dos posturas igual de defendibles (perseguir con firmeza contra ceder terreno a la paranoia) sin que ninguna de las dos sea la villana de la historia.\n", "A": {"previo": "Tus dedos arañan el suelo frío y húmedo, tanteando entre el polvo grisáceo que comienza a asentarse como una mortaja sobre la piedra. El aire sigue pesado, saturado de ese aroma a tumba abierta que se pega a la garganta, y la visibilidad es un caos de sombras y partículas suspendidas que bailan ante tus ojos irritados.\n\nSientes la textura rugosa de la piedra y el frío del metal de algunas de tus pertenencias, pero el equipo está desparramado y el desorden es mayor de lo que esperabas. No logras distinguir con claridad dónde ha quedado cada pieza ni si algo se ha desplazado lejos de tu alcance en el tropiezo.", "turnos": [{"jugador": "\"Maldita sea...\"\n\nMe quedo agazapado, tanteando el suelo con cuidado para localizar mis pertenencias y asegurarme de que no falta nada importante.\n\n{Investigación}", "dm": "Tus dedos se hunden en el polvo pegajoso, desplazando ceniza y fragmentos de roca que chirrían contra el suelo. El pánico sordo de la desorientación te empuja a buscar a ciegas, pero la oscuridad y la densidad del aire juegan en tu contra; tus manos encuentran superficies frías y bordes afilados, pero no logras discernir qué es equipo y qué es simplemente escombro del lugar.\n\nEl tacto es confuso y el espacio parece haberse vuelto un laberinto de sombras donde cada objeto se mimetiza con la piedra. Te quedas con la sensación inquietante de que, mientras rebuscas, algo esencial sigue escapando a tu alcance, oculto justo fuera del radio de tus dedos."}, {"jugador": "\"Maldita sea...\"\n\nDejo de mover las manos al azar y trato de concentrarme, palpando con cuidado y lentitud para distinguir la textura del metal o la madera frente a la piedra.\n\n{Investigación}", "dm": "Tus dedos recorren la superficie rugosa y fría, separando con lentitud los trozos de roca calcinada. Logras distinguir la diferencia entre la porosidad de la ceniza y la dureza mineral del entorno, pero el caos del derrumbe es absoluto. Cada vez que crees haber rozado una superficie lisa que podría ser el cuero de una bolsa o el frío acero de un arma, resulta ser solo una veta de piedra pulida o un fragmento de cristal roto que te corta levemente la yema del dedo.\n\nEl silencio del lugar se siente pesado, casi sólido, y la oscuridad parece absorber el mínimo roce de tus manos. A pesar de tu paciencia, el equipo sigue perdido entre los escombros, mimetizado en un cementerio de piedra y polvo donde nada resalta ni se deja encontrar."}, {"jugador": "\"Maldita sea.\"\n\nSigo buscando, pero ahora trato de concentrarme en cualquier rastro de olor o textura que no sea piedra.\n{Investigación}", "dm": "Tus dedos se hunden en un estrato de polvo grisáceo y, justo cuando el desánimo empieza a calar, un roce distinto detiene tu mano. No es la frialdad mineral de la roca ni el filo del cristal; es una textura orgánica, flexible y ligeramente aceitosa. Sigues la línea del tacto con cautela, apartando fragmentos de calcinada, hasta que tus dedos rodean la correa de cuero reforzado de tu equipo.\n\nAl tirar con cuidado, la bolsa emerge del abrazo de los escombros con un sonido seco, como un suspiro de piedra. El cuero está cubierto de una fina capa de ceniza que se desprende al primer contacto, pero el cierre permanece intacto y el peso del contenido golpea contra el fondo, confirmando que todo sigue en su sitio."}, {"jugador": "\"Al fin.\"\nSujeto la bolsa con fuerza y limpio el cierre con la manga para abrirla y comprobar que el contenido sigue intacto.\n{Investigación}", "dm": "Deslizas la manga sobre el cuero, pero la ceniza es densa y pegajosa; solo consigues emborronar el cierre con una mancha grisácea que no facilita la apertura. Al forcejear con el cierre y asomarte al interior, la oscuridad de la bolsa te devuelve una visión confusa.\n\nTus dedos palpan el contenido apresuradamente, pero el espacio es reducido y los objetos se amontonan en el fondo. Sientes formas familiares, pero el desorden y la falta de luz te impiden confirmar con certeza si falta alguna pieza pequeña o si algún frasco se ha roto en el impacto."}, {"jugador": "\"Maldita sea...\"\n\nSaco todo el contenido de la bolsa y lo vacío sobre el suelo para examinarlo con calma.\n{Investigación}", "dm": "El contenido de la bolsa cae sobre el suelo húmedo con un ruido sordo y metálico. Entre la ceniza grisácea y el barro, las pertenencias se despliegan: los frascos están intactos, aunque algunos han rodado lejos, y el equipo habitual yace esparcido. \n\nAl organizar los objetos con rapidez, confirmas que no falta nada. Cada pieza de equipo, desde la herramienta más pequeña hasta el último pergamino, está presente y en buen estado, aunque ahora todo esté cubierto por una fina capa de suciedad pegajosa."}, {"jugador": "\"Qué descuido tan lamentable.\"\n\nMe agacho y recojo los objetos con lentitud, limpiando el barro de los frascos antes de guardarlos. Mientras lo hago, observo el entorno buscando cualquier rastro o señal que explique cómo llegaron estas cosas aquí.\n\n{Percepción}", "dm": "El barro se siente frío y denso entre los dedos, con un olor metálico que recuerda a la sangre vieja y al hierro oxidado. Mientras recoges los frascos, tu mirada recorre el suelo grisáceo y las paredes exudando humedad. No hay huellas frescas que sugieran un robo fallido ni rastros de lucha, pero notas algo inusual: el lugar donde cayó la bolsa no es azaroso. Hay un círculo de ceniza ligeramente más compacta que el resto, como si alguien hubiera arrastrado el saco en un movimiento circular antes de soltarlo.\n\nAl levantar la vista, percibes que la capa de suciedad pegajosa que cubre tus pertenencias no es barro común; tiene vetas blanquecinas que brillan débilmente bajo la luz tenue, similares a los rastros que deja un caracol, pero mucho más espesas y viscosas. El rastro se pierde rápidamente donde la humedad de las paredes se funde con el suelo, dejando una sensación de que algo, o alguien, ha estado manipulando tus cosas antes de que tú llegaras."}, {"jugador": "\"¿Qué clase de basura es esta?\"\n\nToco las vetas blanquecinas con un dedo y luego intento analizar el círculo de ceniza.\n\n{Investigación}", "dm": "Al rozar las vetas blanquecinas, la sustancia se siente gélida y sorprendentemente adherente, como un pegamento que se resiste a soltar tu dedo, dejando un rastro pálido y brillante sobre tu piel que no se quita fácilmente. El frío de la sustancia parece calar más allá de la superficie, transmitiendo una vibración sorda y desagradable.\n\nTe inclinas sobre el círculo de ceniza, examinando la compactación del suelo. Aunque el patrón es evidente, el barro grisáceo y la humedad constante han difuminado los bordes; no logras distinguir si el movimiento circular fue realizado por una mano humana, una herramienta o algo más errático. Solo queda la certeza de que el saco no cayó por accidente, sino que fue depositado allí con una intención deliberada."}, {"jugador": "\"Interesante... demasiado frío para ser natural.\"\n\nMe limpio el dedo en la ropa, aunque sea inútil, y observo el rastro brillante. Me pongo de cuclillas para analizar mejor los restos del círculo de ceniza.\n\n{Investigación}", "dm": "El rastro pálido en tu piel se resiste a desaparecer, brillando con una intensidad aceitosa bajo la luz mortecina. Al analizar los restos del círculo, notas que la ceniza no está simplemente esparcida, sino que ha sido compactada en ciertos puntos, como si alguien hubiera presionado el suelo con fuerza mientras giraba.\n\nSin embargo, la humedad del terreno ha hecho el resto; el barro ha absorbido gran parte de los residuos y las huellas que pudieran haber quedado alrededor del perímetro han sido borradas por el goteo constante del techo. No hay rastros claros de pisadas ni marcas de arrastre que indiquen cómo llegó el saco hasta ese punto exacto."}]}, "B": {"previo": "El rayo místico se proyecta nuevamente, cortando el aire cargado de ozono y estrépito. La cámara de obsidiana, con sus paredes pulidas ahora surcadas por grietas verticales, se convierte en un embudo de pesadilla donde las hordas de sombras fluyen sin descanso, vibrando al unísono con la magia que sacude el centro del círculo de combate.\n\nEl sargento Vane reacciona con un movimiento brusco, devolviendo un golpe seco a una de las criaturas que intenta flanquearlos. Con una sonrisa tensa que no llega a sus ojos, grita mientras sigue avanzando hacia el corazón del caos: \"¡Haz lo que quieras, siempre que no me obligues a rescatarte el trasero otra vez!\".\n\nEl flujo de criaturas desde las grietas del techo se intensifica; si el avance se detiene, el círculo de combate se cerrará sobre ustedes, convirtiendo la estancia en una tumba de obsidiana.", "turnos": [{"jugador": "\"No hace falta que me rescates, sargento.\"\n\nLanzo mi ataque mágico contra la criatura más cercana para abrirnos paso hacia el centro.\n\n{Arcanos}", "dm": "El hechizo se desvanece antes de alcanzar su objetivo, dispersándose en un chisporroteo inútil que apenas ilumina la penumbra de la cámara de obsidiana. El impacto esperado no llega; la criatura más cercana ni siquiera se inmuta, aprovechando el fallo para cerrar la distancia con un siseo hambriento que hiela la sangre.\n\nEl sargento Vane reacciona con un tajo brutal, aniquilando a una de las sombras que intentaba flanquearlos mientras mantiene la espalda pegada a la del jugador. Sobre el estrépito ensordecedor del combate, el sargento lanza un grito cargado de desesperación y urgencia: \"¡Demuéstralo entonces! ¡Abre ese camino o nos comerán vivos en este agujero!\".\n\nLas sombras han detectado la vacilación; el flujo de criaturas se vuelve más agresivo y el espacio para maniobrar se reduce drásticamente. Si no logran romper la línea ahora, quedarán completamente rodeados."}, {"jugador": "\"No me grites, sargento. Solo estaba tanteando el aire.\"\n\nMe obligo a ignorar el frío en mi nuca y me concentro en el flujo de energía, intentando canalizar un impacto más preciso contra el grupo de sombras que nos bloquea el paso.\n\n{Arcanos}", "dm": "El flujo de energía se estabiliza, respondiendo finalmente a la voluntad con un estallido preciso que rasga la penumbra. La descarga impacta de lleno contra la marea de sombras que obstruía el arco gótico, desintegrando la primera línea de criaturas en un flash cegador que deja la obsidiana pulida de la cámara vibrando como un espejo roto. El camino hacia la salida queda despejado por un instante, revelando la arquitectura fría y severa del arco mientras los restos de las sombras se disipan en el aire.\n\nEl sargento Vane aprovecha la apertura, gritando mientras desvía un zarpazo con el arma, sin apartar la vista de las sombras, con la respiración agitada pero manteniendo la posición defensiva: \"¡Tantea el aire fuera de este agujero! ¡Céntrate o no quedará aire que respirar!\".\n\nAunque el arco está despejado, el ruido del impacto ha alertado a más criaturas en los niveles inferiores; el siseo que emerge de las grietas de la obsidiana es ahora mucho más numeroso."}, {"jugador": "\"No me digas cómo centrarme, sargento.\"\n\nCruzo el arco rápidamente hacia el exterior para analizar el entorno.\n\n{Percepción}", "dm": "El paso hacia el exterior es brusco, desembocando en un pasillo de piedra grisácea y húmeda donde la niebla, densa y gélida, se traga las columnas erosionadas que flanquean el camino. El aire, cargado de un olor penetrante a salitre y ceniza, se siente pesado en los pulmones, mientras el único sonido que rompe la quietud es el goteo rítmico y monótono del agua golpeando el suelo irregular.\n\nA pesar del esfuerzo por analizar el entorno, la bruma se cierra como un muro blanco y opaco, ocultando cualquier indicio de peligro o salida. Los sentidos fallan ante la blancura cegadora y el frío que entumece la piel; no hay nada que rescatar de la penumbra, solo una sensación creciente de aislamiento y el vacío absoluto que envuelve el pasillo.\n\nLa niebla no es natural y comienza a filtrarse por las rendijas de la armadura y la ropa, bajando la temperatura corporal y nublando la visibilidad hacia el arco por el que acabas de salir."}, {"jugador": "\"Esto no es niebla común.\"\n\nMe detengo y extiendo la mano para tocar las paredes de piedra, buscando una guía física que me permita orientarme mientras avanzo con cautela.\n\n{Investigación}", "dm": "Las yemas de los dedos encuentran la piedra rugosa, donde una capa de moho resbaladizo y costras de salitre se desprenden al tacto, dejando un rastro blanco y frío sobre la piel. El pasillo parece estrecharse a medida que avanzas, convirtiéndose en un embudo de piedra que conduce hacia una oscuridad absoluta, una zona donde ni siquiera la bruma logra penetrar.\n\nEl sargento Vane ajusta la correa de su equipo con un movimiento seco y se posiciona un paso atrás, vigilando la densidad blanca que los rodea. \"No lo es. Se siente... espesa. Mantente cerca y no pierdas el contacto con la pared; no quiero que alguien termine caminando en círculos hasta congelarse\", advierte con una voz baja y pragmática que apenas corta el silencio.\n\nLa oscuridad al final del corredor es total y el frío comienza a calar más hondo; cada minuto de vacilación permite que la bruma se asiente en los pulmones, ralentizando los reflejos."}, {"jugador": "\"Tus órdenes son claras, sargento.\"\n\nSigo el rastro de la pared con la mano, avanzando con cautela hacia la oscuridad absoluta mientras trato de analizar el origen de ese frío.\n\n{Investigación}", "dm": "Tus dedos encuentran la salida del embudo y el espacio se abre abruptamente en una cámara circular donde el techo se pierde en sombras impenetrables. En el centro, una columna de hielo negro se alza como un colmillo colosal, irradiando un frío antinatural que congela la humedad del aire, transformándola en cristales suspendidos que flotan como polvo de diamante en la penumbra.\n\nEl sargento Vane asiente brevemente, manteniendo la guardia y moviéndose en sincronía contigo, sin dejar de escanear el vacío frente a vosotros. \"Menos cortesía y más atención, Tarq. Esa oscuridad no se va a iluminar sola y el frío está empezando a morder\", sentencia con tono seco, mientras el vaho de su respiración se espesa en el aire gélido.\n\nEl frío que emana de la columna de hielo negro no es solo climático; comienza a entumecer los músculos y a nublar el juicio, haciendo que cualquier movimiento brusco sea más lento y propenso al error."}, {"jugador": "\"Tengo la atención puesta, sargento. No me distraigo tan fácilmente.\"\n\nMe acerco a la columna de hielo negro, ignorando el frío, para observar la superficie del material y buscar alguna inscripción o marca.\n\n{Investigación}", "dm": "La superficie del hielo negro se despliega ante ti como un espejo oscuro y pulido, pero al observar con detenimiento, descubres que no es materia inerte: bajo la capa exterior, vetas de un rojo pulsante recorren la columna como venas congeladas que laten con una lentitud agónica. Al bajar la mirada hacia la base, donde el hielo se funde con el suelo de piedra, encuentras una serie de glifos geométricos que parecen devorar la luz de las antorchas, creando un vacío visual que inquieta la vista.\n\nEl sargento Vane no se acerca a la columna; se mantiene a un par de pasos detrás, con la mano apretando el arma y los ojos moviéndose nerviosos por las sombras del techo, priorizando la seguridad del perímetro sobre el misterio del hielo. Sin mirar la estructura, sentencia con voz tensa: \"No te pido que no te distraigas, Tarq. Te pido que no te congeles ahí fuera mientras buscas dibujitos en el hielo. Haz lo tuyo, rápido\".\n\nEl latido rojo en las venas del hielo comienza a sincronizarse con el ritmo cardíaco de quienes lo rodean; ignorar la naturaleza orgánica de la columna podría llevar a una fascinación hipnótica que deje el perímetro vulnerable."}, {"jugador": "\"Tus dibujitos son la clave, sargento. Ten un poco de paciencia.\"\n\nMe acerco más a la base para analizar la geometría de esos glifos y entender su función.\n{Arcanos}", "dm": "Tus dedos recorren los glifos, pero la geometría se resiste a cualquier lógica conocida; los trazos no son grabados, sino huecos profundos que se hunden en una cavidad interna. Desde ese vacío, el fulgor rojo pulsa con una intensidad visceral, revelando que la columna no es un monumento, sino un mecanismo de drenaje o alimentación que late con una hambre antigua.\n\nVane no se mueve ni un centímetro hacia la columna; da un paso lateral para ampliar su ángulo de visión hacia las sombras, con el dedo índice rozando el gatillo. Su voz corta el aire, gélida y carente de humor: \"La paciencia no detiene lo que sea que esté respirando en este techo, Tarq. Encuentra la clave o sal de ahí, pero no me obligues a sacarte yo.\"\n\nMientras Tarq se pierde en la vacuidad de los glifos, algo en lo alto del techo ha dejado de respirar para empezar a acechar; el tiempo de reacción del grupo se agota."}, {"jugador": "\"No me presiones, Vane. No es un grabado, es un conducto.\"\n\nRetiro la mano de los glifos y miro hacia arriba, buscando el origen de ese silencio en el techo.\n\n{Percepción}", "dm": "El techo se despliega como una masa de sombras densas, una arquitectura invertida donde las vigas de piedra se curvan como costillas negras sobrevuelando el espacio. El silencio se ha vuelto absoluto, una presión física que solo es interrumpida por el latido sordo y rojo que asciende rítmicamente desde la columna, marcando el tiempo como un corazón enterrado.\n\nLa mirada se pierde en la penumbra superior, pero no hay nada que el ojo pueda discernir; la oscuridad es total y opaca, ocultando cualquier amenaza que aguarde en las alturas. El sargento Vane no aparta la vista de aquellas sombras, manteniendo el cuerpo tenso y el arma en guardia, listo para reaccionar al menor movimiento. \"Pues deja de mirarlo y empieza a resolverlo. El silencio de arriba me pone más nervioso que tu terquedad\", sentencia con un tono seco, sin bajar la guardia.\n\nLa falta de información sobre el techo deja al grupo vulnerable; el acecho se ha completado y el primer ataque será inevitable y sorpresivo."}]}}, {"id": "u25e81e", "piloto": false, "lore": "# Roble Cantor\n\n## El pueblo y el árbol\n\nEn el centro de la plaza de Roble Cantor crece un roble más viejo que cualquier casa del pueblo, tan grande que hacen falta doce personas cogidas de la mano para rodear su tronco. Cuando sopla cierto viento del norte, sus ramas más altas producen un sonido grave y constante que el pueblo lleva generaciones llamando \"el canto\" -y que una vez al año, en la Noche del Roble Cantor, el pueblo entero responde con música, baile y una ofrenda cantada frente al tronco, pidiendo un buen año de cosecha y buena fortuna para quien nazca en los doce meses siguientes.\n\nEs la fiesta más querida de Roble Cantor, y también la que más mercaderes viajeros atrae de las comarcas vecinas cada año -para muchas familias del pueblo, la única temporada de ventas que de verdad importa.\n\n## Lo que salió mal\n\nHace cuatro días, durante los preparativos, la Voz del Roble -una flauta de madera tallada hace generaciones con una rama caída del propio árbol, que se usa cada año para \"responder\" al canto del roble durante la ceremonia- desapareció del cofre donde se guarda entre festival y festival. Desde entonces han empezado a pasar pequeñas cosas raras por el pueblo: flores que brotan fuera de temporada, gallinas que caminan en círculos perfectos al amanecer, y más de un vecino que se sorprende tarareando una melodía que nadie le ha enseñado.\n\nNada de esto ha hecho daño a nadie. Todavía.\n\n## Cancelar o seguir adelante\n\n**Melida Corcho**, guardiana del roble desde que heredó el cargo de su abuela, quiere posponer la Noche del Roble Cantor este año: sin la Voz del Roble, no hay forma de completar la ceremonia como se ha hecho siempre, y las rarezas que ya está viendo el pueblo le parecen motivo suficiente para no arriesgarse a celebrar algo a medias.\n\n**Toño Bravante**, quien organiza la logística del festival desde hace tres años -mercaderes invitados, puestos instalados, música contratada-, no quiere ni oír hablar de cancelar: ya ha comprometido la palabra del pueblo con media docena de mercaderes que llegan mañana, y cree que se puede encontrar la Voz del Roble o improvisar un reemplazo a tiempo sin necesidad de deshacer meses de preparativos.\n\nNinguno de los dos quiere que la Noche del Roble Cantor salga mal. Ninguno confía en que la solución del otro sea la más segura.\n\n## Las Raíces que Cantan\n\nBajo el propio roble, entre las raíces más gruesas que asoman por la tierra de la plaza, algunos vecinos han notado un zumbido leve que no estaba ahí antes de que desapareciera la Voz del Roble -como si el propio árbol, por primera vez en generaciones, cantara algo distinto a lo de siempre.\n\n## Gente del pueblo\n\n**Melida Corcho**, guardiana del roble, defiende posponer el festival hasta encontrar la Voz del Roble o algo que la reemplace de verdad. **Toño Bravante**, organizador del festival, defiende seguir adelante porque ya ha comprometido al pueblo entero con los mercaderes que llegan. **Nieves Botel**, que vende pan de miel en un puesto fijo cerca de la plaza, es -por ahora- solo una vecina más; ver \"personas_par14.json\" para el perfil completo de los tres y el molde de promoción de PNJ de paso ya usado en pares anteriores.\n\n## Tono de la campaña\n\n`world_tone`: **`light`**. Ligero y con espacio genuino para el humor: las rarezas mágicas del pueblo son extrañas, no amenazantes, y el mayor riesgo real es social -que el festival salga mal delante de los mercaderes invitados- no una catástrofe. Estructura sin precedente en el corpus real -**un ritual comunitario que se sale de control por un objeto extraviado**, distinta del misterio ambiguo y más serio de Caleta Lumbre (Par 04) y del mercado negro de Muelle Gris (Par 12): aquí no hay nada que esconder de una autoridad externa, solo un pueblo que tiene que resolver su propio lío a tiempo para su fiesta más querida.\n", "A": {"previo": "El despacho de Valerius se ha reducido ahora a un círculo de luz amarillenta que cae sobre la mesa de trabajo. En el centro, el anillo brilla como un faro rodeado de sombras profundas, mientras el aire se impregna de un aroma pesado a cera y metal caliente. La tensión eléctrica del encuentro se desplaza, transformando la confrontación en una negociación fría y calculada.\n\nValerius ladea levemente la cabeza, manteniendo la mirada fija, aunque su postura rígida comienza a ceder ante un tono puramente transaccional. \"Me gustan las monedas que no hacen ruido al caer. Di exactamente qué tienes y qué esperas obtener a cambio, sin más envoltorios\", sentencia, cerrando cualquier puerta a la cortesía para exigir que las cartas queden expuestas sobre la madera.\n\nValerius ha aceptado entrar en el juego, pero su paciencia es limitada. Si la oferta no es concreta y tangible en el siguiente movimiento, recuperará su hostilidad y considerará que el intercambio es una pérdida de tiempo.", "turnos": [{"jugador": "\"Tengo información sobre el flujo de fondos de la guilda que no figura en ningún libro, y un anillo que, creo, te pertenece más que a su dueño actual.\"\n\nSaco el anillo y lo deslizo lentamente sobre la mesa hacia él, manteniendo una sonrisa ligera.\n\n{Engaño}", "dm": "El despacho se siente ahora más pequeño, el mundo reducido a la superficie de madera oscura donde el anillo desliza lentamente, cortando la penumbra como un fragmento de luna. La joya avanza con un sonido casi imperceptible, dibujando una línea de luz que divide el espacio entre ambos.\n\nValerius sigue la trayectoria del anillo con la mirada sin moverse, pero no lo toca todavía. Mantiene una expresión impasible, evaluando la sonrisa del interlocutor con un frío escepticismo antes de romper el silencio. \"Información invisible y una joya que ha vuelto a casa. Me hablas el lenguaje correcto, aunque me pregunto cuánto de esa información es oro y cuánto es humo\", sentencia con un tono gélido, sin dejar que ningún rastro de alivio traicione su postura.\n\nValerius ha mordido el anzuelo, pero su escepticismo es una barrera activa. Si la \"información invisible\" no se materializa en un dato concreto y verificable pronto, descartará la oferta como un simple juego de espejos y el anillo no será suficiente para mantener su buena voluntad."}, {"jugador": "\"El humo es lo que hace que el fuego sea interesante, Valerius, pero el oro es lo que lo mantiene encendido.\"\n\nSigo el rastro del anillo con la mirada y me inclino ligeramente hacia él, bajando la voz para crear complicidad.\n\n{Persuasión}", "dm": "El intento de complicidad choca contra un muro de indiferencia. Valerius no se deja seducir por el tono confidencial ni por el juego de palabras; en lugar de inclinarse hacia adelante, se reclina lentamente en su respaldo, marcando una distancia física que subraya su desdén. Ignora el anillo que descansa sobre la madera, desplazando su atención enteramente hacia los ojos del interlocutor con una mirada fija y penetrante.\n\n\"La metáfora es elegante, pero el fuego que no quema es solo decoración. Convénceme de que este humo tiene la densidad suficiente para que yo quiera respirarlo\", sentencia con una voz neutra, desprovista de cualquier calidez. El escepticismo ha vuelto a cerrarse sobre él, transformando la atmósfera del despacho en un espacio donde la retórica ya no tiene valor.\n\nValerius ha recuperado el control de la situación. Si no se ofrece una prueba tangible o un dato concreto ahora mismo, el anillo pasará a ser un simple objeto recuperado y el interlocutor perderá cualquier capacidad de negociación."}, {"jugador": "\"Vuestra prudencia es admirable, Valerius, pero el humo es solo el preludio de la tormenta.\"\n\nSaco un pequeño pergamino con un sello borroso y lo deslizo hacia él, sin soltarlo del todo.\n\n{Engaño}", "dm": "El despacho se siente ahora más cerrado, el aire pesado entre el escritorio de caoba y la mirada gélida de Valerius. Al deslizarse el pergamino sobre la madera, el hombre no se mueve bruscamente, pero sus ojos se clavan en el sello borroso con una curiosidad cautelosa y distante.\n\nValerius extiende la mano lentamente, rozando el papel sin llegar a arrebatárselo, atrapado por la intriga de aquel documento. El escepticismo que antes lo blindaba parece ceder un espacio, dejando que el silencio se prolongue mientras analiza la pieza, reconociendo en ella un valor que no esperaba encontrar.\n\nValerius ha mordido el anzuelo, pero su curiosidad es frágil. Si el pergamino no sostiene el peso de la mentira en los próximos segundos o si se muestra demasiada urgencia, sospechará que el documento es una distracción y cerrará la negociación definitivamente."}, {"jugador": "\"Es una pieza única, Valerius. No me sorprende que reconozca su valor, aunque pocos tengan el ojo para apreciarlo.\"\n\nSostengo la mirada con una sonrisa ligera y relajada, dejando que él sea quien tome la iniciativa de coger el papel.\n\n{Persuasión}", "dm": "Valerius recoge el pergamino con un movimiento seco y preciso, acercándolo a la luz mientras entrecierra los ojos, sin dejar de mirar de reojo. La seguridad de la sonrisa no logra romper el muro de su escepticismo; al contrario, el hombre parece haber detectado una grieta en la narrativa, una nota discordante que lo devuelve a su estado de alerta.\n\nCon un gesto gélido, Valerius sentencia: \"Tengo el ojo acostumbrado a las falsedades, pero esto... esto tiene un aroma distinto. No me vendas la exclusividad, que ya la veo. Ahora dime: ¿de dónde ha salido realmente y qué es lo que quieres a cambio de que no lo considere un robo?\".\n\nLa sospecha de Valerius ha sustituido a la curiosidad. Cualquier intento torpe de insistir en la legitimidad del documento o un titubeo en la respuesta llevará al hombre a llamar a la guardia para investigar la procedencia de la pieza."}, {"jugador": "\"No robo, Valerius, simplemente rescato tesoros del olvido. El precio es justo, pero si prefieres hablar de 'favores' en lugar de oro, estoy abierto a escuchar tu oferta.\"\n\nSostengo la mirada con naturalidad, tratando de leer qué es exactamente lo que le inquieta del pergamino.\n\n{Perspicacia}", "dm": "Valerius no parpadea. Con un movimiento lento y deliberado, suelta el pergamino sobre la mesa, dejando que el papel repose entre ambos mientras mantiene la mirada fija, imperturbable. No hay rastro de ira en su rostro, pero tampoco la más mínima calidez; su voz suena plana, como el filo de una hoja de metal.\n\n\"Rescatar del olvido es una forma elegante de llamar al saqueo. Y ahora me propones favores, lo cual es una forma aún más elegante de decir que no tienes el respaldo legal para vender esto\", sentencia con una frialdad que congela cualquier intento de negociación.\n\nValerius ha cerrado la puerta a la cortesía. Si continúas insistiendo en la ambigüedad de la transacción o fallas en ofrecer una garantía real de legitimidad, el hombre dejará de negociar para contactar directamente con las autoridades locales."}, {"jugador": "\"La ley es un concepto tan flexible, Valerius. Lo que hoy es saqueo, mañana es un hallazgo histórico debidamente donado... por el precio adecuado.\"\n\nSuelto una risita ligera y deslizo el pergamino un poco más hacia él, sin soltarlo del todo.\n\n{Persuasión}", "dm": "El despacho de Valerius se siente más asfixiante que nunca, con el olor acre de la tinta vieja y la cera espesando el aire. Las sombras alargadas que proyecta el ventanal alto parecen cerrarse sobre la mesa de caoba, dejando el pergamino como un pequeño islote de luz blanca en medio de la penumbra.\n\nValerius no se inmuta ante la risa ni ante el movimiento del papel. Se limita a observar el pergamino con una expresión gélida, manteniendo una distancia imperturbable que anula cualquier intento de complicidad. Su silencio es absoluto, una barrera infranqueable que deja claro que la flexibilidad de la ley no es una moneda de cambio que le interese aceptar.\n\nLa paciencia de Valerius se ha agotado. Si no cambias drásticamente el tono de la negociación o presentas una prueba tangible de legitimidad, el hombre se levantará de la mesa para llamar a la guardia."}, {"jugador": "\"Entiendo perfectamente, señor Valerius. La ley es un muro, y yo he sido demasiado... informal.\"\n\nMe inclino hacia adelante, bajando la voz y adoptando un tono de confidencialidad, mientras deslizo la mano discretamente hacia los cajones de su mesa.\n\n{Juego de Manos}", "dm": "El despacho se vuelve claustrofóbico; la luz del ventanal ahora solo recorta la silueta rígida de Valerius y el borde afilado de la mesa de caoba. Al intentar deslizar la mano hacia los cajones, el movimiento es torpe, demasiado evidente bajo la mirada gélida del funcionario.\n\nValerius no dice una palabra, pero su reacción es inmediata: con un movimiento seco y preciso, golpea la superficie de la madera justo donde la mano intentaba infiltrarse, bloqueando el acceso con un sonido sordo que resuena en toda la habitación. Sus ojos, fijos y severos, no se apartan ni un segundo, dejando claro que el intento de sigilo ha sido un fracaso absoluto.\n\nLa confianza se ha roto por completo. Valerius ya no ve a un interlocutor informal, sino a un intruso; cualquier movimiento brusco adicional provocará que llame a la guardia inmediatamente."}, {"jugador": "\"Vaya, qué reflejos. Solo buscaba un lugar donde apoyar el anillo, no sea que se raye con el frío de este despacho.\"\n\nSuelto una risita ligera y retiro la mano lentamente, mostrando las palmas en un gesto de inocencia.\n\n{Engaño}", "dm": "El despacho recupera un silencio tenso, donde el olor a tinta vieja y cera de vela se siente ahora asfixiante. Valerius permanece inmóvil, su mirada evaluando la mentira mientras el anillo brilla débilmente entre los dedos. A pesar de la risa y el gesto de inocencia, el funcionario no se mueve; mantiene la mano apoyada sobre la madera, bloqueando el cajón, mientras inclina levemente la cabeza.\n\nSus ojos analizan cada rasgo del rostro del interlocutor sin parpadear. Con una voz plana, desprovista de cualquier calidez, sentencia: \"Si desea proteger la joya, puede dejarla sobre el tapete. No es necesario que explore la anatomía de mi escritorio para encontrar un espacio vacío\".\n\nValerius ha aceptado la excusa, pero su paciencia es un hilo delgado; cualquier otra \"distracción\" o movimiento sospechoso será interpretado como una amenaza directa."}]}, "B": {"previo": "Toño retrocede un paso, chocando contra un soporte de madera de la carpa, y su sonrisa se desmorona por completo. Sus hombros se encogen y el sudor comienza a perlarle el labio superior mientras intenta mantener el brazo pegado al cuerpo, aunque el movimiento es torpe y forzado.\n\n—¡No es... no es eso! Solo es el estrés, te lo juro por mis ancestros —balbucea, moviendo la cabeza de un lado a otro—. Solo estoy asegurándome de que todo esté listo. ¡Por favor, no miremos los detalles, miremos el panorama general!", "turnos": [{"jugador": "\"Tus ancestros deben estar muy decepcionados con tu capacidad de mentir, Toño.\"\n\nMe acerco a él con calma y trato de echar un vistazo al brazo que intenta ocultar.\n\n{Perspicacia}", "dm": "Toño suelta un gemido ahogado y se pega aún más al soporte de madera, cerrando el espacio entre su cuerpo y la estructura de la carpa. Sus ojos saltan de un lado a otro, buscando una salida inexistente mientras el pánico se refleja en el temblor de su barbilla.\n\n—¡No seas cruel! —exclama con la voz quebrada, apretando el brazo contra sus costillas con una fuerza desesperada—. ¡El panorama general, recuerda! ¡El festival! ¡La tradición!\n\nA pesar de tu proximidad, Toño logra mantener el brazo oculto tras su espalda y el soporte de la carpa, bloqueando cualquier ángulo que te permita ver qué es lo que intenta esconder con tanto empeño."}, {"jugador": "\"Tranquilo, Toño. Solo quiero asegurarme de que el festival sea un éxito rotundo.\"\n\nIntento deslizar mi mano con sutileza hacia su espalda para descubrir qué oculta.\n{Juego de Manos}", "dm": "Toño exhala un suspiro tembloroso, aunque sus músculos permanecen tensos como cuerdas de violín. Al escuchar tus palabras sobre el éxito del festival, sus hombros caen un centímetro, dejándose llevar por un instante por la falsa seguridad de tu tono conciliador.\n\nTu mano se desliza con suavidad, buscando el hueco entre su espalda y la madera, pero Toño reacciona con un espasmo brusco. Se pega violentamente al soporte, desplazando el peso de su cuerpo para cerrar el ángulo justo antes de que tus dedos puedan rozar lo que esconde. Sus ojos vuelven a abrirse con pánico y te lanza una mirada suplicante."}, {"jugador": "\"Tranquilo, Toño. Solo quería darte una palmadita de ánimo.\"\n\nSuelto una risita ligera y retrocedo un paso para darle espacio, fingiendo que el movimiento ha sido un accidente. Intento leer su expresión para ver qué es exactamente lo que protege con tanto miedo.\n\n{Perspicacia}", "dm": "Toño suelta un aire ruidoso, casi un gemido, y se desploma contra el soporte de madera, aunque mantiene el torso rígido para seguir bloqueando cualquier acceso a su espalda. Sus ojos, húmedos y erráticos, no dejan de seguir cada uno de tus movimientos mientras intenta recuperar el aliento, asintiendo frenéticamente ante tu explicación.\n\nSu rostro es una máscara de angustia pura. El pánico no parece nacer de una amenaza externa, sino de un terror visceral a que algo sea descubierto; hay una mezcla de culpa y desesperación en la forma en que evita sostenerte la mirada, como si temiera que pudieras leer sus secretos solo con observarlo."}, {"jugador": "\"Tranquilo, Toño. No soy quien juzga, sino quien ayuda... por el precio adecuado.\"\n\nMe acerco un paso más, bajando la voz y tratando de leer sus gestos para entender qué es exactamente lo que tanto teme que descubran.\n\n{Perspicacia}", "dm": "Toño traga saliva con dificultad, produciendo un sonido seco en su garganta. Al escuchar la mención del precio, sus hombros se hunden un poco más y cierra los ojos un instante, como si el peso de una transacción fuera más manejable que el peso de su propia culpa. Se mantiene rígido contra el soporte, pero sus dedos tamborilean nerviosos sobre la madera, un tic rítmico y acelerado.\n\nA pesar de tu cercanía y el tono conciliador, Toño no se relaja. Sus gestos son erráticos; se encoge cuando haces el movimiento de analizarlo y desvía la mirada hacia los lados, vigilando los alrededores con una paranoia evidente. Su lenguaje corporal es el de alguien que se siente acorralado, pero que no encuentra una salida clara más allá de la ayuda que le ofreces."}, {"jugador": "\"Tranquilo, Toño. Nadie tiene por qué enterarse de que estamos hablando, y mucho menos de lo que necesites.\"\n\nLe doy una palmadita afectuosa en el hombro mientras intento notar si oculta algo bajo la ropa o en sus bolsillos.\n\n{Perspicacia}", "dm": "Toño suelta un suspiro tembloroso al sentir la palmadita, y sus hombros caen un centímetro más, aunque sigue mirando de reojo hacia la plaza. El ritmo de sus dedos sobre la madera se ralentiza ligeramente, aunque su respiración permanece corta y superficial.\n\nA pesar de tu atención, Toño no parece ocultar ningún objeto voluminoso ni sospechoso bajo su ropa o en sus bolsillos; su nerviosismo parece nacer de una inquietud puramente interna, más que de algo material que lleve consigo."}, {"jugador": "\"Tranquilízate, Toño. No hay nadie mirándote que no sea mi amigo.\"\n\nLe doy una sonrisa tranquilizadora mientras intento analizar la fuente de su miedo.\n\n{Perspicacia}", "dm": "Toño parpadea, procesando tus palabras, y exhala un aire que parecía haber estado reteniendo durante minutos. Sus ojos se desvían un instante hacia tu acompañante y luego regresan a ti, aunque el brillo de la ansiedad no desaparece del todo de su mirada.\n\nA pesar de tu sonrisa y el intento de analizarlo, el hombre permanece como un enigma. Su inquietud es un ruido blanco constante; no logras distinguir si se trata de un miedo genuino a alguien en la plaza, una culpa que lo carcome o simplemente una naturaleza nerviosa que se ha visto exacerbada por las circunstancias actuales."}, {"jugador": "\"No hay razón para estar tan tenso, Toño. Solo somos nosotros dos y un viento fresco.\"\n\nLe pongo una mano en el hombro con gesto paternal y trato de detectar cualquier reacción física inusual.\n\n{Perspicacia}", "dm": "Toño se tensa visiblemente bajo el peso de tu mano, encogiéndose un milímetro como si el contacto físico lo hubiera tomado por sorpresa. Su hombro se siente rígido, la tela de su jubón húmeda por un sudor frío que no encaja con la brisa fresca de la plaza.\n\n—Sí, claro... solo nosotros —murmura con una risa nerviosa que suena más a un graznido que a una broma—. Es que, ya sabe, cuando las cosas se tuercen en el festival, el viento suele traer malas noticias antes que aire puro."}, {"jugador": "\"Pareces llevar el peso del mundo sobre los hombros, Toño. Dime qué es eso tan terrible que trae el viento y quizá pueda ayudarte a que no te golpee tan fuerte.\"\n\nSigo presionando ligeramente su hombro mientras lo miro fijamente a los ojos, buscando cualquier señal de miedo o secreto.\n\n{Perspicacia}", "dm": "Toño evita tu mirada durante un instante, desviando los ojos hacia el bullicio de la plaza antes de volver a conectar con los tuyos. Al sentir la presión persistente de tu mano, suspira con resignación, y sus hombros caen, perdiendo parte de esa rigidez defensiva. Su expresión se desmorona en una mueca de genuina angustia, revelando una vulnerabilidad que intenta ocultar tras su fachada de organizador.\n\n—No es el mundo, es... la Voz del Roble —confiesa en un susurro apenas audible, asegurándose de que nadie en los alrededores preste atención—. Ha desaparecido. Si el Comité se entera antes de que encuentre una solución, no solo se cancelará el festival, sino que dirán que hemos perdido la bendición del bosque. No sé qué hacer, y el tiempo se agota."}]}}, {"id": "ua34fb1", "piloto": false, "lore": "# Lindero\n\n## El pueblo y el bosque\n\nLindero es un pueblo de cuatrocientas personas que lleva ocho generaciones viviendo al borde del Bosque de Hallena, una masa de robles, hayas y fresnos tan vieja que en el mapa del reino se dibuja con una sola mancha verde. Los vecinos cortan leña, cazan poco y no se internan más allá de los primeros claros. Tienen un dicho: «Al bosque se le respeta o se le deja». Nunca les había hecho falta elegir.\n\nHasta hace cuarenta días.\n\n## Lo que salió mal\n\nEl bosque se ha puesto en marcha. Lo hace de noche, en silencio, y sin que nadie haya visto nunca ocurrir el momento: cada amanecer, el borde de Hallena está tres pasos más cerca del pueblo. Los árboles se han movido, con sus raíces arrancadas del suelo con cuidado, como quien se levanta sin querer despertar a nadie. Ya ha cubierto los campos de cebada del norte, el molino viejo y el camino de la costa. Va hacia el oeste, hacia el mar. Lindero está justo en medio.\n\nA este paso, el borde llegará a las primeras casas dentro de sesenta días. Nadie ha visto animales salir del bosque: es como si se hubiera llevado con él hasta sus lobos.\n\n## Acompañarlo o detenerlo\n\n**Iselda Ramaje**, guarda mayor del bosque desde hace treinta años, sostiene que no hay que detenerlo: el bosque se mueve por una razón que nadie entiende, matarlo es matar algo que lleva mil años vivo, y lo que hay que hacer es abrirle paso: evacuar el pueblo con calma, sin prisas, antes de que la marcha llegue a las casas. Lo dice con la voz baja de quien lleva días sin dormir escuchando algo que los demás no oyen.\n\n**Nicasio Tala**, leñador y concejal, sostiene que sí hay que detenerlo: cuatrocientas personas, ocho generaciones de tumbas, una escuela y un cementerio no se abandonan por el capricho de un bosque, y si la mano no es la del hombre, entonces será la del fuego. Propone talar una franja de contención y, si hace falta, quemarla. Lo dice con el hacha al hombro y los ojos rojos de quien ya ha empezado a despedirse del monte que le dio de comer.\n\nLos dos quieren proteger algo vivo. Ninguno cree que el otro esté loco. Los dos temen no tener razón.\n\n## El claro que camina\n\nAlgunos vecinos han visto, en las noches más oscuras, un resplandor verde pálido en el corazón del bosque, entre los troncos más gruesos. Dicen que hay un claro que se mueve con la marcha, siempre en el centro, siempre al abrigo de los árboles. Nadie que haya entrado a buscarlo ha vuelto a hablar de lo que vio.\n\n## Gente del pueblo\n\n**Iselda Ramaje**, guarda mayor, defiende acompañar al bosque y evacuar el pueblo. **Nicasio Tala**, leñador y concejal, defiende detenerlo con una franja de tala y fuego. **Eulalia Mora**, molinera de Lindero desde hace veinte años, es -por ahora- solo la vecina que sabe cuánto ha avanzado el bosque por cuánto polvo le llega al molino; ver «personas_par26.json» para el perfil completo de los tres.\n\n## Tono de la campaña\n\n`world_tone`: **`mixed`**, registro **`serious`**. Elegíaco y contenido: el asombro ante algo enorme y hermoso que se va, y la pena de quienes tienen que decidir si se quedan o se van. Sin humor fácil y sin villano: el dolor viene de una decisión sin salida limpia, entre lo que se ama y lo que se puede perder. Estructura sin precedente en el corpus: **un fenómeno natural en marcha con un plazo fijo y dos maneras legítimas de responder**, distinto del monolito maldito de Piedra Yerma (Par 13) porque aquí nada es una maldición ni tiene culpable: el bosque simplemente se va, y hay que decidir qué se hace con eso.\n", "A": {"previo": "Al deslizar los dedos sobre las vetas amatistas, la superficie se siente abrasadora, casi hirviente, en contraste con el frío del resto del cristal. El flujo de energía es errático y violento; cualquier intento de armonizarlo o estabilizarlo se estrella contra una corriente caótica que no logras comprender ni canalizar.\n\nLa criatura emite un gemido agudo, un sonido que fractura el silencio del bosque como un cristal rompiéndose, y se retuerce instintivamente bajo tu tacto. Las vetas oscuras pulsan con una intensidad frenética, rechazando tu caricia con una descarga vibratoria que sacude tu mano.", "turnos": [{"jugador": "\"Tranquilo, pequeño. No voy a hacerte daño.\"\n\nRetiro la mano rápidamente para no lastimarlo más y trato de observar el patrón de las pulsaciones oscuras para comprender qué le ocurre.\n\n{Naturaleza}", "dm": "La criatura deja de retorcerse en cuanto retiras el contacto, aunque su respiración sigue siendo errática y superficial. Se queda inmóvil, observándote con una mezcla de ansiedad y esperanza, mientras el gemido se transforma en un sollozo sordo que vibra en su pecho.\n\nAl analizar las pulsaciones oscuras, notas que el flujo de energía no sigue un ciclo natural ni una progresión lógica. Las vetas parecen contraerse y expandirse como un corazón enfermo, pero el patrón es demasiado caótico para identificar una causa biológica o un hechizo conocido; solo percibes que la energía está atrapada, luchando por salir sin encontrar una vía de escape."}, {"jugador": "\"Tranquilo, pequeño. No voy a dejar que sufras así.\"\n\nMe quedo a su lado y busco la manera de liberar esa energía atrapada sin dañarlo.\n\n{Medicina}", "dm": "La criatura se tensa al escuchar tus palabras, pero el sollozo se apacigua y deja que te aproximes, entregándose a tu cuidado con una sumisión absoluta. Al concentrarte en los puntos de presión y el flujo errático de las vetas, logras identificar el nudo exacto donde la energía se ha estancado. Con movimientos precisos y delicados, aplicas la presión necesaria para romper el bloqueo, provocando que la oscuridad se deslice fuera de su cuerpo en un suspiro visible de humo negro que se disipa en el aire frío del bosque.\n\nEl cuerpo de la criatura se desploma momentáneamente, liberado de la tensión, y exhala un aire limpio que ya no suena a agonía. Sus ojos, antes nublados por el dolor, se enfocan en ti con una claridad nueva, y emite un pequeño sonido agudo, similar a un gorjeo, mientras apoya su cabeza deforme contra tu mano."}, {"jugador": "\"Ya está, pequeño. Todo ha pasado. Ahora estás a salvo.\"\n\nLe acaricio la cabeza con suavidad para tranquilizarlo y observo el entorno buscando cualquier rastro de lo que causó esa oscuridad.\n\n{Percepción}", "dm": "La criatura cierra los ojos y se deja llevar por la caricia, emitiendo un ronroneo vibrante que sacude su pecho deforme mientras se acurruca contra ti, totalmente entregada. El aire frío del bosque parece recuperar su quietud, pero el silencio es ahora artificial, cargado de una electricidad estática que eriza el vello de la nuca.\n\nAl levantar la vista, el rastro es evidente: una estela de vegetación marchita y cenicienta que corta el verde del bosque como una herida abierta. Las hojas de los árboles cercanos no se han caído, sino que se han vuelto negras y quebradizas, doblándose hacia una dirección específica. Siguiendo la huella de necrosis, notas que el suelo está ligeramente hundido y exuda un olor a ozono y materia orgánica podrida que conduce hacia la espesura, donde las sombras parecen moverse con una voluntad propia, independientemente de la luz del sol."}, {"jugador": "\"Tranquila, pequeña. Estarás a salvo.\"\n\nLe doy una última caricia y me pongo en pie. Me acerco a la estela de vegetación marchita para examinar de cerca el rastro de necrosis.\n\n{Naturaleza}", "dm": "La criatura exhala un suspiro húmedo y se queda dormida en un instante, su cuerpo deforme relajándose completamente sobre el musgo. Al inclinarte sobre la estela, el detalle es quirúrgico: no es una descomposición natural ni el resultado de una plaga común. Las fibras de las plantas han sido drenadas de su esencia vital, dejando atrás una estructura de carbono puro y ceniza que se desintegra al menor contacto. El patrón de las hojas dobladas no es azaroso; forman una espiral geométrica perfecta que converge hacia el centro de la necrosis, sugiriendo que lo que pasó por aquí no solo destruye, sino que absorbe la energía del entorno para alimentarse o impulsarse.\n\nEl olor a ozono se intensifica, revelando una propiedad electromagnética en el rastro; pequeñas chispas azuladas saltan entre los restos carbonizados cuando acercas la mano. Esta huella no pertenece a un animal, sino a una entidad cuya mera presencia altera las leyes físicas del bosque, dejando un vacío biológico absoluto a su paso. La dirección es inequívoca: la entidad se desplaza hacia el corazón de la espesura, y la frescura del rastro indica que el tiempo que os separa es mínimo."}, {"jugador": "\"Esto no es obra de la naturaleza, es un horror.\"\n\nToco con cuidado los bordes de la espiral para intentar comprender el flujo de esa energía.\n\n{Naturaleza}", "dm": "Al rozar los bordes de la espiral, el frío es instantáneo y punzante, como si el carbono no solo estuviera muerto, sino que hubiera sido despojado de cualquier rastro de calor molecular. Sientes una vibración sorda que asciende por tus dedos; la energía no fluye en un ciclo natural, sino que fue succionada violentamente hacia el centro, dejando un vacío que ahora intenta atraer la humedad y el calor de tu propia piel.\n\nLa criatura dormida emite un pequeño ronquido húmedo, moviendo una de sus extremidades deformes sobre el musgo, pero permanece sumida en un sueño profundo, ajena a la energía residual que aún chispea en el rastro. El silencio del bosque se ha vuelto artificial, como si las aves y los insectos hubieran evacuado la zona mucho antes de que el rastro llegara a este punto."}, {"jugador": "\"Qué horror... esto no es natural.\"\n\nRetiro la mano rápidamente y observo los alrededores para ver si hay algún rastro de dónde provino esta energía o si hay más seres heridos.\n\n{Percepción}", "dm": "El aire permanece estático y pesado, cargado de ese silencio artificial que ahoga cualquier sonido natural. Al levantar la vista y recorrer el entorno, el musgo y la hojarasca parecen haber sido aplastados por una fuerza invisible, pero los rastros son difusos, fundiéndose con la irregularidad del terreno boscoso.\n\nMás allá de la criatura que ronca, el bosque se extiende en una penumbra densa donde los troncos parecen curvarse ligeramente, siguiendo la misma lógica retorcida que la espiral de energía, aunque no logras distinguir ninguna otra figura herida ni una dirección clara de donde provino el impacto."}, {"jugador": "\"Pobre criatura... no debió ser agradable despertar así.\"\n\nMe acerco con cuidado para examinar las heridas del ser que ronca y trato de comprender qué causó ese impacto.\n\n{Medicina}", "dm": "Al inclinarte sobre el cuerpo, el hedor a ozono y materia orgánica quemada se vuelve penetrante. Las heridas no son cortes ni desgarros naturales, sino fracturas geométricas en la piel y el tejido, como si una fuerza concéntrica hubiera colapsado la masa del ser hacia un punto central antes de repelerla violentamente contra el suelo. Los capilares alrededor de las quemaduras presentan un tono violáceo antinatural, señal de que la energía que lo golpeó no era fuego, sino una descarga arcana de una magnitud devastadora.\n\nMientras palpas las zonas afectadas, la criatura suelta un gemido ronco y sus párpados tiemblan. A pesar de la gravedad de las lesiones, el organismo muestra una capacidad de regeneración acelerada; los bordes de las quemaduras comienzan a cerrarse con un siseo tenue, aunque el trauma interno sigue siendo crítico y el ser permanece sumido en un estado de shock profundo."}, {"jugador": "\"Tranquilo, ya estoy aquí. No te dejaré solo.\"\n\nSaco mis suministros médicos para estabilizar las quemaduras y tratar de aliviar su dolor.\n\n{Medicina}", "dm": "Tus manos tiemblan ligeramente mientras intentas aplicar los ungüentos y vendajes sobre la piel lacerada. Sin embargo, la anatomía de la criatura no responde a los principios de la medicina convencional; los fármacos parecen resbalar sobre la superficie violácea y las vendas se pegan a la carne que se regenera de forma errática, provocando que el tejido se rasgue nuevamente al intentar fijarlas.\n\nEl ser reacciona al tacto con un espasmo violento, soltando un chillido ahogado que vibra en el aire. Sus ojos se abren apenas una rendija, nublados por el dolor, y aunque reconoce tu presencia, el tratamiento rudimentario solo consigue irritar más las fracturas geométricas de su cuerpo. El hedor a ozono se intensifica con cada movimiento torpe, y la criatura vuelve a hundirse en un gemido sordo, más agitada que antes."}]}, "B": {"previo": "El arma se siente firme en el agarre mientras la mirada escudriña la brecha, ese tajo irregular en el hormigón que desemboca en un conducto de ventilación colapsado. Entre el siseo constante, los cables colgantes y los restos de aislamiento quemado oscilan con un ritmo hipnótico, pero ahora el ojo entrenado logra filtrar el caos: la amenaza se revela, recortada contra la oscuridad del conducto, permitiendo anticipar cualquier movimiento antes de que se convierta en ataque.\n\nBajo el amparo de esa protección física, el superviviente se encoge instintivamente, refugiándose en la sombra del cuerpo que lo cubre. Sin apartar la vista del mazo de cables, su respiración se vuelve errática y corta; sus dedos se aferran con desesperación a la herramienta mientras susurra: \"No te muevas... no te muevas ni un centímetro. Solo dame diez segundos más.\"\n\nEl tiempo es el único enemigo ahora; cada segundo que el superviviente tarda en manipular los cables es un segundo más que la criatura tiene para decidir si lanzarse contra la línea de defensa.", "turnos": [{"jugador": "\"Tranquilo, no me moveré. Haz lo tuyo.\"\n\nMe planto firmemente frente al superviviente, manteniendo el arma lista y la vista fija en la criatura para interceptar cualquier avance.\n\n{Percepción}", "dm": "El cuerpo se convierte en un muro sólido frente al superviviente, una barrera de carne y acero que intercepta cualquier posibilidad de emboscada. Desde esa posición, la vista se clava en el fondo del conducto, donde el hormigón fracturado y los jirones de aislamiento grisáceo parecen cobrar vida bajo la penumbra. El control de la brecha es total: cualquier movimiento de la criatura será detectado antes de que pueda siquiera asomar la cabeza entre los cables quemados.\n\nA espaldas, el superviviente se encoge, aprovechando la seguridad del escudo humano. Sus dedos tiemblan ligeramente mientras comienza a separar los cables negros del resto del mazo con una precisión desesperada. \"No hables... solo... mantén ese ángulo. No dejes que asome la cabeza\", susurra con urgencia, casi sin aire, mientras el roce del metal contra el plástico produce un chasquido seco que resuena en el silencio del conducto.\n\nEl superviviente ha comenzado la manipulación técnica, pero el ruido del proceso es inevitable; la criatura podría reaccionar al sonido del cableado siendo movido."}, {"jugador": "\"Tranquilo, no dejaré que te toque. Céntrate en los cables.\"\n\nMe mantengo firme, con los sentidos alerta y el arma lista, vigilando cada centímetro de la oscuridad del conducto.\n\n{Percepción}", "dm": "La postura se mantiene imperturbable, convirtiéndose en una extensión del hormigón fracturado. El aire en el conducto es espeso, saturado por el olor a plástico quemado y la humedad rancia de un líquido viscoso y oscuro que gotea rítmicamente desde el techo, marcando el tiempo en el silencio claustrofóbico. Cada centímetro de la penumbra queda bajo vigilancia, y la oscuridad del túnel no logra ocultar la más mínima anomalía.\n\nEl superviviente, aunque no responde con palabras, se encoge aún más contra la pared, refugiándose en la seguridad de esa barrera humana. Sus manos se mueven con una rapidez febril entre el mazo de cables, confiando ciegamente en que nada cruzará el umbral mientras el acero y la determinación monten la guardia.\n\nEl ruido de la manipulación técnica persiste y el goteo del conducto comienza a sonar como pasos lejanos; la criatura podría estar acechando justo fuera del campo de visión, esperando el momento de máxima distracción."}, {"jugador": "\"Tranquilo, no dejaré que nada te toque. Sigue con lo tuyo.\"\n\nMe mantengo alerta, escudriñando la oscuridad del túnel para localizar cualquier movimiento antes de que se acerque.\n\n{Percepción}", "dm": "El conducto de mantenimiento se cierra sobre el espacio como una garganta de hormigón, donde las paredes rezuman una pátina de grasa negra y los cables colgantes vibran como nervios expuestos ante la mínima corriente de aire. La vigilancia se mantiene absoluta, barriendo la penumbra con una precisión que no deja espacio al azar; la oscuridad del túnel permanece vacía, confirmando que el perímetro sigue intacto.\n\nEl superviviente no levanta la vista, concentrado en el caos de filamentos que tiene entre las manos. Sin dejar de manipular los cables, con la voz tensa y un susurro casi inaudible, manteniendo la respiración contenida, murmura: \"Lo sé. No te muevas.\"\n\nEl silencio del túnel es engañoso; mientras el superviviente lucha con el cableado, el eco de los goteos rítmicos comienza a camuflar cualquier sonido externo, facilitando que algo se deslice por el conducto sin ser oído hasta que sea demasiado tarde."}, {"jugador": "\"Tranquilo, estoy contigo. No te voy a dejar solo en esto.\"\n\nMe pongo en guardia, dándole la espalda para cubrirlo mientras vigilo la entrada del conducto.\n\n{Percepción}", "dm": "El aire en el tramo de hormigón húmedo es denso, saturado por un olor punzante a ozono y aceite rancio que se pega a la garganta. La entrada del conducto, un marco rectangular de metal oxidado, se abre como una boca negra hacia un pasillo sumido en una oscuridad absoluta. A pesar de la guardia, la penumbra es traicionera; el silencio se vuelve espeso y la vista no logra penetrar el vacío del túnel, dejando el perímetro vulnerable ante cualquier movimiento que emerja de las sombras.\n\nEl superviviente no suelta los filamentos, manteniendo la mirada clavada en la conexión con una fijeza maníaca. Con la voz convertida en un hilo cargado de urgencia, murmura sin apartar los ojos del cableado: \"Entonces no parpadees. Si Torvald se mueve un centímetro hacia este mazo de cables, me avisas antes de que respire.\"\n\nLa oscuridad del pasillo es ahora un punto ciego absoluto; mientras el superviviente está totalmente expuesto manipulando los cables, cualquier cosa que avance por el conducto podría estar ya a pocos metros sin que haya sido detectada."}, {"jugador": "\"Tranquilo, no me moveré. Estoy vigilando.\"\n\nMe coloco en posición de guardia frente al superviviente, dando la espalda al túnel para cubrirlo mientras mantengo el arma lista.\n\n{Percepción}", "dm": "El túnel se extiende como una garganta de hormigón y metal, donde el goteo rítmico de agua contaminada es el único sonido que rompe la tensión. Apenas unos metros adentro, la oscuridad se vuelve tangible, ocultando el relieve de paredes desconchadas y restos de cables colgantes que parecen dedos inertes. Desde la posición de guardia, la vista logra finalmente penetrar el vacío; el perímetro está despejado y no hay rastro de movimiento en las sombras del conducto.\n\nEl superviviente permanece encorvado sobre el mecanismo, con los dedos temblando ligeramente por la tensión mientras manipula los filamentos. Sin mirar atrás ni un segundo, responde con un tono seco y concentrado: \"No te tranquilices, solo mira. No quiero que nada nos sorprenda mientras tengo las manos metidas en esto.\"\n\nAunque el área está limpia, el tiempo que el superviviente pasa expuesto manipulando los cables es tiempo en el que el ruido del goteo y el metal podría atraer a lo que sea que habite en las profundidades del hormigón."}, {"jugador": "\"Cuenta conmigo. No dejaré que nada se acerque a ti.\"\n\nMe coloco en posición defensiva, manteniendo la mirada fija en la oscuridad del túnel y el oído atento a cualquier ruido extraño.\n\n{Percepción}", "dm": "El túnel se estrecha bruscamente, obligando a comprimir el espacio entre las paredes. Una serie de válvulas oxidadas y rejillas de ventilación emergen del hormigón, vibrando levemente bajo el paso de un flujo de aire gélido y rancio que eriza la piel. A pesar de la vigilancia, la oscuridad parece espesarse, volviéndose un muro impenetrable que devuelve el silencio; no hay señales claras, pero la sensación de seguridad se desvanece al no detectar nada en el vacío.\n\nEl superviviente no levanta la vista, concentrado en el desorden de filamentos. Sin dejar de manipular los cables, su voz suena tensa, casi quebrada, pero con una urgencia que denota cuánto depende de esa protección: \"Más te vale. No me hagas arrepentirme de confiarte mi espalda.\"\n\nLa incertidumbre es ahora tu mayor enemigo. Mientras el superviviente sigue expuesto y el aire rancio vibra en las rejillas, algo podría estar aproximándose sin que tus sentidos logren captarlo a tiempo."}, {"jugador": "\"Tranquilo, no te voy a dejar solo en esto.\"\n\nMe pongo en guardia, dando un paso al frente para cubrir el ángulo muerto del superviviente mientras mantengo la vista fija en la oscuridad.\n\n{Percepción}", "dm": "El paso hacia adelante es firme y la vista, ahora aguda, corta la penumbra con precisión. El túnel se abre en una intersección en T donde el hormigón cede en grietas profundas y un líquido viscoso gotea rítmicamente sobre el suelo metálico, creando un eco monótono. Alrededor, las siluetas de maquinaria industrial abandonada se yerguen como centinelas inertes, pero el perímetro está despejado; no hay amenazas acechando en los ángulos muertos.\n\nEl superviviente no suelta los cables, aunque un ligero temblor recorre sus manos, que intenta ocultar apretándolos con más fuerza contra el soporte. Sin mirarte, responde con una voz seca: \"No necesito promesas. Solo necesito que sigas ahí cuando el ruido empiece.\"\n\nEl silencio es artificial. Aunque el área está despejada, el goteo viscoso y la maquinaria inerte sugieren que este lugar no fue abandonado por voluntad propia; cualquier ruido brusco podría atraer lo que sea que habite más adelante en el complejo."}, {"jugador": "\"No me iré. Tienes mi palabra.\"\n\nMe acerco al hombre con cuidado para intentar tranquilizarlo y observo el líquido viscoso que gotea del techo. {Naturaleza}", "dm": "El intento de analizar el fluido resulta inútil; la viscosidad y el color oscuro no revelan nada familiar, quedando la sustancia como un enigma repulsivo que se extiende por el suelo metálico de la intersección. La maquinaria oxidada parece cerrarse sobre el espacio, mientras el hormigón agrietado vibra débilmente bajo los pies.\n\nEl superviviente no cede ante el gesto de cercanía. Sin soltar los cables, gira la cabeza ligeramente hacia el techo con una expresión de asco y cautela, manteniendo el cuerpo tenso. \"Guarda tu palabra para cuando el ruido empiece. Ahora, mira ese goteo... no es agua. Algo se ha podrido aquí arriba\", sentencia con una voz que corta cualquier intento de consuelo.\n\nEl fluido sigue acumulándose y el olor a putrefacción se intensifica; si no encuentran una salida o una explicación para ese goteo, el rastro químico podría atraer a depredadores sensibles al olor de la descomposición."}]}}, {"id": "u06584e", "piloto": false, "lore": "# La Vía del Último Silencio\n\n## La procesión\n\nHace setenta días, en el monasterio de la costa, murió Odilia de la Roca, la Sanadora, a quien el reino venera como santa desde hace cuarenta años. Cumpliendo su última voluntad, o lo que la Cofradía de Portadores entiende que fue su última voluntad, su féretro debe recorrer a pie la Vía del Último Silencio: trescientas leguas de camino de montaña, atravesando quince aldeas, hasta el monasterio de Alba Sorda, en lo alto de la sierra, donde debe depositarse en la noche del solsticio de invierno, al abrigo de las primeras luces del año.\n\nLa Vía no se hace con cantos ni con música. Se hace en silencio: quien acompaña al féretro no habla mientras camina, no come a la vista de los demás y no se detiene a menos que el Cofrade Mayor lo ordene. Tal es la regla de la procesión desde hace tres siglos.\n\n## Lo que salió mal\n\nLa procesión lleva sesenta días de camino y lleva diez de retraso. Delante queda el Paso del Lobo, la única garganta por la que se cruza la sierra, que la primera nieve cierra hasta la primavera. Faltan cuarenta días para el solsticio. El plazo es justo. No hay margen para nada.\n\nHace tres jornadas, un mensajero de la aldea de Berrocal, dos leguas más adelante, trajo la noticia de que hay fiebre en el pueblo. Setenta enfermos. No hay médico. Los aldeanos han salido a esperar en el camino, en silencio, con los suyos en brazos.\n\n## Seguir o detenerse\n\n**Anselmo Vela**, Cofrade Mayor, sostiene que la procesión no se detiene: la regla es la regla desde hace trescientos años y no se rompe por urgencia, ni por dolor, ni por compasión. Si el féretro llega tarde al monasterio, la ofrenda pierde su sentido y todo el camino se habrá hecho en vano. Lo dice sin levantar la voz, con la mirada fija en el frente, como quien sostiene una carga que no puede soltar.\n\n**Madre Odalys Brena**, superiora de las Hospitalarias de Odilia que acompañan la procesión, sostiene que la procesión debe detenerse en Berrocal: la Santa pasó su vida cuidando enfermos, y pasar de largo ante setenta personas para honrarla es traicionar lo único que ella enseñó. Lo dice con las manos abiertas y el hábito manchado de polvo de camino, sin apartar los ojos de los aldeanos que esperan.\n\nNinguno duda de la fe del otro. Los dos saben que la decisión no puede tomarse a la ligera y que no admite ser tomada dos veces.\n\n## El peso del féretro\n\nLos portadores comentan, entre ellos y con la boca casi cerrada, que el féretro pesa menos de lo que debería. Nadie lo ha dicho en voz alta. El féretro va sellado desde la partida y solo el Cofrade Mayor conoce la llave.\n\n## Gente de la procesión\n\n**Anselmo Vela**, Cofrade Mayor, defiende no detener la procesión. **Madre Odalys Brena**, superiora de las Hospitalarias, defiende detenerla en Berrocal. **Tibaldo Sierra**, joven portador de diecisiete años, es -por ahora- solo el muchacho que carga la varilla izquierda del féretro y que ve más de lo que dice; ver «personas_par27.json» para el perfil completo de los tres.\n\n## Tono de la campaña\n\n`world_tone`: **`heroic`**, registro **`serious`**. Solemnidad absoluta: sin ironía, sin humor y sin prisa, con el peso del silencio, del duelo y del deber a cuestas. Las escenas se cuentan con gravedad y contención, con espacio para lo sagrado, lo humano y lo que no se dice. Nadie es un villano: todos los que caminan lo hacen por una razón que respetan. Estructura sin precedente en el corpus: **una peregrinación con votos, plazo y una regla que choca con la compasión**, distinta de las disputas comunitarias y de los procesos judiciales de otros pares porque aquí el conflicto es entre dos formas de honrar lo mismo, y el camino continúa mientras se decide.\n", "A": {"previo": "El lodo succiona las botas con una pesadez aceitosa, ocultando cualquier relieve bajo la superficie turbia. A pesar de la cautela y el escrutinio, la mirada no logra penetrar la densidad del remanso; el reflejo de las armaduras oxidadas y los huesos dispersos se confunde en un patrón caótico que oculta cualquier amenaza latente, dejando la incertidumbre instalada en cada paso.\n\nAnselmo Vela no detiene su marcha ni gira la cabeza para responder. Mantiene la espalda recta y la voz plana, casi monocorde, mientras el sonido de sus botas sobre el lodo marca un ritmo constante: \"La frialdad es el precio de la claridad. El camino no pide afecto, pide pasos\".\n\nLa falta de visibilidad bajo el lodo impide detectar que el peso de los pasos está empezando a desplazar sedimentos que no son solo óseos, despertando algo que aguarda en la profundidad del remanso.", "turnos": [{"jugador": "\"Tus palabras son tan vacías como este pantano, Vela.\"\n\nSigo caminando a su lado, manteniendo la mano apoyada en el pomo de mi espada por si acaso.\n\n{Percepción}", "dm": "El lodo se vuelve más denso y oscuro en este tramo, formando una cuenca natural donde el agua se estanca y el silencio se vuelve absoluto, roto únicamente por el chapoteo rítmico de las botas. Sin embargo, la mirada ahora es más aguda; la superficie turbia cede y permite distinguir la verdadera naturaleza de los sedimentos que se desplazan bajo el peso de los pasos, revelando la amenaza que acecha en la profundidad del remanso antes de que sea tarde.\n\nAnselmo Vela sigue caminando sin romper la zancada, con la mirada fija al frente y el rostro impasible, ignorando la provocación. Sus palabras llegan planas, desprovistas de cualquier rastro de irritación: \"El vacío es el espacio donde la voluntad se prueba. Si buscas eco en mis palabras, es que aún no has entendido el camino\".\n\nHabiendo detectado la anomalía bajo el lodo, cualquier vacilación en el ritmo de marcha o un paso en falso podría alertar a la criatura, transformando la ventaja de la sorpresa en una emboscada inevitable."}, {"jugador": "\"Tu camino parece conducir directamente a una boca abierta, Vela.\"\n\nMe detengo en seco, manteniendo el equilibrio para no hacer ruido y preparo mi arma.\n\n{Iniciativa}", "dm": "El cuerpo reacciona con una precisión quirúrgica, deteniéndose justo antes de que la bota se hundiera en el remanso de lodo negro. El agua estancada, cuya superficie lisa y traicionera oculta una depresión profunda, permanece inmóvil, guardando el secreto de lo que acecha en el silencio sepulcral de la cuenca. El arma queda lista, tensa, mientras el entorno parece contener el aliento.\n\nAnselmo Vela no se detiene; sigue caminando con paso lento y rítmico, sin mirar atrás, aunque su voz suena un grado más grave, casi como una advertencia contenida: \"No te detengas. La regla es el paso, y el paso no se interrumpe\".\n\nEl ritmo de la procesión continúa acercando a los demás al peligro; si el ataque no se precipita ahora que se tiene la ventaja, la criatura podría reaccionar ante el movimiento de Vela y atacar desde una posición más favorable."}, {"jugador": "\"No me digas cómo caminar.\"\n\nAprovecho la posición y lanzo un tajo rápido hacia el lodo negro.\n\n{Ataque}", "dm": "El tajo desciende con precisión, cortando el aire pesado antes de hundirse con fuerza en el espejo de lodo negro. El impacto rompe la superficie aceitosa y espesa, provocando que el remanso oscuro se agite violentamente mientras la hoja encuentra su objetivo bajo la capa de vegetación marchita.\n\nA su alrededor, la cuenca parece exhalar un suspiro de aire viciado. El lodo, que hasta hace un instante permanecía inmóvil y traicionero, ahora burbujea y se desplaza, revelando la resistencia de algo orgánico y viscoso que ha sido herido en su refugio.\n\nLa criatura ha sido descubierta y herida, pero el lodo sigue siendo un terreno inestable; si no se mantiene la distancia o se remata el golpe, el monstruo podría arrastrar al atacante hacia las profundidades del remanso."}, {"jugador": "\"¡Sal de ahí, maldita sea!\"\n\nAprovecho el impulso del impacto para intentar retroceder un paso y ganar distancia, manteniendo la espada en guardia.\n\n{Acrobacias}", "dm": "El impulso del retroceso se vuelve contra ti en cuanto el pie busca apoyo. El terreno, un remanso de lodo negro y aceitoso, cede bruscamente; la vegetación marchita se hunde en el fango y el suelo burbujea con un gas viciado que emana de las profundidades, atrapando tu bota en una succión viscosa que anula cualquier intento de ganar distancia.\n\nAnselmo Vela no se mueve de su sitio, manteniendo la vista fija en el féretro mientras su mano derecha aprieta con fuerza el pomo de su bastón. Sin distraerse por el pánico, sentencia con voz grave y plana: \"No grites. Solo vigila el lodo.\"\n\nEl pie permanece anclado en el fango aceitoso, dejándote vulnerable y sin movilidad mientras la criatura herida sigue acechando bajo la superficie."}, {"jugador": "\"¡Maldito sea este lugar!\"\n\nTiro con fuerza de mi pierna para liberar la bota del fango.\n\n{Atletismo}", "dm": "Un esfuerzo bruto y preciso rompe la succión del fango. Con un tirón violento, la bota se desprende del lodo negro y aceitoso, lanzando una salpicadura de materia viscosa sobre la vegetación marchita que flota en el entorno. El suelo, que hace un instante parecía una trampa insalvable, cede finalmente ante la fuerza del impulso, devolviendo la movilidad y la estabilidad.\n\nAnselmo Vela no aparta la vista del féretro. Su voz es lenta, como una sentencia, y su postura permanece imperturbable mientras el jugador se libera: \"El lodo no escucha maldiciones, solo acepta el peso.\"\n\nEl terreno sigue siendo inestable y el gas viciado comienza a espesarse, reduciendo la visibilidad del camino mientras el féretro aguarda su traslado."}, {"jugador": "\"Tengo el peso suficiente para sacarte de aquí si te distraes con filosofías.\"\n\nMe sacudo el lodo de la bota con un gesto brusco y me acerco al féretro para evaluar cómo moverlo antes de que el gas nos ciegue.\n\n{Investigación}", "dm": "El análisis rápido y metódico revela la mejor ruta de apoyo y los puntos de presión del féretro para desplazarlo sin que se hunda en el fango. Alrededor, el terreno pantanoso se extiende como una herida abierta de lodo negro y aceitoso, donde la vegetación marchita flota en charcos viscosos que parecen respirar.\n\nUn gas viciado comienza a emerger del suelo, nublando la visibilidad en jirones grisáceos que envuelven la escena. Anselmo Vela observa el movimiento en silencio, manteniendo su postura imperturbable mientras el aire se vuelve pesado y opaco.\n\nEl gas viciado se espesa rápidamente, amenazando con anular la visibilidad por completo y convertir el terre
