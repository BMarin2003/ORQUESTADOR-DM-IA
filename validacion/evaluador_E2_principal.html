levantarse, observa la escena con una apatía absoluta. \"No te molestes en esconderte, que el ruido de tus botas suena más que una cerradura rota. Si vais a acabar en el calabozo, espero que al menos me paguéis lo que os debo antes de que os lleven\", suelta con un tono cargado de hastío.\n\nEl ruido ha eliminado cualquier elemento sorpresa; los guardias ahora saben exactamente dónde estás y aceleran el paso para cerrar la distancia."}, {"jugador": "\"Vaya, parece que mis botas no están de acuerdo con mi discreción.\"\n\nMe detengo en seco y me giro hacia Fermín con una sonrisa, mientras preparo mi arma.\n\n{Iniciativa}", "dm": "El intento de adoptar una postura combatiente termina en un tropiezo ridículo; el pie resbala en una mancha de aceite y el arma oscila peligrosamente en el aire antes de quedar en una posición totalmente inútil. El pasillo técnico, estrecho y opresivo, parece burlarse de la situación mientras el vapor caliente sigue goteando de las tuberías y el eco del fallo resuena contra las paredes de metal oxidado.\n\nFermín Llavín, que sigue cómodamente instalado en el suelo, ni siquiera se molesta en levantar la vista. Con un gesto perezoso, señala con el dedo hacia la salida mientras cierra con un clic seco un pequeño maletín de llaves. \"Si vas a jugar al héroe, hazlo lejos de mi mercancía. Que no me rompan el puesto por tu falta de tacto con el suelo\", sentencia con una apatía gélida.\n\nTu torpeza ha dejado el camino libre; los guardias han doblado la esquina y te encuentran en el momento exacto en que intentas recuperar el equilibrio."}, {"jugador": "\"Vaya, parece que el suelo tiene sus propios planes hoy.\"\n\nIntento deslizarme rápidamente detrás de Fermín Llavín para usarlo como escudo humano mientras recupero la compostura.\n\n{Acrobacias}", "dm": "El intento de maniobra rápida se convierte en un desastre coordinado. Al intentar deslizarse, el cuerpo no responde con la agilidad esperada y el suelo resbaladizo vuelve a cobrar su tributo, provocando un movimiento torpe que termina en un choque sordo contra el metal oxidado. El pasillo técnico, saturado de vapor y tuberías que gotean, parece cerrarse aún más sobre la escena, envolviendo el fracaso en una bruma caliente y húmeda.\n\nFermín Llavín reacciona con un espasmo de irritación, encogiéndose de hombros y apartando la mirada con un gesto de profundo desprecio. No dice una palabra, pero su lenguaje corporal es un grito de fastidio mientras se pega más a la pared para evitar que cualquier contacto accidental lo involucre en el caos.\n\nLa maniobra fallida te ha dejado expuesto y fuera de posición; el ruido del impacto ha alertado a cualquiera que estuviera cerca y ahora eres un blanco fácil en medio del pasillo."}, {"jugador": "\"Maldita sea... el suelo está hecho un jabón.\"\n\nMe levanto rápidamente, intentando ignorar el golpe, y busco cualquier saliente o tubería donde pueda cubrirme para no quedar a la vista.\n\n{Sigilo}", "dm": "El cuerpo reacciona con una agilidad inesperada y, sorteando el aceite viscoso que gotea del techo, se logra alcanzar el refugio de unas tuberías oxidadas que vibran con un zumbido sordo. El vapor denso del pasillo técnico envuelve la figura, fundiéndola con las sombras del metal y el ruido mecánico, logrando desaparecer de la vista justo a tiempo.\n\nFermín Llavín suspira con pesadez, sin mirarte, mientras se sacude una mota de polvo inexistente de la ropa y se pega aún más a la pared. \"El suelo no es el problema, es que te mueves como un saco de carbón. No me salpiques con el óxido, que luego no hay quien limpie estas mangas\", suelta con un tono de fastidio absoluto.\n\nAunque ahora estás cubierto, el vapor empieza a disiparse lentamente; si no avanzas pronto, la visibilidad mejorará y Fermín no tendrá paciencia para esperar a que te recuperes del golpe."}, {"jugador": "\"Perdona, Fermín, no quería manchar tu impecable traje.\"\n\nLe dedico una sonrisa rápida y me deslizo entre las tuberías para seguir avanzando sin hacer ruido.\n\n{Sigilo}", "dm": "El avance es fluido, casi felino; el cuerpo se desliza entre el laberinto de tuberías que sudan condensación, aprovechando el zumbido eléctrico constante que devora cualquier ruido accidental. El vapor sigue envolviendo el pasillo técnico, creando una cortina blanca que oculta el movimiento mientras se progresa con éxito hacia la siguiente sección del conducto.\n\nFermín Llavín suelta un bufido nasal, lanza una mirada rápida y gélida hacia el jugador y comienza a avanzar con pasos cortos y precisos, manteniendo la espalda pegada al metal. \"No es un traje, es ropa de trabajo, y el 'impecable' es precisamente lo que voy a perder si seguimos aquí plantados. Menos sonrisas y más pasos, que el vapor no va a durar toda la eternidad\", sentencia con un tono seco.\n\nEl zumbido eléctrico comienza a fluctuar, indicando que el sector técnico está entrando en un ciclo de mantenimiento; si no atraviesan el pasillo pronto, las luces de emergencia se activarán, eliminando la ventaja de las sombras."}, {"jugador": "\"Tienes razón, Fermín. No queremos que nos vean con este despliegue de elegancia.\"\n\nLe dedico una sonrisa rápida y sigo sus pasos, tratando de mantener la distancia. {Sigilo}", "dm": "El pasillo técnico desemboca en una cámara de distribución circular, un caos de cables colgantes que caen como lianas negras desde el techo. El aire vibra con una intensidad ensordecedora debido a una rejilla de ventilación masiva que sacude las paredes metálicas, convirtiendo cualquier intento de discreción en una farsa.\n\nEn medio de este estruendo, un paso en falso es inevitable. El pie se engancha en uno de los cables sueltos y el cuerpo se desploma con un estrépito metálico que resuena en toda la cámara, provocando que Fermín Llavín se detenga en seco y gire la cabeza con una expresión de absoluto desprecio, aunque no pronuncia palabra.\n\nEl ruido del impacto ha alertado a las patrullas del sector; el tiempo para encontrar cobertura antes de que los guardias lleguen a la cámara de distribución se agota rápidamente."}, {"jugador": "\"¡Vaya torpeza la mía!\"\n\nMe levanto rápidamente y trato de deslizarme entre los cables colgantes para ocultarme de la vista de Llavín y de las patrullas.\n\n{Sigilo}", "dm": "Con un movimiento fluido y sorprendentemente ágil, el cuerpo se funde con el nido de cables negros y el ruido industrial de la cámara. Las columnas de soporte proyectan sombras profundas que devoran cualquier rastro de movimiento, permitiendo que el refugio sea perfecto justo antes de que el entorno se cierre sobre la posición.\n\nFermín Llavín, sin embargo, no se mueve para ayudar; se mantiene firme en su sitio, mirando con fastidio mientras ajusta distraídamente una de las llaves de su mostrador. Su voz corta el aire con un tono seco: \"Si vais a hacer ruido, hacedlo lejos de mi mercancía. No pienso pagar el arreglo de una cerradura abollada porque no sepáis caminar.\"\n\nAunque Llavín ha sido el único en reaccionar por ahora, el estruendo inicial sigue propagándose por los conductos; las patrullas del sector se acercan y el espacio de ocultación es limitado."}]}, "B": {"previo": "El tabernero lanza un gruñido que suena a motor viejo, pero se distrae intentando limpiar una mancha imaginaria de la barra con un trapo que parece más sucio que la superficie misma. Mientras él se pierde en su propia indignación, tu mano se mueve con la precisión de un cirujano y la velocidad de un rayo; la llave y el pergamino desaparecen de la madera sin que el aire siquiera se mueva.\n\nEl hombre se detiene un segundo, mirando el espacio vacío donde hace un instante estaban los objetos. Parpadea confundido, mira a su alrededor y luego vuelve a mirarte, pero tu sonrisa cálida parece haberle hipnotizado lo suficiente como para que simplemente se encoja de hombros, convencido de que quizá nunca estuvieron allí.", "turnos": [{"jugador": "\"Muchas gracias por la hospitalidad, buen hombre. Ha sido un placer.\"\n\nLe guiño un ojo y me retiro tranquilamente hacia la salida, guardando los objetos en mis bolsillos.\n\n{Sigilo}", "dm": "El tabernero asiente con torpeza, todavía procesando el vacío sobre la barra, mientras te das la vuelta para marcharte. Sin embargo, al intentar deslizarte hacia la puerta con aire despreocupado, tu bota se engancha en una tabla suelta del suelo que cruje con el estruendo de una tabla de madera partiéndose a la mitad. El ruido resuena en todo el local, rompiendo el silencio y atrayendo la mirada inmediata de los pocos clientes presentes.\n\nEl hombre del trapo sucio se tensa y, al mirar nuevamente el espacio vacío donde estaban la llave y el pergamino, su expresión de confusión se transforma en una mueca de comprensión súbita. Sus ojos se clavan en tus bolsillos abultados y el trapo cae al suelo mientras su rostro se pone del color de un tomate maduro.\n\n—¡Eh! ¡Tú! ¡Vuelve aquí, rata de alcantarilla! —brama, golpeando la barra con el puño mientras se lanza a rodear el mostrador con una agilidad sorprendente para su volumen."}, {"jugador": "\"¡Vaya descuido el mío! Mil disculpas, caballero.\"\n\nLe dedico una sonrisa encantadora mientras retrocedo rápidamente hacia la salida para ganar distancia.\n\n{Acrobacias}", "dm": "Tus pies se mueven con una gracia felina, transformando el tropiezo en un giro fluido que te impulsa hacia atrás. Mientras el tabernero se lanza hacia adelante con el ímpetu de un barril rodando colina abajo, tú ya estás dibujando un arco perfecto que te aleja de su alcance, manteniendo esa sonrisa imperturbable mientras el aire silba en tus oídos.\n\nEl hombre choca contra el borde de la barra con un estruendo sordo, haciendo que varias jarras vacías bailen peligrosamente antes de caer. Desde el suelo, con la cara aplastada contra la madera y el trapo sucio ahora pegado a su mejilla, lanza un grito ahogado que suena más a un graznido que a una amenaza. Los clientes observan la escena con una mezcla de aburrimiento y ligera admiración por tu pirueta."}, {"jugador": "\"Vaya, parece que el suelo tiene más ganas de abrazarte que yo.\"\n\nLe echo una mirada rápida a la caja de monedas que hay sobre la barra mientras el hombre sigue aturdido.\n\n{Juego de Manos}", "dm": "Tus dedos se deslizan sobre la madera con la precisión de un cirujano y la velocidad de un rayo, aprovechando que el tabernero sigue peleando contra la gravedad y el trapo sucio. En un parpadeo, el peso metálico de la caja se traslada a tu persona sin que el menor de los tintineos delate el robo; el movimiento es tan fluido que parece que el objeto simplemente haya decidido desaparecer por voluntad propia.\n\nEl hombre logra levantar la cabeza, soltando un bufido que expulsa una nube de polvo de su nariz. Se apoya en los codos, parpadeando con confusión mientras intenta recuperar la dignidad, totalmente ajeno a que su tesoro acaba de cambiar de dueño mientras él besaba el suelo."}, {"jugador": "\"Vaya golpe, amigo. ¿Se encuentra bien?\"\n\nLe tiendo la mano para ayudarle a levantarse mientras guardo la caja con cuidado.\n\n{Engaño}", "dm": "El tabernero acepta la mano con un gruñido, apoyando todo su peso en ti mientras se pone en pie con la gracia de un saco de patatas húmedo. Se sacude el polvo de la chaqueta con gestos bruscos, entornando los ojos mientras te mira de arriba abajo con una expresión de sospecha genuina, aunque su cerebro parece procesar la información a la velocidad de una tortuga con reuma.\n\n—Sí, sí... maldita sea el suelo jabonoso —masculla, rascándose la barbilla y mirando fugazmente hacia el lugar donde estaba la caja—. Me he quedado un poco aturdido, pero estoy bien. ¿Quién eres tú, forastero? No recuerdo haber visto tu cara por aquí, y yo recuerdo hasta el color de los mocos de cada cliente."}, {"jugador": "\"Solo un viajero que pasaba por aquí y no podía dejar que un hombre tan distinguido terminara el día abrazando el suelo.\"\n\nLe sonrío con calidez mientras echo un vistazo rápido a su mostrador buscando algo que parezca valioso.\n\n{Perspicacia}", "dm": "El tabernero parpadea confundido, procesando el cumplido con una lentitud casi hipnótica. Una chispa de orgullo mal gestionado ilumina su rostro y endereza la espalda, aunque el efecto se pierde al soltar un ruido nasal que suena a mucosidad. —Distinguido, ¿eh? —repite con una sonrisa torpe, visiblemente halagado por la adulación—. Pues tienes buen ojo, forastero. No muchos saben apreciar la clase en este agujero de mala muerte.\n\nMientras él se regocija en su nueva e inexistente distinción, tu mirada recorre el mostrador. Entre manchas de grasa y restos de comida, destaca una pequeña caja de madera oscura con incrustaciones de nácar, parcialmente oculta tras un montón de servilletas mugrientas. No parece el tesoro de una vida, pero el cierre es de plata fina y el peso que sugiere al moverse es considerablemente mayor que el de una simple caja de propinas."}, {"jugador": "\"Tiene usted un gusto exquisito, señor tabernero. Me pregunto si guarda otros tesoros tan finos como este.\"\n\nSigo halagándolo mientras deslizo la mano con cuidado hacia la caja de nácar para intentar tomarla sin que se dé cuenta.\n{Juego de Manos}", "dm": "El tabernero suelta una carcajada ronca, cerrando los ojos con satisfacción mientras se deja llevar por la corriente de halagos. —¡Ja! Otros tesoros... bueno, el gusto no se compra, se nace con él —exclama, gesticulando con entusiasmo hacia el techo descascarillado del local, completamente ajeno a lo que ocurre a la altura de su cintura.\n\nTus dedos se deslizan con una precisión quirúrgica entre las servilletas grasientas. El contacto con la madera fría y el nácar es breve y fluido; en un parpadeo, la caja ha abandonado el mostrador para quedar oculta bajo tu ropa, sin que el hombre haya sentido siquiera el desplazamiento del aire. El tabernero abre un ojo, aún sonriendo con suficiencia, esperando que continúes con tu letanía de elogios."}, {"jugador": "\"Tiene usted un ojo clínico para la calidad, amigo mío. Es un don envidiable.\"\n\nLe doy una palmada afectuosa en el hombro mientras empiezo a retroceder hacia la salida con una sonrisa.\n\n{Engaño}", "dm": "El tabernero se queda congelado un instante, con la sonrisa aún dibujada pero la mirada empezando a nublarse por la confusión. Sus ojos viajan lentamente desde tu rostro hacia el espacio vacío sobre el mostrador, donde hace un segundo descansaba su tesoro. El parpadeo es lento, casi incrédulo, mientras procesa que el peso del nácar ya no está allí.\n\n—Espera... ¿qué...? —balbucea, su voz recuperando la ronquera pero perdiendo la suficiencia. Se inclina hacia delante, tanteando la madera con torpeza y mirando frenéticamente entre las servilletas grasientas, mientras su expresión pasa del orgullo a una sorpresa absoluta."}, {"jugador": "\"Parece que el destino ha decidido que ese objeto necesita un cambio de aires, amigo mío.\"\n\nLe dedico una sonrisa cálida mientras retrocedo discretamente hacia la puerta.\n\n{Sigilo}", "dm": "El tabernero deja de tantear la madera y levanta la vista, justo a tiempo para captar el movimiento. Su rostro se pone rojo como un tomate maduro y su expresión de confusión se transforma en una mueca de indignación pura.\n\n—¡Eh! ¡Vuelve aquí, rata de alcantarilla! —brama, golpeando el mostrador con un puñetazo que hace saltar un par de platos sucios. Se lanza hacia el extremo de la barra con una agilidad sorprendente para su volumen, intentando interceptar tu camino hacia la salida mientras lanza un grito que silencia toda la taberna."}]}}, {"id": "u201105", "piloto": false, "lore": "# Balanza Real\n\n## La ciudad y el Congreso\n\nBalanza Real es una ciudad-puerto neutral, sin rey ni ejército propio, que vive de un solo servicio: cada cuatro años, acoge el Congreso de Pesos y Medidas, donde las delegaciones del Norte y del Sur, junto con las ciudades libres, intentan ponerse de acuerdo sobre cuánto mide una vara, cuánto pesa un quintal y cuántos dedos tiene un palmo. Hasta ahora no lo han conseguido nunca, y cada cuatro años vuelven a intentarlo con más entusiasmo y más sobres.\n\nLos comerciantes lo saben: un palmo más largo o más corto significa millones de monedas al año en aranceles, en telas, en grano y en todo lo que se vende por metros y por sacos. Por eso el Congreso es la reunión más solemne, más lujosa y más corrupta del continente.\n\n## Lo que salió mal\n\nEste año el Congreso tiene una fecha de cierre: dentro de sesenta días, las delegaciones deben votar y firmar el Tratado de la Vara Única, o el sistema de aranceles vuelve a la guerra comercial de hace treinta años. Los trámites han empezado con doce días de retraso, las dos delegaciones principales no se saludan y ninguna quiere ceder la primera.\n\nTodo el mundo sabe que hay sobornos. Nadie sabe quién es el más generoso, y ese es, oficialmente, el motivo por el que la Secretaría neutral necesita cada año más intérpretes, más escribanos y más gente de paso que oiga sin que parezca que oye.\n\n## Vara larga o vara corta\n\n**Ottilie Ventura**, embajadora del Norte, defiende adoptar como estándar el palmo largo del rey del Norte: es la medida histórica, la más precisa según sus maestros y la que ha regido el comercio del continente durante quinientos años. Lo dice con la voz sedosa de quien ha dicho lo mismo en cuarenta banquetes.\n\n**Faustino Vara**, embajador del Sur, defiende el palmo corto de las ciudades del Sur: la medida larga favorece a los grandes almacenistas del Norte, arruina a los pequeños mercaderes y convierte cada venta en una trampa. Lo dice con una sonrisa de dientes perfectos y la mano ya extendida hacia tu copa.\n\nLos dos citan argumentos verdaderos. Ninguno cree ni un solo argumento del otro.\n\n## La Cámara Acorazada\n\nEn el sótano del Palacio del Congreso, tras tres puertas y siete cerraduras, se guarda la Vara Maestra, la barra de bronce contra la que se calibran todas las medidas del continente desde hace tres siglos. Solo se saca en cada Congreso, para una ceremonia, y solo la ha tocado el Custodio de la ciudad. Nadie ha vuelto a medirla desde la ceremonia anterior.\n\n## Gente del Congreso\n\n**Ottilie Ventura**, embajadora del Norte, defiende el palmo largo. **Faustino Vara**, embajador del Sur, defiende el palmo corto. **Eusebio Plumilla**, bedel del Congreso desde hace veintiocho años, es -por ahora- solo el hombre que reparte las convocatorias y sabe quién habló con quién en los pasillos; ver «personas_par25.json» para el perfil completo de los tres.\n\n## Tono de la campaña\n\n`world_tone`: **`mixed`**, registro **`comedic`**. Sátira diplomática con dientes: el humor viene del contraste entre la solemnidad de las formas y el cinismo de los fondos, de banquetes que no acaban y de cortesías que son puñales. La comedia es oscura y afilada, con un toque de intriga y con consecuencias reales, no un juego de niños. Estructura sin precedente en el corpus: **un congreso multilateral con dos bloques y un patrón de referencia que nadie ha verificado**, distinto de la sátira institucional de Nubarrón (Par 18) porque aquí no hay reglas absurdas sino intereses muy racionales cubiertos de protocolo.\n", "A": {"previo": "Te fundes con las irregularidades de los muros, aprovechando el ruido del mercado y el humo de los puestos de comida para borrar tu silueta. Te desplazas como una mancha más en la piedra, evitando los charcos y los escombros que podrían traicionarte, hasta quedar a pocos pasos del hombre.\n\nDesde tu posición, notas que el sujeto no mira a la multitud en general, sino que sus ojos regresan obsesivamente a un punto específico: la puerta trasera de una taberna cercana, donde un símbolo dorado y desgastado cuelga de una cadena. Cada vez que alguien se acerca demasiado a esa entrada, el hombre aprieta el pomo de su daga y exhala un suspiro contenido, manteniendo una vigilancia tensa y deliberada.", "turnos": [{"jugador": "\"Interesante...\"\nMe quedo inmóvil, observando la puerta de la taberna y al hombre para entender qué protege con tanta tensión.\n{Percepción}", "dm": "El ruido del mercado se vuelve un zumbido distante mientras te concentras en la escena. El hombre sigue allí, como una gárgola humana, con la mirada clavada en el símbolo dorado que oscila levemente con la brisa. Sus dedos tamborilean sobre el cuero de su daga, pero el resto de su cuerpo permanece rígido, casi artificial.\n\nA pesar de tu atención, la multitud es caótica. Un vendedor de especias pasa justo frente a ti con una bandeja cargada de polvos rojos que sueltan una nube irritante, y el bullicio de una discusión cercana sobre el precio de unas cabras tapa cualquier sonido sutil que pudiera emanar de la puerta. No logras percibir nada inusual más allá de la evidente paranoia del vigilante."}, {"jugador": "\"Qué mirada más intensa tienes, amigo.\"\n\nMe acerco al vigilante con paso relajado, intentando distraerlo con una sonrisa mientras deslizo la mano hacia el símbolo dorado.\n\n{Juego de Manos}", "dm": "El vigilante no parpadea ni siquiera cuando te acercas, manteniendo esa rigidez antinatural mientras tu comentario flota en el aire. Justo cuando tu mano se desliza hacia el símbolo dorado, el vendedor de especias tropieza con un bulto invisible, lanzando una ráfaga de polvo rojo directamente hacia vuestros rostros.\n\nEn el instante en que estornudas y pierdes el equilibrio por la irritación, el hombre reacciona con una velocidad mecánica. Sus dedos se cierran sobre tu muñeca como una tenaza de hierro antes de que puedas siquiera rozar el metal, anclándote al sitio con un apretón que te deja claro que no tiene intención de soltarte.\n\n—El símbolo no es para tocar —sentencia con una voz seca y monocorde, sin soltarte el brazo."}, {"jugador": "\"Vaya, qué reflejos. No sabía que los adornos venían con perro guardián.\"\n\nIntento zafarme de su agarre con un movimiento brusco.\n{Acrobacias}", "dm": "El vigilante no se inmuta ante la ironía, manteniendo su expresión gélida mientras sientes la presión metálica de sus dedos. Sin embargo, el movimiento brusco y coordinado de tu cuerpo sorprende la rigidez de su agarre; aprovechas el impulso del giro para deslizar tu muñeca fuera de su presa, rompiendo la tensión del agarre con un tirón seco y preciso.\n\nTe alejas un paso, libre, mientras el vigilante cierra la mano en el vacío, manteniendo el brazo extendido unos segundos más por pura inercia mecánica. Sus ojos vuelven a fijarse en ti, imperturbables, mientras el vendedor de especias sigue maldiciendo entre nubes de polvo rojo a pocos metros."}, {"jugador": "\"No me toques otra vez.\"\n\nAprovecho que el guardia sigue recuperando la posición para lanzarme hacia el puesto del vendedor y buscar algo de valor entre el caos del polvo rojo.\n\n{Juego de Manos}", "dm": "Tus dedos se mueven como relámpagos entre los sacos rasgados y los cuencos volcados, aprovechando que el vendedor sigue gritando y el vigilante recalibra su postura. El polvo rojo flota en el aire, irritando la garganta y nublando la vista, pero tu mano encuentra un tacto frío y sólido oculto bajo una tela de seda manchada de azafrán.\n\nCon un movimiento fluido, cierras el puño sobre una pequeña daga de hueso tallado, finamente grabada con runas que parecen vibrar bajo tu piel, y la deslizas en tu ropa antes de que el vendedor deje de maldecir para notar que algo falta en su inventario."}, {"jugador": "\"¡Qué desorden tan espantoso!\"\n\nMe aparto rápidamente de los restos del puesto, fingiendo indignación por el caos, mientras me aseguro de que la daga esté bien oculta. Busco con la mirada algún otro objeto de valor que haya quedado expuesto por el revuelo.\n\n{Percepción}", "dm": "El polvo rojo comienza a asentarse, revelando entre los restos de cerámica rota y telas desgarradas un destello metálico que no encaja con la chatarra del puesto. Bajo una pesada manta de lana que ha caído sobre un charco de aceite, asoma la esquina de un estuche de cuero negro, reforzado con cierres de plata oxidada, que ha quedado parcialmente aplastado por una caja de especias volcada.\n\nEl vendedor, aún rojo de ira, gesticula violentamente hacia el guardia, ignorando por completo el objeto que brilla débilmente a pocos pasos de tus botas. El ruido de la disputa en el mercado crea una cortina sonora perfecta; nadie más parece haber notado el estuche, que yace allí, esperando a ser rescatado del desastre."}, {"jugador": "\"Vaya desastre...\"\n\nAprovecho la distracción del vendedor y el guardia para deslizarme hacia el estuche y recogerlo rápidamente.\n\n{Juego de Manos}", "dm": "Al intentar agacharte con sigilo, el talón de tu bota choca con el borde de la volcada caja de especias. El impacto provoca que el resto de los frascos rotos se deslicen con un chirrido agudo sobre el pavimento, mientras que una nube de azafrán y pimienta roja sale disparada hacia arriba, envolviéndote en una nube carmesí.\n\nEl ruido es lo suficientemente seco como para cortar la discusión. El guardia detiene su gesto a mitad de camino y gira la cabeza hacia ti, frunciendo el ceño mientras te observa luchar contra el estornudo inminente, justo encima del estuche de cuero negro que sigue ahí, expuesto y brillando bajo la luz del mediodía."}, {"jugador": "\"Maldita sea...\"\n\nTrato de contener el estornudo apretando la nariz y aprovecho el momento de confusión para agarrar el estuche de cuero negro antes de retroceder.\n\n{Juego de Manos}", "dm": "Aprietas la nariz con fuerza, conteniendo el estornudo en un gemido nasal mientras extiendes la mano hacia el cuero negro. Sin embargo, la nube de pimienta roja sigue irritando tus fosas nasales y tus dedos, torpes por la urgencia y el picor, rozan el borde del estuche sin lograr cerrarlo sobre él. El objeto se desliza unos centímetros sobre el pavimento, produciendo un sonido metálico que resuena en el silencio súbito.\n\nEl guardia, que ya te observaba con sospecha, abre los ojos de par en par al ver el movimiento brusco. Su expresión pasa del desconcierto a la alerta inmediata y da un paso rápido hacia tu posición, llevando la mano al pomo de su espada.\n\n—¡Eh! ¿Qué demonios haces ahí tirado entre las especias? —brama, mientras el polvo carmesí aún flota a tu alrededor."}, {"jugador": "\"¡Ayuda! ¡Me he resbalado con el polvo y he tirado esto!\"\n\nMe quedo en el suelo, fingiendo torpeza y desesperación mientras intento cubrir el estuche con mi cuerpo para recuperar el control sobre él.\n\n{Engaño}", "dm": "El guardia frunce el ceño, deteniéndose a un paso de ti. Sus ojos viajan del polvo rojo que aún te hace lagrimear hacia la posición forzada de tu cuerpo sobre el cuero negro. Se queda un momento en silencio, procesando la escena, mientras una gota de sudor resbala por su sien. No parece convencido del todo, pero la imagen de alguien pataleando en medio de un derrame de pimienta es lo suficientemente ridícula como para generar una chispa de duda en su juicio.\n\n—¡Por los dioses, qué torpe eres! —exclama, aunque su mano no suelta el pomo de la espada—. Quítate de ahí antes de que el capitán te vea y decida que eres un espía particularmente idiota. ¡Levántate y muévete, ahora!"}]}, "B": {"previo": "El intento de deslizarse con elegancia termina en un desastre de metal y ruido. Al intentar entrar en el conducto, el cuerpo choca contra el borde afilado de la rejilla, que cede con un estruendo metálico y seco que retumba en todo el pasillo, dejando el cuerpo a medio camino, encajado torpemente entre el suelo y la abertura.\n\nEl silencio que sigue es sepulcral, roto únicamente por el eco del impacto y el chirrido del metal retorcido. La posición es precaria y la visibilidad desde el conducto es nula, pero el ruido ha sido lo suficientemente fuerte como para alertar a cualquier ser vivo en el sector.\n\nEl estruendo ha actuado como una campana de cena para las patrullas. En cuestión de segundos, alguien llegará a la intersección para investigar el ruido.", "turnos": [{"jugador": "\"Maldita sea\".\n\nMe saco del conducto rápidamente y busco el rincón más oscuro del pasillo para agazaparme, esperando a que quien venga no me vea de inmediato.\n\n{Sigilo}", "dm": "El movimiento es rápido y preciso, una recuperación felina que contrasta con el desastre anterior. Te fundes con la penumbra de un rincón donde las paredes metálicas están tan desconchadas que el óxido parece absorber cualquier rastro de luz. El pasillo industrial se extiende frente a ti, bañado por el parpadeo rítmico de unos fluorescentes que proyectan sombras largas y profundas, ocultando tu silueta entre capas espesas de polvo acumulado.\n\nEl eco del estruendo se apaga, dejando paso a un silencio tenso. Desde el fondo del corredor comienza a escucharse el rítmico golpeteo de unas botas sobre el metal, acercándose lentamente hacia la rejilla torcida, pero tú ya eres parte de la oscuridad.\n\nLa patrulla está llegando al punto del ruido. Si no te mueves o decides intervenir, quedarás atrapado en el rincón mientras registran la zona."}, {"jugador": "Me quedo inmóvil, conteniendo la respiración, y observo la patrulla desde las sombras para ver cuántos son y qué llevan encima.\n{Percepción}", "dm": "El pasillo técnico se estrecha, asfixiante, flanqueado por tuberías que sudan un líquido viscoso y cables que cuelgan como lianas eléctricas. La luz intermitente golpea el metal con un efecto estroboscópico, fragmentando la visión en destellos violentos que convierten el movimiento de la patrulla en una serie de imágenes inconexas y borrosas.\n\nEl esfuerzo por concentrarse en los detalles falla estrepitosamente bajo el parpadeo errático de los fluorescentes. Entre el ruido del goteo y las sombras que bailan, es imposible distinguir el número exacto de guardias ni el equipo que transportan; solo se perciben siluetas oscuras y el eco metálico de sus pasos, que ahora resuenan peligrosamente cerca.\n\nLa patrulla está registrando la zona inmediata. Si no cambias de posición o actúas ahora, el ángulo de visión de los guardias terminará por revelarte inevitablemente."}, {"jugador": "\"Maldita sea esta luz.\"\n\nMe pego a la pared y busco cualquier hueco o conducto donde deslizarme para desaparecer de su vista.\n\n{Sigilo}", "dm": "El cuerpo se desliza con precisión quirúrgica hacia un recoveco técnico donde el metal se dobla en un ángulo muerto. El refugio es precario pero efectivo: una rejilla de ventilación parcialmente desprendida que permite el acceso a un hueco estrecho, resguardado por un cúmulo de cables quemados que caen como una cortina de plástico fundido, ocultando cualquier rastro de movimiento.\n\nDesde la penumbra del escondite, el vaho del plástico quemado llena los pulmones mientras el ruido de las botas metálicas de la patrulla se desvanece lentamente, dejando atrás solo el goteo rítmico de las tuberías.\n\nAunque estás a salvo por ahora, el espacio es extremadamente reducido y el olor a cable quemado empieza a ser asfixiante; permanecer demasiado tiempo aquí atraerá la atención de los sistemas de ventilación o te dejará sin aire."}, {"jugador": "\"Maldito olor...\"\n\nTapo mi nariz con la tela de mi ropa y busco con la mirada cualquier objeto de valor o documento que haya caído en este hueco.\n\n{Investigación}", "dm": "El hueco técnico es una ratonera asfixiante. Entre los residuos plásticos y los cables calcinados que cuelgan como telarañas negras, los dedos solo encuentran mugre pegajosa y trozos de aislante fundido. No hay ningún documento olvidado ni piezas de valor; solo la frustrante certeza de que este rincón es el vertedero de los desechos más inútiles del sector.\n\nEl aire se vuelve más denso y pesado, cargado de un aroma a ozono y goma quemada que traspasa incluso la tela de la ropa.\n\nEl aire se agota rápidamente en este espacio cerrado; si no sales pronto, el mareo por hipoxia te impedirá moverte con sigilo cuando intentes abandonar el escondite."}, {"jugador": "\"Maldita basura.\"\n\nSuelto el montón de cables y me retiro rápidamente del hueco para recuperar el aire.\n\n{Acrobacias}", "dm": "El intento de salir con agilidad termina en un desastre coordinado de extremidades y metal. Al intentar impulsarse fuera del hueco, el pie resbala en una placa de acero cubierta de esa humedad aceitosa, provocando un giro torpe que termina en un golpe seco contra la pared. El cuerpo impacta contra el metal oxidado, mientras el zumbido eléctrico de los cables expuestos vibra con una intensidad molesta, casi dental, en el estrecho pasillo técnico.\n\nEl espacio claustrofóbico no perdona el error; el movimiento brusco solo ha servido para agitar el aire viciado y quedar atrapado un instante más en el abrazo pegajoso de las paredes sudorosas.\n\nEl ruido del golpe ha resonado en el conducto metálico; cualquier patrulla cercana ahora tiene una razón para investigar este sector del pasillo."}, {"jugador": "\"Maldita sea...\"\n\nMe quedo completamente inmóvil, conteniendo la respiración y pegando la espalda al metal para intentar fundirme con las sombras del conducto.\n\n{Sigilo}", "dm": "El esfuerzo por mimetizarse con el acero termina en un fracaso sutil pero decisivo. Al intentar fundirse con las sombras, el cuerpo se desliza apenas unos centímetros sobre el lubricante oscuro que empapa el suelo, produciendo un sonido húmedo y chirriante que rompe el silencio del pasillo técnico. El movimiento es insuficiente para alcanzar la cobertura total, dejando la silueta expuesta bajo el parpadeo errático de los cables que chisporrotean sobre la cabeza.\n\nLas sombras proyectadas por las tuberías goteantes bailan frenéticamente, pero no logran ocultar la presencia en el angosto corredor. El acero oxidado, frío y pegajoso contra la espalda, parece vibrar con la tensión del momento, mientras el aire viciado se vuelve más pesado, cargado con el olor a ozono y metal quemado.\n\nEl deslizamiento ha sido audible. El eco del ruido viaja por las tuberías, guiando a cualquier entidad que patrulle los niveles técnicos directamente hacia tu posición."}, {"jugador": "\"Maldita sea...\"\n\nMe pego rápidamente a la pared más cercana y saco mi daga, preparando la guardia mientras escucho con atención cualquier movimiento en el pasillo.\n\n{Percepción}", "dm": "El acero oxidado de la pared se siente frío y pegajoso contra la espalda, mientras la daga brilla tenuemente bajo el parpadeo errático de los cables del techo. El pasillo técnico es un laberinto angosto de tuberías que gotean lubricante negro, creando un ritmo monótono y húmedo que parece burlarse de la espera.\n\nA pesar de la tensión y el esfuerzo por filtrar cada sonido, el entorno resulta confuso; el chisporroteo eléctrico y el eco del goteo constante enmascaran cualquier movimiento cercano. No se percibe ninguna amenaza inmediata, pero el silencio que sigue al ruido anterior es artificial, cargado de una incertidumbre que hace que el aire viciado huela más a ozono que nunca.\n\nLa falta de información es peligrosa. Mientras esperas sin saber dónde está el enemigo, el lubricante negro sigue acumulándose bajo tus pies, reduciendo tu capacidad de reacción si necesitas moverte rápido."}, {"jugador": "\"Maldito sitio...\"\n\nMe deslizo con cuidado hacia la pared más cercana, intentando buscar algún resquicio o conducto que me permita observar el pasillo sin exponerme.\n\n{Sigilo}", "dm": "El intento de deslizarse por la pared termina en un tropiezo torpe cuando el pie resbala sobre una mancha de lubricante negro, provocando un ruido metálico seco que resuena en el pasillo. El movimiento brusco no lleva a ningún refugio seguro, sino que deja el cuerpo expuesto justo donde el pasillo se estrecha, obligando a detenerse en seco mientras el corazón late con fuerza contra las costillas.\n\nEn ese rincón, una rejilla de ventilación oxidada cuelga a medio soltar, balanceándose levemente con la corriente de aire viciado. A través de la abertura, se revela un conducto oscuro y polvoriento que corre paralelo al corredor, una boca negra que parece observar el fracaso del sigilo desde las sombras.\n\nEl ruido del tropiezo ha alertado a cualquiera que estuviera merodeando por el sector técnico; ahora el elemento sorpresa se ha perdido y el conducto de ventilación es la única salida rápida antes de que alguien llegue al rincón."}]}}, {"id": "u1c44cb", "piloto": false, "lore": "# Lindero\n\n## El pueblo y el bosque\n\nLindero es un pueblo de cuatrocientas personas que lleva ocho generaciones viviendo al borde del Bosque de Hallena, una masa de robles, hayas y fresnos tan vieja que en el mapa del reino se dibuja con una sola mancha verde. Los vecinos cortan leña, cazan poco y no se internan más allá de los primeros claros. Tienen un dicho: «Al bosque se le respeta o se le deja». Nunca les había hecho falta elegir.\n\nHasta hace cuarenta días.\n\n## Lo que salió mal\n\nEl bosque se ha puesto en marcha. Lo hace de noche, en silencio, y sin que nadie haya visto nunca ocurrir el momento: cada amanecer, el borde de Hallena está tres pasos más cerca del pueblo. Los árboles se han movido, con sus raíces arrancadas del suelo con cuidado, como quien se levanta sin querer despertar a nadie. Ya ha cubierto los campos de cebada del norte, el molino viejo y el camino de la costa. Va hacia el oeste, hacia el mar. Lindero está justo en medio.\n\nA este paso, el borde llegará a las primeras casas dentro de sesenta días. Nadie ha visto animales salir del bosque: es como si se hubiera llevado con él hasta sus lobos.\n\n## Acompañarlo o detenerlo\n\n**Iselda Ramaje**, guarda mayor del bosque desde hace treinta años, sostiene que no hay que detenerlo: el bosque se mueve por una razón que nadie entiende, matarlo es matar algo que lleva mil años vivo, y lo que hay que hacer es abrirle paso: evacuar el pueblo con calma, sin prisas, antes de que la marcha llegue a las casas. Lo dice con la voz baja de quien lleva días sin dormir escuchando algo que los demás no oyen.\n\n**Nicasio Tala**, leñador y concejal, sostiene que sí hay que detenerlo: cuatrocientas personas, ocho generaciones de tumbas, una escuela y un cementerio no se abandonan por el capricho de un bosque, y si la mano no es la del hombre, entonces será la del fuego. Propone talar una franja de contención y, si hace falta, quemarla. Lo dice con el hacha al hombro y los ojos rojos de quien ya ha empezado a despedirse del monte que le dio de comer.\n\nLos dos quieren proteger algo vivo. Ninguno cree que el otro esté loco. Los dos temen no tener razón.\n\n## El claro que camina\n\nAlgunos vecinos han visto, en las noches más oscuras, un resplandor verde pálido en el corazón del bosque, entre los troncos más gruesos. Dicen que hay un claro que se mueve con la marcha, siempre en el centro, siempre al abrigo de los árboles. Nadie que haya entrado a buscarlo ha vuelto a hablar de lo que vio.\n\n## Gente del pueblo\n\n**Iselda Ramaje**, guarda mayor, defiende acompañar al bosque y evacuar el pueblo. **Nicasio Tala**, leñador y concejal, defiende detenerlo con una franja de tala y fuego. **Eulalia Mora**, molinera de Lindero desde hace veinte años, es -por ahora- solo la vecina que sabe cuánto ha avanzado el bosque por cuánto polvo le llega al molino; ver «personas_par26.json» para el perfil completo de los tres.\n\n## Tono de la campaña\n\n`world_tone`: **`mixed`**, registro **`serious`**. Elegíaco y contenido: el asombro ante algo enorme y hermoso que se va, y la pena de quienes tienen que decidir si se quedan o se van. Sin humor fácil y sin villano: el dolor viene de una decisión sin salida limpia, entre lo que se ama y lo que se puede perder. Estructura sin precedente en el corpus: **un fenómeno natural en marcha con un plazo fijo y dos maneras legítimas de responder**, distinto del monolito maldito de Piedra Yerma (Par 13) porque aquí nada es una maldición ni tiene culpable: el bosque simplemente se va, y hay que decidir qué se hace con eso.\n", "A": {"previo": "Tus dedos se desplazan con cautela sobre la piel, pero la rigidez mineral es engañosa. Al intentar aislar el punto exacto de donde emana la frecuencia, la textura del tejido se siente uniforme y confusa; no logras distinguir un núcleo central ni un patrón claro de propagación. La vibración parece emanar de cada filamento cristalino por igual, convirtiendo la herida en un laberinto de sensaciones frías que se resisten a ser descifradas.\n\nLa estructura mineral permanece imperturbable bajo tu tacto. No hay un punto de presión evidente ni una debilidad en la red que te permita comprender la mecánica de su avance, dejando la extensión de la infección como un enigma que sigue vibrando sordamente contra tus yemas.", "turnos": [{"jugador": "\"Esto no es una herida natural, es una invasión.\"\n\nSigo palpando los bordes donde la piel sana se encuentra con el cristal, buscando cualquier señal de que la infección esté reaccionando a mi calor corporal.\n\n{Medicina}", "dm": "Tus dedos recorren la frontera exacta donde la carne se rinde ante la piedra, presionando con cuidado el límite de la zona afectada. Sin embargo, la transición es abrupta y gélida; no hay rastro de inflamación, ni calor, ni el pulso acelerado que acompañaría a una reacción biológica. El cristal se siente inerte, como una roca tallada que simplemente ha sustituido el tejido, ignorando por completo la temperatura de tu cuerpo.\n\nLa piel sana se siente extrañamente distante, como si el mineral estuviera aislando la zona y anulando cualquier respuesta orgánica. No percibes ningún estremecimiento ni cambio en la intensidad de la vibración mientras palpas los bordes; la infección permanece estática, indiferente a tu presencia y a tu tacto."}, {"jugador": "\"Esto no es ninguna enfermedad natural...\"\n\nRetiro la mano y observo detenidamente la zona donde el cristal se une a la carne, buscando cualquier patrón o grieta en la estructura mineral.\n\n{Investigación}", "dm": "La superficie del cristal es asombrosamente regular, una malla de prismas hexagonales que se hunden en la piel sin dejar cicatrices ni desgarros. Al observar con detenimiento, notas que la estructura no crece al azar, sino que sigue una geometría precisa, casi arquitectónica, que parece haber reescrito la anatomía de la zona para sostener el peso del mineral.\n\nNo hay grietas ni imperfecciones en la unión; el cristal emerge de los poros como si siempre hubiera pertenecido allí, fundiéndose con la dermis en una transición tan perfecta que resulta antinatural. A pesar de la intensidad de tu mirada, la superficie permanece opaca y gélida, sin revelar ningún núcleo interno ni patrón recurrente que sugiera una debilidad estructural."}, {"jugador": "\"Esto no es una enfermedad natural, es una construcción.\"\n\nToco los bordes donde el cristal se une a la piel para sentir si hay pulso o calor bajo la superficie. {Medicina}", "dm": "Tus dedos recorren la zona de transición con una precisión quirúrgica. Bajo la superficie gélida del mineral, no percibes el latido rítmico de un corazón ni el flujo cálido de la sangre; en su lugar, detectas una vibración sutil, una frecuencia constante y mecánica que resuena contra tus yemas. El cristal no está simplemente creciendo sobre el tejido, lo ha sustituido: los capilares y nervios han sido reemplazados por filamentos translúcidos que transportan una energía fría y artificial.\n\nLa unión es absoluta. Al presionar los bordes, confirmas que no existe ninguna membrana orgánica remanente que actúe como barrera; la biología ha sido borrada para dar paso a una arquitectura mineral que imita la función del cuerpo, pero ignora sus leyes. El tejido circundante, aunque parece sano, está en un estado de estasis forzada, mantenido vivo únicamente por la estructura que lo ha colonizado."}, {"jugador": "\"Esto no es natural. No es una enfermedad, es una sustitución.\"\n\nRetiro la mano con cuidado y busco cualquier rastro de dónde comenzó la infección en el cuerpo para entender el origen del proceso.\n\n{Investigación}", "dm": "Tus ojos escudriñan la piel y el tejido circundante, buscando una herida, una punción o cualquier anomalía que marque el punto de entrada de la cristalización. Sin embargo, la superficie del cuerpo no revela ninguna marca distintiva ni cicatriz que sugiera un origen externo; el mineral parece haberse manifestado sin dejar rastro de un trauma previo.\n\nLa transición entre la carne sana y la estructura mineral es demasiado perfecta, fundiéndose en un degradado imperceptible que no permite localizar un epicentro claro. No hay rastro de una fuente primaria en el área examinada."}, {"jugador": "\"Esto no es una herida... es una transformación.\"\n\nMe alejo un poco del cuerpo para observar el entorno inmediato, buscando rastros de este mismo mineral en la vegetación o el suelo.\n\n{Percepción}", "dm": "Al retroceder, la vista se amplía y el patrón se vuelve evidente. Entre las raíces retorcidas y la hojarasca húmeda, pequeños brotes de cuarzo pálido emergen del suelo como agujas gélidas, perforando el musgo y las raíces de los árboles cercanos. No son piedras depositadas allí, sino extensiones del terreno que han dejado de ser orgánicas para volverse minerales.\n\nUna rama baja, que debería haber caído hace tiempo, se mantiene rígida y brillante; el mineral ha trepado por la madera, sustituyendo la savia por una estructura geométrica y fría que refracta la luz del bosque en destellos antinaturales."}, {"jugador": "\"Esto no es natural... el bosque está muriendo y convirtiéndose en piedra.\"\nMe acerco a la rama mineralizada y trato de analizar el crecimiento del cuarzo para entender cómo se propaga.\n{Naturaleza}", "dm": "Te inclinas sobre la rama, observando la transición donde la madera marrón y podrida se funde con el cristal pálido. Intentas buscar un patrón en la dirección de las vetas o alguna señal de cómo el mineral consume la materia orgánica, pero la geometría del cuarzo es caótica y confusa. La superficie es tan lisa y fría que no deja pistas claras sobre si el crecimiento es lento o si se expande en pulsos violentos.\n\nAlrededor, el silencio del bosque se vuelve más pesado. El brillo antinatural de la rama proyecta sombras alargadas sobre el musgo, y el aire comienza a sentirse cargado, con un olor metálico que sustituye la fragancia habitual de la tierra húmeda."}, {"jugador": "\"Esto no es natural. El bosque está sufriendo.\"\n\nMe separo de la rama y miro a mi alrededor, intentando detectar si hay más rastros de este cristal en los árboles cercanos o alguna criatura afectada.\n\n{Percepción}", "dm": "Te enderezas y escudriñas la espesura, pero el bosque parece haberse cerrado sobre sí mismo. El brillo blanquecino de la rama que acabas de examinar es el único punto de luz disruptivo en el entorno; el resto de la vegetación se funde en una masa de verdes oscuros y sombras densas que confunden la vista.\n\nNo percibes ningún movimiento inusual entre los arbustos ni detectas el brillo del cristal en los troncos adyacentes. El silencio persiste, roto únicamente por el eco de tu propia respiración y ese persistente aroma a metal oxidado que flota en el aire."}, {"jugador": "\"Huele a sangre vieja y hierro... Esto no es natural.\"\n\nMe acerco a la rama brillante y trato de analizar la naturaleza de ese resplandor y el origen del olor.\n\n{Naturaleza}", "dm": "Al acercarte, el resplandor blanquecino no es una luz emitida, sino una cristalización mineral que ha sustituido la savia y la fibra de la madera. Al tacto, la rama está fría como el hielo y posee una dureza vítrea que rechaza cualquier rastro de humedad orgánica. El olor a metal oxidado se intensifica aquí, revelando que no es sangre, sino una reacción química corrosiva; el mineral está consumiendo la planta desde adentro, transformando la materia orgánica en una estructura de sal y hierro que imita la forma de la vida, pero la deja hueca y quebradiza.\n\nEl fenómeno es quirúrgico y expansivo. Observas que la cristalización no es aleatoria: sigue un patrón geométrico preciso que se extiende por las vetas de la madera, como si una red invisible estuviera colonizando el bosque. El olor a hierro es el subproducto de esta transmutación, un rastro químico que indica que el proceso es reciente y sigue activo en los alrededores."}]}, "B": {"previo": "El intento de cerrar la brecha resulta torpe; el pie resbala en el barro removido y el arma no llega a cubrir el ángulo necesario, dejando un espacio vulnerable entre ambos mientras la bruma, blanca y asfixiante, devora cualquier rastro del entorno más allá de dos pasos. El aire se siente pesado, cargado de humedad y el olor a tierra aplastada por el combate.\n\nNicasio suelta un bufido ronco y ajusta el agarre del hacha con fuerza, plantándose hombro con hombro, aunque sin dedicar una sola mirada. Con la vista clavada en la blancura espesa, sentencia: \"¡Ya estoy bastante calmado, que el monte no espera a que nos pongamos de acuerdo! Tú cierra ese hueco y deja que yo me encargue de lo que asome. Si alguno de los dos cae, que sea peleando y no por andar dándonos consejos.\"\n\nLa formación sigue rota y la visibilidad es nula. El enemigo, aprovechando la falta de coordinación y el hueco persistente en la guardia, está a punto de lanzar un ataque sorpresa desde el flanco expuesto.", "turnos": [{"jugador": "\"¡Menos palabras y más acero, Nicasio!\"\n\nIgnoro su mal humor y me planto con fuerza, intentando recuperar el equilibrio en el barro para cubrir el flanco expuesto.\n\n{Atletismo}", "dm": "El pie encuentra finalmente un apoyo firme entre las raíces expuestas y el peso del cuerpo se desplaza con precisión, cerrando la brecha defensiva justo a tiempo. El barro viscoso chapotea bajo las botas, pero la postura es ahora sólida, recuperando la estabilidad en medio de esa bruma blanca que sigue borrando el horizonte y convirtiendo el terreno en una trampa resbaladiza.\n\nNicasio gruñe con una sonrisa áspera, clavando los pies en el suelo mientras siente el hombro del compañero recuperar la posición. Ajusta el hacha con un movimiento seco, listo para golpear, y exclama: \"¡Así me gusta! ¡Menos charla y más fuerza, que el barro no se quita hablando!\".\n\nLa guardia está restaurada, pero la bruma sigue siendo absoluta. El enemigo, aunque ya no tiene un flanco abierto, acecha en el silencio blanco y cualquier distracción romperá de nuevo la cohesión del grupo."}, {"jugador": "\"¡No te preocupes, Nicasio, que no pienso moverme de aquí!\"\n\nMe planto firme, apretando el agarre de mi arma y agudizando el oído para detectar cualquier movimiento en la bruma.\n\n{Percepción}", "dm": "El intento de agudizar los sentidos fracasa rotundamente; la bruma blanca y espesa se clava en los ojos y el silencio del pantano es un muro infranqueable. No hay ruidos que descifrar, solo el chapoteo sordo del barro y el goteo constante de la humedad sobre el equipo, mientras las raíces retorcidas emergen del suelo como dedos negros buscando dónde sujetar el tobillo.\n\nNicasio Tala no aparta la vista del vacío blanco, escaneando el horizonte con una tensión eléctrica. Aprieta el mango del hacha hasta que sus nudillos blanquean y, con un tono ronco, sentencia: \"Eso espero. Porque si te mueves un centímetro fuera de sitio, el bosque se te echará encima antes de que puedas pedir perdón\".\n\nLa ceguera sensorial es total y la tensión de Nicasio es un aviso: algo se desplaza en el pantano y, al no haber detectado su posición, el primer contacto será un impacto directo."}, {"jugador": "\"No hace falta que me lo recuerdes, Nicasio. Mantén el hacha lista y confía en que sé caminar por el barro.\"\n\nSigo avanzando con cautela, tratando de no hacer ruido y buscando cualquier rastro físico en el suelo que la bruma no pueda ocultar.\n\n{Supervivencia}", "dm": "El terreno se vuelve traicionero y el suelo cede bajo el peso. El barro se profundiza rápidamente hasta las rodillas, mientras el agua estancada, de un tono aceitoso que refleja la blancura de la bruma, parece querer arrastrar cada paso hacia abajo. No hay senderos que seguir; solo una alternancia desesperante entre raíces resbaladizas y pozos de lodo negro que succionan el calzado con una fuerza ciega, haciendo que cada avance sea una lucha contra la gravedad y la densidad del pantano.\n\nNicasio Tala gruñe con un matiz de respeto forzado, ajustando el agarre del hacha y dando un paso pesado pero firme para mantenerse pegado a tu costado. \"Confío en que sepas caminar, pero no confío en que el barro tenga piedad. Sigue adelante, que yo cubro tu espalda... pero no te alejes más de un brazo de distancia\", sentencia mientras se asegura de que la distancia entre ambos sea mínima.\n\nEl lodo negro succiona tu equipo y ralentiza tus movimientos. En este estado de vulnerabilidad, cualquier emboscada será devastadora, ya que no podrás reaccionar con rapidez ni retroceder."}, {"jugador": "\"No te preocupes, Nicasio. Mantente firme y no des pasos bruscos.\"\n\nIntento buscar algún punto de apoyo sólido o raíces fuertes que nos permitan avanzar sin hundirnos más.\n\n{Supervivencia}", "dm": "El lodo negro retrocede para revelar un entramado de raíces petrificadas y crestas de turba compacta que emergen del suelo como costillas, creando un camino precario pero firme sobre el agua aceitosa. El terreno finalmente cede un punto de apoyo sólido, permitiendo que el avance deje de ser una lucha contra la succión del pantano.\n\nNicasio Tala suelta un bufido ronco, aunque asiente con la cabeza reconociendo el acierto. Se inclina hacia adelante, apoyando el peso del cuerpo en el hacha para no hundirse más, mientras señala la raíz con un gesto brusco de la mano: \"No me digas cómo caminar por mi propio monte, que llevo más tiempo pisando este barro que tú viviendo. Pero... tienes buen ojo. Esa raíz de ahí es de un roble viejo, no se moverá aunque el mundo se hunda. Apóyate en ella y sácame el pie de este agujero antes de que el pantano decida que soy parte del paisaje\".\n\nAunque el terreno es más firme, el tiempo sigue corriendo y la bruma comienza a espesarse, reduciendo la visibilidad y ocultando lo que pueda acechar entre los árboles muertos."}, {"jugador": "\"No te pongas así, Nicasio. Solo quiero que salgamos los dos de aquí.\"\n\nSujeto el brazo del hombre con firmeza y tiro de él para ayudarlo a liberar el pie del lodo.\n\n{Atletismo}", "dm": "El tirón es seco y efectivo, arrancando el pie de Nicasio de la succión del pantano con un sonido húmedo. El hombre gruñe mientras se deja tirar, recuperando el equilibrio con un salto torpe y limpiándose el lodo de la bota con un gesto brusco contra una raíz. Una vez estable, se endereza y sentencia con aspereza: \"No me pongo así, simplemente digo las cosas como son. Ahora suelta ya, que me estás sacando el hombro antes que el pie\".\n\nAlrededor, el sendero de raíces petrificadas y crestas de turba serpentea entre el agua aceitosa, guiando el camino bajo la mirada de árboles muertos cuyos troncos, como dedos esqueléticos, señalan un cielo gris y opresivo.\n\nLa bruma se vuelve más densa y fría, envolviendo los troncos esqueléticos y amortiguando los sonidos del entorno; cualquier cosa que se mueva entre la niebla ahora es invisible hasta que esté demasiado cerca."}, {"jugador": "\"No seas malagradecido, Nicasio. Podrías haberte quedado ahí para siempre.\"\n\nSuelto su brazo y me detengo un momento para observar los troncos y el comportamiento de la bruma.\n\n{Percepción}", "dm": "El sendero se estrecha, flanqueado por depósitos de turba que parecen costras negras sobre el agua estancada. La bruma no es uniforme, sino que se desplaza en jirones lentos, revelando fugazmente que los árboles muertos no están solos: hay formas inertes, como restos de embarcaciones o estructuras de madera podrida, medio hundidas en el fango. Al observar con detenimiento, el patrón de la niebla y la disposición de los restos sugieren que el terreno es más traicionero de lo que parece, pero el camino sigue siendo discernible entre el caos de la madera podrida.\n\nNicasio se sacude el brazo con un gesto brusco, aunque su mirada se suaviza un instante antes de volver a clavarse en la bruma con desconfianza. \"Agradecido estoy de que no me hayas dejado ahí, no te niego que el fango no tiene memoria ni piedad. Pero no confundas un tirón de brazo con un favor que me obligue a callar la verdad sobre este lugar\", sentencia con una voz que recupera su aspereza habitual.\n\nLos restos de madera podrida y las estructuras hundidas crean puntos ciegos naturales; algo podría estar acechando justo detrás de una de esas formas inertes sin que sea posible detectarlo hasta que esté a pocos pasos."}, {"jugador": "\"No busco que me debas nada, Nicasio. Solo que lleguemos enteros.\"\n\nCamino con cautela, atento a esos puntos ciegos entre los restos de madera. {Percepción}", "dm": "El sendero se transforma en un laberinto de costras de turba, donde maderas negras emergen del agua estancada como costillas rotas. La bruma se espesa súbitamente, volviéndose un muro opaco que devora el paisaje y reduce la visibilidad a apenas unos pocos metros, convirtiendo cada estructura hundida en una trampa invisible. El intento de mantener la cautela fracasa; la confusión del terreno y la densidad del aire ocultan el peligro hasta que es demasiado tarde, provocando un traspié torpe que rompe el ritmo de la marcha.\n\nNicasio suelta un bufido ronco y escupe a un lado, retomando la marcha con pasos pesados pero seguros, sin dejar de vigilar los alrededores con ojos curtidos. \"Pues caminar entero es lo único que me interesa ahora mismo. Pero no te distraigas mirando el fango; en este monte, cuando crees que has visto el fondo del agujero, es cuando el bosque te agarra los tobillos\", sentencia con su voz áspera.\n\nLa pérdida de visibilidad y el traspié han dejado un rastro de ruido y desequilibrio; cualquier cosa que aceche en la bruma ahora sabe exactamente dónde están y que su paso se ha vuelto errático."}, {"jugador": "\"Ten razón, Nicasio. No dejaremos que el bosque nos gane la partida.\"\n\nMe sacudo el barro con rapidez y me pongo alerta, tratando de captar cualquier sonido extraño entre la bruma.\n\n{Percepción}", "dm": "El esfuerzo por agudizar los sentidos resulta estéril frente a la densidad del pantano. La bruma es ahora casi sólida, un muro húmedo que ahoga los ruidos y devuelve ecos distorsionados; mientras tanto, bajo las botas, la turba y el agua negra vibran con pulsaciones sordas, sonidos profundos que emergen de las profundidades del fango sin revelar su origen.\n\nNicasio se detiene un segundo, clavando la mirada en la bruma espesa mientras aprieta el mango de su hacha, con el tono ronco y cargado de una urgencia contenida: \"No es una partida, muchacho. Es una guerra de desgaste. El bosque no juega, solo crece, y no tiene prisa porque sabe que nosotros sí la tenemos\".\n\nLa incapacidad de detectar el origen de las vibraciones subterráneas sugiere que lo que sea que se mueve bajo el agua negra se está posicionando, aprovechando que el grupo sigue ciego y desorientado."}]}}, {"id": "u8a4c87", "piloto": false, "lore": "# Cima Clara\n\n## El pueblo bajo el cielo\n\nCima Clara se asienta en la meseta más alta de una cadena de picos donde el aire es tan limpio que, en noches sin luna, se dice que se puede leer el cielo entero sin perder una sola estrella. De ahí viene tanto el nombre del pueblo como su oficio más antiguo: durante generaciones, Cima Clara ha dado sabios lectores del cielo, gente que interpreta lo que pasa arriba para explicar lo que puede venir abajo.\n\nHace nueve noches, dos soles asomaron a la vez sobre la cresta oriental durante casi un minuto, antes de que uno se desvaneciera como si nunca hubiera estado ahí. Cientos de personas lo vieron. Nadie en el pueblo, ni siquiera los más ancianos, recuerda un presagio parecido en su tiempo de vida -y las crónicas que sí lo mencionan, de hace más de dos siglos, no se ponen de acuerdo en qué significó entonces.\n\n## La Ofrenda y la prudencia\n\n**Illian Vasto**, la sabia de mayor rango de la Orden del Cielo, sostiene que un presagio de ese tamaño exige la Ofrenda: una peregrinación de todo el pueblo, casa por casa, hasta el Picacho Sagrado, para completar un rito que no se realiza entero desde hace generaciones porque nunca hizo falta. Cree, con la misma certeza con que ha leído el cielo toda su vida, que no cumplir la Ofrenda a tiempo invita al desastre que el segundo sol anunciaba.\n\n**Rodrigo Fenz**, quien preside el concejo del pueblo desde hace una década, no niega que el presagio sea real ni que la Orden lo lea con sinceridad. Lo que le preocupa es el costo: la Ofrenda exige semanas de trabajo y provisiones que el pueblo necesita para el invierno, y una peregrinación completa por el Sendero de la Ofrenda no está exenta de riesgo real. Prefiere reforzar los graneros y las defensas del pueblo por si el desastre llega de una forma más terrenal, y dejar la Ofrenda como último recurso, no como primera respuesta.\n\nIllian no miente sobre lo que cree. Rodrigo no miente sobre lo que teme perder. Cima Clara entera, dividida en susurros primero y en discusiones abiertas después, todavía no sabe a cuál de los dos seguir.\n\n## El Archivo de Presagios\n\nEn un cuarto trasero del Observatorio Viejo se guardan crónicas de más de dos siglos de antigüedad, con cada presagio importante que el pueblo ha registrado y lo que pasó después de cada uno. Ni Illian ni Rodrigo las han revisado enteras en años -ambos citan de memoria solo los fragmentos que respaldan su propia postura. Lo que dicen de verdad esas crónicas sobre presagios de dos soles, si es que alguna vez se registró uno, es algo que este documento no resuelve por adelantado.\n\n## Gente del pueblo\n\n**Illian Vasto**, sabia de la Orden del Cielo, defiende la Ofrenda completa porque su lectura del presagio no le deja otra salida honesta. **Rodrigo Fenz**, presidente del concejo, defiende la prudencia y la preparación terrenal porque no está dispuesto a arriesgar el invierno del pueblo en un rito que nadie viviente ha visto funcionar. **Prudencio Aza**, que talla las marcas del calendario en la piedra del observatorio cada amanecer, es -por ahora- solo un vecino más; ver \"personas_par11.json\" para el perfil completo de los tres y el molde de promoción de PNJ de paso ya usado en pares anteriores.\n\n## Tono de la campaña\n\n`world_tone`: **`heroic`**. Heroico en el sentido de que ambas posturas nacen de una fe genuina -en el cielo o en el propio pueblo- y no de cinismo ni de cálculo. Estructura sin precedente en el corpus real: una **profecía que divide a la comunidad**, distinta de la amenaza externa organizada de Vega del Yelmo (Par 03, con un enemigo activo y visible) y de la disputa de sucesión de Vado Cabrero (Par 05, sin ningún elemento sobrenatural de por medio). Aquí el propio significado del presagio -y si la Ofrenda serviría de algo- queda deliberadamente sin resolver en este documento, para que la partida lo descubra jugando.\n", "A": {"previo": "El paño desliza sobre la piedra, arrastrando una capa grisácea de siglos de olvido. A medida que la superficie se despeja, el brillo violeta de la amatista emerge con nitidez, actuando como el centro de un engranaje invisible. Bajo la limpieza, las muescas dejan de parecer grietas para revelarse como surcos precisos, tallados con una geometría deliberada que converge exactamente hacia el cristal.\n\nAl observar la disposición ahora despejada, notas que los surcos no son aleatorios: forman una serie de arcos concéntricos que imitan la curvatura del horizonte. El fragmento de amatista no está simplemente apoyado, sino encajado en una hendidura milimétrica que sugiere que el cristal es la llave, o el foco, de un mecanismo diseñado para interactuar con la luz del cielo.", "turnos": [{"jugador": "\"Es una obra meticulosa, casi sagrada.\"\nMe inclino sobre la piedra para analizar la geometría de los surcos y tratar de comprender la función exacta del mecanismo.\n{Investigación}", "dm": "Te inclinas sobre la superficie fría, recorriendo con la mirada los arcos concéntricos y la posición del cristal. Sin embargo, la geometría es desconcertante; los ángulos parecen desafiar la perspectiva natural y los surcos, aunque precisos, no revelan un patrón lógico inmediato. Te quedas observando la piedra, pero la función del mecanismo permanece oculta tras una complejidad que escapa a tu análisis actual.\n\nLa amatista sigue allí, vibrando en un silencio violeta, devolviéndote la mirada desde el centro de aquel enigma de piedra que se niega a ceder sus secretos."}, {"jugador": "\"Tengo que entender cómo funciona esto para poder ayudar.\"\n\nCierro los ojos un instante y trato de recordar si he leído algo similar en los textos sagrados o antiguos sobre este lugar.\n\n{Religión}", "dm": "Al cerrar los ojos, el ruido del entorno se desvanece y las imágenes de pergaminos amarillentos y relieves de templos olvidados emergen en tu mente. Recuerdo un fragmento de un salmo litúrgico de la Orden del Cielo que hablaba de \"la luz que se dobla para encontrar su centro\". No es un manual de instrucciones, pero la noción de que el mecanismo no busca una secuencia lógica, sino una alineación de focos lumínicos, resuena con la disposición de los arcos concéntricos que tienes delante.\n\nAbres los ojos y la estructura ya no parece un rompecabezas matemático, sino un receptor. La amatista en el centro no es solo una llave, sino el punto de convergencia donde la luz, adecuadamente desviada por los cristales periféricos, debería concentrarse para activar el mecanismo."}, {"jugador": "\"La luz que se dobla para encontrar su centro... claro.\"\n\nMe acerco a los cristales periféricos y trato de orientarlos para que el haz de luz converja exactamente en la amatista central.\n\n{Investigación}", "dm": "Tus manos se deslizan sobre las superficies frías y facetadas de los cristales periféricos. Intentas aplicar la lógica del salmo, girando las piezas para que el haz de luz se curve y busque el núcleo, pero el mecanismo ofrece una resistencia seca y áspera. Cada movimiento que realizas parece desviar el rayo lumínico hacia los muros de piedra, donde la luz rebota sin sentido, iluminando motas de polvo suspendidas en el aire y dejando la amatista central sumida en una sombra persistente.\n\nEl silencio de la estancia se siente más pesado mientras los cristales emiten un leve chasquido metálico, indicando que han llegado a un tope o que el ángulo es erróneo. No hay respuesta del mecanismo; la gema central permanece opaca, fría y distante, sin absorber ni un solo destello de la luz que intentas dirigir hacia ella."}, {"jugador": "\"Tengo que encontrar el camino correcto, no puedo rendirme ahora.\"\n\nMe detengo un momento para observar el patrón de los rebotes de luz en los muros, buscando alguna marca o pista que indique la trayectoria original.\n\n{Investigación}", "dm": "Tus ojos recorren las paredes de piedra, siguiendo el rastro errático de los haces lumínicos que rebotan en ángulos absurdos. Te concentras en las superficies, buscando alguna muesca, una marca de desgaste o un grabado que sugiera la ruta correcta, pero la piedra es bruta y el polvo acumulado selama siglos ha borrado cualquier indicio. Los reflejos bailan en el muro sin formar patrón alguno, devolviéndote una imagen caótica que no ofrece ninguna pista sobre la configuración original del mecanismo.\n\nEl silencio vuelve a cerrarse sobre ti, interrumpido únicamente por el eco de tu propia respiración. La amatista central sigue allí, imperturbable y oscura, mientras los cristales periféricos permanecen bloqueados en posiciones que solo sirven para iluminar el vacío de la estancia."}, {"jugador": "\"Ten paciencia, que todo tiene un sentido.\"\n\nMe acerco a la amatista central para examinarla de cerca, buscando cualquier inscripción o mecanismo oculto en su base.\n\n{Investigación}", "dm": "Te inclinas sobre la amatista central, acercando el rostro al frío cristal. El mineral es una masa densa y opaca que parece absorber la escasa luz de la estancia en lugar de reflejarla. Pasas los dedos por la base, palpando la piedra donde la gema se une al pedestal, pero solo encuentras una superficie lisa, gélida y carente de cualquier relieve o hendidura.\n\nNo hay inscripciones, ni palancas ocultas, ni marcas de desgaste que sugieran que la pieza pueda girar o desplazarse. La amatista se siente como una parte integral e inamovible de la roca, un nudo ciego de mineral que guarda silencio absoluto ante tu escrutinio."}, {"jugador": "\"No es una piedra común, esto ha sido puesto aquí con un propósito.\"\nCierro los ojos y trato de sentir si hay alguna vibración o rastro de energía divina emanando del cristal.\n{Religión}", "dm": "Al cerrar los ojos, el frío gélido de la gema deja de ser una molestia para convertirse en un faro. No hay una vibración física, sino una resonancia espiritual que late con una lentitud agónica, como el corazón de una criatura en hibernación. Reconoces ese patrón: no es una energía natural, sino una impronta de diseño, una arquitectura divina destinada a actuar como un ancla o un receptor.\n\nLa sensación es la de un vacío hambriento. El cristal no emite poder, sino que parece estar configurado para aguardar una señal específica, una frecuencia de fe o un rito que lo despierte. Sientes que la amatista es la llave de un mecanismo mucho más vasto, aunque ahora mismo permanece inerte, sumida en un silencio sagrado y expectante."}, {"jugador": "\"Algo espera ser despertado aquí.\"\n\nMantengo la gema entre mis manos, tratando de sintonizar mi propia fe con ese vacío para ver si puedo identificar a qué divinidad o rito pertenece.\n\n{Religión}", "dm": "El vacío dentro de la gema permanece imperturbable, como un océano profundo que se niega a reflejar la superficie. A pesar de tu esfuerzo por sintonizar tu fe con esa ausencia, la resonancia no ofrece ninguna pista concreta; no hay un nombre, ni un símbolo, ni un eco de plegaria que logre romper el silencio sagrado del cristal. \n\nLa amatista sigue sintiéndose fría y expectante en tus manos, pero su arquitectura divina se mantiene hermética, negándote cualquier rastro de la divinidad o el rito que podría despertarla."}, {"jugador": "\"No me conoces, pero no dejaré que este silencio sea la última palabra.\"\n\nSigo sosteniendo la gema con cuidado, buscando cualquier imperfección física o marca oculta que no haya visto antes.\n\n{Investigación}", "dm": "Tus dedos recorren con minuciosidad cada faceta de la amatista, buscando una grieta, un grabado microscópico o cualquier asimetría que delate un mecanismo oculto. La superficie es perfecta, pulida con una maestría que roza lo sobrenatural, y el tacto gélido del cristal se mantiene constante contra tu piel.\n\nA pesar de tu insistencia, la gema no revela ninguna marca física ni imperfección. Sigue siendo un bloque de color violeta profundo y hermético, devolviéndote únicamente el reflejo de tu propio rostro bajo la luz del lugar."}]}, "B": {"previo": "El esfuerzo es coordinado y preciso; la fuerza del agarre permite arrastrar el cuerpo de Illian hacia el refugio de la piedra, logrando que ambos queden encajados en la grieta de basalto. El frío del muro cala hasta los huesos, pero es una solidez necesaria frente al océano de ceniza perpetua que se extiende debajo, una masa grisácea que engulle cualquier sonido y anula cualquier esperanza de un descenso seguro.\n\nIllian se relaja contra la piedra, aunque mantiene la mirada fija en las nubes cenicientas, respirando con una calma litúrgica mientras el viento aún aúlla a su alrededor. Con un tono sereno, casi distante, responde: \"Tus brazos son el único ancla que el cielo me concede hoy. No me pidas que confíe, pues la confianza es un sentimiento; pídeme que acepte que el destino ha decidido que mi lectura no termine en el abismo\".\n\nLa cornisa es demasiado estrecha para permitir cualquier maniobra de descanso; el viento comienza a ganar fuerza, amenazando con desestabilizar el equilibrio de ambos en el pequeño respiro de piedra.", "turnos": [{"jugador": "\"No hables de destino mientras el viento intenta empujarnos al vacío. Aguanta fuerte.\"\n\nSujeto a Illian con firmeza para evitar que el viento lo desplace y busco cualquier saliente o grieta donde podamos asegurar la posición.\n\n{Percepción}", "dm": "El agarre es firme y la mirada, aguda. Mientras el viento golpea con furia contra la hendidura de basalto negro, la piedra pulida por milenios de erosión revela sus secretos: justo por encima de sus cabezas, el muro se quiebra en una serie de fisuras naturales, profundas y transversales, que ofrecen el anclaje sólido y seguro que el vacío parecía negarles.\n\nIllian cierra los ojos un instante, dejándose llevar por la ráfaga sin resistirse físicamente, pero manteniendo la espalda rígida contra la pared. Su voz no sube el volumen a pesar del estruendo del viento, obligando a inclinarse para escucharla: \"El viento solo es el aliento de *Aethelgard* reclamando lo que es suyo. No lucharé contra él, pero tampoco permitiré que me arrebate la vista antes de tiempo. Mantén tu agarre; el basalto es ciego, pero yo aún puedo sentir el pulso de la roca\".\n\nAunque han encontrado anclajes, el viento comienza a generar remolinos violentos que podrían arrancar cualquier cuerda mal asegurada o desplazar la posición de Illian antes de que logren fijarse."}, {"jugador": "\"Confío en ti, Illian, pero no podemos dejar que el viento decida nuestro destino.\"\n\nMe aferro con fuerza a la piedra y busco rápidamente una de esas fisuras para asegurar mi posición antes de que la siguiente ráfaga nos desplace.\n\n{Atletismo}", "dm": "El brazo encuentra el hueco exacto en el basalto negro; el encaje es perfecto y la piedra, fría y pulida, cede el espacio necesario para un anclaje inamovible. Mientras el cuerpo queda fijado contra la pared, el desfiladero ruge a su alrededor, pero la posición es ahora sólida, transformando la fragilidad del ascenso en una base firme contra la furia del viento.\n\nIllian mantiene los ojos cerrados un segundo más, sintiendo la vibración de la piedra contra su espalda, y abre la mirada con una calma imperturbable mientras observa al jugador asegurar su posición. \"La confianza es un ancla necesaria, pero la voluntad es lo que evita que el ancla se arrastre. No es el viento quien decide, sino nuestra capacidad de leer el ritmo de su furia y movernos en los espacios que nos concede\", sentencia con una voz que corta el estrépito del aire.\n\nEl viento ha dado una tregua momentánea, pero las fisuras del basalto son escasas y el camino hacia arriba se vuelve más expuesto; cualquier error en el siguiente movimiento dejará el cuerpo a merced de las ráfagas sin protección."}, {"jugador": "\"Vuestra voluntad es admirable, Illian, pero no olvidéis que no estamos solos en este ascenso.\"\n\nMe aferro con fuerza a la roca, buscando el siguiente punto de apoyo con cuidado para no exponer mi cuerpo al viento.\n\n{Percepción}", "dm": "La mano encuentra un agarre firme y seguro, permitiendo que el cuerpo se desplace con precisión sobre la pared de basalto. A medida que el ascenso continúa, la piedra se vuelve más lisa y vertical, dejando la espalda expuesta a un vacío vertiginoso que parece succionar el aliento. Sin embargo, la mirada atenta revela una cornisa irregular unos metros más arriba, donde el negro de la piedra es interrumpido por sombras inquietantes que no se corresponden con la geografía del risco.\n\nIllian Vasto mantiene la espalda pegada al basalto, con la mirada fija en el horizonte superior, sin mirar al jugador. Deja que el silencio posterior a sus palabras sea llenado por el rugido del desfiladero mientras sentencia: \"No olvido que el cielo nos observa a todos, y que el peso de quien nos acompaña es, a menudo, el peso de la propia duda. No busquéis la compañía en el camino, sino la sincronía en el esfuerzo; solo así el *Viento de Aethelgard* nos permitirá alcanzar la cumbre.\"\n\nLas sombras en la cornisa superior se desplazan lentamente; si el ascenso no se agiliza o no se busca una aproximación sigilosa, el grupo quedará expuesto y vulnerable ante quien o qué aguarda arriba."}, {"jugador": "\"Tened cuidado, hay algo moviéndose arriba.\"\n\nSigo ascendiendo con cautela, intentando no hacer ruido mientras me acerco a la cornisa.\n\n{Sigilo}", "dm": "El esfuerzo por pasar inadvertido fracasa cuando una bota resbala sobre el basalto húmedo, produciendo un raspado seco y estridente que reverbera contra las paredes del abismo. El viento, que hasta entonces parecía un aliado, aúlla con renovada fuerza, arrastrando el ruido hacia arriba y alertando a cualquier presencia que aguarde en la estrecha cornisa resbaladiza.\n\nIllian Vasto no se mueve ni un milímetro de la pared, manteniendo la respiración contenida. Sus palabras son un susurro gélido y rítmico, sin rastro de pánico, pero con una gravedad litúrgica: \"Que el cielo nos guarde... pero que no nos distraiga. Si hay sombras que no pertenecen a la piedra, es que el tiempo de la cautela se ha agotado y el de la resolución ha llegado.\"\n\nEl ruido ha eliminado el factor sorpresa; las sombras en la cornisa superior ya no se desplazan erráticamente, sino que convergen hacia el punto exacto del ascenso."}, {"jugador": "\"No temáis, que la luz nos acompañe en este ascenso.\"\nSujeto con fuerza la pared y preparo mi escudo, mirando hacia arriba para identificar qué es lo que se acerca.\n{Percepción}", "dm": "El agarre en la pared es firme y el escudo se despliega con un golpe seco, creando un bastión de metal contra la roca húmeda. Al elevar la mirada, la vista se aclara y los contornos de las amenazas que descendían por la cornisa se vuelven nítidos, revelando sus formas y distancias antes de que puedan lanzar el primer ataque.\n\nIllian Vasto no aparta la vista de la pared, manteniendo el cuerpo pegado al basalto. Su voz es un hilo gélido, constante y desprovisto de pánico, marcando el ritmo de una sentencia: \"La luz es un don, pero el *Aethel-Solis* no concede clemencia a quien camina con pasos torpes. No deseéis compañía, desead precisión; el cielo no perdona el ruido en el silencio de la piedra.\"\n\nLos enemigos han localizado la posición exacta; el tiempo de observación ha terminado y el choque es ahora inevitable."}, {"jugador": "\"No teman, que la luz nos guíe y nos proteja.\"\nMe coloco en posición defensiva junto a Illian, preparando mis conjuros para sanar o apoyar a quien caiga en el choque.\n{Percepción}", "dm": "El intento de anticipar el movimiento enemigo fracasa; la visión se nubla entre la bruma del abismo y el brillo cegador del basalto húmedo, dejando el flanco expuesto justo cuando el metal del escudo choca contra la piedra fría. En esa cornisa estrecha, donde el vacío bosteza a pocos centímetros de los talones, la seguridad prometida se desvanece ante la inminencia del impacto.\n\nIllian Vasto no se inmuta, manteniendo la vista fija en la cornisa con una calma litúrgica que roza la frialdad. Sin siquiera mirarlo, sentencia: \"La luz no protege, guía. Y el guía solo señala el camino; es el paso del hombre el que evita la caída. No busquéis consuelo en el cielo ahora, buscad el acero de vuestro compañero.\"\n\nEl descuido en la vigilancia permite que el primer ataque enemigo impacte sin previo aviso, rompiendo la formación defensiva."}, {"jugador": "\"¡Tened cuidado! ¡No permitáis que el miedo os domine!\"\n\nMe pongo en guardia rápidamente para cubrir el hueco dejado por el impacto, intentando estabilizar la posición mientras recito una plegaria breve.\n\n{Perspicacia}", "dm": "El cuerpo se tensa y se ajusta con precisión quirúrgica, llenando el vacío en la línea defensiva justo a tiempo. El acero se posiciona con firmeza, creando un muro sólido que estabiliza la posición precaria sobre el basalto húmedo. La plegaria, aunque breve, parece anclar los pies al suelo resbaladizo, transformando la vulnerabilidad del momento en una barrera infranqueable f
